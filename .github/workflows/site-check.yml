name: Private review site build check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pinned N05 numeric dependency
        run: python -m pip install -r requirements-n05.txt

      - name: Install pinned CPU-only PyTorch
        run: python -m pip install -r requirements-n05-torch-cpu.txt

      - name: Check N05 environment
        run: python scripts/check_n05_environment.py

      - name: Test source checks
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run required N05 examples
        run: python scripts/run_n05_examples.py

      - name: Audit canonical Markdown
        run: python scripts/site.py audit

      - name: Prepare generated source
        run: python scripts/site.py prepare

      - name: Build production HTML
        run: python -m mkdocs build --strict --clean --config-file .build/mkdocs.yml

      - name: Validate generated site
        run: python scripts/site.py validate
