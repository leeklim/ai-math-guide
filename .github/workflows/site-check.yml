name: Site checks and GitHub Pages deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pinned N05 numeric dependency
        run: python -m pip install -r requirements-n05.txt

      - name: Install pinned CPU-only PyTorch
        run: python -m pip install -r requirements-n05-torch-cpu.txt

      - name: Check N05 environment
        run: python scripts/check_n05_environment.py

      - name: Require reviewed and verified full English edition
        run: python scripts/concepts.py check-translations --require-verified

      - name: Test source checks
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run required N05 examples
        run: python scripts/run_n05_examples.py

      - name: Run required I06 examples
        run: python scripts/run_i06_examples.py

      - name: Run required I07 examples
        run: python scripts/run_i07_examples.py

      - name: Run required I08 examples
        run: python scripts/run_i08_examples.py

      - name: Audit canonical Markdown
        run: |
          python scripts/site.py audit --lang ko
          python scripts/site.py audit --lang en

      - name: Audit stored figures
        run: python scripts/figures.py check

      - name: Audit completed explanations
        run: python scripts/concepts.py check --require-explanations

      - name: Audit completed concept revisions
        run: python scripts/concepts.py check --require-verified

      - name: Prepare generated source
        run: |
          python scripts/site.py prepare --lang ko --isolated
          python scripts/site.py prepare --lang en

      - name: Build production HTML
        run: |
          python -m mkdocs build --strict --clean --config-file .build/ko/mkdocs.yml
          python -m mkdocs build --strict --clean --config-file .build/en/mkdocs.yml

      - name: Validate generated site
        run: python scripts/site.py merge

      - name: Test analytics runtime guards
        run: |
          node tests/analytics_runtime.cjs .build/ko/site/index.html
          node tests/analytics_runtime.cjs .build/en/site/index.html

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/bilingual/site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
