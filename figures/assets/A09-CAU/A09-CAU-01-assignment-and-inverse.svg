<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1010" width="1100" height="1010" role="img"><title>assignment-and-inverse</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1100" height="1010" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Assignment direction survives algebraic rearrangement</text><text x="40" y="154" fill="#7C3AED" font-size="29">Structural assignment</text><rect x="40" y="220" width="345" height="154" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="69" y="304" fill="#2563EB" font-size="29">X=1; U_Y=1</text><path d="M399 297H586" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="600" y="220" width="455" height="154" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="635" y="304" fill="#059669" font-size="29">Y=2(1)+1=3</text><text x="40" y="436" fill="#475569" font-size="27">Inputs of f_Y</text><text x="600" y="436" fill="#475569" font-size="27">Assigned value of Y</text><text x="40" y="558" fill="#D97706" font-size="29">Algebraic solution of the same numbers</text><rect x="40" y="625" width="345" height="154" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="69" y="709" fill="#D97706" font-size="29">Y=3; U_Y=1</text><path d="M399 702H586" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="600" y="625" width="455" height="154" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="627" y="709" fill="#D97706" font-size="27">Solved X=(3−1)/2=1</text><text x="40" y="875" fill="#475569" font-size="27">F still assigns Y from X and U_Y.</text><text x="40" y="948" fill="#475569" font-size="25">The inverse calculation does not replace the X equation.</text></g></svg>
