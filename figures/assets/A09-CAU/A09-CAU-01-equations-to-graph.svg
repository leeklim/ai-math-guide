<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1187 1025" width="1187" height="1025" role="img"><title>equations-to-graph</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1187" height="1025" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Structural equations determine the directed edges</text><text x="40" y="113" fill="#2563EB" font-size="28">Exogenous inputs U; their joint law is P_U</text><circle cx="180" cy="190" r="50" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="180" y="200" text-anchor="middle" fill="#2563EB" font-size="27">U_X</text><circle cx="565" cy="190" r="50" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="565" y="200" text-anchor="middle" fill="#2563EB" font-size="27">U_M</text><circle cx="950" cy="190" r="50" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="950" y="200" text-anchor="middle" fill="#2563EB" font-size="27">U_Y</text><path d="M180 254V508" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M565 254V310" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M950 254V508" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M242 544L512 413" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M620 413L888 544" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M242 570H888" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><circle cx="180" cy="570" r="50" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="180" y="580" text-anchor="middle" fill="#059669" font-size="30">X</text><circle cx="565" cy="375" r="50" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="565" y="385" text-anchor="middle" fill="#059669" font-size="30">M</text><circle cx="950" cy="570" r="50" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="950" y="580" text-anchor="middle" fill="#059669" font-size="30">Y</text><rect x="40" y="741" width="347" height="141" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="64" y="792" fill="#7C3AED" font-size="27">X equation</text><text x="64" y="853" fill="#7C3AED" font-size="28">X=U_X</text><rect x="415" y="741" width="347" height="141" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="439" y="792" fill="#7C3AED" font-size="27">M equation</text><text x="439" y="853" fill="#7C3AED" font-size="28">M=2X+U_M</text><rect x="790" y="741" width="347" height="141" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="814" y="792" fill="#7C3AED" font-size="27">Y equation</text><text x="814" y="853" fill="#7C3AED" font-size="28">Y=M+X+U_Y</text><text x="40" y="967" fill="#475569" font-size="25">Directed edges summarize parent use; coefficients remain in F.</text></g></svg>
