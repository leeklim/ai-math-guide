<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1247 1180" width="1247" height="1180" role="img"><title>shared-subspace-coordinate</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1247" height="1180" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Overlapping subspaces share a coordinate</text><text x="40" y="118" fill="#475569" font-size="28">A=span{e₁,e₂}; B=span{e₁,e₃}</text><rect x="433" y="193" width="374" height="134" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="463" y="274" fill="#2563EB" font-size="30">h=(2,1,1)ᵀ</text><path d="M620 341V403H285V451" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M620 341V403H955V451" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="465" width="490" height="225" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="66" y="525" fill="#059669" font-size="28">Projection onto A</text><rect x="66" y="561" width="116" height="83" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="107" y="617" fill="#D97706" font-size="33">2</text><rect x="211" y="561" width="116" height="83" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="252" y="617" fill="#059669" font-size="33">1</text><rect x="356" y="561" width="116" height="83" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="397" y="617" fill="#059669" font-size="33">0</text><rect x="710" y="465" width="490" height="225" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="736" y="525" fill="#059669" font-size="28">Projection onto B</text><rect x="736" y="561" width="116" height="83" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="777" y="617" fill="#D97706" font-size="33">2</text><rect x="881" y="561" width="116" height="83" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="922" y="617" fill="#059669" font-size="33">0</text><rect x="1026" y="561" width="116" height="83" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="1067" y="617" fill="#059669" font-size="33">1</text><path d="M285 704V782H540V830" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><path d="M955 704V782H700V830" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="433" y="844" width="374" height="127" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="459" y="923" fill="#DC2626" font-size="30">Sum: (4,1,1)ᵀ</text><text x="40" y="1053" fill="#D97706" font-size="28">The shared e₁ component 2 is counted twice.</text><text x="40" y="1125" fill="#475569" font-size="26">A∩B=span{e₁}; the projection sum is not h.</text></g></svg>
