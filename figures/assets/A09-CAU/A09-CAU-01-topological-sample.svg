<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 1150" width="1350" height="1150" role="img"><title>topological-sample</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1350" height="1150" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">One background draw produces one observation</text><rect x="40" y="176" width="1262" height="151" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="70" y="264" fill="#2563EB" font-size="30">Joint draw: (U_X,U_M,U_Y)=(1,0,0)</text><path d="M185 342V416" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="430" width="290" height="164" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="66" y="489" fill="#059669" font-size="29">X=U_X</text><text x="66" y="560" fill="#059669" font-size="31">X=1</text><rect x="494" y="430" width="345" height="164" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="520" y="489" fill="#059669" font-size="29">M=2(1)+0</text><text x="520" y="560" fill="#059669" font-size="31">M=2</text><rect x="945" y="430" width="357" height="164" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="971" y="489" fill="#059669" font-size="29">Y=2+1+0</text><text x="971" y="560" fill="#059669" font-size="31">Y=3</text><path d="M344 512H480" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M853 512H931" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M185 608V770H1123V608" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="246" y="847" fill="#7C3AED" font-size="28">X=1 also enters Y directly</text><text x="40" y="983" fill="#475569" font-size="27">Evaluate parents before their children: X → M → Y.</text><text x="40" y="1087" fill="#475569" font-size="25">The computed triple (1,2,3) is one observational sample.</text></g></svg>
