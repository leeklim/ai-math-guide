<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 1090" width="1170" height="1090" role="img"><title>constant-and-conditional-policy</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1170" height="1090" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">A conditional policy can introduce new incoming dependence</text><text x="40" y="140" fill="#475569" font-size="28">Constant replacement</text><text x="660" y="140" fill="#475569" font-size="28">Policy reads S and T</text><circle cx="255" cy="468" r="46" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="255" y="479" text-anchor="middle" fill="#DC2626" font-size="32">H</text><circle cx="255" cy="771" r="46" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="255" y="782" text-anchor="middle" fill="#059669" font-size="32">Y</text><path d="M255 529V709" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="222" y="587" text-anchor="end" fill="#DC2626" font-size="29">Fixed H=h</text><circle cx="755" cy="250" r="46" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="755" y="261" text-anchor="middle" fill="#2563EB" font-size="32">S</text><circle cx="1010" cy="250" r="46" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="1010" y="261" text-anchor="middle" fill="#2563EB" font-size="32">T</text><circle cx="882" cy="468" r="46" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="882" y="479" text-anchor="middle" fill="#DC2626" font-size="32">H</text><circle cx="882" cy="771" r="46" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="882" y="782" text-anchor="middle" fill="#059669" font-size="32">Y</text><path d="M786 288L847 419" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M978 288L917 419" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M882 529V709" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="850" y="587" text-anchor="end" fill="#DC2626" font-size="29">H:=τ(S,T)</text><text x="40" y="929" fill="#475569" font-size="27">No original parents are read</text><text x="660" y="929" fill="#475569" font-size="27">S and T are new parents</text><text x="40" y="1020" fill="#475569" font-size="25">Keep the specified downstream computation in both policies.</text></g></svg>
