<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1010" width="1260" height="1010" role="img"><title>downstream-recalculation</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1260" height="1010" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Keeping a mechanism permits its output value to change</text><rect x="40" y="209" width="310" height="160" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="64" y="271" fill="#2563EB" font-size="28">Z=0; U_X=1</text><text x="64" y="335" fill="#2563EB" font-size="28">U_Y=0</text><path d="M364 289H446" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="460" y="209" width="350" height="160" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="487" y="270" fill="#059669" font-size="29">X=Z+U_X</text><text x="487" y="334" fill="#059669" font-size="28">Original value 1</text><path d="M824 289H926" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="940" y="209" width="270" height="160" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="965" y="270" fill="#059669" font-size="28">Y=X+0+0</text><text x="965" y="334" fill="#059669" font-size="31">Y=1</text><rect x="40" y="575" width="310" height="160" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="64" y="637" fill="#2563EB" font-size="28">Z=0; U_X=1</text><text x="64" y="701" fill="#2563EB" font-size="28">U_Y=0</text><path d="M195 749V799H1075V749" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="460" y="779" fill="#475569" font-size="25">Retained Z and U_Y</text><rect x="460" y="575" width="350" height="160" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="487" y="636" fill="#DC2626" font-size="29">X:=2</text><text x="487" y="700" fill="#DC2626" font-size="28">New value 2</text><path d="M824 655H926" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="940" y="575" width="270" height="160" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="965" y="636" fill="#059669" font-size="28">Y=X+0+0</text><text x="965" y="700" fill="#059669" font-size="31">Y=2</text><text x="40" y="861" fill="#7C3AED" font-size="29">In both runs: Y=X+Z+U_Y.</text><text x="40" y="954" fill="#475569" font-size="27">Recompute downstream values with the retained equation.</text></g></svg>
