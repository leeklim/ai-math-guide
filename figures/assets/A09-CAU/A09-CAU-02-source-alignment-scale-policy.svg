<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1138 1040" width="1138" height="1040" role="img"><title>source-alignment-scale-policy</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1138" height="1040" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">A source activation can pass through an explicit patch map</text><rect x="40" y="243" width="285" height="164" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="64" y="306" fill="#2563EB" font-size="28">Source H(s)</text><text x="64" y="375" fill="#2563EB" font-size="31">(2,4)ᵀ</text><rect x="424" y="243" width="285" height="164" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="448" y="306" fill="#7C3AED" font-size="28">Align order</text><text x="448" y="375" fill="#7C3AED" font-size="31">(4,2)ᵀ</text><rect x="808" y="243" width="285" height="164" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="832" y="306" fill="#7C3AED" font-size="28">Scale 0.5</text><text x="832" y="375" fill="#7C3AED" font-size="31">(2,1)ᵀ</text><path d="M339 325H410" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M723 325H794" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M951 421V716H789" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><text x="425" y="559" fill="#2563EB" font-size="27">Target originally H=(9,8)ᵀ</text><rect x="425" y="635" width="350" height="163" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="450" y="728" fill="#DC2626" font-size="29">H:=τ(s)=(2,1)ᵀ</text><text x="40" y="906" fill="#475569" font-size="27">Illustrative policy: reorder, then multiply by 0.5.</text><text x="40" y="978" fill="#475569" font-size="25">Record source pairing and the hook before downstream rerun.</text></g></svg>
