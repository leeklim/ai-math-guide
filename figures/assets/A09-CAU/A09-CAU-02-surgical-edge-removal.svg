text x="810" y="461" text-anchor="middle" fill="#DC2626" font-size="32">X</text><circle cx="1140" cy="450" r="46" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="1140" y="461" text-anchor="middle" fill="#059669" font-size="32">Y</text><path d="M1005 270L1106 412" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M864 450H1086" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M945 270L844 412" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 7"/><path d="M880 325L911 356M911 325L880 356" fill="none" stroke="#DC2626" stroke-width="3"/><text x="744" y="586" fill="#DC2626" font-size="27">Removed Z→X</text><rect x="720" y="670" width="545" height="151" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="747" y="754" fill="#DC2626" font-size="31">X:=x</text><text x="40" y="926" fill="#475569" font-size="27">The U_X input is also removed from the new X equation.</text><text x="40" y="1003" fill="#475569" font-size="27">Keep the joint background law and the Y mechanism.</text></g></svg>
