<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1140" width="1440" height="1140" role="img"><title>truncated-factorization</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1440" height="1140" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Remove the target factor, substitute its fixed value</text><text x="40" y="145" fill="#475569" font-size="28">Original joint P(z,x,y)</text><rect x="40" y="218" width="370" height="163" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="78" y="312" fill="#2563EB" font-size="31">P(z)</text><rect x="548" y="218" width="350" height="163" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="586" y="312" fill="#7C3AED" font-size="31">P(x|z)</text><rect x="1032" y="218" width="350" height="163" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="1070" y="312" fill="#059669" font-size="31">P(y|x,z)</text><text x="463" y="314" fill="#475569" font-size="34">×</text><text x="952" y="314" fill="#475569" font-size="34">×</text><text x="40" y="546" fill="#DC2626" font-size="29">After do(X=x): X is fixed</text><rect x="40" y="627" width="370" height="163" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="78" y="721" fill="#2563EB" font-size="31">P(z)</text><rect x="548" y="627" width="350" height="163" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="586" y="721" fill="#DC2626" font-size="31">P(x|z)</text><path d="M574 680L872 738" fill="none" stroke="#DC2626" stroke-width="3"/><text x="568" y="858" fill="#DC2626" font-size="27">Removed</text><rect x="1032" y="627" width="350" height="163" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="1070" y="721" fill="#059669" font-size="31">P(y|x,z)</text><text x="1032" y="858" fill="#DC2626" font-size="27">Use fixed x</text><text x="40" y="982" fill="#059669" font-size="30">Remaining joint of Z,Y: P(z)·P(y|x,z)</text><text x="40" y="1082" fill="#475569" font-size="25">Acyclic SCM; independent node noise; required observational support.</text></g></svg>
