<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1590 980" width="1590" height="980" role="img"><title>middle-node-roles</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1590" height="980" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Three middle-node roles depend on arrow direction</text><text x="70" y="146" fill="#0F172A" font-size="29">Common cause</text><circle cx="130" cy="480" r="46" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text text-anchor="middle" x="130" y="490" fill="#2563EB" font-size="30">X</text><circle cx="445" cy="480" r="46" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text text-anchor="middle" x="445" y="490" fill="#059669" font-size="30">Y</text><circle cx="288" cy="280" r="46" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text text-anchor="middle" x="288" y="290" fill="#D97706" font-size="30">Z</text><path d="M258 320L160 425" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><path d="M318 320L414 425" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><path d="M191 480H384" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="70" y="625" fill="#475569" font-size="28">X ← Z → Y</text><text x="70" y="753" fill="#475569" font-size="25">Condition Z: blocks this</text><text x="70" y="803" fill="#475569" font-size="25">noncausal path.</text><text x="580" y="146" fill="#0F172A" font-size="29">Mediator</text><circle cx="640" cy="480" r="46" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text text-anchor="middle" x="640" y="490" fill="#2563EB" font-size="30">X</text><circle cx="955" cy="480" r="46" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text text-anchor="middle" x="955" y="490" fill="#059669" font-size="30">Y</text><circle cx="798" cy="280" r="46" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text text-anchor="middle" x="798" y="290" fill="#7C3AED" font-size="30">M</text><path d="M670 425L768 320" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M828 320L924 425" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="580" y="625" fill="#475569" font-size="28">X → M → Y</text><text x="580" y="753" fill="#475569" font-size="25">Fix M: blocks part of</text><text x="580" y="803" fill="#475569" font-size="25">the causal path.</text><text x="1090" y="146" fill="#0F172A" font-size="29">Collider</text><circle cx="1150" cy="480" r="46" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text text-anchor="middle" x="1150" y="490" fill="#2563EB" font-size="30">X</text><circle cx="1465" cy="480" r="46" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text text-anchor="middle" x="1465" y="490" fill="#059669" font-size="30">Y</text><circle cx="1308" cy="280" r="46" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text text-anchor="middle" x="1308" y="290" fill="#7C3AED" font-size="30">C</text><path d="M1180 425L1278 320" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1434 425L1338 320" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="1090" y="625" fill="#475569" font-size="28">X → C ← Y</text><text x="1090" y="753" fill="#475569" font-size="25">Select C: can open</text><text x="1090" y="803" fill="#475569" font-size="25">this otherwise blocked path.</text><text x="40" y="915" fill="#475569" font-size="27">A node's role is relative to the selected treatment, outcome and path.</text></g></svg>

