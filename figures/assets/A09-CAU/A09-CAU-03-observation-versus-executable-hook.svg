<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1140" width="1460" height="1140" role="img"><title>observation-versus-executable-hook</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1460" height="1140" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Direct hook replacement measures a specified low-level operation</text><text x="40" y="150" fill="#0F172A" font-size="29">Observation</text><circle cx="310" cy="285" r="58" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text text-anchor="middle" x="310" y="295" fill="#2563EB" font-size="30">Input</text><circle cx="140" cy="532" r="46" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text text-anchor="middle" x="140" y="542" fill="#059669" font-size="30">H</text><circle cx="530" cy="532" r="46" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text text-anchor="middle" x="530" y="542" fill="#059669" font-size="30">Y</text><path d="M277 335L174 476" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M343 335L496 476" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M200 532H470" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="40" y="713" fill="#475569" font-size="25">Input may influence H and Y.</text><text x="760" y="150" fill="#0F172A" font-size="29">Paired direct execution</text><rect x="760" y="258" width="585" height="141" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="787" y="311" fill="#2563EB" font-size="27">Same prompt and evaluation</text><text x="787" y="370" fill="#2563EB" font-size="26">Fixed model / hook / policy</text><path d="M938 413V484" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1205 413V484" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="795" y="498" width="285" height="159" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="820" y="563" fill="#059669" font-size="28">Original H</text><text x="820" y="626" fill="#059669" font-size="28">Outcome Y₀</text><rect x="1110" y="498" width="285" height="159" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="1135" y="563" fill="#DC2626" font-size="28">Replace H</text><text x="1135" y="626" fill="#DC2626" font-size="28">Outcome Y₁</text><path d="M938 671V804H1024" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1252 671V804H1133" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1038" y="732" width="80" height="145" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text text-anchor="middle" x="1078" y="816" fill="#7C3AED" font-size="30">Δ</text><text x="983" y="957" fill="#7C3AED" font-size="29">Y₁ − Y₀</text><text x="40" y="1064" fill="#475569" font-size="27">This intervention is executable; semantic equivalence needs separate evidence.</text></g></svg>

