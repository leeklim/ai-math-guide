<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 1140" width="1430" height="1140" role="img"><title>prompt-units-shared-state</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1430" height="1140" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Prompt sampling and cross-run state determine the experimental unit</text><text x="40" y="150" fill="#0F172A" font-size="29">Separate prompt units</text><text x="760" y="150" fill="#0F172A" font-size="29">Shared state creates interference</text><rect x="40" y="239" width="595" height="145" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="69" y="297" fill="#2563EB" font-size="28">Prompt 1 / weight w1</text><text x="69" y="354" fill="#059669" font-size="28">Paired effect Δ1</text><rect x="760" y="239" width="595" height="145" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="790" y="317" fill="#2563EB" font-size="28">Prompt 1 execution</text><path d="M1190 398V445" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><text x="1209" y="434" fill="#DC2626" font-size="25">state</text><rect x="40" y="459" width="595" height="145" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="69" y="517" fill="#2563EB" font-size="28">Prompt 2 / weight w2</text><text x="69" y="574" fill="#059669" font-size="28">Paired effect Δ2</text><rect x="760" y="459" width="595" height="145" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="790" y="537" fill="#2563EB" font-size="28">Prompt 2 execution</text><path d="M1190 618V665" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><text x="1209" y="654" fill="#DC2626" font-size="25">state</text><rect x="40" y="679" width="595" height="145" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="69" y="737" fill="#2563EB" font-size="28">Prompt 3 / weight w3</text><text x="69" y="794" fill="#059669" font-size="28">Paired effect Δ3</text><rect x="760" y="679" width="595" height="145" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="790" y="757" fill="#2563EB" font-size="28">Prompt 3 execution</text><text x="40" y="977" fill="#7C3AED" font-size="29">Mean effect = Σ wᵢ Δᵢ</text><text x="40" y="1020" fill="#475569" font-size="25">wᵢ ≥ 0; Σ wᵢ = 1</text><text x="760" y="977" fill="#DC2626" font-size="26">Later runs depend on earlier runs.</text><text x="40" y="1075" fill="#475569" font-size="27">Specify the prompt population and check whether a prompt is a separate unit.</text></g></svg>

