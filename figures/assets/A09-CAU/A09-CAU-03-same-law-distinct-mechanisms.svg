<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 1140" width="1460" height="1140" role="img"><title>same-law-distinct-mechanisms</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1460" height="1140" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Identical observed pairs can come from different causal assignments</text><text x="40" y="146" fill="#0F172A" font-size="29">Model A</text><circle cx="310" cy="257" r="46" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text text-anchor="middle" x="310" y="267" fill="#2563EB" font-size="30">U</text><circle cx="138" cy="480" r="46" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text text-anchor="middle" x="138" y="490" fill="#059669" font-size="30">X</text><circle cx="520" cy="480" r="46" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text text-anchor="middle" x="520" y="490" fill="#059669" font-size="30">Y</text><path d="M280 297L172 424" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M198 480H460" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="675" width="595" height="170" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="70" y="739" fill="#7C3AED" font-size="30">X=U</text><text x="70" y="809" fill="#7C3AED" font-size="30">Y=X</text><text x="40" y="963" fill="#DC2626" font-size="29">do(X=1) ⇒ Y=1</text><text x="770" y="146" fill="#0F172A" font-size="29">Model B</text><circle cx="1040" cy="257" r="46" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text text-anchor="middle" x="1040" y="267" fill="#2563EB" font-size="30">U</text><circle cx="868" cy="480" r="46" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text text-anchor="middle" x="868" y="490" fill="#059669" font-size="30">X</text><circle cx="1250" cy="480" r="46" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text text-anchor="middle" x="1250" y="490" fill="#059669" font-size="30">Y</text><path d="M1010 297L902 424" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1070 297L1216 424" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="770" y="675" width="595" height="170" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="800" y="739" fill="#7C3AED" font-size="30">X=U</text><text x="800" y="809" fill="#7C3AED" font-size="30">Y=U</text><text x="770" y="963" fill="#DC2626" font-size="29">do(X=1) ⇒ Y=U</text><text x="40" y="1062" fill="#475569" font-size="27">U is binary with P(U=0)=P(U=1)=0.5; both yield only (0,0) and (1,1).</text></g></svg>

