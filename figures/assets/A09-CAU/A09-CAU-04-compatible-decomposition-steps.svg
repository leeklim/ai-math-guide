    <text style="font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: middle" x="889.744681" y="228.4" transform="rotate(-0 889.744681 228.4)">Y=a+2m+am</text>
   </g>
  </g>
  <g id="text_31">
   <text style="font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: middle" x="580" y="74.275625" transform="rotate(-0 580 74.275625)">One shared intermediate outcome gives a compatible decomposition</text>
  </g>
  <g id="text_32">
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(164.970703 950.213281)">M(a)=a. States are Y(0,0), Y(1,0), Y(1,1), not times on a trajectory.</text>
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(193.560547 983.906641)">Additive: 3−0=(1−0)+(3−1). Interaction: 4−0=(1−0)+(4−1).</text>
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(190.371094 1017.6)">The middle term cancels without a no-interaction assumption.</text>
  </g>
 </g>
