<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1475 1120" width="1475" height="1120" role="img"><title>controlled-versus-natural-mediator</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1475" height="1120" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">A controlled mediator is common; a natural baseline mediator is unit-specific</text><text x="40" y="145" fill="#0F172A" font-size="28">Natural direct-effect pairing</text><text x="760" y="145" fill="#0F172A" font-size="28">Controlled direct-effect pairing</text><rect x="40" y="244" width="270" height="145" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="302" fill="#2563EB" font-size="28">Unit 1</text><text x="65" y="361" fill="#059669" font-size="29">M(0)=1</text><path d="M324 316H424" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="438" y="244" width="265" height="145" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="463" y="331" fill="#DC2626" font-size="28">Hold M=1</text><rect x="760" y="244" width="270" height="145" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="785" y="302" fill="#2563EB" font-size="28">Unit 1</text><text x="785" y="361" fill="#059669" font-size="29">M(0)=1</text><path d="M1044 316H1144" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1158" y="244" width="265" height="145" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="1183" y="331" fill="#DC2626" font-size="28">Set M=2</text><rect x="40" y="554" width="270" height="145" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="612" fill="#2563EB" font-size="28">Unit 2</text><text x="65" y="671" fill="#059669" font-size="29">M(0)=3</text><path d="M324 626H424" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="438" y="554" width="265" height="145" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="463" y="641" fill="#DC2626" font-size="28">Hold M=3</text><rect x="760" y="554" width="270" height="145" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="785" y="612" fill="#2563EB" font-size="28">Unit 2</text><text x="785" y="671" fill="#059669" font-size="29">M(0)=3</text><path d="M1044 626H1144" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1158" y="554" width="265" height="145" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="1183" y="641" fill="#DC2626" font-size="28">Set M=2</text><text x="40" y="848" fill="#7C3AED" font-size="28">Change A: 0 → 1 in each paired comparison.</text><text x="40" y="966" fill="#475569" font-size="26">Left: each unit keeps its own M(0). Right: everyone receives the same chosen m.</text><text x="40" y="1050" fill="#475569" font-size="26">Baseline values 1 and 3, and controlled m=2, are illustrative.</text></g></svg>

