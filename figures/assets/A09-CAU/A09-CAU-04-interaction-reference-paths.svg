   <text style="font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: middle" x="630" y="74.275625" transform="rotate(-0 630 74.275625)">Interaction changes reference-specific effects, not total difference</text>
  </g>
  <g id="text_28">
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(218.208984 950.213281)">Y(a,m)=a+2m+am gives Y(0,0)=0, Y(1,0)=1, Y(0,1)=2, Y(1,1)=4.</text>
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(304.398438 983.906641)">The two compatible paths yield 1+3=4 and 2+2=4.</text>
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(214.908203 1017.6)">Do not combine direct and indirect terms from mismatched paths.</text>
  </g>
