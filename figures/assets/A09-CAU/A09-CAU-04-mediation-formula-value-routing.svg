<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1375 1200" width="1375" height="1200" role="img"><title>mediation-formula-value-routing</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1375" height="1200" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Mediation formula matches mediator values across two treatment roles</text><rect x="40" y="175" width="1270" height="130" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="69" y="253" fill="#2563EB" font-size="28">Fix baseline stratum C=c; average these strata last using P(C=c).</text><rect x="40" y="437" width="430" height="159" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="65" y="494" fill="#7C3AED" font-size="27">Outcome arm: A=a</text><text x="65" y="557" fill="#059669" font-size="26">μ0=E[Y | a,M=0,c]</text><rect x="554" y="437" width="430" height="159" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="579" y="494" fill="#2563EB" font-size="27">Mediator arm: A=a′</text><text x="579" y="557" fill="#2563EB" font-size="26">q0=P(M=0 | a′,c)</text><path d="M255 423V370H1211V423" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M998 517H1082" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1096" y="437" width="230" height="159" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="1120" y="526" fill="#059669" font-size="28">μ0 × q0</text><rect x="40" y="727" width="430" height="159" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="65" y="784" fill="#7C3AED" font-size="27">Outcome arm: A=a</text><text x="65" y="847" fill="#059669" font-size="26">μ1=E[Y | a,M=1,c]</text><rect x="554" y="727" width="430" height="159" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="579" y="784" fill="#2563EB" font-size="27">Mediator arm: A=a′</text><text x="579" y="847" fill="#2563EB" font-size="26">q1=P(M=1 | a′,c)</text><path d="M255 713V660H1211V713" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M998 807H1082" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1096" y="727" width="230" height="159" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="1120" y="816" fill="#059669" font-size="28">μ1 × q1</text><text x="40" y="1050" fill="#475569" font-size="27">Match the same m in each term; sum over m, then average over C.</text><text x="40" y="1135" fill="#475569" font-size="26">Cross-world independence, no confounding, consistency and support are assumptions.</text></g></svg>

