<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 1060" width="1410" height="1060" role="img"><title>mediator-selection-versus-setting</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1410" height="1060" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Selecting M can select a background; setting M changes the mechanism</text><text x="40" y="143" fill="#0F172A" font-size="28">Condition on observed M</text><circle cx="310" cy="272" r="48" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text text-anchor="middle" x="310" y="282" fill="#2563EB" font-size="30">U</text><circle cx="135" cy="530" r="48" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text text-anchor="middle" x="135" y="540" fill="#D97706" font-size="30">M</text><circle cx="510" cy="530" r="48" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text text-anchor="middle" x="510" y="540" fill="#059669" font-size="30">Y</text><path d="M344 313L476 474" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M197 530H448" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M276 313L169 474" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><circle cx="135" cy="530" r="70" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="8 7"/><text x="40" y="773" fill="#475569" font-size="26">Use P(U | M=m, A=a)</text><text x="720" y="143" fill="#0F172A" font-size="28">Set M:=m</text><circle cx="990" cy="272" r="48" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text text-anchor="middle" x="990" y="282" fill="#2563EB" font-size="30">U</text><circle cx="815" cy="530" r="48" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text text-anchor="middle" x="815" y="540" fill="#DC2626" font-size="30">M</text><circle cx="1190" cy="530" r="48" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text text-anchor="middle" x="1190" y="540" fill="#059669" font-size="30">Y</text><path d="M1024 313L1156 474" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M877 530H1128" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M956 313L849 474" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 7"/><path d="M886 378l30 30m0-30l-30 30" stroke="#DC2626" stroke-width="3"/><text x="720" y="773" fill="#475569" font-size="26">Keep the unit/population background</text><text x="40" y="900" fill="#475569" font-size="27">A=a is held fixed here; the diagram isolates mediator–outcome confounding.</text><text x="40" y="990" fill="#475569" font-size="27">The same observed m need not mean the same outcome distribution.</text></g></svg>

