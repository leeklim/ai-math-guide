  <g id="text_11">
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(82.7375 811.4175)">Toy relation M(a)=a, A binary.</text>
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(99.08375 843.763125)">Natural states: (0,0), (1,1).</text>
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(90.62375 876.10875)">Hybrid (1,0) has no support.</text>
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(62.901875 908.454375)">Known Y(1,0) is still computable;</text>
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(62.894375 940.8)">this is not an observed manifold.</text>
