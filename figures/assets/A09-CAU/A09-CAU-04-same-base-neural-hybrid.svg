<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1090" width="1320" height="1090" role="img"><title>same-base-neural-hybrid</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1320" height="1090" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">A natural-mediator patch uses the same base prompt and specified hook</text><rect x="40" y="190" width="390" height="166" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="67" y="255" fill="#2563EB" font-size="28">Base prompt b / A=0</text><text x="67" y="319" fill="#059669" font-size="29">Cache M_b(0)</text><path d="M444 273H584" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="598" y="190" width="650" height="166" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="625" y="255" fill="#2563EB" font-size="28">Base prompt b / A=1</text><text x="625" y="319" fill="#DC2626" font-size="28">At fixed hook: insert M_b(0)</text><path d="M923 370V518" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="598" y="532" width="650" height="160" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="625" y="593" fill="#059669" font-size="28">Rerun downstream computation</text><text x="625" y="655" fill="#059669" font-size="30">Y_b(1,M_b(0))</text><text x="40" y="827" fill="#475569" font-size="27">A different base prompt b′ gives a different source policy.</text><text x="40" y="925" fill="#475569" font-size="26">Scale corrections change the inserted value; record them rather than calling it M_b(0).</text><text x="40" y="1020" fill="#475569" font-size="26">Execution of a hybrid does not prove a natural concept change or a unique mechanism.</text></g></svg>

