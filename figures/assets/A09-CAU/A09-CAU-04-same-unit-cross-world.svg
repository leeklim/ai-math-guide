<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 1270" width="1410" height="1270" role="img"><title>same-unit-cross-world</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1410" height="1270" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">One unit supplies the mediator in both treatment worlds</text><text x="40" y="144" fill="#0F172A" font-size="28">Baseline world</text><rect x="40" y="240" width="380" height="148" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="327" fill="#2563EB" font-size="31">A:=0</text><rect x="40" y="557" width="380" height="148" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="645" fill="#059669" font-size="29">Natural M(0)</text><rect x="40" y="865" width="380" height="148" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="953" fill="#059669" font-size="28">Y(0,M(0))</text><path d="M230 719V851" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M230 402V543" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="510" y="144" fill="#0F172A" font-size="28">Cross-world hybrid</text><rect x="510" y="240" width="380" height="148" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="535" y="327" fill="#2563EB" font-size="31">A:=1</text><rect x="510" y="557" width="380" height="148" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="535" y="645" fill="#DC2626" font-size="29">Insert M(0)</text><rect x="510" y="865" width="380" height="148" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="535" y="953" fill="#059669" font-size="28">Y(1,M(0))</text><path d="M700 719V851" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="980" y="144" fill="#0F172A" font-size="28">Treatment world</text><rect x="980" y="240" width="380" height="148" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="1005" y="327" fill="#2563EB" font-size="31">A:=1</text><rect x="980" y="557" width="380" height="148" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="1005" y="645" fill="#059669" font-size="29">Natural M(1)</text><rect x="980" y="865" width="380" height="148" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="1005" y="953" fill="#059669" font-size="28">Y(1,M(1))</text><path d="M1170 719V851" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1170 402V543" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M434 631H496" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><text x="40" y="1115" fill="#475569" font-size="28">same unit / same background</text><text x="40" y="1200" fill="#475569" font-size="26">The hybrid uses treatment 1 with that unit's baseline mediator, not another unit's value.</text></g></svg>

