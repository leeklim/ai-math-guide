<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 1080" width="1370" height="1080" role="img"><title>treatment-created-confounder</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1370" height="1080" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">A treatment-created mediator–outcome common cause is not baseline C</text><circle cx="145" cy="295" r="48" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text text-anchor="middle" x="145" y="305" fill="#2563EB" font-size="30">A</text><circle cx="620" cy="295" r="48" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text text-anchor="middle" x="620" y="305" fill="#7C3AED" font-size="30">L</text><circle cx="435" cy="645" r="48" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text text-anchor="middle" x="435" y="655" fill="#059669" font-size="30">M</text><circle cx="1050" cy="645" r="48" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text text-anchor="middle" x="1050" y="655" fill="#059669" font-size="30">Y</text><path d="M207 295H558" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M590 340L465 590" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M654 337L1014 590" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M497 645H988" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="40" y="827" fill="#7C3AED" font-size="29">L occurs after A.</text><text x="40" y="915" fill="#475569" font-size="27">L → M and L → Y create mediator–outcome confounding.</text><text x="40" y="1010" fill="#475569" font-size="26">Adding L to a regression does not automatically restore the standard natural-effect formula.</text></g></svg>

