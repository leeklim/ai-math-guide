<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1390 1010" width="1390" height="1010" role="img"><title>abduction-action-prediction</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1390" height="1010" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Abduction preserves evidence-informed background through the action</text><text x="40" y="151" fill="#0F172A" font-size="29">Abduction</text><rect x="40" y="268" width="370" height="233" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="64" y="338" fill="#2563EB" font-size="26">Observe X=1, Y=5</text><text x="64" y="419" fill="#2563EB" font-size="26">Infer U_X=1, U_Y=3</text><path d="M424 385H486" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="500" y="151" fill="#0F172A" font-size="29">Action</text><rect x="500" y="268" width="370" height="233" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="524" y="338" fill="#DC2626" font-size="26">Replace X equation</text><text x="524" y="419" fill="#DC2626" font-size="26">Set X:=0</text><path d="M884 385H946" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="960" y="151" fill="#0F172A" font-size="29">Prediction</text><rect x="960" y="268" width="370" height="233" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="984" y="338" fill="#2563EB" font-size="26">Keep inferred U_Y=3</text><text x="984" y="419" fill="#2563EB" font-size="26">Y=2×0+3=3</text><text x="40" y="690" fill="#7C3AED" font-size="29">Known SCM: X=U_X; Y=2X+U_Y.</text><text x="40" y="833" fill="#475569" font-size="27">Do not force the old Y=5 after action; recompute the downstream outcome.</text><text x="40" y="936" fill="#475569" font-size="27">If population E[U_Y]=0, its do(X=0) mean is 0, not this unit's value 3.</text></g></svg>

