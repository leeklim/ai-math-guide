<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1020" width="1320" height="1020" role="img"><title>later-time-different-background</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1320" height="1020" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">A later treated outcome is not automatically the missing earlier world</text><path d="M86 456H1260" fill="none" stroke="#475569" stroke-width="3"  marker-end="url(#arrow)"/><text x="1202" y="514" fill="#475569" font-size="28">Time</text><rect x="40" y="180" width="440" height="153" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="67" y="242" fill="#2563EB" font-size="30">At t₀: A=0</text><text x="67" y="307" fill="#2563EB" font-size="28">Background u₀</text><rect x="790" y="180" width="440" height="153" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="817" y="242" fill="#D97706" font-size="30">Later t₁: A=1</text><text x="817" y="307" fill="#D97706" font-size="26">Background may change</text><path d="M260 347V442" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1010 347V442" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="631" width="560" height="156" rx="7" fill="#475569" fill-opacity=".07" stroke="#475569" stroke-width="2"/><text x="67" y="721" fill="#475569" font-size="27">Missing: Y at A=1, t₀, u₀</text><text x="40" y="938" fill="#475569" font-size="28">Same unit name does not hold time and background fixed.</text></g></svg>

