<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 1060" width="1370" height="1060" role="img"><title>one-unit-one-revealed-world</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1370" height="1060" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">One assignment reveals one of a unit's potential outcomes</text><rect x="40" y="170" width="500" height="153" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="67" y="232" fill="#2563EB" font-size="29">Unit i / background fixed</text><text x="67" y="297" fill="#2563EB" font-size="28">Two defined outcomes</text><path d="M554 247H679" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M290 337V421H1172V337" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="693" y="170" width="285" height="153" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="720" y="259" fill="#059669" font-size="32">Yᵢ(0)</text><rect x="1030" y="170" width="285" height="153" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="1057" y="259" fill="#059669" font-size="32">Yᵢ(1)</text><rect x="40" y="568" width="500" height="153" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="67" y="654" fill="#D97706" font-size="30">Assignment Aᵢ=1</text><path d="M554 644H635V500H1172V554" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1030" y="568" width="285" height="153" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="1057" y="654" fill="#D97706" font-size="28">Observed Yᵢ(1)</text><rect x="693" y="568" width="285" height="153" rx="7" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 7"/><text x="716" y="654" fill="#475569" font-size="27">Unobserved Yᵢ(0)</text><text x="40" y="884" fill="#7C3AED" font-size="27">Individual contrast: τᵢ=Yᵢ(1)−Yᵢ(0), not a difference between two unrelated units.</text><text x="40" y="984" fill="#475569" font-size="27">ATE needs marginal means; the joint pairing contains more information.</text></g></svg>

