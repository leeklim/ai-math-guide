<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1250" width="1320" height="1250" role="img"><title>shared-state-interference</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1320" height="1250" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Shared batch state can carry one unit's intervention into another unit</text><rect x="40" y="210" width="440" height="160" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="67" y="303" fill="#DC2626" font-size="28">Prompt i: replace Hᵢ</text><rect x="800" y="210" width="460" height="160" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="827" y="303" fill="#2563EB" font-size="28">Prompt j: keep Hⱼ</text><path d="M260 384V612H386" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1030 384V612H944" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="400" y="532" width="530" height="160" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="427" y="594" fill="#7C3AED" font-size="28">Shared batch statistic</text><text x="427" y="655" fill="#7C3AED" font-size="28">or mutable state</text><path d="M665 706V832" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="400" y="846" width="530" height="150" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="427" y="935" fill="#059669" font-size="29">Outcome of prompt j</text><text x="40" y="1085" fill="#475569" font-size="28">Yⱼ depends on Aᵢ as well as Aⱼ.</text><text x="40" y="1175" fill="#475569" font-size="27">Red arrows show interference; redefine or isolate the unit contract.</text></g></svg>

