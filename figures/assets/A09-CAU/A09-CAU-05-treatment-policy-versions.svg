<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 1090" width="1330" height="1090" role="img"><title>treatment-policy-versions</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1330" height="1090" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Different replacement rules define different treatment versions</text><rect x="40" y="220" width="420" height="150" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="67" y="306" fill="#2563EB" font-size="27">Same original activation H</text><rect x="730" y="160" width="540" height="145" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="757" y="219" fill="#DC2626" font-size="28">Zero policy</text><text x="757" y="276" fill="#DC2626" font-size="28">H:=0</text><path d="M474 295H650V232H716" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="730" y="385" width="540" height="145" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="757" y="444" fill="#DC2626" font-size="28">Mean policy</text><text x="757" y="501" fill="#DC2626" font-size="28">H:=mean</text><path d="M474 295H650V457H716" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="730" y="610" width="540" height="145" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="757" y="669" fill="#DC2626" font-size="28">Source policy</text><text x="757" y="726" fill="#DC2626" font-size="28">H:=H(source)</text><path d="M474 295H650V682H716" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><text x="40" y="940" fill="#475569" font-size="28">One label 'ablation' does not make these the same Yᵢ(1).</text><text x="40" y="1025" fill="#475569" font-size="27">Specify the rule or define policy selection as part of treatment.</text></g></svg>

