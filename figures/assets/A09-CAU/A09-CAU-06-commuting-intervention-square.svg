<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 1160" width="1370" height="1160" role="img"><title>commuting-intervention-square</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1370" height="1160" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Both routes start from corresponding states and include recomputation</text><rect x="40" y="235" width="420" height="180" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="68" y="330" fill="#2563EB" font-size="31">Low state l</text><rect x="820" y="235" width="490" height="180" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="848" y="308" fill="#DC2626" font-size="29">Intervened i_L(l)</text><text x="848" y="378" fill="#DC2626" font-size="25">Includes downstream rerun</text><rect x="40" y="780" width="420" height="180" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="68" y="883" fill="#2563EB" font-size="30">High state τ(l)</text><rect x="820" y="780" width="490" height="180" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="848" y="837" fill="#059669" font-size="27">Compare abstract results</text><text x="848" y="915" fill="#059669" font-size="28">τ(i_L(l)) / i_H(τ(l))</text><path d="M474 325H806" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><text x="600" y="279" fill="#DC2626" font-size="28">i_L</text><path d="M250 429V766" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="283" y="617" fill="#7C3AED" font-size="30">τ</text><path d="M1065 429V766" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="1098" y="617" fill="#7C3AED" font-size="30">τ</text><path d="M474 870H806" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><text x="600" y="824" fill="#DC2626" font-size="28">i_H</text><text x="40" y="1090" fill="#475569" font-size="27">Exact commuting requires equality on the stated states and intervention pairs.</text></g></svg>

