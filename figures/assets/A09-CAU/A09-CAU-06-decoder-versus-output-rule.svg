<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1160" width="1200" height="1160" role="img"><title>decoder-versus-output-rule</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1200" height="1160" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Changing a decoded label is not the same as implementing an output rule</text><rect x="40" y="235" width="460" height="161" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="67" y="300" fill="#DC2626" font-size="28">Low-level flip and rerun</text><text x="67" y="365" fill="#475569" font-size="26">Illustrative failure case</text><path d="M514 315H653" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="667" y="235" width="460" height="161" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="694" y="325" fill="#059669" font-size="28">Decoded label: plural</text><path d="M270 410V662" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="676" width="460" height="161" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="67" y="741" fill="#DC2626" font-size="27">Actual recomputed verb</text><text x="67" y="806" fill="#DC2626" font-size="30">is (unchanged)</text><rect x="667" y="676" width="460" height="161" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="694" y="741" fill="#059669" font-size="27">High-level rule predicts</text><text x="694" y="806" fill="#059669" font-size="30">are after flip</text><text x="490" y="970" fill="#DC2626" font-size="30">Mismatch</text><text x="40" y="1090" fill="#475569" font-size="27">The label changed, but the selected downstream output did not commute.</text></g></svg>

