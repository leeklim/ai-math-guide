  <g id="text_24">
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(256.537109 892.613281)">τ(l)=sign(l1). Before: (2,1) and (2,−1) both map to +1.</text>
