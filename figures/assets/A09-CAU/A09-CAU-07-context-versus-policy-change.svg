<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1290" width="1300" height="1290" role="img"><title>context-versus-policy-change</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1300" height="1290" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Context heterogeneity and intervention-policy changes answer different questions</text><text x="75" y="180" fill="#7C3AED" font-size="29">Same policy</text><text x="75" y="238" fill="#7C3AED" font-size="27">Change context only</text><rect x="40" y="310" width="470" height="160" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="369" fill="#2563EB" font-size="29">Template A</text><text x="65" y="434" fill="#475569" font-size="26">Same layer and replacement</text><rect x="40" y="540" width="470" height="160" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="599" fill="#2563EB" font-size="29">Template B</text><text x="65" y="664" fill="#475569" font-size="26">Same layer and replacement</text><path d="M525 390H672" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><path d="M525 620H672" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><text x="720" y="513" fill="#D97706" font-size="27">Compare context effects</text><rect x="40" y="865" width="1160" height="192" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="68" y="924" fill="#DC2626" font-size="28">Different layer / replacement / baseline</text><text x="68" y="997" fill="#475569" font-size="27">A changed intervention contract, not merely a new context</text><text x="40" y="1210" fill="#475569" font-size="26">Define context before intervention; do not silently reuse changed activations.</text></g></svg>

