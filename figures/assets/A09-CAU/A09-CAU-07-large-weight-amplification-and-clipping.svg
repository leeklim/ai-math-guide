  <g id="text_20">
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(143.701172 944.624609)">Illustrative p_S=0.05, p_T=0.50; ratio=10. Conditional estimate error=0.02.</text>
