   <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(181.503906 1012.706641)">Clip ratio at 4: source mass 0.05 becomes 0.20, not target mass 0.50.</text>
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(120.585938 1046.4)">Renormalization must be checked across all contexts; it does not undo clipping.</text>
