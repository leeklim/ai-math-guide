<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1120" width="1300" height="1120" role="img"><title>matched-contrast-contract</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1300" height="1120" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Population change preserves the intervention contrast only under a matched contract</text><rect x="40" y="190" width="490" height="210" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="66" y="251" fill="#2563EB" font-size="29">Source population</text><text x="66" y="323" fill="#2563EB" font-size="29">Same definition: Y¹ − Y⁰</text><text x="66" y="375" fill="#475569" font-size="25">Different context proportions</text><rect x="740" y="190" width="490" height="210" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="766" y="251" fill="#059669" font-size="29">Target population</text><text x="766" y="323" fill="#059669" font-size="29">Same definition: Y¹ − Y⁰</text><text x="766" y="375" fill="#475569" font-size="25">Different context proportions</text><path d="M544 295H726" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="565" y="223" fill="#7C3AED" font-size="25">Match policy</text><text x="565" y="365" fill="#7C3AED" font-size="25">and outcome</text><rect x="180" y="600" width="900" height="220" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="210" y="662" fill="#D97706" font-size="28">A population shift changes where we average.</text><text x="210" y="729" fill="#0F172A" font-size="27">Zero ablation vs mean replacement changes</text><text x="210" y="785" fill="#0F172A" font-size="27">the operation itself, not only the population.</text><text x="40" y="1050" fill="#475569" font-size="26">Keep units, replacement rules and outcome scales aligned before transport.</text></g></svg>

