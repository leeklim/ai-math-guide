<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1450" width="1300" height="1450" role="img"><title>seed-role-heldout-correspondence</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1300" height="1450" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Match a causal role, then test its intervention response on held-out prompts</text><rect x="40" y="205" width="450" height="230" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="273" fill="#2563EB" font-size="30">Seed S: head 7</text><text x="65" y="343" fill="#2563EB" font-size="26">Selected circuit role</text><text x="65" y="410" fill="#475569" font-size="25">Illustrative correspondence</text><rect x="780" y="205" width="450" height="230" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="805" y="273" fill="#DC2626" font-size="30">Seed T: head 7</text><text x="805" y="343" fill="#DC2626" font-size="26">Same index is not evidence</text><text x="805" y="410" fill="#475569" font-size="25">of the same role</text><path d="M504 286H766" fill="none" stroke="#DC2626" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="565" y="228" fill="#DC2626" font-size="26">Index only</text><rect x="780" y="660" width="450" height="230" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="805" y="725" fill="#059669" font-size="26">Seed T: matched component</text><text x="805" y="795" fill="#059669" font-size="26">Role / subspace criterion</text><text x="805" y="861" fill="#475569" font-size="25">Fit on selection data</text><path d="M265 449V777H766" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="780" y="1070" width="450" height="190" rx="7" fill="#0