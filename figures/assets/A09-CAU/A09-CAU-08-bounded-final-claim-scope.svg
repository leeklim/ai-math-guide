<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1300" width="1300" height="1300" role="img"><title>bounded-final-claim-scope</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1300" height="1300" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Claim scope follows completed evidence, not the number of positive-looking tests</text><rect x="40" y="180" width="1190" height="475" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="68" y="247" fill="#059669" font-size="28">If the stated tests were actually completed:</text><text x="68" y="337" fill="#059669" font-size="29">One specified architecture</text><text x="68" y="420" fill="#059669" font-size="27">Evaluated prompt population and intervention family</text><rect x="160" y="488" width="380" height="110" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="187" y="554" fill="#2563EB" font-size="28">Aligned seed 1</text><rect x="710" y="488" width="380" height="110" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="737" y="554" fill="#2563EB" font-size="28">Aligned seed 2</text><text x="40" y="837" fill="#DC2626" font-size="29">Not established by that scope alone</text><rect x="40" y="930" width="360" height="160" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="65" y="995" fill="#DC2626" font-size="27">Other architectures</text><text x="65" y="1060" fill="#475569" font-size="25">Needs separate evidence</text><rect x="455" y="930" width="360" height="160" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="480" y="995" fill="#DC2626" font-size="27">A unique circuit</text><text x="480" y="1060" fill="#475569" font-size="25">Needs separate evidence</text><rect x="870" y="930" width="360" height="160" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="895" y="995" fill="#DC2626" font-size="27">Human mechanism</text><text x="895" y="1060" fill="#475569" font-size="25">Needs separate evidence</text><text x="40" y="1230" fill="#475569" font-size="26">Record failed and unmeasured checks; the capstone does not supply new results.</text></g></svg>

