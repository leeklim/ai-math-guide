<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1300" width="1360" height="1300" role="img"><title>natural-identity-versus-node-additivity</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1360" height="1300" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Telescoping natural contrasts differ from adding isolated node effects</text><text x="40" y="157" fill="#7C3AED" font-size="28">Compatible natural-reference path</text><rect x="40" y="245" width="370" height="140" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="324" fill="#2563EB" font-size="28">Y(0, M(0))</text><path d="M424 315H476" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="426" y="270" fill="#7C3AED" font-size="25">NDE</text><rect x="490" y="245" width="370" height="140" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="515" y="324" fill="#2563EB" font-size="28">Y(1, M(0))</text><path d="M874 315H926" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="876" y="270" fill="#7C3AED" font-size="25">NIE</text><rect x="940" y="245" width="370" height="140" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="965" y="324" fill="#2563EB" font-size="28">Y(1, M(1))</text><text x="40" y="520" fill="#7C3AED" font-size="30">The middle outcome cancels in NDE + NIE = TE.</text><text x="40" y="597" fill="#475569" font-size="27">This identity remains valid with interaction.</text><rect x="40" y="810" width="1250" height="242" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="68" y="881" fill="#DC2626" font-size="29">Isolated node A effect + isolated node B effect</text><text x="68" y="951" fill="#DC2626" font-size="28">does not automatically equal the joint A/B effect.</text><text x="68" y="1021" fill="#475569" font-size="27">Test Y(1,1) − Y(1,0) − Y(0,1) + Y(0,0).</text><text x="40" y="1230" fill="#475569" font-size="26">Define natural mediator pairing or arbitrary-source patch policies separately.</text></g></svg>

