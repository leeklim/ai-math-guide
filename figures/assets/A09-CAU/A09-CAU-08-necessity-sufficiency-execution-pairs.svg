<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 1440" width="1330" height="1440" role="img"><title>necessity-sufficiency-execution-pairs</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1330" height="1440" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">The labels 1 and 0 refer to two explicitly defined executions</text><text x="40" y="190" fill="#DC2626" font-size="30">Necessity contrast</text><rect x="40" y="280" width="520" height="200" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="66" y="344" fill="#DC2626" font-size="27">1: specified ablation</text><text x="66" y="415" fill="#475569" font-size="26">Background: intact input</text><rect x="730" y="280" width="520" height="200" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="756" y="344" fill="#2563EB" font-size="27">0: intact execution</text><text x="756" y="415" fill="#475569" font-size="26">Same input and background</text><path d="M574 378H716" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><text x="594" y="332" fill="#D97706" font-size="25">Compare</text><text x="40" y="584" fill="#DC2626" font-size="30">Yᵢ(1) − Yᵢ(0)</text><text x="500" y="584" fill="#475569" font-size="27">A decrease can be negative.</text><text x="40" y="760" fill="#059669" font-size="30">Sufficiency contrast</text><rect x="40" y="850" width="520" height="200" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="66" y="914" fill="#059669" font-size="27">1: clean activation patch</text><text x="66" y="985" fill="#475569" font-size="26">Background: corrupted input</text><rect x="730" y="850" width="520" height="200" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="756" y="914" fill="#2563EB" font-size="27">0: unpatched corrupted run</text><text x="756" y="985" fill="#475569" font-size="26">Same corrupted background</text><path d="M574 948H716" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><text x="594" y="902" fill="#D97706" font-size="25">Compare</text><text x="40" y="1154" fill="#059669" font-size="30">Yᵢ(1) − Yᵢ(0)</text><text x="500" y="1154" fill="#475569" font-size="27">Restoration can be positive.</text><text x="40" y="1370" fill="#475569" font-size="26">Same equation shape, different policies and estimands; these are designs, not results.</text></g></svg>

