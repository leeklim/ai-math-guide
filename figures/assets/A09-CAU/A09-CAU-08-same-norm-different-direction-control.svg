  <g id="text_12">
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(84.55625 875.071875)">Illustrative control directions.</text>
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(138.32 907.4175)">Both norms equal 1.</text>
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(58.2725 939.763125)">Fix layer, position and dimension.</text>
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(74.24 972.10875)">Norm matching alone does not</text>
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(50.196875 1004.454375)">match every intervention property.</text>
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(129.636875 1036.8)">No effects are shown.</text>
  </g>
