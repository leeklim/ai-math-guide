<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1430 1190" width="1430" height="1190" role="img"><title>selection-final-test-boundary</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1430" height="1190" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Fix candidates and policies before final claim evaluation</text><rect x="40" y="240" width="410" height="230" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="66" y="305" fill="#2563EB" font-size="29">Localization</text><text x="66" y="380" fill="#2563EB" font-size="25">Activation / attribution</text><text x="66" y="442" fill="#475569" font-size="25">Candidate proposals</text><path d="M464 355H491" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="505" y="240" width="410" height="230" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="531" y="305" fill="#7C3AED" font-size="29">Validation</text><text x="531" y="380" fill="#7C3AED" font-size="25">Select nodes and baselines</text><text x="531" y="442" fill="#475569" font-size="25">Freeze the contract</text><path d="M929 355H956" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="970" y="240" width="410" height="230" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="996" y="305" fill="#059669" font-size="29">Final test</text><text x="996" y="380" fill="#059669" font-size="25">Paired effects and controls</text><text x="996" y="442" fill="#475569" font-size="25">Uncertainty and claim scope</text><rect x="180" y="710" width="1080" height="240" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="208" y="781" fill="#D97706" font-size="29">No test-result reuse for candidate or baseline selection</text><text x="208" y="865" fill="#475569" font-size="28">Unmeasured checks remain unmeasured.</text><text x="40" y="1120" fill="#475569" font-size="26">This capstone specifies a protocol; it does not report newly executed model tests.</text></g></svg>

