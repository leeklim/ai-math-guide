<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 670" width="960" height="670" role="img"><title>Incoming probability mass in row-vector propagation</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="960" height="670" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="62" fill="#0F172A" font-size="30" text-anchor="start">Sum all incoming probability mass</text><text x="40" y="112" fill="#64748B" font-size="28" text-anchor="start">Illustrative input distribution p = (0.5, 0.5)</text><rect x="55" y="150" width="220" height="95" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="165" y="189" fill="#2563EB" font-size="28" text-anchor="middle">Source 1: 0.5</text><rect x="55" y="415" width="220" height="95" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="165" y="454" fill="#2563EB" font-size="28" text-anchor="middle">Source 2: 0.5</text><rect x="725" y="150" width="195" height="95" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="822.5" y="189" fill="#059669" font-size="28" text-anchor="middle">Next 1: 0.6</text><rect x="725" y="415" width="195" height="95" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="822.5" y="454" fill="#059669" font-size="28" text-anchor="middle">Next 2: 0.4</text><path d="M275 195H725" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><text x="500" y="174" fill="#2563EB" font-size="28" text-anchor="middle">0.5 × 0.8 = 0.4</text><path d="M275 460H725" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="500" y="510" fill="#7C3AED" font-size="28" text-anchor="middle">0.5 × 0.6 = 0.3</text><path d="M275 220L725 440" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><text x="360" y="320" fill="#2563EB" font-size="28" text-anchor="middle">0.1</text><path d="M275 440L725 220" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="650" y="320" fill="#7C3AED" font-size="28" text-anchor="middle">0.2</text><text x="40" y="605" fill="#0F172A" font-size="28" text-anchor="start">Next 1: 0.4 + 0.2 = 0.6;  next 2: 0.1 + 0.3 = 0.4</text></g></svg>
