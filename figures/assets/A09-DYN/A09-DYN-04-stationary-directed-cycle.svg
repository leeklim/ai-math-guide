<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 850" width="520" height="850" role="img"><title>Stationary uniform distribution on a directed cycle</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="850" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="62" fill="#0F172A" font-size="26" text-anchor="start">Stationary with a circulating flux</text><rect x="160" y="135" width="200" height="96" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="174" fill="#2563EB" font-size="28" text-anchor="middle">State 1</text><text x="260" y="210" fill="#64748B" font-size="24" text-anchor="middle">Mass 1/3</text><rect x="40" y="420" width="190" height="96" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="135" y="459" fill="#2563EB" font-size="28" text-anchor="middle">State 2</text><text x="135" y="495" fill="#64748B" font-size="24" text-anchor="middle">Mass 1/3</text><rect x="290" y="420" width="190" height="96" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="385" y="459" fill="#2563EB" font-size="28" text-anchor="middle">State 3</text><text x="385" y="495" fill="#64748B" font-size="24" text-anchor="middle">Mass 1/3</text><path d="M190 231L125 420" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M230 467H290" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M395 420L330 231" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="350" fill="#7C3AED" font-size="25" text-anchor="start">1 → 2</text><text x="400" y="350" fill="#7C3AED" font-size="25" text-anchor="start">3 → 1</text><text x="260" y="570" fill="#7C3AED" font-size="25" text-anchor="middle">2 → 3</text><text x="40" y="660" fill="#7C3AED" font-size="28" text-anchor="start">Every forward flux = 1/3</text><text x="40" y="725" fill="#64748B" font-size="28" text-anchor="start">Every reverse flux = 0</text><text x="40" y="790" fill="#64748B" font-size="25" text-anchor="start">Uniform masses persist; no balance.</text></g></svg>
