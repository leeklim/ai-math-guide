<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 735" width="520" height="735" role="img"><title>Nonzero balanced pair flux at stationarity</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="735" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="62" fill="#0F172A" font-size="25" text-anchor="start">Balanced flux does not mean no moves</text><text x="40" y="128" fill="#64748B" font-size="27" text-anchor="start">Stationary π = (2/3, 1/3)</text><rect x="55" y="310" width="140" height="105" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><rect x="325" y="310" width="140" height="105" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="125" y="348" fill="#2563EB" font-size="27" text-anchor="middle">State 1</text><text x="125" y="390" fill="#2563EB" font-size="25" text-anchor="middle">Mass 2/3</text><text x="395" y="348" fill="#2563EB" font-size="27" text-anchor="middle">State 2</text><text x="395" y="390" fill="#2563EB" font-size="25" text-anchor="middle">Mass 1/3</text><path d="M195 330H325" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M325 390H195" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="260" y="265" fill="#7C3AED" font-size="28" text-anchor="middle">π₁ P₁₂ = 2/15</text><text x="260" y="480" fill="#7C3AED" font-size="28" text-anchor="middle">π₂ P₂₁ = 2/15</text><text x="40" y="600" fill="#64748B" font-size="26" text-anchor="start">The pair exchanges nonzero mass.</text><text x="40" y="668" fill="#059669" font-size="25" text-anchor="start">State distribution stays unchanged.</text></g></svg>
