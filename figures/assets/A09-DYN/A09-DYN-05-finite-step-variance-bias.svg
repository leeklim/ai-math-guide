  <g id="text_11">
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start" x="40.04" y="49" transform="rotate(-0 40.04 49)">Finite steps change the variance</text>
  </g>
  <g id="text_12">
   <text style="font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7c3aed" x="40.04" y="132.3" transform="rotate(-0 40.04 132.3)">Discrete v = 1 / (1 − h/2)</text>
  </g>
  <g id="text_13">
   <text style="font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #059669" x="40.04" y="196" transform="rotate(-0 40.04 196)">Continuous variance T = 1 - -</text>
  </g>
  <g id="text_14">
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start" x="40.04" y="813.4" transform="rotate(-0 40.04 813.4)">h = 0.5: v = 4/3; h = 1: v = 2</text>
  </g>
  <g id="text_15">
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #d97706" x="40.04" y="886.9" transform="rotate(-0 40.04 886.9)">Formula applies only for 0 &lt; h &lt; 2.</text>
  </g>
  <g id="text_16">
   <text style="font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64748b" x="40.04" y="945.7" transform="rotate(-0 40.04 945.7)">Bias tends to zero as h → 0.</text>
  </g>
