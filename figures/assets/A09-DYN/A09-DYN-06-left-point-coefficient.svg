<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1010" width="520" height="1010" role="img"><title>Left-point coefficient evaluation in an Ito increment</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1010" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="62" fill="#0F172A" font-size="26" text-anchor="start">Evaluate before the new increment</text><text x="40" y="125" fill="#64748B" font-size="28" text-anchor="start">Illustrative σ(x) = x</text><rect x="80" y="185" width="360" height="104" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="224" fill="#2563EB" font-size="28" text-anchor="middle">Known at tₖ: Xₖ = 1</text><path d="M260 289V370" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="80" y="380" width="360" height="104" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="419" fill="#7C3AED" font-size="28" text-anchor="middle">Freeze σ(Xₖ) = 1</text><path d="M260 484V565" fill="none" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="80" y="575" width="360" height="104" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="260" y="614" fill="#D97706" font-size="28" text-anchor="middle">Then observe ΔW = 0.2</text><path d="M260 679V760" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="80" y="770" width="360" height="104" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="809" fill="#059669" font-size="28" text-anchor="middle">Noise ΔX = 1 × 0.2</text><text x="40" y="952" fill="#64748B" font-size="25" text-anchor="start">No future noise sets σ(Xₖ).</text></g></svg>
