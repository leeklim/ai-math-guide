<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 945" width="960" height="945" role="img"><title>Scalar per-step covariance matching of SGD and a diffusion</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="960" height="945" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="62" fill="#0F172A" font-size="30" text-anchor="start">Match one-step noise covariance</text><text x="40" y="115" fill="#64748B" font-size="28" text-anchor="start">Scalar example: η = 0.1, C = 4, S = 2</text><text x="230" y="177" fill="#0F172A" font-size="30" text-anchor="middle">SGD: −η ξ</text><text x="730" y="177" fill="#0F172A" font-size="30" text-anchor="middle">SDE: √η S ΔW</text><rect x="65" y="230" width="330" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="230" y="269" fill="#2563EB" font-size="28" text-anchor="middle">SD(ξ) = 2</text><rect x="565" y="230" width="330" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="730" y="269" fill="#2563EB" font-size="28" text-anchor="middle">SD(ΔW) = √0.1</text><path d="M230 330V410" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M730 330V410" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="420" width="330" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="230" y="459" fill="#7C3AED" font-size="28" text-anchor="middle">Multiply by η = 0.1</text><rect x="565" y="420" width="330" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="730" y="459" fill="#7C3AED" font-size="28" text-anchor="middle">Multiply by 2√0.1</text><path d="M230 520V600" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M730 520V600" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="610" width="330" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="230" y="649" fill="#059669" font-size="28" text-anchor="middle">Step SD = 0.2</text><rect x="565" y="610" width="330" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="730" y="649" fill="#059669" font-size="28" text-anchor="middle">Step SD = 0.2</text><text x="480" y="814" fill="#059669" font-size="30" text-anchor="middle">Both per-step variances = 0.04</text><text x="40" y="885" fill="#64748B" font-size="26" text-anchor="start">Interval length η; match covariance only.</text></g></svg>
