<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1130" width="1080" height="1130" role="img"><title>Paired seed runs and nested checkpoint observations</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="1130" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="28" text-anchor="start">Pair runs; nest checkpoints</text><text x="40" y="105" fill="#64748B" font-size="26" text-anchor="start">Each pair shares initialization and data order.</text><rect x="40" y="295" width="230" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="155" y="334" fill="#2563EB" font-size="28" text-anchor="middle">Seed 1</text><text x="155" y="370" fill="#64748B" font-size="24" text-anchor="middle">Shared recipe</text><path d="M270 345L320 345L320 260L365 260" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M270 345L320 345L320 430L365 430" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="375" y="215" width="350" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="390" y="250" fill="#7C3AED" font-size="26" text-anchor="start">Condition A</text><path d="M405 287L685 287" fill="none" stroke="#CBD5E1" stroke-width="2.6"/><circle cx="420" cy="287" r="6" fill="#7C3AED"/><circle cx="550" cy="287" r="6" fill="#7C3AED"/><circle cx="680" cy="287" r="6" fill="#7C3AED"/><rect x="375" y="385" width="350" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="390" y="420" fill="#059669" font-size="26" text-anchor="start">Condition B</text><path d="M405 457L685 457" fill="none" stroke="#CBD5E1" stroke-width="2.6"/><circle cx="420" cy="457" r="6" fill="#059669"/><circle cx="550" cy="457" r="6" fill="#059669"/><circl