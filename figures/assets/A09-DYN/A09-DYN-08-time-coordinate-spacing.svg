   <text style="font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start" x="40.04" y="656" transform="rotate(-0 40.04 656)">Unequal token intervals</text>
  </g>
  <g id="text_28">
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7c3aed" x="40.04" y="1078.4" transform="rotate(-0 40.04 1078.4)">Rates: 0.01, 0.005 per token</text>
  </g>
  <g id="text_29">
   <text style="font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start" x="40.04" y="1120" transform="rotate(-0 40.04 1120)">Unequal summed LR intervals</text>
  </g>
  <g id="text_30">
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7c3aed" x="40.04" y="1542.4" transform="rotate(-0 40.04 1542.4)">Rates: 10, 20 per LR unit</text>
  </g>
  <g id="text_31">
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; text-anchor: start" x="40.04" y="80" transform="rotate(-0 40.04 80)">Same displacements; different clocks</text>
  </g>
  <g id="text_32">
   <text style="font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: start" x="40.04" y="136" transform="rotate(-0 40.04 136)">Illustrative: each interval Δz = 1</text>
