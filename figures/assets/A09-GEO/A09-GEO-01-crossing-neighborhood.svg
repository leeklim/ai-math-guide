<svg xmlns="http://www.w3.org/2000/svg" width="520" height="870" viewBox="0 0 520 870" role="img" aria-labelledby="title desc">
  <title id="title">Two versus four branches after removing a point</title>
  <desc id="desc">An interval loses its center and has two connected branches. Two crossing lines lose their crossing point and have four branches, so the crossing is not a one dimensional manifold neighborhood.</desc>
  <rect width="520" height="870" fill="#F8FAFC"/>
  <g font-family="sans-serif" font-size="27" fill="#0F172A">
    <text x="260" y="60" text-anchor="middle">Remove the center point</text>
    <text x="260" y="112" text-anchor="middle" fill="#2563EB">Interval: two branches</text>
    <path d="M70 250H235 M285 250H450" stroke="#2563EB" stroke-width="5" fill="none"/>
    <circle cx="260" cy="250" r="11" fill="#F8FAFC" stroke="#D97706" stroke-width="3"/>
    <text x="140" y="205" text-anchor="middle">1</text>
    <text x="380" y="205" text-anchor="middle">2</text>
    <text x="260" y="320" text-anchor="middle" font-size="26">Each side stays connected</text>
    <text x="260" y="402" text-anchor="middle" fill="#7C3AED">Crossing: four branches</text>
    <g stroke="#D9E2EF" stroke-width="1">
      <path d="M80 445V745 M140 445V745 M200 445V745 M260 445V745 M320 445V745 M380 445V745 M440 445V745 M80 475H440 M80 535H440 M80 595H440 M80 655H440 M80 715H440"/>
    </g>
    <path d="M100 595H420 M260 455V735" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M100 455L243 578 M277 612L420 735 M100 735L243 612 M277 578L420 455" stroke="#7C3AED" stroke-width="5" fill="none"/>
    <circle cx="260" cy="595" r="11" fill="#F8FAFC" stroke="#D97706" stroke-width="3"/>
    <text x="158" y="455" text-anchor="middle">1</text>
    <text x="362" y="455" text-anchor="middle">2</text>
    <text x="158" y="743" text-anchor="middle">3</text>
    <text x="362" y="743" text-anchor="middle">4</text>
    <text x="260" y="815" text-anchor="middle" font-size="25">No interval-like neighborhood</text>
  </g>
</svg>
