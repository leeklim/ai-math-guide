<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Tangent vectors covectors and gradients at one point of a manifold</title>
  <desc id="desc">At point p on a curved manifold, a tangent vector follows an allowed curve velocity, a covector df maps that vector to a scalar rate, and a metric identifies df with a gradient vector.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs>
  <rect width="960" height="540" rx="18" fill="#F8FAFC"/>
  <text x="480" y="48" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Tangent and cotangent objects have different types</text>
  <path d="M45 335C170 170 330 170 455 335C575 485 760 455 915 280" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3" opacity="0.85"/>
  <text x="140" y="420" font-family="sans-serif" font-size="19" fill="#1E3A8A">manifold M</text>
  <circle cx="450" cy="329" r="9" fill="#0F172A"/><text x="430" y="360" font-family="sans-serif" font-size="19" fill="#0F172A">p</text>
  <path d="M450 329L640 380" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="610" y="415" font-family="sans-serif" font-size="18" font-weight="600" fill="#1D4ED8">v ∈ TₚM</text>
  <path d="M450 329L535 185" stroke="#DC2626" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="540" y="183" font-family="sans-serif" font-size="18" font-weight="600" fill="#991B1B">grad f</text>
  <g transform="translate(665 95)">
    <rect width="245" height="145" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="122" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#78350F">covector dfₚ</text>
    <text x="122" y="73" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">input: tangent vector v</text>
    <text x="122" y="101" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">output: rate dfₚ(v)</text>
    <text x="122" y="128" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">linear functional</text>
  </g>
  <path d="M640 365C735 350 755 300 780 250" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <rect x="310" y="105" width="250" height="62" rx="12" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="435" y="143" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5B21B6">metric gₚ converts dfₚ ↔ grad f</text>
  <text x="480" y="500" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">The differential exists without a metric; the gradient vector depends on the chosen metric.</text>
</svg>
