<svg xmlns="http://www.w3.org/2000/svg" width="520" height="950" viewBox="0 0 520 950" role="img" aria-labelledby="title desc">
  <title id="title">Centering imposes a sample-rank ceiling</title>
  <desc id="desc">Three samples in five ambient coordinates have centered rows that sum to zero and a covariance of rank at most two, regardless of unobserved manifold directions.</desc>
  <rect width="520" height="950" rx="18" fill="#F8FAFC"/>
  <g font-family="Arial, sans-serif" fill="#0F172A" text-anchor="middle">
    <text x="260" y="64" font-size="28">Three samples in R⁵</text>
    <text x="260" y="108" font-size="26">Center each coordinate</text>
    <text x="284" y="172" font-size="25">Ambient coordinate columns</text>
    <g font-size="26">
      <text x="135" y="219">1</text><text x="209" y="219">2</text><text x="283" y="219">3</text><text x="357" y="219">4</text><text x="431" y="219">5</text>
    </g>
    <g stroke="#D9E2EF" fill="none">
      <path d="M98 244H468V508H98Z M172 244V508 M246 244V508 M320 244V508 M394 244V508 M98 332H468 M98 420H468"/>
    </g>
    <g font-size="26" fill="#2563EB">
      <text x="56" y="299">x₁</text><text x="56" y="387">x₂</text><text x="56" y="475">x₃</text>
      <text x="135" y="299">2/3</text><text x="209" y="299">−1/3</text><text x="283" y="299">−1/3</text><text x="357" y="299">0</text><text x="431" y="299">0</text>
      <text x="135" y="387">−1/3</text><text x="209" y="387">2/3</text><text x="283" y="387">−1/3</text><text x="357" y="387">0</text><text x="431" y="387">0</text>
      <text x="135" y="475">−1/3</text><text x="209" y="475">−1/3</text><text x="283" y="475">2/3</text><text x="357" y="475">0</text><text x="431" y="475">0</text>
    </g>
    <text x="260" y="574" font-size="27" fill="#7C3AED">Centered x₁+x₂+x₃=0</text>
    <text x="260" y="630" font-size="27">One row is dependent</text>
    <text x="260" y="710" font-size="28" fill="#059669">rank ≤ min(D,k−1)=2</text>
    <text x="260" y="778" font-size="26">This is a sampling ceiling.</text>
    <text x="260" y="827" font-size="26">It does not rule out</text>
    <text x="260" y="872" font-size="26">unobserved tangent directions.</text>
  </g>
</svg>
