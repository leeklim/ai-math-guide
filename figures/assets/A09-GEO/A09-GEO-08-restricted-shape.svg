<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1040" viewBox="0 0 1040 1040" role="img" aria-labelledby="title desc">
  <title id="title">Tangent coordinates to ambient directions to output speed</title>
  <desc id="desc">A three by two tangent basis and two by three downstream Jacobian give a two by two restricted Jacobian and a two by two Gram metric with eigenvalues four and one.</desc>
  <defs><marker id="dart" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 6 4 0 8 2 4Z" fill="context-stroke"/></marker></defs>
  <rect width="1040" height="1040" rx="18" fill="#F8FAFC"/>
  <g font-family="Arial,sans-serif" fill="#0F172A" text-anchor="middle">
    <text x="520" y="65" font-size="30">c ∈ R² → Uc ∈ R³ → JUc ∈ R²</text>
    <text x="316" y="121" font-size="28" fill="#2563EB">U: 3 × 2</text>
    <text x="316" y="162" font-size="25" fill="#2563EB">ambient rows; tangent columns</text>
    <text x="753" y="121" font-size="28" fill="#7C3AED">J: 2 × 3</text>
    <text x="753" y="162" font-size="25" fill="#7C3AED">output rows; ambient columns</text>
    <g font-size="26"><text x="268" y="195">c₁</text><text x="364" y="195">c₂</text><text x="657" y="195">a₁</text><text x="753" y="195">a₂</text><text x="849" y="195">a₃</text>
      <text x="171" y="263">a₁</text><text x="171" y="347">a₂</text><text x="171" y="431">a₃</text>
      <text x="559" y="263">y₁</text><text x="559" y="347">y₂</text></g>
    <g fill="none" stroke="#D9E2EF" stroke-width="1.5"><path d="M220 217H412V469H220Z M316 217V469 M220 301H412 M220 385H412"/><path d="M609 217H897V385H609Z M705 217V385 M801 217V385 M609 301H897"/></g>
    <g font-size="28" fill="#2563EB"><text x="268" y="263">1</text><text x="364" y="263">0</text><text x="268" y="347">0</text><text x="364" y="347">1</text><text x="268" y="431">0</text><text x="364" y="431">0</text></g>
    <g font-size="28" fill="#7C3AED"><text x="657" y="263">2</text><text x="753" y="263">0</text><text x="849" y="263">0</text><text x="657" y="347">0</text><text x="753" y="347">1</text><text x="849" y="347">0</text></g>
    <path d="M316 485V535" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#dart)"/>
    <path d="M753 403V516H480V552" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#dart)"/>
    <text x="596" y="478" font-size="26" fill="#7C3AED">multiply J U</text>
    <text x="316" y="594" font-size="28" fill="#059669">JU: 2 output rows × 2 tangent columns</text>
    <text x="772" y="594" font-size="28">Gᵣ=(JU)ᵀ(JU): 2 × 2</text>
    <g font-size="26"><text x="268" y="650">c₁</text><text x="364" y="650">c₂</text><text x="724" y="650">c₁</text><text x="820" y="650">c₂</text><text x="171" y="718">y₁</text><text x="171" y="802">y₂</text><text x="627" y="718">c₁</text><text x="627" y="802">c₂</text></g>
    <g fill="none" stroke="#D9E2EF" stroke-width="1.5"><path d="M220 672H412V840H220Z M316 672V840 M220 756H412"/><path d="M676 672H868V840H676Z M772 672V840 M676 756H868"/></g>
    <g font-size="28" fill="#059669"><text x="268" y="718">2</text><text x="364" y="718">0</text><text x="268" y="802">0</text><text x="364" y="802">1</text></g>
    <g font-size="28"><text x="724" y="718">4</text><text x="820" y="718">0</text><text x="724" y="802">0</text><text x="820" y="802">1</text></g>
    <path d="M444 756H584" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#dart)"/>
    <text x="520" y="926" font-size="28">c=(1,0) → Uc=(1,0,0) → JUc=(2,0)</text>
    <text x="520" y="978" font-size="28">Squared gain 4; length gain √4=2.</text>
  </g>
</svg>
