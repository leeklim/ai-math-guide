<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 720" width="1040" height="720" role="img" aria-labelledby="title desc">
<title id="title">A discrete integral operator weights sampled function values</title>
<desc id="desc">Three input values 1,2,3 at z1,z2,z3 are weighted by kernel rows 1,1,0 and 0,1,1 with uniform mass one third. Outputs at x1 and x2 are 1 and five thirds.</desc>
<defs><marker id="dart" viewBox="0 0 10 8" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8L3 4Z" fill="context-stroke"/></marker></defs>
<rect width="1040" height="720" rx="18" fill="#F8FAFC"/>
<g font-family="Arial, sans-serif" fill="#0F172A" font-size="25">
<text x="52" y="62" font-size="29">Integral operator: keep x, sum over z</text>
<text x="90" y="140" fill="#2563EB">sampled input f(z)</text><text x="635" y="140" fill="#059669">output (Tₖf)(x)</text>
<g fill="#2563EB"><circle cx="145" cy="225" r="28" fill="#DBEAFE"/><circle cx="145" cy="330" r="28" fill="#DBEAFE"/><circle cx="145" cy="435" r="28" fill="#DBEAFE"/><text x="145" y="234" text-anchor="middle">1</text><text x="145" y="339" text-anchor="middle">2</text><text x="145" y="444" text-anchor="middle">3</text></g>
<text x="75" y="280">z₁</text><text x="75" y="385">z₂</text><text x="75" y="490">z₃</text>
<g fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#dart)"><path d="M190 225L630 245"/><path d="M190 330L630 265"/><path d="M190 330L630 400"/><path d="M190 435L630 420"/></g>
<rect x="660" y="213" width="290" height="103" rx="14" fill="#D1FAE5" stroke="#059669"/><rect x="660" y="365" width="290" height="103" rx="14" fill="#D1FAE5" stroke="#059669"/>
<text x="685" y="254">x₁: (1·1+1·2)/3</text><text x="685" y="290" fill="#059669">= 1</text><text x="685" y="405">x₂: (1·2+1·3)/3</text><text x="685" y="444" fill="#059669">= 5/3</text>
<rect x="255" y="520" width="570" height="138" rx="14" fill="#EDE9FE"/>
<text x="282" y="559" fill="#7C3AED">K rows (x), columns (z):</text><text x="300" y="606">x₁: [1, 1, 0]</text><text x="550" y="606">x₂: [0, 1, 1]</text><text x="282" y="642">Uniform mass μ(zⱼ)=1/3; zero weights omit edges.</text>
</g></svg>
