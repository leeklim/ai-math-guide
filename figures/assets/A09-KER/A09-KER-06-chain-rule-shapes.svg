<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1080" width="520" height="1080" role="img" aria-labelledby="title desc">
<title id="title">Chain rule between sample outputs and parameters</title><desc id="desc">A two by three Jacobian with rows one zero zero and one one zero sends residual one two through minus its transpose to parameter speed minus three minus two zero. Applying the Jacobian gives sample output speed minus three minus five, equal to minus the NTK times the residual.</desc>
<defs><marker id="dart" viewBox="0 0 8 8" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8L2.5 4Z" fill="context-stroke"/></marker></defs>
<rect width="520" height="1080" rx="18" fill="#F8FAFC"/>
<g font-family="Arial, sans-serif" font-size="26" fill="#0F172A">
<text x="260" y="66" text-anchor="middle" font-size="28">Chain rule: n=2, p=3</text>
<text x="260" y="123" text-anchor="middle">J: sample rows, parameter columns</text>
<g text-anchor="middle"><text x="177" y="168">θ₁</text><text x="252" y="168">θ₂</text><text x="327" y="168">θ₃</text></g>
<g stroke="#D9E2EF" fill="#DBEAFE"><rect x="140" y="185" width="75" height="60"/><rect x="215" y="185" width="75" height="60"/><rect x="290" y="185" width="75" height="60"/><rect x="140" y="245" width="75" height="60"/><rect x="215" y="245" width="75" height="60"/><rect x="290" y="245" width="75" height="60"/></g>
<g text-anchor="middle" font-size="28"><text x="177" y="224">1</text><text x="252" y="224">0</text><text x="327" y="224">0</text><text x="177" y="284">1</text><text x="252" y="284">1</text><text x="327" y="284">0</text></g>
<text x="82" y="224">s₁</text><text x="82" y="284">s₂</text>
<rect x="75" y="365" width="370" height="98" rx="14" fill="#DBEAFE" stroke="#2563EB"/><text x="260" y="405" text-anchor="middle" fill="#2563EB" font-size="28">Residual r=(1,2)</text><text x="260" y="443" text-anchor="middle">sample vector: 2 entries</text>
<path d="M260 475V530" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#dart)"/><text x="294" y="511" fill="#7C3AED" font-size="28">−Jᵀ</text>
<rect x="75" y="546" width="370" height="108" rx="14" fill="#EDE9FE" stroke="#7C3AED"/><text x="260" y="589" text-anchor="middle" fill="#7C3AED" font-size="28">θ̇=(−3,−2,0)</text><text x="260" y="633" text-anchor="middle">parameter speed: 3 entries</text>
<path d="M260 671V726" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#dart)"/><text x="294" y="707" fill="#059669" font-size="28">J</text>
<rect x="75" y="744" width="370" height="108" rx="14" fill="#D1FAE5" stroke="#059669"/><text x="260" y="787" text-anchor="middle" fill="#059669" font-size="28">ḟ=(−3,−5)</text><text x="260" y="831" text-anchor="middle">output speed: 2 entries</text>
<g text-anchor="middle"><text x="260" y="930">K=JJᵀ=[[1,1],[1,2]]</text><text x="260" y="967">−Kr=(−3,−5)</text><text x="260" y="1004">Same output speed</text></g>
</g></svg>
