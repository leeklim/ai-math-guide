<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 985" width="520" height="985" role="img"><title>Independent centered predictor and label cross-products cancel in expectation</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="985" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="28" text-anchor="start">Cross-products average to zero</text><text x="40" y="115" fill="#64748B" font-size="27" text-anchor="start">r = f̂ − f̄; independent ε</text><text x="270" y="220" fill="#D97706" font-size="25" text-anchor="middle">ε = −√2</text><text x="410" y="220" fill="#D97706" font-size="25" text-anchor="middle">ε = +√2</text><text x="40" y="355" fill="#7C3AED" font-size="25" text-anchor="start">r = −2</text><rect x="200" y="280" width="140" height="140" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="270" y="360" fill="#0F172A" font-size="28" text-anchor="middle">+2√2</text><rect x="340" y="280" width="140" height="140" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="410" y="360" fill="#0F172A" font-size="28" text-anchor="middle">−2√2</text><text x="40" y="545" fill="#7C3AED" font-size="25" text-anchor="start">r =  +2</text><rect x="200" y="470" width="140" height="140" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="270" y="550" fill="#0F172A" font-size="28" text-anchor="middle">−2√2</text><rect x="340" y="470" width="140" height="140" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="410" y="550" fill="#0F172A" font-size="28" text-anchor="middle">+2√2</text><text x="40" y="710" fill="#64748B" font-size="26" text-anchor="start">Each cell has probability 1/4.</text><text x="40" y="780" fill="#0F172A" font-size="24" text-anchor="start">(+2√2 − 2√2 − 2√2 + 2√2) / 4</text><text x="40" y="840" fill="#059669" font-size="30" text-anchor="start">E[rε] = 0</text><text x="40" y="925" fill="#64748B" font-size="24" text-anchor="start">Individual products need not vanish.</text></g></svg>
