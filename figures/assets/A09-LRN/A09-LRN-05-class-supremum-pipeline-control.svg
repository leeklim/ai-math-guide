<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1050" width="520" height="1050" role="img"><title>Class supremum is not a training pipeline</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1050" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#0F172A" font-size="28" text-anchor="start">Two different measurements</text><text x="40" y="125" fill="#7C3AED" font-size="28" text-anchor="start">Theory: fixed S and F</text><rect x="60" y="155" width="400" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="194" fill="#2563EB" font-size="28" text-anchor="middle">Draw random signs σ</text><text x="260" y="230" fill="#64748B" font-size="24" text-anchor="middle">Not training labels</text><path d="M260 255 L260 300" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="315" width="400" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="354" fill="#7C3AED" font-size="28" text-anchor="middle">Supremum over the class</text><text x="260" y="390" fill="#64748B" font-size="24" text-anchor="middle">Sign-weighted real output</text><path d="M260 415 L260 460" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="475" width="400" height="90" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="514" fill="#059669" font-size="28" text-anchor="middle">Average over signs</text><text x="40" y="625" fill="#D97706" font-size="28" text-anchor="start">Control: actual pipeline</text><rect x="60" y="655" width="400" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="694" fill="#2563EB" font-size="28" text-anchor="middle">Randomize training labels</text><text x="260" y="730" fill="#64748B" font-size="24" text-anchor="middle">Keep the declared pipeline</text><path d="M260 755 L260 800" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="815" width="400" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="854" fill="#7C3AED" font-size="28" text-anchor="middle">Run the optimizer</text><text x="260" y="890" fill="#64748B" font-size="24" text-anchor="middle">May not reach the class best</text><path d="M260 915 L260 955" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><text x="260" y="1000" fill="#059669" font-size="26" text-anchor="middle">Measure empirical accuracy</text></g></svg>
