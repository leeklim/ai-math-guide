<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1120" width="520" height="1120" role="img"><title>Choose before or after averaging</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1120" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#0F172A" font-size="28" text-anchor="start">Same sample S; F = {f, −f}</text><text x="40" y="105" fill="#64748B" font-size="26" text-anchor="start">Here f(x₁) = f(x₂) = 1</text><text x="40" y="165" fill="#7C3AED" font-size="28" text-anchor="start">Eσ [supf score]</text><rect x="60" y="195" width="400" height="90" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="234" fill="#2563EB" font-size="28" text-anchor="middle">Draw one sign vector</text><path d="M260 285 L260 330" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="345" width="400" height="115" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="384" fill="#7C3AED" font-size="28" text-anchor="middle">Choose f for that sign</text><text x="260" y="420" fill="#64748B" font-size="24" text-anchor="middle">Suprema: 1, 0, 0, 1</text><path d="M260 460 L260 505" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="520" width="400" height="90" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="559" fill="#059669" font-size="28" text-anchor="middle">Average: 1/2</text><text x="40" y="675" fill="#D97706" font-size="28" text-anchor="start">supf Eσ [score]</text><rect x="60" y="705" width="400" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="744" fill="#2563EB" font-size="28" text-anchor="middle">Fix f first</text><text x="260" y="780" fill="#64748B" font-size="24" text-anchor="middle">Each fixed score: mean 0</text><path d="M260 805 L260 850" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="865" width="400" height="100" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="260" y="904" fill="#D97706" font-size="28" text-anchor="middle">Choose the larger average</text><text x="260" y="940" fill="#64748B" font-size="24" text-anchor="middle">sup{0, 0} = 0</text><text x="40" y="1045" fill="#0F172A" font-size="26" text-anchor="start">Selection can depend on signs</text><text x="40" y="1080" fill="#64748B" font-size="26" text-anchor="start">only in the first route.</text></g></svg>
