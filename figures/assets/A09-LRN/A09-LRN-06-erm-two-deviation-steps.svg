<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1030" width="520" height="1030" role="img"><title>ERM uses two uniform deviations</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1030" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#0F172A" font-size="28" text-anchor="start">One uniform event; any h ∈ H</text><rect x="60" y="125" width="400" height="95" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="164" fill="#059669" font-size="28" text-anchor="middle">R(ĥ)</text><path d="M260 220 L260 270" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><text x="300" y="255" fill="#D97706" font-size="26" text-anchor="start">+ ε/2</text><rect x="60" y="285" width="400" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="324" fill="#7C3AED" font-size="28" text-anchor="middle">≤ R̂(ĥ) + ε/2</text><text x="260" y="360" fill="#64748B" font-size="24" text-anchor="middle">First uniform deviation</text><path d="M260 390 L260 440" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="455" width="400" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="494" fill="#7C3AED" font-size="28" text-anchor="middle">≤ R̂(h) + ε/2</text><text x="260" y="530" fill="#64748B" font-size="24" text-anchor="middle">ERM: R̂(ĥ) ≤ R̂(h)</text><path d="M260 560 L260 610" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><text x="300" y="595" fill="#D97706" font-size="26" text-anchor="start">+ ε/2</text><rect x="60" y="625" width="400" height="105" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="664" fill="#059669" font-size="28" text-anchor="middle">≤ R(h) + ε</text><text x="260" y="700" fill="#64748B" font-size="24" text-anchor="middle">Second uniform deviation</text><path d="M260 730 L260 780" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="795" width="400" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="834" fill="#059669" font-size="28" text-anchor="middle">Compare with infh R(h)</text><text x="260" y="870" fill="#64748B" font-size="24" text-anchor="middle">Total excess-risk tolerance ε</text><text x="40" y="975" fill="#64748B" font-size="23" text-anchor="start">Both deviations hold simultaneously.</text></g></svg>
