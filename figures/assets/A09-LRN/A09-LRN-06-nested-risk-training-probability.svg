<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1070" width="520" height="1070" role="img"><title>Two probability levels</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1070" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#2563EB" font-size="28" text-anchor="start">Outer: redraw S ∼ Pⁿ</text><text x="40" y="105" fill="#64748B" font-size="26" text-anchor="start">and retrain the learner</text><rect x="60" y="145" width="400" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="184" fill="#7C3AED" font-size="28" text-anchor="middle">One trained predictor ĥS</text><text x="260" y="220" fill="#64748B" font-size="24" text-anchor="middle">Fix its training outcome</text><path d="M260 250 L260 295" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="320" width="400" height="335" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="365" fill="#059669" font-size="28" text-anchor="middle">Inner: fresh examples</text><text x="260" y="410" fill="#2563EB" font-size="28" text-anchor="middle">Z₁, Z₂, Z₃, … ∼ P</text><path d="M260 435 L260 480" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><text x="260" y="525" fill="#059669" font-size="28" text-anchor="middle">Average loss under P</text><text x="260" y="575" fill="#0F172A" font-size="28" text-anchor="middle">R(ĥS) = E[loss]</text><text x="260" y="625" fill="#64748B" font-size="24" text-anchor="middle">Not finite test accuracy</text><path d="M260 655 L260 700" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="720" width="400" height="100" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="260" y="759" fill="#D97706" font-size="28" text-anchor="middle">Check R(ĥS) ≤ best + ε</text><text x="260" y="795" fill="#64748B" font-size="24" text-anchor="middle">One pass/fail for this S</text><path d="M260 820 L260 865" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><text x="260" y="910" fill="#0F172A" font-size="24" text-anchor="middle">Repeat over S (and learner seed)</text><text x="260" y="955" fill="#059669" font-size="26" text-anchor="middle">Probability of passing ≥ 1 − δ</text><text x="40" y="1020" fill="#64748B" font-size="24" text-anchor="start">Keep the target population P fixed.</text></g></svg>
