<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1050" width="520" height="1050" role="img"><title>A single run is not a PAC theorem</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1050" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#0F172A" font-size="26" text-anchor="start">Declared family of distributions</text><rect x="40" y="110" width="440" height="510" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="70" y="155" fill="#2563EB" font-size="28" text-anchor="start">Population P</text><rect x="70" y="185" width="380" height="330" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/><rect x="95" y="220" width="330" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="259" fill="#7C3AED" font-size="28" text-anchor="middle">One training result</text><text x="260" y="295" fill="#64748B" font-size="24" text-anchor="middle">One fixed ĥS</text><path d="M260 320 L260 365" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><text x="260" y="410" fill="#059669" font-size="26" text-anchor="middle">Independent test estimate</text><text x="260" y="455" fill="#64748B" font-size="24" text-anchor="middle">Not all training outcomes</text><text x="70" y="570" fill="#64748B" font-size="22" text-anchor="start">Other P: not evaluated by this run</text><path d="M260 620 L260 665" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="685" width="400" height="110" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="260" y="724" fill="#D97706" font-size="28" text-anchor="middle">PAC: a broader guarantee</text><text x="260" y="760" fill="#64748B" font-size="24" text-anchor="middle">All target P; sufficient n</text><text x="260" y="850" fill="#0F172A" font-size="28" text-anchor="middle">All permitted ε and δ</text><text x="260" y="900" fill="#0F172A" font-size="23" text-anchor="middle">Repeat-training success probability</text><text x="260" y="980" fill="#64748B" font-size="22" text-anchor="middle">Shift outside the family is not covered.</text></g></svg>
