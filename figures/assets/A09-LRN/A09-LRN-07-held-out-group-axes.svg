<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 870" width="1140" height="870" role="img"><title>Different held-out groups answer different questions</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1140" height="870" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#0F172A" font-size="30" text-anchor="start">Different axes, not one nesting hierarchy</text><rect x="40" y="110" width="510" height="340" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="65" y="155" fill="#0F172A" font-size="28" text-anchor="start">Prompt split</text><text x="65" y="200" fill="#64748B" font-size="24" text-anchor="start">Group = full prompt</text><rect x="65" y="235" width="215" height="145" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/><text x="172" y="273" fill="#2563EB" font-size="26" text-anchor="middle">Train</text><text x="172" y="320" fill="#2563EB" font-size="26" text-anchor="middle">P₁, P₂</text><rect x="310" y="235" width="215" height="145" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="2"/><text x="417" y="273" fill="#059669" font-size="26" text-anchor="middle">Test</text><text x="417" y="320" fill="#059669" font-size="26" text-anchor="middle">New P₃</text><text x="65" y="420" fill="#64748B" font-size="24" text-anchor="start">Keep all rows of each group together.</text><rect x="590" y="110" width="510" height="340" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="615" y="155" fill="#0F172A" font-size="28" text-anchor="start">Template split</text><text x="615" y="200" fill="#64748B" font-size="24" text-anchor="start">Group = expression template</text><rect x="615" y="235" width="215" height="145" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/><text x="722" y="273" fill="#2563EB" font-size="26" text-anchor="middle">Train</text><text x="722" y="320" fill="#2563EB" font-size="26" text-anchor="middle">T₁, T₂</text><rect x="860" y="235" width="215" height="145" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="2"/><text x="967" y="273" fill="#059669" font-size="26" text-anchor="middle">Test</text><text x="967" y="320" fill="#059669" font-size="26" text-anchor="middle">New T₃</text><text x="615" y="420" fill="#64748B" font-size="24" text-anchor="start">Keep all rows of each group together.</text><rect x="40" y="490" width="510" height="340" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="65" y="535" fill="#0F172A" font-size="28" text-anchor="start">Concept split</text><text x="65" y="580" fill="#64748B" font-size="24" text-anchor="start">Group = specified meaning category</text><rect x="65" y="615" width="215" height="145" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/><text x="172" y="653" fill="#2563EB" font-size="26" text-anchor="middle">Train</text><text x="172" y="700" fill="#2563EB" font-size="26" text-anchor="middle">C₁, C₂</text><rect x="310" y="615" width="215" height="145" rx="8" fill="#F8FAFC" stroke="#059669" stroke-width="2"/><text x="417" y="653" fill="#059669" font-size="26" text-anchor="middle">Test</text><text x="417" y="700" fill="#059669" font-size="26" text-anchor="middle">New C₃</text><text x="65" y="800" fill="#64748B" font-size="24" text-anchor="start">Keep all rows of each group together.</text><rect x="590" y="490" width="510" height="340" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="615" y="535" fill="#0F172A" font-size="28" text-anchor="start">Model split</text><text x="615" y="580" fill="#64748B" font-size="24" text-anchor="start">Group = model seed / architecture</text><rect x="615" y="615" width="215" height="145" rx="8" fill="#F8FAFC" stroke="#2563EB" stroke-width="2"/><text x="722" y="653" fill="#2563EB" font-size="26" text-anchor="middle">Train</text><text x="722" y="700" fill="#256