<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1110" width="520" height="1110" role="img"><title>New-model refitting and predictor transfer</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1110" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#0F172A" font-size="27" text-anchor="start">First model: M₁ → fit probe p₁</text><text x="40" y="130" fill="#2563EB" font-size="28" text-anchor="start">Route A: new model M₂</text><rect x="60" y="165" width="400" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="204" fill="#7C3AED" font-size="28" text-anchor="middle">Fit a new probe p₂</text><text x="260" y="240" fill="#64748B" font-size="24" text-anchor="middle">Use M₂ train/validation</text><path d="M260 265 L260 310" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="325" width="400" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="364" fill="#059669" font-size="28" text-anchor="middle">Evaluate p₂ on M₂ test</text><text x="260" y="400" fill="#64748B" font-size="24" text-anchor="middle">Recoverability in this model</text><text x="40" y="510" fill="#2563EB" font-size="28" text-anchor="start">Route B: new model M₂</text><rect x="60" y="545" width="400" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="584" fill="#7C3AED" font-size="28" text-anchor="middle">Reuse frozen probe p₁</text><text x="260" y="620" fill="#64748B" font-size="24" text-anchor="middle">No probe refit on M₂</text><path d="M260 645 L260 690" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="705" width="400" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="744" fill="#059669" font-size="28" text-anchor="middle">Evaluate p₁ on M₂ test</text><text x="260" y="780" fill="#64748B" font-size="24" text-anchor="middle">Predictor transfer</text><text x="40" y="895" fill="#0F172A" font-size="26" text-anchor="start">Both use a new trained model.</text><text x="40" y="940" fill="#64748B" font-size="26" text-anchor="start">Changing only the probe seed</text><text x="40" y="980" fill="#64748B" font-size="26" text-anchor="start">is not model generalization.</text><text x="40" y="1050" fill="#64748B" font-size="22" text-anchor="start">Match activation definitions.</text></g></svg>
