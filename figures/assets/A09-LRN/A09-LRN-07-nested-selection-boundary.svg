<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1330" width="520" height="1330" role="img"><title>Keep selection inside the outer evaluation</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1330" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#0F172A" font-size="28" text-anchor="start">Repeat the full outer trial</text><rect x="40" y="110" width="440" height="1140" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="70" y="155" fill="#64748B" font-size="28" text-anchor="start">Outer trial k</text><rect x="65" y="185" width="390" height="750" rx="8" fill="#F8FAFC" stroke="#7C3AED" stroke-width="2"/><text x="260" y="225" fill="#7C3AED" font-size="26" text-anchor="middle">Inner development data</text><text x="260" y="265" fill="#64748B" font-size="24" text-anchor="middle">Repeat candidates here</text><rect x="90" y="305" width="340" height="110" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="344" fill="#2563EB" font-size="28" text-anchor="middle">Fit on inner train</text><text x="260" y="380" fill="#64748B" font-size="24" text-anchor="middle">Including preprocessing</text><path d="M260 415 L260 460" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="90" y="480" width="340" height="110" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="519" fill="#7C3AED" font-size="28" text-anchor="middle">Select on validation</text><text x="260" y="555" fill="#64748B" font-size="24" text-anchor="middle">Layer, norm, class</text><path d="M260 590 L260 635" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="90" y="655" width="340" height="110" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="694" fill="#7C3AED" font-size="28" text-anchor="middle">Freeze the pipeline</text><text x="260" y="730" fill="#64748B" font-size="24" text-anchor="middle">No test-guided revision</text><path d="M260 765 L260 810" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><text x="260" y="860" fill="#64748B" font-size="22" text-anchor="middle">Any refit rule is predeclared.</text><path d="M260 935 L260 985" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="90" y="1005" width="340" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="1044" fill="#059669" font-size="28" text-anchor="middle">Locked outer test</text><text x="260" y="1080" fill="#64748B" font-size="24" text-anchor="middle">Evaluate after selection</text><text x="260" y="1185" fill="#64748B" font-size="22" text-anchor="middle">Test stays outside inner selection.</text><text x="40" y="1290" fill="#64748B" font-size="22" text-anchor="start">Redo inner selection in each outer trial.</text></g></svg>
