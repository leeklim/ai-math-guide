<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1320" width="520" height="1320" role="img"><title>Resample prompt packs, not isolated token rows</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1320" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#0F172A" font-size="26" text-anchor="start">Original independent prompt packs</text><rect x="60" y="115" width="400" height="95" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="90" y="152" fill="#2563EB" font-size="28" text-anchor="start">P₁</text><text x="210" y="152" fill="#0F172A" font-size="26" text-anchor="start">20 token rows</text><text x="260" y="190" fill="#64748B" font-size="24" text-anchor="middle">r₁, r₂, r₃, …, r₂₀</text><rect x="60" y="235" width="400" height="95" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="90" y="272" fill="#2563EB" font-size="28" text-anchor="start">P₂</text><text x="210" y="272" fill="#0F172A" font-size="26" text-anchor="start">20 token rows</text><text x="260" y="310" fill="#64748B" font-size="24" text-anchor="middle">r₁, r₂, r₃, …, r₂₀</text><rect x="60" y="355" width="400" height="95" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="90" y="392" fill="#2563EB" font-size="28" text-anchor="start">P₃</text><text x="210" y="392" fill="#0F172A" font-size="26" text-anchor="start">20 token rows</text><text x="260" y="430" fill="#64748B" font-size="24" text-anchor="middle">r₁, r₂, r₃, …, r₂₀</text><path d="M260 450 L260 495" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="260" y="550" fill="#7C3AED" font-size="24" text-anchor="middle">Draw prompt IDs with replacement</text><text x="260" y="600" fill="#7C3AED" font-size="27" text-anchor="middle">Illustrative draw: P₂, P₁, P₂</text><path d="M260 625 L260 675" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="705" width="400" height="95" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="90" y="742" fill="#2563EB" font-size="28" text-anchor="start">P₂</text><text x="210" y="742" fill="#0F172A" font-size="26" text-anchor="start">20 token rows</text><text x="260" y="780" fill="#64748B" font-size="24" text-anchor="middle">r₁, r₂, r₃, …, r₂₀</text><rect x="60" y="825" width="400" height="95" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="90" y="862" fill="#2563EB" font-size="28" text-anchor="start">P₁</text><text x="210" y="862" fill="#0F172A" font-size="26" text-anchor="start">20 token rows</text><text x="260" y="900" fill="#64748B" font-size="24" text-anchor="middle">r₁, r₂, r₃, …, r₂₀</text><rect x="60" y="945" width="400" height="95" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="90" y="982" fill="#2563EB" font-size="28" text-anchor="start">P₂</text><text x="210" y="982" fill="#0F172A" font-size="26" text-anchor="start">20 token rows</text><text x="260" y="1020" fill="#64748B" font-size="24" text-anchor="middle">r₁, r₂, r₃, …, r₂₀</text><text x="40" y="1130" fill="#0F172A" font-size="24" text-anchor="start">Each drawn pack keeps all its rows.</text><text x="40" y="1190" fill="#64748B" font-size="22" text-anchor="start">P₂ appears twice; its rows travel twice.</text><text x="40" y="1260" fill="#64748B" font-size="22" text-anchor="start">Higher shared groups need larger packs.</text></g></svg>
