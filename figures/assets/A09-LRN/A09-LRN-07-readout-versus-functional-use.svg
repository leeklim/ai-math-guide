<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 850" width="1080" height="850" role="img"><title>Probe readout and model use are separate routes</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="850" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#0F172A" font-size="30" text-anchor="start">Separate readout evidence from output effects</text><rect x="60" y="310" width="240" height="130" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="180" y="349" fill="#2563EB" font-size="28" text-anchor="middle">Activation h</text><text x="180" y="385" fill="#64748B" font-size="24" text-anchor="middle">Fixed model state</text><rect x="430" y="160" width="260" height="110" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="560" y="199" fill="#7C3AED" font-size="28" text-anchor="middle">Probe readout</text><text x="560" y="235" fill="#64748B" font-size="24" text-anchor="middle">External predictor</text><rect x="780" y="160" width="240" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="900" y="199" fill="#059669" font-size="28" text-anchor="middle">Label estimate</text><path d="M300 375 L365 375 L365 215 L420 215" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M690 215 L770 215" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="430" y="440" width="260" height="130" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="560" y="479" fill="#7C3AED" font-size="28" text-anchor="middle">Downstream model</text><text x="560" y="515" fill="#64748B" font-size="24" text-anchor="middle">Native computation</text><rect x="780" y="440" width="240" height="130" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="90