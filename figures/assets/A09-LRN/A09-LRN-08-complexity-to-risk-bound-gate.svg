<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1240" width="520" height="1240" role="img"><title>Complexity is not already a risk-gap bound</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1240" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#7C3AED" font-size="28" text-anchor="start">Class complexity on fixed S</text><rect x="60" y="115" width="400" height="160" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="165" fill="#7C3AED" font-size="28" text-anchor="middle">B/n · √(Σ‖xᵢ‖²)</text><text x="260" y="215" fill="#64748B" font-size="22" text-anchor="middle">Sample-conditional class bound</text><text x="260" y="250" fill="#D97706" font-size="24" text-anchor="middle">Not yet a risk-gap guarantee</text><path d="M260 275 L260 320" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="345" width="400" height="345" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="260" y="390" fill="#D97706" font-size="26" text-anchor="middle">Theorem gate</text><text x="90" y="445" fill="#0F172A" font-size="24" text-anchor="start">• bounded / Lipschitz loss</text><text x="90" y="495" fill="#0F172A" font-size="24" text-anchor="start">• concentration terms</text><text x="90" y="545" fill="#0F172A" font-size="24" text-anchor="start">• fixed/declared class</text><text x="90" y="595" fill="#0F172A" font-size="24" text-anchor="start">• iid sampling unit n</text><text x="260" y="655" fill="#DC2626" font-size="22" text-anchor="middle">Dependent token rows ≠ iid prompts</text><path d="M260 690 L260 735" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="760" width="400" height="120" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="799" fill="#059669" font-size="28" text-anchor="middle">Applicable risk-gap bound</text><text x="260" y="835" fill="#64748B" font-size="24" text-anchor="middle">Only when assumptions match</text><text x="40" y="980" fill="#0F172A" font-size="26" text-anchor="start">If conditions are not established:</text><text x="40" y="1035" fill="#64748B" font-size="26" text-anchor="start">keep the row-complexity number</text><text x="40" y="1080" fill="#64748B" font-size="26" text-anchor="start">as conditional class comparison.</text><text x="40" y="1175" fill="#DC2626" font-size="22" text-anchor="start">Tokens need not be iid units.</text></g></svg>
