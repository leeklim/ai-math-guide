<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1270" width="520" height="1270" role="img"><title>What is repeated determines interval scope</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1270" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#0F172A" font-size="27" text-anchor="start">Route A: fixed trained predictor</text><rect x="60" y="115" width="400" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="154" fill="#2563EB" font-size="28" text-anchor="middle">Resample test prompts</text><text x="260" y="190" fill="#64748B" font-size="24" text-anchor="middle">Keep ĥ and selection fixed</text><path d="M260 215 L260 260" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="280" width="400" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="319" fill="#059669" font-size="28" text-anchor="middle">Evaluate fixed predictor</text><text x="260" y="355" fill="#64748B" font-size="24" text-anchor="middle">Conditional test uncertainty</text><text x="40" y="450" fill="#64748B" font-size="25" text-anchor="start">No training or selection variation.</text><text x="40" y="535" fill="#0F172A" font-size="26" text-anchor="start">Route B: repeat the learning path</text><rect x="60" y="575" width="400" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="614" fill="#2563EB" font-size="28" text-anchor="middle">Repeat declared sampling</text><text x="260" y="650" fill="#64748B" font-size="24" text-anchor="middle">Respect the independent units</text><path d="M260 675 L260 720" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="745" width="400" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="784" fill="#7C3AED" font-size="28" text-anchor="middle">Refit and reselect</text><text x="260" y="820" fill="#64748B" font-size="24" text-anchor="middle">Inner procedure repeated</text><path d="M260 845 L260 890" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="915" width="400" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="954" fill="#059669" font-size="28" text-anchor="middle">Evaluate each trained ĥ</text><text x="260" y="990" fill="#64748B" font-size="24" text-anchor="middle">Includes the repeated stages</text><text x="40" y="1120" fill="#0F172A" font-size="26" text-anchor="start">Record populations and stages</text><text x="40" y="1160" fill="#0F172A" font-size="26" text-anchor="start">the reported interval includes.</text><text x="40" y="1230" fill="#64748B" font-size="25" text-anchor="start">No interval was simulated here.</text></g></svg>
