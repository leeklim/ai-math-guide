<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1190" width="520" height="1190" role="img"><title>Different controls break different pairings</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1190" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#0F172A" font-size="26" text-anchor="start">Keep each null and unit explicit</text><text x="40" y="130" fill="#0F172A" font-size="28" text-anchor="start">Real activation–label pairing</text><rect x="60" y="165" width="155" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><rect x="305" y="165" width="155" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="137" y="212" fill="#2563EB" font-size="28" text-anchor="middle">X</text><text x="382" y="212" fill="#059669" font-size="28" text-anchor="middle">Y</text><path d="M225 215 L295 215" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="260" y="305" fill="#64748B" font-size="24" text-anchor="middle">Matched rows and labels</text><text x="40" y="390" fill="#0F172A" font-size="28" text-anchor="start">Permute labels on valid units</text><rect x="60" y="425" width="155" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><rect x="305" y="425" width="155" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="137" y="472" fill="#2563EB" font-size="28" text-anchor="middle">X</text><text x="382" y="472" fill="#059669" font-size="28" text-anchor="middle">Yπ</text><path d="M225 475 L295 475" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-dasharray="6 5"/><path d="M252 459 L268 491" fill="none" stroke="#DC2626" stroke-width="2.6"/><path d="M268 459 L252 491" fill="none" stroke="#DC2626" stroke-width="2.6"/><text x="260" y="565" fill="#64748B" font-size="24" text-anchor="middle">Feature rows retained</text><text x="40" y="650" fill="#0F172A" font-size="28" text-anchor="start">Matched random features</text><rect x="60" y="685" width="155" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><rect x="305" y="685" width="155" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="137" y="732" fill="#2563EB" font-size="28" text-anchor="middle">Xrand</text><text x="382" y="732" fill="#059669" font-size="28" text-anchor="middle">Y</text><path d="M225 735 L295 735" fill="none" stroke="#DC2626" stroke-width="2.6" stroke-dasharray="6 5"/><path d="M252 719 L268 751" fill="none" stroke="#DC2626" stroke-width="2.6"/><path d="M268 719 L252 751" fill="none" stroke="#DC2626" stroke-width="2.6"/><text x="260" y="825" fill="#64748B" font-size="24" text-anchor="middle">Labels retained; feature null changed</text><path d="M260 850 L260 895" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="915" width="400" height="110" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="954" fill="#7C3AED" font-size="28" text-anchor="middle">Refit control pipelines</text><text x="260" y="990" fill="#64748B" font-size="24" text-anchor="middle">Same selection; test excluded</text><text x="40" y="1110" fill="#64748B" font-size="26" text-anchor="start">The two nulls are not one control.</text></g></svg>
