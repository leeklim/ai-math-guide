<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" width="1200" height="890" role="img"><title>Freeze selection before separate population evaluation</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1200" height="890" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#0F172A" font-size="30" text-anchor="start">One declared protocol; separate target populations</text><rect x="60" y="330" width="280" height="140" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="200" y="369" fill="#2563EB" font-size="28" text-anchor="middle">Development data</text><text x="200" y="405" fill="#64748B" font-size="24" text-anchor="middle">Train + validation</text><rect x="440" y="330" width="280" height="140" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="580" y="369" fill="#7C3AED" font-size="28" text-anchor="middle">Frozen protocol</text><text x="580" y="405" fill="#64748B" font-size="24" text-anchor="middle">Fit + select inside</text><path d="M340 395 L430 395" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="870" y="130" width="270" height="115" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="1005" y="169" fill="#059669" font-size="28" text-anchor="middle">IID test</text><text x="1005" y="205" fill="#64748B" font-size="24" text-anchor="middle">Same population</text><rect x="870" y="350" width="270" height="115" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="1005" y="389" fill="#059669" font-size="28" text-anchor="middle">Template shift</text><text x="1005" y="425" fill="#64748B" font-size="24" text-anchor="middle">Held-out template</text><rect x="870" y="570" width="270" height="115" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="1005" y="609" fill="#059669" font-size="28" text-anchor="middle">New model</text><text x="1005" y="645" fill="#64748B" font-size="24" text-anchor="middle">New training seed</text><path d="M720 395 L790 395 L790 185 L860 185" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M720 395 L790 395 L790 405 L860 405" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M720 395 L790 395 L790 625 L860 625" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><text x="60" y="575" fill="#64748B" font-size="28" text-anchor="start">Class, norm, loss, unit</text><text x="60" y="625" fill="#64748B" font-size="26" text-anchor="start">and fit data are recorded.</text><text x="60" y="745" fill="#64748B" font-size="26" text-anchor="start">Any final refit rule is declared before test.</text><text x="60" y="795" fill="#64748B" font-size="26" text-anchor="start">New-model refit and transfer are different evaluations.</text><text x="60" y="845" fill="#D97706" font-size="26" text-anchor="start">Plan only: no new model or score was generated.</text></g></svg>
