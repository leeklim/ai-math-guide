<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1280" width="520" height="1280" role="img"><title>Keep conclusions within the evaluated scope</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1280" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="65" fill="#0F172A" font-size="24" text-anchor="start">Exercise scenario; no new results</text><rect x="60" y="120" width="400" height="410" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="170" fill="#2563EB" font-size="28" text-anchor="middle">Current model M₁</text><text x="90" y="235" fill="#059669" font-size="28" text-anchor="start">✓ unseen prompts</text><text x="90" y="295" fill="#059669" font-size="28" text-anchor="start">✓ held-out templates</text><path d="M260 325 L260 370" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><text x="260" y="420" fill="#059669" font-size="22" text-anchor="middle">Recoverability here</text><text x="260" y="480" fill="#64748B" font-size="28" text-anchor="middle">in this model</text><rect x="60" y="600" width="400" height="245" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="260" y="650" fill="#2563EB" font-size="28" text-anchor="middle">New model seed M₂</text><text x="90" y="715" fill="#D97706" font-size="28" text-anchor="start">× generalization failed</text><text x="260" y="785" fill="#64748B" font-size="22" text-anchor="middle">No model-wide claim</text><rect x="60" y="915" width="400" height="225" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="260" y="965" fill="#64748B" font-size="26" text-anchor="middle">Intervention: not measured</text><text x="260" y="1030" fill="#64748B" font-size="24" text-anchor="middle">Leave this result unmeasured.</text><text x="260" y="1090" fill="#DC2626" font-size="24" text-anchor="middle">Probe ≠ causal-use evidence</text><text x="40" y="1230" fill="#64748B" font-size="24" text-anchor="start">Do not fill missing cells with theory.</text></g></svg>
