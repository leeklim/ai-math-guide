<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1060" width="520" height="1060" role="img"><title>Prompt packs and independent null draws</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1060" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="58" fill="#2563EB" font-size="28" text-anchor="start">Observed token rows</text><rect x="40" y="110" width="200" height="110" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="140" fill="#2563EB" font-size="27" text-anchor="middle">Prompt P₁</text><rect x="64" y="160" width="64" height="38" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><rect x="152" y="160" width="64" height="38" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="96" y="187" fill="#0F172A" font-size="25" text-anchor="middle">t₁</text><text x="184" y="187" fill="#0F172A" font-size="25" text-anchor="middle">t₂</text><rect x="280" y="110" width="200" height="110" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="380" y="140" fill="#2563EB" font-size="27" text-anchor="middle">Prompt P₂</text><rect x="304" y="160" width="64" height="38" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><rect x="392" y="160" width="64" height="38" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="336" y="187" fill="#0F172A" font-size="25" text-anchor="middle">t₁</text><text x="424" y="187" fill="#0F172A" font-size="25" text-anchor="middle">t₂</text><text x="40" y="292" fill="#64748B" font-size="24" text-anchor="start">Shared prompt = shared sampling group</text><text x="40" y="350" fill="#0F172A" font-size="25" text-anchor="start">Two packs are not four iid prompts.</text><path d="M40 395 L480 395" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="40" y="440" fill="#64748B" font-size="25" text-anchor="start">Different sampling contracts</text><text x="40" y="505" fill="#059669" font-size="28" text-anchor="start">Independent null draws</text><rect x="40" y="555" width="92" height="78" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="86" y="603" fill="#059669" font-size="28" text-anchor="middle">Z₁</text><rect x="156" y="555" width="92" height="78" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="202" y="603" fill="#059669" font-size="28" text-anchor="middle">Z₂</text><rect x="272" y="555" width="92" height="78" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="318" y="603" fill="#059669" font-size="28" text-anchor="middle">Z₃</text><rect x="388" y="555" width="92" height="78" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="434" y="603" fill="#059669" font-size="28" text-anchor="middle">Z₄</text><text x="40" y="690" fill="#64748B" font-size="24" text-anchor="start">Four distinct draws under an iid law</text><text x="40" y="790" fill="#0F172A" font-size="25" text-anchor="start">Match dimension and covariance.</text><text x="40" y="850" fill="#0F172A" font-size="25" text-anchor="start">Declare the sampling unit as well.</text><text x="40" y="932" fill="#D97706" font-size="24" text-anchor="start">Token count alone does not justify</text><text x="40" y="981" fill="#D97706" font-size="24" text-anchor="start">an iid sample-size interpretation.</text></g></svg>
