<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 915" width="1100" height="915" role="img"><title>Expected row contributions in Gaussian projection</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1100" height="915" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="48" y="58" fill="#0F172A" font-size="30" text-anchor="start">One fixed input; two Gaussian output coordinates</text><text x="48" y="112" fill="#64748B" font-size="27" text-anchor="start">m = 2, d = 3; each Rᵢⱼ has variance 1/2</text><text x="60" y="192" fill="#2563EB" font-size="30" text-anchor="start">v = (2, 0, 0)ᵀ</text><rect x="50" y="260" width="450" height="110" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="75" y="298" fill="#7C3AED" font-size="28" text-anchor="start">Row 1 of R</text><text x="75" y="342" fill="#7C3AED" font-size="29" text-anchor="start">(r₁₁, r₁₂, r₁₃)</text><path d="M510 315 L602 315" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="630" y="260" width="405" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="653" y="302" fill="#059669" font-size="30" text-anchor="start">z₁ = 2r₁₁</text><text x="653" y="346" fill="#059669" font-size="27" text-anchor="start">E z₁² = 4 · 1/2 = 2</text><rect x="50" y="414" width="450" height="110" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="75" y="452" fill="#7C3AED" font-size="28" text-anchor="start">Row 2 of R</text><text x="75" y="496" fill="#7C3AED" font-size="29" text-anchor="start">(r₂₁, r₂₂, r₂₃)</text><path d="M510 469 L602 469" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="630" y="414" width="405" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="653" y="456" fill="#059669" font-size="30" text-anchor="start">z₂ = 2r₂₁</text><text x="653" y="500" fill="#059669" font-size="27" text-anchor="start">E z₂² = 4 · 1/2 = 2</text><path d="M1035 315 L1060 315 L1060 580 L730 580" fill="none" stroke="#059669" stroke-width="2.6"/><path d="M730 550 L730 608 L520 608 L520 650" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="290" y="680" width="520" height="105" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="550" y="719" fill="#059669" font-size="28" text-anchor="middle">E ‖Rv‖² = 2 + 2 = 4</text><text x="550" y="755" fill="#64748B" font-size="24" text-anchor="middle">Same as ‖v‖²; not true per draw</text><text x="48" y="856" fill="#64748B" font-size="27" text-anchor="start">R is 2×3: RR is not defined; this is not P² = P.</text></g></svg>
