<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1010" width="1200" height="1010" role="img"><title>Projection and refitted probe comparison</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1200" height="1010" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="48" y="58" fill="#0F172A" font-size="30" text-anchor="start">Match the projection and readout contracts</text><rect x="350" y="120" width="480" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="590" y="159" fill="#2563EB" font-size="28" text-anchor="middle">Same activation input X</text><text x="590" y="195" fill="#64748B" font-size="24" text-anchor="middle">Output dimension m = 64 for both</text><path d="M450 220 L450 260 L290 260 L290 300" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M730 220 L730 260 L870 260 L870 300" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="50" y="330" width="490" height="110" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="295" y="369" fill="#7C3AED" font-size="28" text-anchor="middle">Learned projection P</text><text x="295" y="405" fill="#64748B" font-size="24" text-anchor="middle">Data-dependent fit</text><rect x="660" y="330" width="490" height="110" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="905" y="369" fill="#7C3AED" font-size="28" text-anchor="middle">Random Rₖ, k = 1, 2, …</text><text x="905" y="405" fill="#64748B" font-size="24" text-anchor="middle">Gaussian entry variance 1/64</text><path d="M295 460 L295 505" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M905 460 L905 505" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="50" y="535" width="490" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="295" y="574" fill="#059669" font-size="28" text-anchor="middle">Fit a probe in P-space</text><text x="295" y="610" fill="#64748B" font-size="24" text-anchor="middle">Own selection on development data</text><rect x="660" y="535" width="490" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="905" y="574" fill="#059669" font-size="28" text-anchor="middle">Refit for every Rₖ-space</text><text x="905" y="610" fill="#64748B" font-size="24" text-anchor="middle">Same selection / locked test</text><path d="M295 665 L295 710" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M905 665 L905 710" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="50" y="740" width="1100" height="92" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="600" y="795" fill="#D97706" font-size="30" text-anchor="middle">Compare under the same evaluation protocol</text><text x="48" y="900" fill="#DC2626" font-size="26" text-anchor="start">Do not carry P-space probe weights into new Rₖ coordinates.</text><text x="48" y="950" fill="#64748B" font-size="26" text-anchor="start">Multiple R seeds describe variability, not a learned mechanism.</text></g></svg>
