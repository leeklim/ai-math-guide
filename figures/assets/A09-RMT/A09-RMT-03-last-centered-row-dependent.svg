<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 825" width="1100" height="825" role="img"><title>Centering row dependence and rank</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1100" height="825" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="48" y="58" fill="#0F172A" font-size="30" text-anchor="start">Centering makes one row dependent</text><text x="48" y="113" fill="#64748B" font-size="28" text-anchor="start">Illustrative Xc: n = 3, d = 2</text><text x="100" y="189" fill="#2563EB" font-size="28" text-anchor="start">Centered rows</text><text x="54" y="290" fill="#2563EB" font-size="28" text-anchor="start">r₁</text><rect x="100" y="238" width="100" height="88" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="150" y="291" fill="#2563EB" font-size="32" text-anchor="middle">−1</text><rect x="224" y="238" width="100" height="88" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="274" y="291" fill="#2563EB" font-size="32" text-anchor="middle">−1</text><text x="54" y="422" fill="#2563EB" font-size="28" text-anchor="start">r₂</text><rect x="100" y="370" width="100" height="88" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="150" y="423" fill="#2563EB" font-size="32" text-anchor="middle">1</text><rect x="224" y="370" width="100" height="88" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="274" y="423" fill="#2563EB" font-size="32" text-anchor="middle">−1</text><text x="54" y="554" fill="#059669" font-size="28" text-anchor="start">r₃</text><rect x="100" y="502" width="100" height="88" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="150" y="555" fill="#059669" font-size="32" text-anchor="middle">0</text><rect x="224" y="502" width="100" height="88" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="274" y="555" fill="#059669" font-size="32" text-anchor="middle">2</text><path d="M350 282 L400 282 L400 384 L450 384" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M350 414 L400 414 L400 384" fill="none" stroke="#2563EB" stroke-width="2.6"/><rect x="480" y="315" width="550" height="130" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="755" y="354" fill="#7C3AED" font-size="28" text-anchor="middle">r₃ = −(r₁ + r₂)</text><text x="755" y="390" fill="#64748B" font-size="24" text-anchor="middle">(0, 2) = −[(−1, −1) + (1, −1)]</text><path d="M740 470 L740 546 L350 546" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><text x="48" y="683" fill="#0F172A" font-size="28" text-anchor="start">The last row is fixed by the first n−1 rows.</text><text x="48" y="744" fill="#64748B" font-size="27" text-anchor="start">rank(Xc) ≤ min(d, n−1); more dependence can lower it.</text></g></svg>
