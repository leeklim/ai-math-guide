<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1250" width="520" height="1250" role="img"><title>Matrix rows and grouped prompt bootstrap</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1250" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="58" fill="#0F172A" font-size="28" text-anchor="start">Same data; two different counts</text><rect x="40" y="110" width="440" height="110" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="149" fill="#2563EB" font-size="28" text-anchor="middle">20 prompts × 50 token rows</text><text x="260" y="185" fill="#64748B" font-size="24" text-anchor="middle">Counts from the exercise</text><rect x="40" y="270" width="440" height="88" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="324" fill="#2563EB" font-size="28" text-anchor="middle">P₁: all 50 rows</text><rect x="40" y="384" width="440" height="88" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="438" fill="#2563EB" font-size="28" text-anchor="middle">P₂: all 50 rows</text><rect x="40" y="552" width="440" height="88" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="606" fill="#2563EB" font-size="28" text-anchor="middle">P₂₀: all 50 rows</text><text x="260" y="523" fill="#64748B" font-size="36" text-anchor="middle">⋮</text><path d="M260 680 L260 710 L145 710 L145 750" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M260 710 L375 710 L375 750" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="780" width="205" height="170" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="142.5" y="824" fill="#059669" font-size="27" text-anchor="middle">Matrix rows</text><text x="142.5" y="879" fill="#059669" font-size="28" text-anchor="middle">n = 1000</text><text x="142.5" y="924" fill="#64748B" font-size="25" text-anchor="middle">Xc: 1000×d</text><rect x="275" y="780" width="205" height="170" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="377.5" y="824" fill="#D97706" font-size="27" text-anchor="middle">Bootstrap</text><text x="377.5" y="879" fill="#D97706" font-size="28" text-anchor="middle">20 packs</text><text x="377.5" y="924" fill="#64748B" font-size="25" text-anchor="middle">Keep 50 rows</text><text x="40" y="1040" fill="#0F172A" font-size="25" text-anchor="start">Rank uses the actual matrix rows.</text><text x="40" y="1103" fill="#0F172A" font-size="25" text-anchor="start">Resample each prompt as one pack.</text><text x="40" y="1180" fill="#DC2626" font-size="24" text-anchor="start">Do not just set n = 20 in an MP law.</text></g></svg>
