<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1500" width="520" height="1500" role="img"><title>Prompt bootstrap refitting and separate measurements</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1500" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="58" fill="#0F172A" font-size="27" text-anchor="start">Resample units; refit the basis</text><text x="40" y="102" fill="#64748B" font-size="25" text-anchor="start">Illustrative bootstrap contract</text><rect x="40" y="150" width="440" height="112" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="189" fill="#2563EB" font-size="28" text-anchor="middle">Original prompt packs</text><text x="260" y="225" fill="#64748B" font-size="24" text-anchor="middle">P₁, P₂, P₃</text><path d="M260 262 V340" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="340" width="440" height="112" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="379" fill="#7C3AED" font-size="28" text-anchor="middle">One replacement resample</text><text x="260" y="415" fill="#64748B" font-size="24" text-anchor="middle">P₁, P₁, P₃</text><path d="M260 452 V540" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="540" width="440" height="112" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="579" fill="#7C3AED" font-size="28" text-anchor="middle">Center; covariance; PCA</text><text x="260" y="615" fill="#64748B" font-size="24" text-anchor="middle">Refit λ_b and U_b each time</text><path d="M150 652 V725 H135 V800" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M370 652 V725 H385 V800" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="800" width="190" height="130" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="135" y="839" fill="#059669" font-size="28" text-anchor="middle">λ_b</text><text x="135" y="875" fill="#64748B" font-size="24" text-anchor="middle">Eigenvalues</text><rect x="290" y="800" width="190" height="130" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="385" y="839" fill="#059669" font-size="28" text-anchor="middle">O_b</text><text x="385" y="875" fill="#64748B" font-size="24" text-anchor="middle">U_b vs U_ref</text><text x="40" y="1020" fill="#0F172A" font-size="24" text-anchor="start">Fix the overlap reference explicitly.</text><rect x="40" y="1080" width="440" height="120" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="60" y="1123" fill="#D97706" font-size="27" text-anchor="start">Eigenvalue interval: size</text><text x="60" y="1168" fill="#D97706" font-size="24" text-anchor="start">Overlap interval: reference match</text><text x="40" y="1290" fill="#0F172A" font-size="22" text-anchor="start">Repeat whole packs, not single tokens.</text><text x="40" y="1360" fill="#64748B" font-size="22" text-anchor="start">No new bootstrap or interval is executed.</text><text x="40" y="1430" fill="#64748B" font-size="23" text-anchor="start">U_ref is not an unnamed shared basis.</text></g></svg>
