<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1280" width="520" height="1280" role="img"><title>Prompt-level split and separate basis refits</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1280" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="58" fill="#0F172A" font-size="27" text-anchor="start">Split independent prompt packs</text><text x="40" y="102" fill="#64748B" font-size="24" text-anchor="start">One feature coordinate contract</text><rect x="40" y="145" width="440" height="112" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="184" fill="#2563EB" font-size="28" text-anchor="middle">Whole prompt packs</text><text x="260" y="220" fill="#64748B" font-size="24" text-anchor="middle">P₁, P₂, P₃, P₄</text><path d="M180 257 V305 H135 V340" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M340 257 V305 H385 V340" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="340" width="190" height="105" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="135" y="379" fill="#2563EB" font-size="28" text-anchor="middle">Split A</text><text x="135" y="415" fill="#64748B" font-size="24" text-anchor="middle">P₁, P₂</text><rect x="290" y="340" width="190" height="105" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="385" y="379" fill="#2563EB" font-size="28" text-anchor="middle">Split B</text><text x="385" y="415" fill="#64748B" font-size="24" text-anchor="middle">P₃, P₄</text><path d="M135 445 V500" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M385 445 V500" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="500" width="190" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="135" y="539" fill="#7C3AED" font-size="28" text-anchor="middle">Center A</text><text x="135" y="575" fill="#64748B" font-size="24" text-anchor="middle">Own mean</text><rect x="290" y="500" width="190" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="385" y="539" fill="#7C3AED" font-size="28" text-anchor="middle">Center B</text><text x="385" y="575" fill="#64748B" font-size="24" text-anchor="middle">Own mean</text><path d="M135 605 V660" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M385 605 V660" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="660" width="190" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="135" y="699" fill="#7C3AED" font-size="28" text-anchor="middle">Fit PCA A</text><text x="135" y="735" fill="#64748B" font-size="24" text-anchor="middle">New U_A</text><rect x="290" y="660" width="190" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="385" y="699" fill="#7C3AED" font-size="28" text-anchor="middle">Fit PCA B</text><text x="385" y="735" fill="#64748B" font-size="24" text-anchor="middle">New U_B</text><path d="M135 765 V850 H220 V900" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M385 765 V850 H300 V900" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="900" width="440" height="112" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="939" fill="#059669" font-size="28" text-anchor="middle">Compare U_A and U_B</text><text x="260" y="975" fill="#64748B" font-size="24" text-anchor="middle">Same d and k; orthonormal columns</text><text x="40" y="1090" fill="#0F172A" font-size="25" text-anchor="start">Never fit one full-data PCA first.</text><text x="40" y="1150" fill="#0F172A" font-size="24" text-anchor="start">Tokens from one pack stay together.</text><text x="40" y="1210" fill="#64748B" font-size="22" text-anchor="start">Comparison design, not an executed split</text></g></svg>
