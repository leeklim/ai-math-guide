   <text style="font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start" x="48" y="46.5" transform="rotate(-0 48 46.5)">Paired rows preserve the Gram; separate column shuffles need not.</text>
  </g>
  <g id="text_44">
   <text style="font-size: 27px; font-family: 'DejaVu Sans'; text-anchor: start" x="48" y="111.6" transform="rotate(-0 48 111.6)">Cell colors and row positions track original pair membership.</text>
  </g>
  <g id="text_45">
   <text style="font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start" x="48" y="860.25" transform="rotate(-0 48 860.25)">Same marginals; different feature pairing in the right matrix</text>
  </g>
  <g id="text_46">
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64748b" x="48" y="906.75" transform="rotate(-0 48 906.75)">Exact small matrices, not a prompt-preserving null generator</text>
  </g>
 </g>
