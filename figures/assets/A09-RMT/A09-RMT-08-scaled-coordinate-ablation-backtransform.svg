   <text style="font-size: 29px; font-family: 'DejaVu Sans'; text-anchor: start" x="48" y="705.2" transform="rotate(-0 48 705.2)">(3,0)ᵀ → (1,0)ᵀ → (0.5,−0.5)ᵀ → (1.5,−0.5)ᵀ</text>
  </g>
  <g id="text_31">
   <text style="font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #64748b" x="48" y="762.6" transform="rotate(-0 48 762.6)">Naive raw U removal gives (1.5,−1.5)ᵀ instead; no behavior measured.</text>
  </g>
 </g>
