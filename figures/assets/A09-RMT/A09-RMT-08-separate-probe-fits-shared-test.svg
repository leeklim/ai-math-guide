<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1450" width="520" height="1450" role="img"><title>Separate probe fits and shared held-out test</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1450" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="58" fill="#0F172A" font-size="26" text-anchor="start">Refit both probes; share the test</text><text x="40" y="104" fill="#64748B" font-size="23" text-anchor="start">A comparison contract, not model results</text><rect x="40" y="160" width="440" height="115" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="199" fill="#2563EB" font-size="28" text-anchor="middle">Train / validation only</text><text x="260" y="235" fill="#64748B" font-size="24" text-anchor="middle">Subspace and probe selection</text><path d="M180 275 V330 H135 V390" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M340 275 V330 H385 V390" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="390" width="190" height="120" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="135" y="429" fill="#7C3AED" font-size="28" text-anchor="middle">Chosen U</text><text x="135" y="465" fill="#64748B" font-size="24" text-anchor="middle">Dimension k</text><rect x="290" y="390" width="190" height="120" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="385" y="429" fill="#7C3AED" font-size="28" text-anchor="middle">Random V</text><text x="385" y="465" fill="#64748B" font-size="24" text-anchor="middle">Same k</text><path d="M135 510 V595" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M385 510 V595" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="595" width="190" height="130" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="135" y="634" fill="#7C3AED" font-size="28" text-anchor="middle">Fit A</text><text x="135" y="670" fill="#64748B" font-size="24" text-anchor="middle">Select A</text><rect x="290" y="595" width="190" height="130" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="385" y="634" fill="#7C3AED" font-size="28" text-anchor="middle">Fit B</text><text x="385" y="670" fill="#64748B" font-size="24" text-anchor="middle">Same rules</text><path d="M135 725 V815 H220 V880" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M385 725 V815 H300 V880" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="880" width="440" height="115" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="919" fill="#059669" font-size="28" text-anchor="middle">Fixed evaluation</text><text x="260" y="955" fill="#64748B" font-size="24" text-anchor="middle">Same untouched test prompts</text><text x="40" y="1080" fill="#0F172A" font-size="23" text-anchor="start">Paired predictions on the same prompts</text><text x="40" y="1150" fill="#0F172A" font-size="22" text-anchor="start">Prompt-unit uncertainty; no test tuning</text><text x="40" y="1240" fill="#DC2626" font-size="23" text-anchor="start">Task prediction ≠ demonstrated use</text><text x="40" y="1320" fill="#64748B" font-size="22" text-anchor="start">Ablation needs separate matched controls.</text><text x="40" y="1390" fill="#64748B" font-size="23" text-anchor="start">No new probe or behavior experiment</text></g></svg>
