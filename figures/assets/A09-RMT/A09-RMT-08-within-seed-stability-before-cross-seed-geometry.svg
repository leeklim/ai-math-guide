<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1270" width="520" height="1270" role="img"><title>Within-seed stability and cross-seed coordinate boundary</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1270" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="58" fill="#0F172A" font-size="24" text-anchor="start">Repeat evidence; do not equate axes.</text><text x="40" y="106" fill="#64748B" font-size="23" text-anchor="start">Same width does not align coordinates.</text><rect x="40" y="170" width="190" height="110" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="135" y="209" fill="#2563EB" font-size="28" text-anchor="middle">Seed A</text><text x="135" y="245" fill="#64748B" font-size="24" text-anchor="middle">Own axes</text><rect x="290" y="170" width="190" height="110" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="385" y="209" fill="#2563EB" font-size="28" text-anchor="middle">Seed B</text><text x="385" y="245" fill="#64748B" font-size="24" text-anchor="middle">Own axes</text><path d="M135 280 V360" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M385 280 V360" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="360" width="190" height="130" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="135" y="399" fill="#7C3AED" font-size="28" text-anchor="middle">Refit PCA</text><text x="135" y="435" fill="#64748B" font-size="24" text-anchor="middle">A1 vs A2</text><rect x="290" y="360" width="190" height="130" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="385" y="399" fill="#7C3AED" font-size="28" text-anchor="middle">Refit PCA</text><text x="385" y="435" fill="#64748B" font-size="24" text-anchor="middle">B1 vs