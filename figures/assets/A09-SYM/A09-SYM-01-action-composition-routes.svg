<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 870" width="1060" height="870" role="img"><title>Sequential action agrees with applying the group product</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1060" height="870" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">The right-hand factor acts first</text><text x="40" y="130" fill="#475569" font-size="27">Sequential: R then R</text><rect x="40" y="177" width="260" height="138" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="90" y="260" fill="#2563EB" font-size="30">x=(2,1)</text><path d="M304 246H388" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="338" y="207" fill="#7C3AED" font-size="28">R</text><rect x="400" y="177" width="260" height="138" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="443" y="260" fill="#7C3AED" font-size="28">Rx=(−1,2)</text><path d="M664 246H748" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="698" y="207" fill="#7C3AED" font-size="28">R</text><rect x="760" y="177" width="260" height="138" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="778" y="259" fill="#059669" font-size="25">R(Rx)=(−2,−1)</text><text x="40" y="446" fill="#475569" font-size="27">Product: RR=R₁₈₀</text><rect x="40" y="496" width="260" height="138" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="90" y="579" fill="#2563EB" font-size="30">x=(2,1)</text><path d="M304 565H748" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="401" y="526" fill="#7C3AED" font-size="28">Apply RR once</text><rect x="760" y="496" width="260" height="138" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="778" y="579" fill="#059669" font-size="25">(RR)x=(−2,−1)</text><text x="40" y="748" fill="#0F172A" font-size="28">(g₁g₂)·x = g₁·(g₂·x)</text><text x="40" y="811" fill="#475569" font-size="25">The product is a group element; the action returns an object in X.</text></g></svg>
