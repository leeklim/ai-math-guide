  <g id="text_12">
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(148.810625 671.30875)">Identity: n + 0 = n</text>
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(76.4675 703.654375)">Closure: the sum is an integer.</text>
   <text style="font-size: 24px; font-family: 'DejaVu Sans'; fill: #475569" transform="translate(81.72875 736)">(2 + 3) + 1 = 2 + (3 + 1) = 6</text>
