<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1020" width="1100" height="1020" role="img"><title>The same permutation acts on different target sets</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1100" height="1020" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Specify the object receiving the permutation</text><text x="40" y="126" fill="#475569" font-size="28">P = coordinate swap</text><rect x="700" y="83" width="190" height="106" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="734" y="123" fill="#7C3AED" font-size="29">0</text><text x="814" y="123" fill="#7C3AED" font-size="29">1</text><text x="734" y="165" fill="#7C3AED" font-size="29">1</text><text x="814" y="165" fill="#7C3AED" font-size="29">0</text><text x="40" y="271" fill="#0F172A" font-size="28">Vector action: Ph</text><rect x="60" y="312" width="245" height="171" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="111" y="355" fill="#2563EB" font-size="27">h in R²</text><text x="120" y="434" fill="#2563EB" font-size="31">(3,1)ᵀ</text><path d="M309 398H769" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="390" y="361" fill="#7C3AED" font-size="27">Swap coordinates</text><rect x="781" y="312" width="265" height="171" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="829" y="355" fill="#059669" font-size="27">Ph in R²</text><text x="849" y="434" fill="#059669" font-size="31">(1,3)ᵀ</text><text x="40" y="592" fill="#0F172A" font-size="28">Matrix action: PW</text><rect x="60" y="629" width="245" height="171" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="94" y="669" fill="#2563EB" font-size="29">3</text><text x="174" y="669" fill="#2563EB" font-size="29">1</text><text x="94" y="711" fill="#2563EB" font-size="29">2</text><text x="174" y="711" fill="#2563EB" font-size="29">5</text><path d="M309 715H769" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="435" y="677" fill="#7C3AED" font-size="27">Swap rows</text><rect x="781" y="629" width="265" height="171" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="815" y="669" fill="#059669" font-size="29">2</text><text x="895" y="669" fill="#059669" font-size="29">5</text><text x="815" y="711" fill="#059669" font-size="29">3</text><text x="895" y="711" fill="#059669" font-size="29">1</text><text x="40" y="868" fill="#475569" font-size="27">Row 1 and row 2 move; columns keep their roles.</text><text x="40" y="952" fill="#475569" font-size="27">Same P; distinct action domains and output shapes.</text></g></svg>
