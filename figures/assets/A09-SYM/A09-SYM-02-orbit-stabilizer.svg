<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 715" width="1100" height="715" role="img"><title>Orbit points and transformations returning the original point to itself</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1100" height="715" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Orbit moves the object; stabilizer leaves it fixed</text><ellipse cx="385" cy="360" rx="320" ry="225" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2" stroke-dasharray="9 7"/><text x="130" y="117" fill="#1E3A8A" font-size="26">orbit G · x</text><circle cx="210" cy="365" r="48" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="210" y="374" text-anchor="middle" fill="#1E3A8A" font-size="25">x</text><circle cx="440" cy="225" r="48" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="440" y="234" text-anchor="middle" fill="#1E3A8A" font-size="25">g₁·x</text><circle cx="565" cy="465" r="48" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="565" y="474" text-anchor="middle" fill="#1E3A8A" font-size="25">g₂·x</text><path d="M253 342C300 290 350 260 385 246" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M468 264C515 315 548 370 561 407" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M512 493C380 565 268 472 237 410" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><text x="310" y="261" fill="#334155" font-size="26">g₁</text><text x="539" y="343" fill="#334155" font-size="26">g₂g₁⁻¹</text><text x="340" y="464" fill="#334155" font-size="26">g₂⁻¹</text><rect x="810" y="170" width="250" height="430" rx="18" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/><text x="935" y="220" text-anchor="middle" fill="#9A3412" font-size="26">stabilizer Gₓ</text><circle cx="935" cy="375" r="48" fill="#FFEDD5" stroke="#F97316" stroke-width="3"/><text x="935" y="385" text-anchor="middle" fill="#9A3412" font-size="27">x</text><path d="M900 342C850 290 1020 290 970 342" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><path d="M970 408C1020 485 850 485 900 408" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="876" y="273" fill="#92400E" font-size="25">e · x = x</text><text x="876" y="540" fill="#5B21B6" font-size="25">h · x = x</text><text x="550" y="665" text-anchor="middle" fill="#334155" font-size="25">Fixed finite G: a larger stabilizer gives a smaller orbit.</text></g></svg>
