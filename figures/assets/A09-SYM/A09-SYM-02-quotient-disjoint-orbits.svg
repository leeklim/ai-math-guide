<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1070" width="950" height="1070" role="img"><title>Distinct permutation orbits become distinct elements of the quotient</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="950" height="1070" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">The quotient maps whole orbits to classes</text><ellipse cx="272" cy="228" rx="220" ry="117" fill="#2563EB" fill-opacity=".035" stroke="#94A3B8" stroke-dasharray="8 7"/><circle cx="165" cy="228" r="61" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="165" y="238" text-anchor="middle" fill="#2563EB" font-size="27">(1,3)</text><circle cx="380" cy="228" r="61" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="380" y="238" text-anchor="middle" fill="#2563EB" font-size="27">(3,1)</text><text x="209" y="144" fill="#2563EB" font-size="25">Orbit A</text><path d="M228 202H305" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M313 254H236" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M497 228H749" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><text x="537" y="193" fill="#475569" font-size="25">quotient map</text><circle cx="822" cy="228" r="61" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="822" y="238" text-anchor="middle" fill="#059669" font-size="27">[A]</text><ellipse cx="272" cy="523" rx="220" ry="117" fill="#2563EB" fill-opacity=".035" stroke="#94A3B8" stroke-dasharray="8 7"/><circle cx="165" cy="523" r="61" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="165" y="533" text-anchor="middle" fill="#2563EB" font-size="27">(2,4)</text><circle cx="380" cy="523" r="61" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="380" y="533" text-anchor="middle" fill="#2563EB" font-size="27">(4,2)</text><text x="209" y="439" fill="#2563EB" font-size="25">Orbit B</text><path d="M228 497H305" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M313 549H236" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M497 523H749" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><text x="537" y="488" fill="#475569" font-size="25">quotient map</text><circle cx="822" cy="523" r="61" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="822" y="533" text-anchor="middle" fill="#059669" font-size="27">[B]</text><circle cx="272" cy="802" r="61" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="272" y="812" text-anchor="middle" fill="#2563EB" font-size="27">(2,2)</text><text x="225" y="704" fill="#2563EB" font-size="25">Orbit C</text><path d="M339 802H749" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><circle cx="822" cy="802" r="61" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="822" y="812" text-anchor="middle" fill="#059669" font-size="27">[C]</text><text x="40" y="941" fill="#475569" font-size="27">P swaps coordinates; different orbits stay disjoint.</text><text x="40" y="1005" fill="#475569" font-size="26">Each class is an orbit; no representative is selected.</text></g></svg>
