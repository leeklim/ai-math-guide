<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1130" width="1100" height="1130" role="img"><title>Left cosets group the transformations producing the same orbit point</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1100" height="1130" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Six transformations fall into three equal-size fibers</text><rect x="40" y="177" width="470" height="165" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="101" y="247" fill="#7C3AED" font-size="31">e, (12)</text><text x="194" y="303" fill="#7C3AED" font-size="28">Gₓ</text><path d="M514 260H719" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="553" y="219" fill="#475569" font-size="25">act on x</text><rect x="731" y="177" width="325" height="165" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="790" y="267" fill="#059669" font-size="31">(1,1,2)</text><rect x="40" y="429" width="470" height="165" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="101" y="499" fill="#7C3AED" font-size="31">(23), (132)</text><text x="194" y="555" fill="#7C3AED" font-size="28">(23)Gₓ</text><path d="M514 512H719" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="553" y="471" fill="#475569" font-size="25">act on x</text><rect x="731" y="429" width="325" height="165" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="790" y="519" fill="#059669" font-size="31">(1,2,1)</text><rect x="40" y="681" width="470" height="165" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="101" y="751" fill="#7C3AED" font-size="31">(13), (123)</text><text x="194" y="807" fill="#7C3AED" font-size="28">(13)Gₓ</text><path d="M514 764H719" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="553" y="723" fill="#475569" font-size="25">act on x</text><rect x="731" y="681" width="325" height="165" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="790" y="771" fill="#059669" font-size="31">(2,1,1)</text><text x="40" y="1000" fill="#0F172A" font-size="28">x=(1,1,2);  G=S₃;  Gₓ={e,(12)}</text><text x="40" y="1065" fill="#475569" font-size="27">|G·x|=6/2=3; each left coset has 2 elements.</text></g></svg>
