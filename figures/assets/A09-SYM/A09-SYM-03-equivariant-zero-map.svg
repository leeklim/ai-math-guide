<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 850" width="520" height="850" role="img"><title>A zero equivariant map need not preserve information</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="850" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Zero map is equivariant</text><text x="40" y="103" fill="#0F172A" font-size="27">The input is not recoverable</text><rect x="40" y="185" width="195" height="122" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="87" y="263" fill="#2563EB" font-size="29">(1,3)ᵀ</text><rect x="285" y="185" width="195" height="122" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="332" y="263" fill="#2563EB" font-size="29">(3,1)ᵀ</text><path d="M239 244H273" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="245" y="169" fill="#7C3AED" font-size="26">P</text><path d="M138 319V474" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M382 319V474" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="220" y="415" fill="#7C3AED" font-size="28">f=0</text><rect x="80" y="486" width="360" height="122" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="133" y="563" fill="#059669" font-size="28">f(x)=(0,0)ᵀ</text><text x="105" y="711" fill="#059669" font-size="28">P(0,0)ᵀ=(0,0)ᵀ</text><text x="40" y="784" fill="#475569" font-size="25">Different inputs share one output.</text></g></svg>
