<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1206 1240" width="1206" height="1240" role="img"><title>Finite group averaging is invariant because multiplication reindexes every term</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1206" height="1240" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">A full uniform average reorders the same terms</text><text x="40" y="114" fill="#0F172A" font-size="28">G={+1,−1}; f(z)=z+z²</text><rect x="40" y="197" width="220" height="140" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="89" y="283" fill="#2563EB" font-size="30">x=2</text><rect x="460" y="144" width="240" height="110" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="494" y="212" fill="#7C3AED" font-size="29">f(2)=6</text><rect x="460" y="368" width="240" height="110" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="494" y="436" fill="#7C3AED" font-size="29">f(−2)=2</text><path d="M264 255L448 199" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M264 282L448 423" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="319" y="168" fill="#7C3AED" font-size="25">g=+1</text><text x="319" y="486" fill="#7C3AED" font-size="25">g=−1</text><path d="M704 199L824 272" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><path d="M704 423L824 315" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="836" y="233" width="330" height="151" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="878" y="323" fill="#059669" font-size="28">(6+2)/2=4</text><rect x="40" y="692" width="220" height="140" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="89" y="778" fill="#2563EB" font-size="30">−x=−2</text><rect x="460" y="639" width="240" height="110" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="494" y="707" fill="#7C3AED" font-size="29">f(−2)=2</text><rect x="460" y="863" width="240" height="110" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="494" y="931" fill="#7C3AED" font-size="29">f(2)=6</text><path d="M264 750L448 694" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M264 777L448 918" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="319" y="663" fill="#7C3AED" font-size="25">g=+1</text><text x="319" y="981" fill="#7C3AED" font-size="25">g=−1</text><path d="M704 694L824 767" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><path d="M704 918L824 810" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="836" y="728" width="330" height="151" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="878" y="818" fill="#059669" font-size="28">(2+6)/2=4</text><text x="40" y="1114" fill="#475569" font-size="27">Multiplication by −1 exchanges the two group elements.</text><text x="40" y="1179" fill="#475569" font-size="27">Both uniform sums contain exactly the same two terms.</text></g></svg>
