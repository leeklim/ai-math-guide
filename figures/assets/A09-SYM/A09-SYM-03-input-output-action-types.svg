<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1126 1270" width="1126" height="1270" role="img"><title>Invariant and equivariant maps use different output actions</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1126" height="1270" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Output action depends on the chosen map</text><text x="40" y="125" fill="#0F172A" font-size="28">Invariant sum: R² → R</text><rect x="60" y="185" width="330" height="126" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="161" y="263" fill="#2563EB" font-size="31">(1,3)ᵀ</text><path d="M394 248H744" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="561" y="214" fill="#7C3AED" font-size="28">f</text><rect x="756" y="185" width="330" height="126" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="910" y="263" fill="#059669" font-size="31">4</text><rect x="60" y="411" width="330" height="126" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="161" y="489" fill="#2563EB" font-size="31">(3,1)ᵀ</text><path d="M394 474H744" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="561" y="440" fill="#7C3AED" font-size="28">f</text><rect x="756" y="411" width="330" height="126" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="910" y="489" fill="#059669" font-size="31">4</text><path d="M225 323V399" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="54" y="372" fill="#7C3AED" font-size="25">Input swap P</text><path d="M921 323V399" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><text x="965" y="372" fill="#059669" font-size="25">Identity</text><text x="40" y="660" fill="#0F172A" font-size="28">Equivariant identity: R² → R²</text><rect x="60" y="720" width="330" height="126" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="161" y="798" fill="#2563EB" font-size="31">(1,3)ᵀ</text><path d="M394 783H744" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="561" y="749" fill="#7C3AED" font-size="28">f</text><rect x="756" y="720" width="330" height="126" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="850" y="798" fill="#059669" font-size="31">(1,3)ᵀ</text><rect x="60" y="946" width="330" height="126" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="161" y="1024" fill="#2563EB" font-size="31">(3,1)ᵀ</text><path d="M394 1009H744" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="561" y="975" fill="#7C3AED" font-size="28">f</text><rect x="756" y="946" width="330" height="126" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="850" y="1024" fill="#059669" font-size="31">(3,1)ᵀ</text><path d="M225 858V934" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="54" y="907" fill="#7C3AED" font-size="25">Input swap P</text><path d="M921 858V934" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><text x="965" y="907" fill="#059669" font-size="25">Swap P</text><text x="40" y="1155" fill="#475569" font-size="27">The scalar sum is constant on the input orbit.</text><text x="40" y="1213" fill="#475569" font-size="25">The identity output moves with P; its coordinates are retained.</text></g></svg>
