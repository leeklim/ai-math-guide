<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 885" width="1070" height="885" role="img"><title>A noncommuting linear map is not equivariant to the chosen permutation</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1070" height="885" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">The linear map must commute with the actions</text><text x="40" y="123" fill="#0F172A" font-size="27">A=diag(2,1); P swaps the coordinates.</text><rect x="40" y="199" width="270" height="142" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="70" y="286" fill="#2563EB" font-size="26">x=(1,3)ᵀ</text><rect x="400" y="199" width="270" height="142" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="430" y="286" fill="#7C3AED" font-size="26">Px=(3,1)ᵀ</text><rect x="760" y="199" width="270" height="142" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="790" y="286" fill="#059669" font-size="26">APx=(6,1)ᵀ</text><path d="M314 270H388" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M674 270H748" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="341" y="231" fill="#7C3AED" font-size="28">P</text><text x="701" y="231" fill="#7C3AED" font-size="28">A</text><rect x="40" y="506" width="270" height="142" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="70" y="593" fill="#2563EB" font-size="26">x=(1,3)ᵀ</text><rect x="400" y="506" width="270" height="142" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="430" y="593" fill="#7C3AED" font-size="26">Ax=(2,3)ᵀ</text><rect x="760" y="506" width="270" height="142" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="790" y="593" fill="#059669" font-size="26">PAx=(3,2)ᵀ</text><path d="M314 577H388" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M674 577H748" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="341" y="538" fill="#7C3AED" font-size="28">A</text><text x="701" y="538" fill="#7C3AED" font-size="28">P</text><text x="40" y="756" fill="#475569" font-size="27">APx≠PAx. One counterexample rules out equivariance.</text><text x="40" y="822" fill="#0F172A" font-size="27">For every x, the linear condition is AP=P_out A.</text></g></svg>
