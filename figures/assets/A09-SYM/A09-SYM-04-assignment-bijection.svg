<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1030" width="1080" height="1030" role="img"><title>assignment-bijection</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="1030" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Independent row maxima do not form a permutation</text><text x="40" y="111" fill="#475569" font-size="25">Similarity scores: maximize the total subject to one-to-one matching.</text><text x="40" y="254" fill="#2563EB" font-size="29">A1</text><rect x="116" y="178" width="235" height="129" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="179" y="254" fill="#D97706" font-size="31">0.90</text><rect x="371" y="178" width="235" height="129" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="434" y="254" fill="#059669" font-size="31">0.80</text><text x="735" y="254" fill="#DC2626" font-size="28">Row best → B1</text><text x="40" y="411" fill="#2563EB" font-size="29">A2</text><rect x="116" y="335" width="235" height="129" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="179" y="411" fill="#059669" font-size="31">0.95</text><rect x="371" y="335" width="235" height="129" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="434" y="411" fill="#D97706" font-size="31">0.70</text><text x="735" y="411" fill="#DC2626" font-size="28">Row best → B1</text><text x="179" y="143" fill="#475569" font-size="27">B1</text><text x="434" y="143" fill="#475569" font-size="27">B2</text><text x="735" y="567" fill="#DC2626" font-size="28">Duplicate target</text><path d="M960 242C992 330 973 444 940 512" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1021 402L1014 512" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><text x="40" y="627" fill="#D97706" font-size="27">Valid diagonal: 0.90+0.70=1.60</text><text x="40" y="694" fill="#059669" font-size="27">Valid off-diagonal: 0.80+0.95=1.75</text><rect x="40" y="779" width="995" height="202" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="91" y="845" fill="#059669" font-size="29">A1 → B2</text><text x="612" y="845" fill="#059669" font-size="29">A2 → B1</text><text x="91" y="922" fill="#059669" font-size="27">One per row and one per column.</text></g></svg>
