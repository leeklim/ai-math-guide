<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 1090" width="1090" height="1090" role="img"><title>bias-coordinate-pair</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1090" height="1090" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Bias belongs to the same hidden coordinate</text><text x="40" y="142" fill="#0F172A" font-size="27">Original</text><rect x="40" y="190" width="315" height="124" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="59" y="262" fill="#2563EB" font-size="27">W₁x=(1,2)ᵀ</text><text x="381" y="262" fill="#475569" font-size="30">+</text><rect x="427" y="190" width="280" height="124" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="445" y="262" fill="#7C3AED" font-size="27">b₁=(1,3)ᵀ</text><path d="M719 252H780" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="793" y="190" width="257" height="124" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="835" y="262" fill="#7C3AED" font-size="29">(2,5)ᵀ</text><text x="40" y="397" fill="#0F172A" font-size="27">Both rows and bias swapped</text><rect x="40" y="445" width="315" height="124" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="59" y="517" fill="#2563EB" font-size="27">PW₁x=(2,1)ᵀ</text><text x="381" y="517" fill="#475569" font-size="30">+</text><rect x="427" y="445" width="280" height="124" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="445" y="517" fill="#7C3AED" font-size="27">Pb₁=(3,1)ᵀ</text><path d="M719 507H780" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="793" y="445" width="257" height="124" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="835" y="517" fill="#7C3AED" font-size="29">(5,2)ᵀ</text><text x="40" y="652" fill="#0F172A" font-size="27">Rows swapped, bias left behind</text><rect x="40" y="700" width="315" height="124" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="59" y="772" fill="#2563EB" font-size="27">PW₁x=(2,1)ᵀ</text><text x="381" y="772" fill="#475569" font-size="30">+</text><rect x="427" y="700" width="280" height="124" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="445" y="772" fill="#DC2626" font-size="27">b₁=(1,3)ᵀ</text><path d="M719 762H780" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="793" y="700" width="257" height="124" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="835" y="772" fill="#DC2626" font-size="29">(3,4)ᵀ</text><text x="40" y="921" fill="#475569" font-size="25">ReLU is identity on these positive preactivations.</text><text x="40" y="981" fill="#475569" font-size="25">With readout (7,3): correct 41, wrong-bias 33.</text><text x="40" y="1042" fill="#475569" font-size="25">The output bias b₂ is not a hidden coordinate: b₂′=b₂.</text></g></svg>
