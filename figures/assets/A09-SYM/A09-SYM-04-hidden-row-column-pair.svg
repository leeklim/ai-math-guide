<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1020" width="1080" height="1020" role="img"><title>hidden-row-column-pair</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="1020" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Hidden rows and readout columns move as a pair</text><text x="40" y="110" fill="#475569" font-size="25">x=(1,2)ᵀ ; b₁=(1,3)ᵀ ; ReLU on each unit</text><text x="40" y="150" fill="#0F172A" font-size="28">Original</text><rect x="40" y="188" width="285" height="92" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="62" y="243" fill="#2563EB" font-size="27">Row 1: [1, 0]</text><path d="M335 234H417" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="430" y="188" width="317" height="92" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="450" y="243" fill="#7C3AED" font-size="27">h₁=2 ; weight 3</text><path d="M759 234L847 309" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="338" width="285" height="92" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="62" y="393" fill="#2563EB" font-size="27">Row 2: [0, 1]</text><path d="M335 384H417" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="430" y="338" width="317" height="92" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="450" y="393" fill="#7C3AED" font-size="27">h₂=5 ; weight 7</text><path d="M759 384L847 309" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="859" y="259" width="180" height="108" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="884" y="323" fill="#059669" font-size="29">y = 41</text><text x="40" y="519" fill="#0F172A" font-size="28">After swapping hidden units</text><rect x="40" y="557" width="285" height="92" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="62" y="612" fill="#2563EB" font-size="27">Row 2: [0, 1]</text><path d="M335 603H417" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="430" y="557" width="317" height="92" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="450" y="612" fill="#7C3AED" font-size="27">h₂=5 ; weight 7</text><path d="M759 603L847 678" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="707" width="285" height="92" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="62" y="762" fill="#2563EB" font-size="27">Row 1: [1, 0]</text><path d="M335 753H417" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="430" y="707" width="317" height="92" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="450" y="762" fill="#7C3AED" font-size="27">h₁=2 ; weight 3</text><path d="M759 753L847 678" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="859" y="628" width="180" height="108" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="884" y="692" fill="#059669" font-size="29">y = 41</text><text x="40" y="914" fill="#475569" font-size="27">W₁′=PW₁ ; W₂′=W₂P⁻¹</text><text x="40" y="974" fill="#475569" font-size="25">The hidden names change, not the paired computation.</text></g></svg>
