<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1206 940" width="1206" height="940" role="img"><title>positive-scale-exchange</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1206" height="940" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Positive scaling exchanges adjacent layer gains</text><text x="40" y="113" fill="#475569" font-size="27">ReLU(cz)=c ReLU(z), only for c>0.</text><text x="40" y="165" fill="#0F172A" font-size="28">Original</text><rect x="40" y="210" width="220" height="130" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="75" y="288" fill="#2563EB" font-size="30">z=2</text><path d="M274 275H346" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="361" y="210" width="273" height="130" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="386" y="288" fill="#7C3AED" font-size="28">ReLU(2)=2</text><path d="M648 275H720" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="735" y="210" width="242" height="130" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="767" y="288" fill="#059669" font-size="28">w=3</text><path d="M991 275H1050" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><text x="1070" y="288" fill="#059669" font-size="30">y=6</text><text x="40" y="498" fill="#0F172A" font-size="28">Scale c=4</text><rect x="40" y="543" width="220" height="130" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="75" y="621" fill="#2563EB" font-size="30">cz=8</text><path d="M274 608H346" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="361" y="543" width="273" height="130" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="386" y="621" fill="#7C3AED" font-size="28">ReLU(8)=8</text><path d="M648 608H720" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="735" y="543" width="242" height="130" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="767" y="621" fill="#059669" font-size="28">w/c=0.75</text><path d="M991 608H1050" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><text x="1070" y="621" fill="#059669" font-size="30">y=6</text><text x="40" y="823" fill="#475569" font-size="26">The entire preactivation scales, including hidden bias.</text><text x="40" y="887" fill="#475569" font-size="27">W₁′=cW₁ ; b₁′=cb₁ ; W₂′=W₂/c</text></g></svg>
