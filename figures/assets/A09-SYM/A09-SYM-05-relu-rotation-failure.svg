<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1274 986" width="1274" height="986" role="img"><title>relu-rotation-failure</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1274" height="986" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">A fixed ReLU need not commute with a rotation</text><text x="40" y="111" fill="#475569" font-size="26">Q: a counterclockwise quarter-turn ; z=(1,−1)ᵀ</text><rect x="40" y="222" width="260" height="150" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="62" y="309" fill="#2563EB" font-size="27">z=(1,−1)ᵀ</text><path d="M313 297H377" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="390" y="222" width="380" height="150" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="412" y="309" fill="#7C3AED" font-size="27">Qz=(1,1)ᵀ</text><path d="M783 297H847" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="860" y="222" width="371" height="150" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="882" y="309" fill="#059669" font-size="27">ReLU(Qz)=(1,1)ᵀ</text><text x="40" y="178" fill="#0F172A" font-size="28">Q first</text><rect x="40" y="565" width="260" height="150" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="62" y="652" fill="#2563EB" font-size="27">z=(1,−1)ᵀ</text><path d="M313 640H377" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="390" y="565" width="380" height="150" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="412" y="652" fill="#7C3AED" font-size="27">ReLU(z)=(1,0)ᵀ</text><path d="M783 640H847" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="860" y="565" width="371" height="150" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="882" y="652" fill="#059669" font-size="27">QReLU(z)=(0,1)ᵀ</text><text x="40" y="521" fill="#0F172A" font-size="28">ReLU first</text><text x="40" y="864" fill="#DC2626" font-size="29">ReLU(Qz)≠QReLU(z).</text><text x="40" y="931" fill="#475569" font-size="25">Linear coordinate freedom is not automatically a symmetry of the architecture.</text></g></svg>
