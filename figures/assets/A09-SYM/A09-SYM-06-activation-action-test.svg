<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1150" width="1240" height="1150" role="img"><title>activation-action-test</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1240" height="1150" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Learned activations require a specified action test</text><text x="40" y="112" fill="#475569" font-size="25">This is a test design, not an observed model result.</text><text x="40" y="180" fill="#0F172A" font-size="27">Transform input, then measure activation</text><rect x="40" y="225" width="280" height="129" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="95" y="302" fill="#2563EB" font-size="30">x</text><path d="M334 289H382" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="395" y="225" width="280" height="129" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="450" y="302" fill="#7C3AED" font-size="30">g·x</text><path d="M689 289H737" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="750" y="225" width="280" height="129" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="805" y="302" fill="#D97706" font-size="30">h(g·x)</text><text x="40" y="545" fill="#0F172A" font-size="27">Encode input, then apply the specified linear rule</text><rect x="40" y="590" width="280" height="129" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="95" y="667" fill="#2563EB" font-size="30">x</text><path d="M334 654H382" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="395" y="590" width="280" height="129" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="450" y="667" fill="#2563EB" font-size="30">h(x)</text><path d="M689 654H737" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="750" y="590" width="280" height="129" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="805" y="667" fill="#059669" font-size="30">ρ(g)h(x)</text><path d="M1043 289H1150V938H1063" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1023 733V855" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="698" y="870" width="351" height="140" rx="7" fill="#475569" fill-opacity=".07" stroke="#475569" stroke-width="2"/><text x="723" y="924" fill="#475569" font-size="26">Compare the vectors</text><text x="723" y="973" fill="#475569" font-size="26">on held-out inputs.</text><text x="40" y="893" fill="#475569" font-size="25">Identity, composition, linearity</text><text x="40" y="949" fill="#475569" font-size="25">and common-subspace stability</text><text x="40" y="1005" fill="#475569" font-size="25">are separate checks.</text><text x="40" y="1100" fill="#475569" font-size="26">Empirical agreement alone does not prove irreducibility.</text></g></svg>
