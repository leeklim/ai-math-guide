<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1096 899" width="1096" height="899" role="img"><title>equivariant-component-blocks</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1096" height="899" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Equivariant maps preserve the two distinct swap components</text><text x="40" y="111" fill="#475569" font-size="26">In the (u₊,u₋) basis: P=diag(1,−1), A=diag(2,3).</text><rect x="40" y="243" width="240" height="118" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="94" y="313" fill="#2563EB" font-size="29">c₊=2</text><path d="M294 302H407" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="421" y="243" width="284" height="118" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="453" y="313" fill="#2563EB" font-size="29">×2 → 4</text><path d="M719 302H827" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="841" y="243" width="211" height="118" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="865" y="313" fill="#2563EB" font-size="27">u₊ span</text><text x="40" y="195" fill="#2563EB" font-size="27">P keeps this coefficient</text><rect x="40" y="545" width="240" height="118" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="94" y="615" fill="#7C3AED" font-size="29">c₋=1</text><path d="M294 604H407" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="421" y="545" width="284" height="118" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="453" y="615" fill="#7C3AED" font-size="29">×3 → 3</text><path d="M719 604H827" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="841" y="545" width="211" height="118" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="865" y="615" fill="#7C3AED" font-size="27">u₋ span</text><text x="40" y="497" fill="#7C3AED" font-size="27">P reverses this coefficient</text><text x="40" y="775" fill="#059669" font-size="28">x=2u₊+u₋ → Ax=4u₊+3u₋=(7,1)ᵀ</text><text x="40" y="846" fill="#475569" font-size="26">The + and − eigenspaces cannot be mixed by AP=PA.</text></g></svg>
