<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1066 1055" width="1066" height="1055" role="img"><title>homomorphism-composition</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1066" height="1055" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Group multiplication becomes matrix composition</text><text x="40" y="111" fill="#475569" font-size="27">G={e,s}, s²=e ; ρ(e)=I, ρ(s)=P</text><rect x="40" y="198" width="220" height="111" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="72" y="264" fill="#2563EB" font-size="29">s · s = e</text><path d="M273 253H399" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="413" y="198" width="565" height="111" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="450" y="264" fill="#7C3AED" font-size="28">ρ(s)ρ(s)=P²=I=ρ(e)</text><rect x="40" y="468" width="272" height="118" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="84" y="537" fill="#2563EB" font-size="29">(3,1)ᵀ</text><path d="M326 527H382" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="395" y="468" width="272" height="118" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="439" y="537" fill="#7C3AED" font-size="29">(1,3)ᵀ</text><path d="M681 527H737" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="750" y="468" width="272" height="118" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="794" y="537" fill="#059669" font-size="29">(3,1)ᵀ</text><text x="40" y="422" fill="#0F172A" font-size="28">Apply P, then P</text><rect x="40" y="775" width="272" height="118" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="84" y="844" fill="#2563EB" font-size="29">(3,1)ᵀ</text><path d="M326 834H382" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="395" y="775" width="272" height="118" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="439" y="844" fill="#7C3AED" font-size="29">I(3,1)ᵀ</text><path d="M681 834H737" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="750" y="775" width="272" height="118" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="794" y="844" fill="#059669" font-size="29">(3,1)ᵀ</text><text x="40" y="729" fill="#0F172A" font-size="28">Apply ρ(s·s)=I</text><text x="40" y="1006" fill="#475569" font-size="25">The same composition law must hold for every pair of group elements.</text></g></svg>
