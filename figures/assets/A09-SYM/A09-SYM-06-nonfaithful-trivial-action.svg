<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 904" width="1060" height="904" role="img"><title>nonfaithful-trivial-action</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1060" height="904" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">A representation need not distinguish group elements</text><rect x="40" y="174" width="230" height="112" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="140" y="242" fill="#2563EB" font-size="31">e</text><path d="M155 299L329 431" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="394" y="174" width="230" height="112" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="494" y="242" fill="#2563EB" font-size="31">s</text><path d="M509 299L405 431" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="281" y="443" width="295" height="121" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="307" y="517" fill="#7C3AED" font-size="28">ρ(e)=ρ(s)=I</text><path d="M590 504H693" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="707" y="443" width="310" height="121" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="732" y="517" fill="#059669" font-size="28">Any v stays v</text><text x="40" y="697" fill="#475569" font-size="28">ρ(s)ρ(s)=I²=I=ρ(e)</text><text x="40" y="762" fill="#475569" font-size="26">Homomorphism is satisfied; the action is not faithful.</text><text x="40" y="849" fill="#475569" font-size="26">ρ(g) is a linear map. A hidden activation h(x) is a vector.</text></g></svg>
