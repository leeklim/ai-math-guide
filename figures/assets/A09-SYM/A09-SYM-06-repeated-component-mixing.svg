<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 965" width="1150" height="965" role="img"><title>repeated-component-mixing</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1150" height="965" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Repeated copies can mix without changing their action</text><text x="40" y="112" fill="#475569" font-size="25">Two copies of the + component: ρ(g)=I on this two-dimensional space.</text><rect x="40" y="235" width="290" height="121" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="67" y="308" fill="#2563EB" font-size="29">Copy 1: c₁=2</text><rect x="40" y="531" width="290" height="121" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="67" y="604" fill="#2563EB" font-size="29">Copy 2: c₂=3</text><path d="M343 295H775" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M343 591C497 591 516 386 775 331" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M343 615H775" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="789" y="235" width="320" height="121" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="813" y="308" fill="#059669" font-size="28">d₁=c₁+c₂=5</text><rect x="789" y="531" width="320" height="121" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="813" y="604" fill="#059669" font-size="28">d₂=c₂=3</text><text x="40" y="784" fill="#475569" font-size="28">U=[1 1; 0 1] is invertible; UI=IU.</text><text x="40" y="846" fill="#475569" font-size="26">Both coordinate systems still have the same group action.</text><text x="40" y="909" fill="#475569" font-size="25">Each copy is invariant; the whole 2D space is not irreducible.</text></g></svg>
