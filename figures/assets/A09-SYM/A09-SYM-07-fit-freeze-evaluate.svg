<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1215" width="1024" height="1215" role="img"><title>fit-freeze-evaluate</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1024" height="1215" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Fit once, then freeze preprocessing and alignment</text><rect x="40" y="204" width="312" height="164" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="70" y="262" fill="#2563EB" font-size="29">Fit inputs</text><text x="70" y="321" fill="#2563EB" font-size="26">Paired Xfit, Yfit</text><path d="M366 286H464" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="478" y="204" width="502" height="164" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="506" y="262" fill="#7C3AED" font-size="27">Estimate means, scales, ĝ</text><text x="506" y="321" fill="#7C3AED" font-size="26">Only from the fit split</text><path d="M729 382V500" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="478" y="514" width="502" height="143" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="506" y="596" fill="#7C3AED" font-size="27">Freeze the fitted settings</text><rect x="40" y="809" width="312" height="164" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="70" y="867" fill="#2563EB" font-size="29">Held-out inputs</text><text x="70" y="926" fill="#2563EB" font-size="26">Paired Xtest, Ytest</text><path d="M366 891H464" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M729 671V795" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="478" y="809" width="502" height="164" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="506" y="867" fill="#059669" font-size="27">Apply the same settings</text><text x="506" y="926" fill="#059669" font-size="26">Measure Xtest ĝ − Ytest</text><text x="40" y="1094" fill="#DC2626" font-size="28">No test re-fitting</text><text x="40" y="1165" fill="#475569" font-size="25">For different n,d, specify normalization: ||error||F / √(nd).</text></g></svg>
