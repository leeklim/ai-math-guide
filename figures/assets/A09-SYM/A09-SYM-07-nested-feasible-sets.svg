<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1085 1085" width="1085" height="1085" role="img"><title>nested-feasible-sets</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1085" height="1085" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">A larger feasible class can only lower the best residual</text><text x="40" y="112" fill="#475569" font-size="25">Fixed data: X=I₂, Y=2R₄₅ ; same preprocessing and Frobenius norm.</text><rect x="40" y="193" width="1001" height="685" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="70" y="245" fill="#7C3AED" font-size="29">Invertible maps GL(2)</text><text x="70" y="315" fill="#7C3AED" font-size="27">g=2R₄₅ gives residual 0.</text><rect x="156" y="387" width="774" height="412" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="186" y="438" fill="#059669" font-size="29">Orthogonal maps O(2)</text><text x="186" y="501" fill="#059669" font-size="26">g=R₄₅ ; minimum residual √2≈1.414</text><rect x="272" y="569" width="536" height="158" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="296" y="619" fill="#2563EB" font-size="28">Permutation maps {I,P}</text><text x="296" y="681" fill="#2563EB" font-size="26">Minimum: √(10−4√2)≈2.084</text><text x="40" y="966" fill="#475569" font-size="27">Permutation ⊂ Orthogonal ⊂ Invertible</text><text x="40" y="1033" fill="#475569" font-size="25">More permitted coordinate change is not new evidence of model equivalence.</text></g></svg>
