<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1206 1010" width="1206" height="1010" role="img"><title>paired-svd-basis-cancellation</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1206" height="1010" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Rotating paired SVD bases need not change the fitted map</text><text x="40" y="113" fill="#475569" font-size="26">Cross matrix M=2I₂ has repeated positive singular values.</text><text x="40" y="191" fill="#0F172A" font-size="27">Original bases U=V=I</text><rect x="40" y="248" width="319" height="132" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="61" y="326" fill="#2563EB" font-size="26">v=(1,0)ᵀ</text><path d="M373 314H426" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="440" y="248" width="319" height="132" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="461" y="326" fill="#7C3AED" font-size="26">Vᵀv=(1,0)ᵀ</text><path d="M773 314H826" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="840" y="248" width="319" height="132" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="861" y="326" fill="#059669" font-size="26">UVᵀv=(1,0)ᵀ</text><text x="40" y="531" fill="#0F172A" font-size="27">Rotated paired bases U′=V′=R₉₀</text><rect x="40" y="588" width="319" height="132" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="61" y="666" fill="#2563EB" font-size="26">v=(1,0)ᵀ</text><path d="M373 654H426" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="440" y="588" width="319" height="132" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="461" y="666" fill="#7C3AED" font-size="26">V′ᵀv=(0,−1)ᵀ</text><path d="M773 654H826" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="840" y="588" width="319" height="132" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="861" y="666" fill="#059669" font-size="26">U′V′ᵀv=(1,0)ᵀ</text><text x="40" y="882" fill="#475569" font-size="27">M=U(2I)Vᵀ=U′(2I)V′ᵀ ; ĝ=UVᵀ=U′V′ᵀ=I.</text><text x="40" y="955" fill="#475569" font-size="25">A repeated positive SVD basis can vary while its polar product stays unique.</text></g></svg>
