<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370 1150" width="1370" height="1150" role="img"><title>independent-seed-contract</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1370" height="1150" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Independent training is not a reparameterized copy</text><rect x="40" y="182" width="341" height="150" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="70" y="242" fill="#2563EB" font-size="29">Same architecture</text><text x="70" y="298" fill="#2563EB" font-size="27">and training recipe</text><path d="M395 258C460 259 482 269 545 269" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="559" y="199" width="270" height="150" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="606" y="286" fill="#7C3AED" font-size="29">Seed a</text><path d="M843 274H945" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="960" y="199" width="368" height="150" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="985" y="285" fill="#059669" font-size="27">Checkpoint a at T</text><path d="M395 258C460 637 482 647 545 647" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="559" y="577" width="270" height="150" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="606" y="664" fill="#7C3AED" font-size="29">Seed b</text><path d="M843 652H945" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="960" y="577" width="368" height="150" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="985" y="663" fill="#059669" font-size="27">Checkpoint b at T</text><text x="40" y="870" fill="#475569" font-size="28">Same training clock; equal loss/state is not assumed.</text><rect x="40" y="952" width="1288" height="150" rx="7" fill="#475569" fill-opacity=".07" stroke="#475569" stroke-width="2"/><text x="70" y="1015" fill="#475569" font-size="28">Compare activations from paired prompts at the same hook.</text><text x="70" y="1076" fill="#475569" font-size="26">An activation alignment is not automatically a parameter symmetry.</text></g></svg>
