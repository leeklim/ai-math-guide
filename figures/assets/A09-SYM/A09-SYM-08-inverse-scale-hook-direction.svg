<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1257 1290" width="1257" height="1290" role="img"><title>inverse-scale-hook-direction</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1257" height="1290" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Return scaled directions to the raw hook before matching strength</text><text x="40" y="112" fill="#475569" font-size="25">Column preprocessing: z=D⁻¹(h−μ), with positive diagonal D.</text><text x="40" y="211" fill="#0F172A" font-size="29">Seed a</text><rect x="40" y="263" width="542" height="121" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="68" y="338" fill="#2563EB" font-size="30">u⁽ᵃ⁾=(1,0)ᵀ</text><path d="M311 398V512" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="526" width="542" height="160" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="68" y="586" fill="#7C3AED" font-size="28">D=diag(2,1)</text><text x="68" y="645" fill="#7C3AED" font-size="26">Inverse scaling: Δh=Du</text><path d="M311 700V814" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="828" width="542" height="170" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="68" y="894" fill="#059669" font-size="29">Δh=(2,0)ᵀ</text><text x="68" y="954" fill="#059669" font-size="28">Raw norm 2</text><text x="673" y="211" fill="#0F172A" font-size="29">Seed b</text><rect x="673" y="263" width="542" height="121" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="701" y="338" fill="#2563EB" font-size="30">u⁽ᵇ⁾=(0,−1)ᵀ</text><path d="M944 398V512" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="673" y="526" width="542" height="160" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="701" y="586" fill="#7C3AED" font-size="28">D=diag(1,4)</text><text x="701" y="645" fill="#7C3AED" font-size="26">Inverse scaling: Δh=Du</text><path d="M944 700V814" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="673" y="828" width="542" height="170" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="701" y="894" fill="#059669" font-size="29">Δh=(0,−4)ᵀ</text><text x="701" y="954" fill="#059669" font-size="28">Raw norm 4</text><text x="40" y="1110" fill="#475569" font-size="26">Unit norm in scaled coordinates does not mean equal raw-hook norm.</text><text x="40" y="1175" fill="#475569" font-size="26">Normalize raw directions, then use the same raw step δ in both seeds.</text><text x="40" y="1240" fill="#475569" font-size="26">A direction is a displacement: do not add the centering mean μ.</text></g></svg>
