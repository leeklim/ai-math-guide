<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1096 1560" width="1096" height="1560" role="img"><title>one-sided-row-shuffle</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1096" height="1560" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">A null shuffle must break row correspondence</text><text x="40" y="153" fill="#0F172A" font-size="28">Correct paired fit rows</text><rect x="40" y="211" width="355" height="79" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="72" y="261" fill="#2563EB" font-size="28">A : [1,3]</text><path d="M411 250H680" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="695" y="211" width="355" height="79" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="727" y="261" fill="#D97706" font-size="28">A : [3,1]</text><rect x="40" y="311" width="355" height="79" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="72" y="361" fill="#2563EB" font-size="28">B : [2,5]</text><path d="M411 350H680" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="695" y="311" width="355" height="79" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="727" y="361" fill="#D97706" font-size="28">B : [5,2]</text><rect x="40" y="411" width="355" height="79" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="72" y="461" fill="#2563EB" font-size="28">C : [4,1]</text><path d="M411 450H680" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="695" y="411" width="355" height="79" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="727" y="461" fill="#D97706" font-size="28">C : [1,4]</text><text x="40" y="569" fill="#0F172A" font-size="28">Both matrices shuffled identically</text><rect x="40" y="627" width="355" height="79" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="72" y="677" fill="#2563EB" font-size="28">B : [2,5]</text><path d="M411 666H680" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="695" y="627" width="355" height="79" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="727" y="677" fill="#D97706" font-size="28">B : [5,2]</text><rect x="40" y="727" width="355" height="79" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="72" y="777" fill="#2563EB" font-size="28">C : [4,1]</text><path d="M411 766H680" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="695" y="727" width="355" height="79" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="727" y="777" fill="#D97706" font-size="28">C : [1,4]</text><rect x="40" y="827" width="355" height="79" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="72" y="877" fill="#2563EB" font-size="28">A : [1,3]</text><path d="M411 866H680" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="695" y="827" width="355" height="79" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="727" y="877" fill="#D97706" font-size="28">A : [3,1]</text><text x="40" y="985" fill="#DC2626" font-size="28">Only Y fit rows are shuffled</text><rect x="40" y="1043" width="355" height="79" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="72" y="1093" fill="#2563EB" font-size="28">A : [1,3]</text><path d="M411 1082H680" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="695" y="1043" width="355" height="79" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="727" y="1093" fill="#D97706" font-size="28">B : [5,2]</text><rect x="40" y="1143" width="355" height="79" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="72" y="1193" fill="#2563EB" font-size="28">B : [2,5]</text><path d="M411 1182H680" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="695" y="1143" width="355" height="79" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="727" y="1193" fill="#D97706" font-size="28">C : [1,4]</text><rect x="40" y="1243" width="355" height="79" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="72" y="1293" fill="#2563EB" font-size="28">C : [4,1]</text><path d="M411 1282H680" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="695" y="1243" width="355" height="79" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="727" y="1293" fill="#D97706" font-size="28">A : [3,1]</text><text x="40" y="1445" fill="#475569" font-size="25">Joint reordering keeps each pair. One-sided shuffling breaks it.</text><text x="40" y="1508" fill="#475569" font-size="25">Refit the null on fit rows; keep held-out evaluation pairs correct.</text></g></svg>
