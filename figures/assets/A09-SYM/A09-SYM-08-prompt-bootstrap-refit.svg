<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1250" width="1420" height="1250" role="img"><title>prompt-bootstrap-refit</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1420" height="1250" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Bootstrap refits the map; evaluation inputs stay fixed</text><rect x="40" y="183" width="350" height="149" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="70" y="246" fill="#2563EB" font-size="29">Fit prompts</text><text x="70" y="305" fill="#2563EB" font-size="28">P1, P2, P3</text><path d="M404 258C470 285 512 285 557 285" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="571" y="210" width="349" height="149" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="598" y="267" fill="#2563EB" font-size="27">Resampled prompts</text><text x="598" y="326" fill="#2563EB" font-size="28">P1, P1, P3</text><path d="M934 285H1021" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1035" y="210" width="233" height="149" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="1062" y="298" fill="#7C3AED" font-size="28">Refit ĝ₁</text><path d="M404 258C470 633 512 633 557 633" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="571" y="558" width="349" height="149" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="598" y="615" fill="#2563EB" font-size="27">Resampled prompts</text><text x="598" y="674" fill="#2563EB" font-size="28">P2, P3, P3</text><path d="M934 633H1021" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1035" y="558" width="233" height="149" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="1062" y="646" fill="#7C3AED" font-size="28">Refit ĝ₂</text><path d="M1282 285H1370V925H1165" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1127 721V810" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="734" y="826" width="417" height="185" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="760" y="891" fill="#059669" font-size="27">Same held-out prompts</text><text x="760" y="957" fill="#059669" font-size="26">Compare maps / residuals</text><text x="40" y="1130" fill="#475569" font-size="26">A prompt is resampled together with all its token rows.</text><text x="40" y="1200" fill="#475569" font-size="25">One seed pair's bootstrap is not an independent-seed replication.</text></g></svg>
