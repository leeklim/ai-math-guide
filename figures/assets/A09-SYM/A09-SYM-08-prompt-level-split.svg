<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1280" width="1180" height="1280" role="img"><title>prompt-level-split</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1180" height="1280" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Keep each prompt's related tokens in one split</text><rect x="40" y="199" width="406" height="151" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="68" y="254" fill="#2563EB" font-size="29">Prompt A</text><text x="68" y="311" fill="#2563EB" font-size="28">A₁  A₂  A₃</text><rect x="40" y="406" width="406" height="151" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="68" y="461" fill="#2563EB" font-size="29">Prompt B</text><text x="68" y="518" fill="#2563EB" font-size="28">B₁  B₂  B₃</text><rect x="731" y="199" width="406" height="151" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="759" y="254" fill="#059669" font-size="29">Prompt C</text><text x="759" y="311" fill="#059669" font-size="28">C₁  C₂  C₃</text><rect x="731" y="406" width="406" height="151" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="759" y="461" fill="#059669" font-size="29">Prompt D</text><text x="759" y="518" fill="#059669" font-size="28">D₁  D₂  D₃</text><text x="40" y="148" fill="#2563EB" font-size="29">Fit split</text><text x="731" y="148" fill="#059669" font-size="29">Held-out split</text><text x="40" y="738" fill="#DC2626" font-size="28">A token-level split can break this boundary</text><rect x="40" y="795" width="1097" height="338" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="70" y="853" fill="#DC2626" font-size="28">One prompt A</text><rect x="87" y="905" width="273" height="89" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="199" y="960" fill="#2563EB" font-size="30">A₁</text><path d="M223 1008V1060" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><text x="153" y="1108" fill="#DC2626" font-size="27">Fit</text><rect x="431" y="905" width="273" height="89" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="543" y="960" fill="#2563EB" font-size="30">A₂</text><path d="M567 1008V1060" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><text x="497" y="1108" fill="#DC2626" font-size="27">Held-out</text><rect x="775" y="905" width="273" height="89" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="887" y="960" fill="#2563EB" font-size="30">A₃</text><path d="M911 1008V1060" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><text x="841" y="1108" fill="#DC2626" font-size="27">Fit</text><text x="40" y="1230" fill="#475569" font-size="27">Shared prompt context leaks across the split.</text></g></svg>
