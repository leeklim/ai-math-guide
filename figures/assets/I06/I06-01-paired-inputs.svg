<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 815" width="520" height="815" role="img"><title>Pair first, then analyze differences</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="815" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" font-size="28">Pair inputs before pooling</text><rect x="40" y="107" width="440" height="98" rx="8" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="68" y="149" fill="#2563EB" font-size="28">Original xᵢ</text><text x="68" y="187" fill="#059669" font-size="26">Behavior b(xᵢ)</text><rect x="40" y="277" width="440" height="98" rx="8" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="68" y="319" fill="#2563EB" font-size="28">Minimal control x′ᵢ</text><text x="68" y="357" fill="#059669" font-size="26">Behavior b(x′ᵢ)</text><path d="M460 227V251" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/><path d="M260 401V450" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="476" width="440" height="107" rx="8" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="68" y="519" fill="#D97706" font-size="28">One paired difference</text><text x="68" y="560" fill="#D97706" font-size="28">dᵢ = b(xᵢ) − b(x′ᵢ)</text><path d="M260 609V656" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><text x="40" y="707" fill="#475569" font-size="25">Analyze differences across pairs.</text><text x="40" y="752" fill="#2563EB" font-size="26">Keep the input-pair unit.</text></g></svg>
