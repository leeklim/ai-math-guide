<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" role="img"><title>Differentiate the downstream target with respect to a leaf</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="640" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Keep values; cut the upstream graph</text><rect x="40" y="138" width="260" height="116" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="184" fill="#2563EB" font-size="28">Upstream h</text><text x="65" y="223" fill="#2563EB" font-size="23">Original computation</text><path d="M326 196H373" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="400" y="138" width="280" height="116" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="425" y="184" fill="#7C3AED" font-size="25">Leaf h̃ = detach(h)</text><text x="425" y="223" fill="#7C3AED" font-size="25">Same values</text><path d="M706 196H753" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="780" y="138" width="220" height="116" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="806" y="184" fill="#059669" font-size="28">Target M</text><text x="806" y="223" fill="#059669" font-size="25">Downstream</text><path d="M888 280V383H566V280" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><text x="601" y="431" fill="#D97706" font-size="28">Gradient ∂M/∂h̃</text><path d="M344 184L368 208M344 208L368 184" stroke="#DC2626" stroke-width="3"/><text x="40" y="503" fill="#DC2626" font-size="28">Upstream graph is cut.</text><text x="40" y="566" fill="#475569" font-size="26">The leaf must be used in the downstream forward pass.</text></g></svg>
