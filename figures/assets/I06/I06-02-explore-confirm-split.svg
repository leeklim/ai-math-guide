<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 730" width="520" height="730" role="img"><title>Choose on exploration and evaluate on confirmation</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="730" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Choose, freeze, then confirm</text><rect x="40" y="110" width="440" height="100" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="152" fill="#2563EB" font-size="28">Exploration inputs</text><text x="65" y="189" fill="#2563EB" font-size="25">Compare candidate positions</text><path d="M260 236V276" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="302" width="440" height="118" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="65" y="348" fill="#D97706" font-size="26">Freeze layer + component</text><text x="65" y="390" fill="#D97706" font-size="25">Keep the token rule fixed.</text><path d="M260 446V486" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="512" width="440" height="122" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="559" fill="#059669" font-size="25">Separate confirmation inputs</text><text x="65" y="600" fill="#059669" font-size="25">Evaluate the frozen selection.</text><text x="40" y="686" fill="#DC2626" font-size="26">No test-to-selection feedback.</text></g></svg>
