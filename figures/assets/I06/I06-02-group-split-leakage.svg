<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 650" width="1040" height="650" role="img"><title>Split groups rather than related rows</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="650" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Keep related inputs in one split</text><text x="40" y="124" fill="#DC2626" font-size="26">Row split: shared source</text><text x="552" y="124" fill="#059669" font-size="26">Group split: new source</text><rect x="40" y="164" width="440" height="110" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="210" fill="#2563EB" font-size="25">Source A: paraphrases A₁, A₂</text><path d="M160 300V350" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><path d="M360 300V350" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="376" width="190" height="108" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><rect x="290" y="376" width="190" height="108" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="62" y="437" fill="#DC2626" font-size="25">Train: A₁</text><text x="310" y="437" fill="#DC2626" font-size="25">Test: A₂</text><rect x="552" y="164" width="448" height="110" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="578" y="210" fill="#2563EB" font-size="25">Source A: paraphrases A₁, A₂</text><path d="M776 300V350" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="552" y="376" width="448" height="108" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="578" y="438" fill="#059669" font-size="26">Train: A₁ and A₂ together</text><rect x="552" y="533" width="448" height="77" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="578" y="583" fill="#059669" font-size="26">Test: separate source B</text><text x="40" y="569" fill="#DC2626" font-size="26">Same source on both sides.</text></g></svg>
