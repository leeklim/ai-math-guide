<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 650" width="520" height="650" role="img"><title>A pair can contain several differences</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="650" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Paired does not mean matched</text><rect x="40" y="115" width="440" height="170" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="166" fill="#2563EB" font-size="27">The <tspan fill="#D97706" text-decoration="underline">animal</tspan> near the river</text><text x="65" y="224" fill="#2563EB" font-size="28">is <tspan fill="#D97706" text-decoration="underline">a salmon.</tspan></text><rect x="40" y="365" width="440" height="170" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="418" fill="#2563EB" font-size="27">The <tspan fill="#D97706" text-decoration="underline">city</tspan> near the river</text><text x="65" y="476" fill="#2563EB" font-size="28">is <tspan fill="#D97706" text-decoration="underline">Berlin.</tspan></text><text x="40" y="603" fill="#D97706" font-size="26">Marked spans change together.</text></g></svg>
