<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 630" width="1040" height="630" role="img"><title>Selected slice versus all layer-token slices</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="630" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Store the slice that answers the question</text><rect x="40" y="125" width="400" height="210" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="66" y="173" fill="#2563EB" font-size="28">Selected location</text><rect x="70" y="200" width="330" height="8" fill="#2563EB" fill-opacity=".2"/><rect x="70" y="213" width="330" height="8" fill="#2563EB" fill-opacity=".2"/><rect x="70" y="226" width="330" height="8" fill="#2563EB" fill-opacity=".2"/><rect x="70" y="239" width="330" height="8" fill="#2563EB" fill-opacity=".2"/><rect x="70" y="252" width="330" height="8" fill="#2563EB" fill-opacity=".2"/><rect x="70" y="265" width="330" height="8" fill="#2563EB" fill-opacity=".2"/><rect x="70" y="278" width="330" height="8" fill="#2563EB" fill-opacity=".2"/><rect x="70" y="291" width="330" height="8" fill="#2563EB" fill-opacity=".2"/><text x="40" y="396" fill="#2563EB" font-size="25">8 input rows × 768 coordinates</text><text x="40" y="443" fill="#D97706" font-size="25">4 × 8 × 768 = 24,576 bytes</text><rect x="600" y="125" width="340" height="160" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><rect x="610" y="135" width="340" height="160" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><rect x="620" y="145" width="340" height="160" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><rect x="630" y="155" width="340" height="160" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><rect x="640" y="165" width="340" height="160" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><rect x="650" y="175" width="340" height="160" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="600" y="381" fill="#7C3AED" font-size="28">All locations</text><text x="600" y="428" fill="#7C3AED" font-size="26">12 layers × 128 tokens</text><text x="600" y="472" fill="#7C3AED" font-size="25">1,536 selected-size slices</text><text x="40" y="573" fill="#475569" font-size="26">Float32 values only; file metadata is separate.</text></g></svg>
