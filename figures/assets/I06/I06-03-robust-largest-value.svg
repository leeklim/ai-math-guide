<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 695" width="520" height="695" role="img"><title>Median and MAD under a moved largest value</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="695" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Median and MAD can stay fixed</text><text x="40" y="115" fill="#475569" font-size="25">Move only the largest norm.</text><path d="M60 275H480" stroke="#CBD5E1" stroke-width="2"/><circle cx="90" cy="275" r="9" fill="#2563EB"/><text x="81" y="329" fill="#2563EB" font-size="28">1</text><circle cx="240" cy="275" r="9" fill="#059669"/><text x="231" y="329" fill="#059669" font-size="28">3</text><circle cx="390" cy="275" r="9" fill="#2563EB"/><text x="381" y="329" fill="#2563EB" font-size="28">5</text><circle cx="465" cy="275" r="9" fill="none" stroke="#D97706" stroke-width="3"/><path d="M396 205H459" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><text x="391" y="159" fill="#D97706" font-size="26">R ≥ 5</text><text x="40" y="419" fill="#059669" font-size="28">Median = 3</text><text x="40" y="467" fill="#7C3AED" font-size="27">Deviations: 2, 0, R−3</text><text x="40" y="515" fill="#059669" font-size="28">MAD = 2</text><text x="40" y="581" fill="#D97706" font-size="27">Mean = (1+3+R)/3</text><text x="40" y="648" fill="#475569" font-size="25">Inspect provenance before removal.</text></g></svg>
