<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 785" width="1040" height="785" role="img"><title>Analysis coordinates and model rewiring are different</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="785" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Rotate the recorded data or change the model?</text><text x="40" y="127" fill="#D97706" font-size="26">Analysis-only rotation</text><text x="552" y="127" fill="#DC2626" font-size="26">Rotation inside the model</text><rect x="40" y="172" width="440" height="110" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="65" y="220" fill="#7C3AED" font-size="28">Model activation h</text><text x="65" y="258" fill="#7C3AED" font-size="25">Original forward path</text><path d="M260 308V350" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="376" width="440" height="105" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="435" fill="#059669" font-size="28">Original output f(x)</text><rect x="40" y="548" width="440" height="130" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="65" y="599" fill="#D97706" font-size="26">Analyze hQ separately</text><text x="65" y="645" fill="#D97706" font-size="26">No model change</text><path d="M480 227H510V610H480" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="552" y="172" width="448" height="110" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="578" y="224" fill="#7C3AED" font-size="28">Activation h</text><path d="M776 308V350" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="552" y="376" width="448" height="105" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="578" y="435" fill="#DC2626" font-size="28">Insert Q: hQ</text><path d="M776 507V549" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="552" y="575" width="448" height="105" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="578" y="621" fill="#DC2626" font-size="26">Downstream computation</text><text x="578" y="660" fill="#DC2626" font-size="25">Equal output not guaranteed</text><text x="40" y="744" fill="#475569" font-size="26">Geometric invariance is not a model-equivalence proof.</text></g></svg>
