<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1020" width="520" height="1020" role="img"><title>Ranked examples generate a testable hypothesis</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1020" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Top examples suggest a hypothesis</text><rect x="40" y="108" width="440" height="130" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="65" y="149" fill="#D97706" font-size="28">High aⱼ examples</text><text x="65" y="199" fill="#D97706" font-size="28">Paris · Berlin · …</text><path d="M260 264V306" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="332" width="440" height="98" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="65" y="390" fill="#D97706" font-size="26">Hypothesis: city response?</text><path d="M260 456V496" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="522" width="440" height="98" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="580" fill="#059669" font-size="28">New city positives</text><rect x="40" y="658" width="440" height="98" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="716" fill="#059669" font-size="26">Non-city hard negatives</text><rect x="40" y="794" width="440" height="98" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="852" fill="#059669" font-size="28">Counterexamples</text><text x="40" y="975" fill="#475569" font-size="25">Measure beyond the ranked subset.</text></g></svg>
