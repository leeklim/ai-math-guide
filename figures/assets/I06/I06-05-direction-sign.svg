<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 650" width="520" height="650" role="img"><title>A direction and its negative describe the same principal axis</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="650" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Sign flips preserve the same axis</text><path d="M150 145V470" stroke="#CBD5E1" stroke-opacity=".5"/><path d="M220 145V470" stroke="#CBD5E1" stroke-opacity=".5"/><path d="M290 145V470" stroke="#CBD5E1" stroke-opacity=".5"/><path d="M360 145V470" stroke="#CBD5E1" stroke-opacity=".5"/><path d="M430 145V470" stroke="#CBD5E1" stroke-opacity=".5"/><path d="M60 190H460" stroke="#CBD5E1" stroke-opacity=".5"/><path d="M60 260H460" stroke="#CBD5E1" stroke-opacity=".5"/><path d="M60 330H460" stroke="#CBD5E1" stroke-opacity=".5"/><path d="M60 400H460" stroke="#CBD5E1" stroke-opacity=".5"/><path d="M60 470H460" stroke="#CBD5E1" stroke-opacity=".5"/><path d="M60 330H460M260 140V470" stroke="#CBD5E1" stroke-width="2"/><path d="M260 330L380 240" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M260 330L140 420" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="392" y="211" fill="#2563EB" font-size="30">v</text><text x="80" y="452" fill="#7C3AED" font-size="30">−v</text><circle cx="260" cy="330" r="5" fill="#475569"/><text x="40" y="546" fill="#059669" font-size="27">One unchanged line: span{v}</text><text x="40" y="601" fill="#475569" font-size="26">Scores change z → −z.</text></g></svg>
