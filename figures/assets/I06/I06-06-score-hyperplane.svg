<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" width="520" height="680" role="img"><title>score-hyperplane</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="680" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Linear score boundary</text><path d="M70 150H450M70 140V460" stroke="#CBD5E1" stroke-width="1"/><path d="M70 200H450M130 140V460" stroke="#CBD5E1" stroke-width="1"/><path d="M70 250H450M190 140V460" stroke="#CBD5E1" stroke-width="1"/><path d="M70 300H450M250 140V460" stroke="#CBD5E1" stroke-width="1"/><path d="M70 350H450M310 140V460" stroke="#CBD5E1" stroke-width="1"/><path d="M70 400H450M370 140V460" stroke="#CBD5E1" stroke-width="1"/><path d="M70 450H450M430 140V460" stroke="#CBD5E1" stroke-width="1"/><path d="M100 420L420 180L420 420Z" fill="#059669" fill-opacity=".08"/><path d="M100 420L420 180L100 180Z" fill="#7C3AED" fill-opacity=".08"/><path d="M100 420L420 180" stroke="#0F172A" stroke-width="3"/><path d="M260 300L347 416" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><text x="365" y="432" fill="#059669" font-size="28">w</text><text x="330" y="300" fill="#059669" font-size="25">score &gt; 0</text><text x="98" y="240" fill="#7C3AED" font-size="25">score &lt; 0</text><text x="60" y="510" fill="#0F172A" font-size="28">wᵀh + b = 0</text><text x="40" y="575" fill="#475569" font-size="25">The normal w crosses the boundary.</text><text x="40" y="624" fill="#475569" font-size="25">sigmoid(score) = 0.5 here.</text></g></svg>
