<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 900" width="520" height="900" role="img"><title>train-only-preprocessing</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="900" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Train-only preprocessing</text><rect x="40" y="110" width="430" height="88" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="90" y="164" fill="#2563EB" font-size="28">Train groups</text><path d="M255 198V244" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="247" width="430" height="90" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="69" y="302" fill="#7C3AED" font-size="28">Fit mean μ and scale σ</text><path d="M255 337V390" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="393" width="430" height="80" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="81" y="442" fill="#D97706" font-size="28">Freeze preprocessing</text><path d="M255 473V537" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="540" width="430" height="245" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="91" y="593" fill="#7C3AED" font-size="28">Apply the same μ, σ</text><text x="88" y="650" fill="#0F172A" font-size="28">Train  →  fit probe</text><text x="65" y="707" fill="#0F172A" font-size="25">Valid  →  select λ / layer</text><text x="80" y="764" fill="#0F172A" font-size="25">Test   →  final metric</text><text x="40" y="843" fill="#475569" font-size="25">Test never fits these parameters.</text></g></svg>
