<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 845" width="520" height="845" role="img"><title>repeated-control-contract</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="845" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Repeated control procedure</text><rect x="40" y="108" width="430" height="80" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="60" y="159" fill="#2563EB" font-size="25">Fixed X, split and protocol</text><path d="M255 188V241" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="244" width="430" height="234" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="65" y="299" fill="#7C3AED" font-size="25">Permutation 1 → A_control¹</text><text x="65" y="359" fill="#7C3AED" font-size="25">Permutation 2 → A_control²</text><text x="245" y="419" fill="#475569" font-size="28">…</text><text x="65" y="464" fill="#7C3AED" font-size="25">Permutation r → A_controlʳ</text><path d="M255 478V537" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="540" width="430" height="125" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="103" y="589" fill="#D97706" font-size="28">Control distribution</text><text x="52" y="637" fill="#D97706" font-size="25">Place task score alongside it.</text><text x="40" y="736" fill="#475569" font-size="25">Do not merge different shuffle units.</text><text x="40" y="791" fill="#475569" font-size="25">No measured distribution shown here.</text></g></svg>
