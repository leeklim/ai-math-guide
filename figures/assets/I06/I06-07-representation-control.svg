<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" width="520" height="760" role="img"><title>representation-control</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="760" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Change the information source</text><rect x="40" y="115" width="440" height="220" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="76" y="166" fill="#2563EB" font-size="28">Activation</text><text x="76" y="216" fill="#0F172A" font-size="28">Random features</text><text x="76" y="266" fill="#0F172A" font-size="25">Length / token identity</text><text x="76" y="316" fill="#0F172A" font-size="25">Untrained representation</text><path d="M260 335V397" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="80" y="400" width="360" height="88" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="109" y="453" fill="#7C3AED" font-size="28">Same probe protocol</text><path d="M260 488V545" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="80" y="548" width="360" height="85" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="105" y="599" fill="#D97706" font-size="28">Same held-out metric</text><text x="40" y="706" fill="#475569" font-size="25">Compare sources, not new model uses.</text></g></svg>
