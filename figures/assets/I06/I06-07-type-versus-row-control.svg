<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 840" width="1040" height="840" role="img"><title>type-versus-row-control</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="840" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Type mapping differs from row noise</text><text x="40" y="125" fill="#0F172A" font-size="25">Repeated words</text><rect x="40" y="167" width="250" height="76" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="93" y="214" fill="#2563EB" font-size="28">apple</text><text x="409" y="214" fill="#059669" font-size="28">1</text><text x="799" y="214" fill="#7C3AED" font-size="28">1</text><rect x="40" y="277" width="250" height="76" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="93" y="324" fill="#2563EB" font-size="28">pear</text><text x="409" y="324" fill="#059669" font-size="28">0</text><text x="799" y="324" fill="#7C3AED" font-size="28">0</text><rect x="40" y="387" width="250" height="76" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="93" y="434" fill="#2563EB" font-size="28">apple</text><text x="409" y="434" fill="#059669" font-size="28">1</text><text x="799" y="434" fill="#7C3AED" font-size="28">0</text><rect x="40" y="497" width="250" height="76" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="93" y="544" fill="#2563EB" font-size="28">pear</text><text x="409" y="544" fill="#059669" font-size="28">0</text><text x="799" y="544" fill="#7C3AED" font-size="28">1</text><text x="343" y="125" fill="#059669" font-size="27">Fixed type label</text><text x="703" y="125" fill="#7C3AED" font-size="27">Per-row label</text><path d="M389 195H362V437H389M779 195H752V437H779" stroke="#CBD5E1" fill="none" stroke-width="2"/><text x="340" y="665" fill="#059669" font-size="27">apple → same 1</text><text x="696" y="665" fill="#7C3AED" font-size="27">apple → 1 and 0</text><text x="40" y="738" fill="#475569" font-size="25">Train/test type overlap can carry memorized mappings.</text><text x="40" y="789" fill="#475569" font-size="25">Row noise has no consistent type-to-label rule.</text></g></svg>
