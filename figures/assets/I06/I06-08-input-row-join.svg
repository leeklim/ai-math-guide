<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 805" width="1040" height="805" role="img"><title>input-row-join</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="805" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Join on input ID before comparison</text><text x="40" y="119" fill="#2563EB" font-size="28">X rows</text><text x="566" y="119" fill="#7C3AED" font-size="28">Y rows: shuffled</text><rect x="40" y="175" width="220" height="80" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="126" y="225" fill="#2563EB" font-size="28">A</text><rect x="600" y="175" width="220" height="80" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="686" y="225" fill="#7C3AED" font-size="28">C</text><rect x="40" y="300" width="220" height="80" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="126" y="350" fill="#2563EB" font-size="28">B</text><rect x="600" y="300" width="220" height="80" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="686" y="350" fill="#7C3AED" font-size="28">A</text><rect x="40" y="425" width="220" height="80" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="126" y="475" fill="#2563EB" font-size="28">C</text><rect x="600" y="425" width="220" height="80" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="686" y="475" fill="#7C3AED" font-size="28">B</text><path d="M260 215H350V340H590" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><path d="M260 340H315V520H540V465H590" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><path d="M260 465H410V215H590" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="40" y="629" fill="#0F172A" font-size="28">Match IDs, not current row indices.</text><text x="40" y="697" fill="#475569" font-size="25">Then center each matrix's columns.</text><text x="40" y="752" fill="#475569" font-size="25">Also align the same token-selection rule.</text></g></svg>
