<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 670" width="520" height="670" role="img"><title>pair-dependence</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="670" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">RSA pairs share inputs</text><rect x="70" y="160" width="140" height="80" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="127" y="209" fill="#2563EB" font-size="28">A</text><rect x="300" y="105" width="140" height="80" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="357" y="154" fill="#7C3AED" font-size="28">B</text><rect x="300" y="315" width="140" height="80" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="357" y="364" fill="#059669" font-size="28">C</text><path d="M210 190L289 151" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><path d="M210 220L289 347" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><text x="245" y="126" fill="#D97706" font-size="25">AB</text><text x="185" y="310" fill="#D97706" font-size="25">AC</text><text x="40" y="475" fill="#475569" font-size="25">Both distances reuse input A.</text><text x="40" y="540" fill="#0F172A" font-size="25">Resample inputs, not isolated pairs.</text><text x="40" y="605" fill="#475569" font-size="25">8 inputs → 28 pairs, not 28 samples.</text></g></svg>
