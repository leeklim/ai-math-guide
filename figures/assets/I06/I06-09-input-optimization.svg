<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 845" width="520" height="845" role="img"><title>input-optimization</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="845" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Optimize x, freeze weights</text><rect x="80" y="110" width="360" height="85" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="141" y="164" fill="#2563EB" font-size="28">Change input x</text><path d="M260 195V255" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="258" width="440" height="215" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="79" y="315" fill="#7C3AED" font-size="25">Model weights stay fixed</text><text x="83" y="373" fill="#059669" font-size="25">Increase feature score</text><text x="77" y="432" fill="#DC2626" font-size="25">Pay input penalty λR(x)</text><path d="M260 473V534" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="537" width="440" height="126" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="62" y="593" fill="#D97706" font-size="25">Gradient ascent updates x</text><text x="80" y="637" fill="#D97706" font-size="28">∇score − λ∇penalty</text><text x="40" y="730" fill="#475569" font-size="25">A soft penalty permits violations.</text><text x="40" y="785" fill="#475569" font-size="25">Hard bounds need an allowed domain.</text></g></svg>
