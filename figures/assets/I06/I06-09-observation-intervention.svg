<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 855" width="520" height="855" role="img"><title>observation-intervention</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="855" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Observation ≠ intervention</text><rect x="40" y="112" width="440" height="82" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="55" y="164" fill="#2563EB" font-size="25">Observe top / bottom inputs</text><path d="M260 194V252" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="255" width="440" height="82" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="48" y="305" fill="#D97706" font-size="24">Hypothesis of reaction conditions</text><path d="M40 395H480" stroke="#CBD5E1" stroke-width="2"/><rect x="40" y="446" width="440" height="82" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="59" y="496" fill="#DC2626" font-size="25">Remove or amplify the feature</text><path d="M260 528V586" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="589" width="440" height="82" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="58" y="639" fill="#059669" font-size="25">Controlled behavior comparison</text><text x="40" y="745" fill="#475569" font-size="24">The first route does not prove</text><text x="40" y="795" fill="#475569" font-size="24">the intervention result.</text></g></svg>
