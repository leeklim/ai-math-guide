<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" width="520" height="760" role="img"><title>token-score-aggregation</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="760" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Token score aggregation</text><rect x="40" y="112" width="430" height="242" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="83" y="166" fill="#2563EB" font-size="28">Token 1 → score s₁</text><text x="83" y="232" fill="#2563EB" font-size="28">Token 2 → score s₂</text><text x="83" y="298" fill="#2563EB" font-size="28">Token 3 → score s₃</text><path d="M255 354V410" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="413" width="430" height="210" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="101" y="470" fill="#7C3AED" font-size="28">max(s₁,s₂,s₃)</text><text x="92" y="533" fill="#7C3AED" font-size="28">mean(s₁,s₂,s₃)</text><text x="64" y="594" fill="#7C3AED" font-size="25">s_t at selected token t</text><text x="40" y="700" fill="#475569" font-size="25">Choose one rule before ranking.</text></g></svg>
