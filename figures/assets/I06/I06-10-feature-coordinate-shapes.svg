<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 735" width="520" height="735" role="img"><title>feature-coordinate-shapes</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="735" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Feature ≠ neuron coordinate</text><rect x="40" y="110" width="430" height="90" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="61" y="165" fill="#2563EB" font-size="25">z = (1,0,0.8): 3 features</text><path d="M255 200V255" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="258" width="430" height="125" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="50" y="312" fill="#7C3AED" font-size="24">D: 2 coordinates × 3 directions</text><text x="124" y="356" fill="#7C3AED" font-size="28">a = d₁ + 0.8 d₃</text><path d="M255 383V444" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="447" width="430" height="95" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="111" y="507" fill="#059669" font-size="28">a ≈ (0.6,−0.693)</text><text x="40" y="617" fill="#475569" font-size="24">Two features, two nonzero coordinates.</text><text x="40" y="672" fill="#475569" font-size="25">Feature count ≠ neuron dimension.</text></g></svg>
