<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Features represented in orthogonal coordinates and in superposition</title>
  <desc id="desc">The left panel shows two orthogonal feature directions assigned to axes, while the right panel shows four non-orthogonal feature directions sharing the same two-dimensional activation space.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
  <rect width="960" height="540" rx="18" fill="#F8FAFC"/>
  <text x="480" y="48" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Feature directions need not equal neuron axes</text>
  <rect x="55" y="95" width="390" height="355" rx="18" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <rect x="515" y="95" width="390" height="355" rx="18" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
  <text x="250" y="135" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1E3A8A">Axis-aligned features</text>
  <text x="710" y="135" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#9A3412">Superposition</text>
  <g stroke="#94A3B8" stroke-width="2"><path d="M110 375H395M250 420V175"/><path d="M570 375H855M710 420V175"/></g>
  <g fill="none" stroke-width="5" marker-end="url(#arrow)">
    <path d="M250 375L365 375" stroke="#2563EB"/><path d="M250 375L250 225" stroke="#059669"/>
    <path d="M710 375L835 340" stroke="#2563EB"/><path d="M710 375L770 230" stroke="#059669"/><path d="M710 375L620 255" stroke="#D97706"/><path d="M710 375L600 395" stroke="#7C3AED"/>
  </g>
  <g font-family="sans-serif" font-size="17" font-weight="600"><text x="350" y="365" fill="#2563EB">f₁</text><text x="262" y="220" fill="#059669">f₂</text><text x="823" y="329" fill="#2563EB">f₁</text><text x="775" y="225" fill="#059669">f₂</text><text x="605" y="245" fill="#D97706">f₃</text><text x="585" y="420" fill="#7C3AED">f₄</text></g>
  <text x="250" y="475" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">2 directions in 2 dimensions</text>
  <text x="710" y="475" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#334155">4 sparse directions share 2 dimensions</text>
  <text x="480" y="515" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Non-orthogonal directions interfere when active together; sparsity reduces how often that conflict occurs.</text>
</svg>
