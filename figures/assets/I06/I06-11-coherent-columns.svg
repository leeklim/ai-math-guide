<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 745" width="520" height="745" role="img"><title>coherent-columns</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="745" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Similar directions blur support</text><path d="M70 150H450M70 130V435" stroke="#CBD5E1"/><path d="M70 200H450M140 130V435" stroke="#CBD5E1"/><path d="M70 250H450M210 130V435" stroke="#CBD5E1"/><path d="M70 300H450M280 130V435" stroke="#CBD5E1"/><path d="M70 350H450M350 130V435" stroke="#CBD5E1"/><path d="M70 400H450M420 130V435" stroke="#CBD5E1"/><path d="M110 410L400 205" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M110 410L421 232" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="323" y="161" fill="#2563EB" font-size="28">d₁</text><text x="397" y="281" fill="#7C3AED" font-size="28">d₂</text><text x="95" y="498" fill="#D97706" font-size="28">|d₁ᵀd₂| near 1</text><text x="40" y="565" fill="#475569" font-size="24">Near-parallel directions may</text><text x="40" y="615" fill="#475569" font-size="24">give similar reconstructions.</text><text x="40" y="685" fill="#475569" font-size="24">Low error ≠ recovered support.</text></g></svg>
