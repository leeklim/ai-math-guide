<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 850" width="1040" height="850" role="img"><title>dictionary-scale-cost</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="850" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Scale changes cost without changing reconstruction</text><text x="40" y="117" fill="#2563EB" font-size="28">Original</text><text x="560" y="117" fill="#7C3AED" font-size="28">Rescaled</text><path d="M60 180H430M60 165V420" stroke="#CBD5E1"/><path d="M60 225H430M130 165V420" stroke="#CBD5E1"/><path d="M60 270H430M200 165V420" stroke="#CBD5E1"/><path d="M60 315H430M270 165V420" stroke="#CBD5E1"/><path d="M60 360H430M340 165V420" stroke="#CBD5E1"/><path d="M60 405H430M410 165V420" stroke="#CBD5E1"/><path d="M580 180H950M580 165V420" stroke="#CBD5E1"/><path d="M580 225H950M650 165V420" stroke="#CBD5E1"/><path d="M580 270H950M720 165V420" stroke="#CBD5E1"/><path d="M580 315H950M790 165V420" stroke="#CBD5E1"/><path d="M580 360H950M860 165V420" stroke="#CBD5E1"/><path d="M580 405H950M930 165V420" stroke="#CBD5E1"/><path d="M85 350H215" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><text x="132" y="316" fill="#2563EB" font-size="28">d_j</text><path d="M605 350H865" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="702" y="316" fill="#7C3AED" font-size="28">2 d_j</text><text x="72" y="485" fill="#2563EB" font-size="28">Coefficient z_j</text><text x="592" y="485" fill="#7C3AED" font-size="28">Coefficient z_j / 2</text><rect x="40" y="540" width="440" height="105" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="104" y="604" fill="#059669" font-size="25">Contribution d_j z_j</text><rect x="560" y="540" width="440" height="105" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="583" y="604" fill="#059669" font-size="25">(2 d_j)(z_j / 2) = d_j z_j</text><text x="40" y="735" fill="#DC2626" font-size="26">Same contribution, half the L₁ cost for this coefficient.</text><text x="40" y="795" fill="#475569" font-size="25">Constrain column norms instead of rewarding this rescaling.</text></g></svg>
