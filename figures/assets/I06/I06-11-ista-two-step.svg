<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 920" width="520" height="920" role="img"><title>ista-two-step</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="920" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">ISTA: move, then shrink</text><rect x="90" y="110" width="350" height="90" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="155" y="165" fill="#2563EB" font-size="28">Current code z</text><path d="M265 200V258" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="90" y="261" width="350" height="130" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="118" y="315" fill="#7C3AED" font-size="25">Gradient Dᵀ(Dz−a)</text><text x="112" y="368" fill="#7C3AED" font-size="25">Move by −η gradient</text><path d="M265 391V449" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><rect x="90" y="452" width="350" height="130" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="136" y="507" fill="#DC2626" font-size="25">Soft threshold ηλ</text><text x="105" y="559" fill="#DC2626" font-size="24">Zero or shrink each coord</text><path d="M265 582V640" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="90" y="643" width="350" height="90" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="178" y="698" fill="#059669" font-size="28">New code z</text><path d="M90 688H48V155H80" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><text x="40" y="813" fill="#475569" font-size="25">Repeat on the same a and D.</text><text x="40" y="865" fill="#475569" font-size="25">η also changes the gradient move.</text></g></svg>
