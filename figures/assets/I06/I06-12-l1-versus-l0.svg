<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 805" width="520" height="805" role="img"><title>l1-versus-l0</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="805" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Equal L₁ does not fix L₀</text><text x="40" y="111" fill="#475569" font-size="25">Positive latent values, t &gt; 0</text><rect x="95" y="235" width="55" height="70" fill="#2563EB" fill-opacity=".2" stroke="#2563EB"/><text x="112" y="213" fill="#2563EB" font-size="25">t</text><rect x="190" y="235" width="55" height="70" fill="#2563EB" fill-opacity=".2" stroke="#2563EB"/><text x="207" y="213" fill="#2563EB" font-size="25">t</text><rect x="285" y="235" width="55" height="70" fill="#2563EB" fill-opacity=".2" stroke="#2563EB"/><text x="302" y="213" fill="#2563EB" font-size="25">t</text><rect x="205" y="420" width="55" height="210" fill="#7C3AED" fill-opacity=".2" stroke="#7C3AED"/><text x="215" y="402" fill="#7C3AED" font-size="25">3t</text><text x="128" y="348" fill="#2563EB" font-size="28">L₁=3t, L₀=3</text><text x="128" y="676" fill="#7C3AED" font-size="28">L₁=3t, L₀=1</text><text x="40" y="745" fill="#475569" font-size="24">Same magnitude sum, different supports.</text></g></svg>
