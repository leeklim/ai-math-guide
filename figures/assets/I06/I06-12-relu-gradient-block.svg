<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 820" width="520" height="820" role="img"><title>relu-gradient-block</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="820" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">ReLU blocks this gradient</text><rect x="80" y="110" width="360" height="88" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="128" y="164" fill="#2563EB" font-size="28">Preactivation &lt; 0</text><path d="M260 198V258" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="80" y="261" width="360" height="88" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="143" y="315" fill="#7C3AED" font-size="28">ReLU value = 0</text><path d="M260 349V409" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="80" y="412" width="360" height="88" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="150" y="466" fill="#059669" font-size="28">Latent f_j = 0</text><path d="M80 454H48V330" stroke="#DC2626" stroke-width="3" fill="none" stroke-dasharray="6 5"/><path d="M38 310L58 330M58 310L38 330" stroke="#DC2626" stroke-width="3"/><text x="40" y="585" fill="#DC2626" font-size="25">ReLU derivative = 0 here.</text><text x="40" y="640" fill="#475569" font-size="25">Encoder gradient is locally blocked.</text><text x="40" y="706" fill="#475569" font-size="25">This claim is about the observed</text><text x="40" y="756" fill="#475569" font-size="25">negative training preactivations.</text></g></svg>
