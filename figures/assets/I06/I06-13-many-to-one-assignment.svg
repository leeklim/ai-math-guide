<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 705" width="1040" height="705" role="img"><title>many-to-one-assignment</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="705" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Nearest neighbors can reuse the same target</text><rect x="40" y="160" width="125" height="70" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="79" y="203" fill="#2563EB" font-size="28">A₁</text><rect x="40" y="330" width="125" height="70" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="79" y="373" fill="#2563EB" font-size="28">A₂</text><rect x="300" y="160" width="125" height="70" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="339" y="203" fill="#059669" font-size="28">B₁</text><rect x="300" y="330" width="125" height="70" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="339" y="373" fill="#059669" font-size="28">B₂</text><rect x="570" y="160" width="125" height="70" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="609" y="203" fill="#2563EB" font-size="28">A₁</text><rect x="570" y="330" width="125" height="70" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="609" y="373" fill="#2563EB" font-size="28">A₂</text><rect x="830" y="160" width="125" height="70" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="869" y="203" fill="#059669" font-size="28">B₁</text><rect x="830" y="330" width="125" height="70" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="869" y="373" fill="#059669" font-size="28">B₂</text><path d="M165 190H290" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M165 365L290 210" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M695 195H820" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M695 365H820" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="40" y="476" fill="#7C3AED" font-size="26">Greedy: both choose B₁</text><text x="570" y="476" fill="#059669" font-size="26">Assignment: unique targets</text><text x="40" y="584" fill="#475569" font-size="25">A pair may accept a lower individual score to improve valid coverage.</text><text x="40" y="646" fill="#475569" font-size="25">Show unmatched / below-threshold columns instead of hiding them.</text></g></svg>
