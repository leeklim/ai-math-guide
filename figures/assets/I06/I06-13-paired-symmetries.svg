<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 785" width="1040" height="785" role="img"><title>paired-symmetries</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="785" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Permute or flip each direction together with its code</text><text x="40" y="118" fill="#2563EB" font-size="26">Original dictionary / signed code</text><rect x="40" y="165" width="174" height="118" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="104" y="210" fill="#2563EB" font-size="28">d₀</text><text x="104" y="260" fill="#2563EB" font-size="28">z₀</text><rect x="232" y="165" width="174" height="118" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="296" y="210" fill="#2563EB" font-size="28">d₁</text><text x="296" y="260" fill="#2563EB" font-size="28">z₁</text><rect x="424" y="165" width="174" height="118" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="488" y="210" fill="#2563EB" font-size="28">d₂</text><text x="488" y="260" fill="#2563EB" font-size="28">z₂</text><rect x="616" y="165" width="174" height="118" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="680" y="210" fill="#2563EB" font-size="28">d₃</text><text x="680" y="260" fill="#2563EB" font-size="28">z₃</text><rect x="808" y="165" width="174" height="118" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="872" y="210" fill="#2563EB" font-size="28">d₄</text><text x="872" y="260" fill="#2563EB" font-size="28">z₄</text><text x="40" y="358" fill="#7C3AED" font-size="25">Same permutation/signs as the lab, without its added noise</text><rect x="40" y="407" width="174" height="118" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="89" y="452" fill="#7C3AED" font-size="28">d₂</text><text x="89" y="502" fill="#7C3AED" font-size="28">z₂</text><rect x="232" y="407" width="174" height="118" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="281" y="452" fill="#7C3AED" font-size="28">−d₄</text><text x="281" y="502" fill="#7C3AED" font-size="28">−z₄</text><rect x="424" y="407" width="174" height="118" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="473" y="452" fill="#7C3AED" font-size="28">d₀</text><text x="473" y="502" fill="#7C3AED" font-size="28">z₀</text><rect x="616" y="407" width="174" height="118" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="665" y="452" fill="#7C3AED" font-size="28">−d₁</text><text x="665" y="502" fill="#7C3AED" font-size="28">−z₁</text><rect x="808" y="407" width="174" height="118" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="857" y="452" fill="#7C3AED" font-size="28">d₃</text><text x="857" y="502" fill="#7C3AED" font-size="28">z₃</text><text x="40" y="603" fill="#059669" font-size="26">Each paired product is preserved, so their sum is unchanged.</text><text x="40" y="670" fill="#475569" font-size="25">Sign flips here require signed codes; ReLU codes cannot flip negative.</text><text x="40" y="729" fill="#475569" font-size="25">Scale normalization also needs nonzero columns.</text></g></svg>
