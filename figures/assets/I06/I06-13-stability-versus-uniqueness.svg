<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 860" width="520" height="860" role="img"><title>stability-versus-uniqueness</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="860" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Stability is not uniqueness</text><rect x="40" y="135" width="440" height="430" rx="24" fill="#7C3AED" fill-opacity=".04" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/><text x="65" y="192" fill="#475569" font-size="25">Allowed parameter settings</text><circle cx="145" cy="315" r="7" fill="#059669"/><text x="162" y="322" fill="#059669" font-size="24">seed 1</text><circle cx="222" cy="348" r="7" fill="#059669"/><text x="239" y="355" fill="#059669" font-size="24">seed 2</text><circle cx="170" cy="421" r="7" fill="#059669"/><text x="187" y="428" fill="#059669" font-size="24">seed 3</text><text x="396" y="273" fill="#475569" font-size="28">?</text><text x="382" y="475" fill="#475569" font-size="28">?</text><text x="51" y="626" fill="#475569" font-size="25">Other compatible settings</text><text x="40" y="679" fill="#475569" font-size="24">These runs leave alternatives open.</text><text x="40" y="746" fill="#D97706" font-size="25">Identifiability: uniqueness under</text><text x="40" y="799" fill="#D97706" font-size="24">distribution and symmetry assumptions.</text></g></svg>
