<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 900" width="1040" height="900" role="img"><title>subspace-basis-stability</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="900" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Different bases can span the same plane</text><rect x="60" y="155" width="390" height="390" fill="#059669" fill-opacity=".05" stroke="#059669" stroke-width="2"/><path d="M60 155H450M60 155V545" stroke="#CBD5E1"/><path d="M60 220H450M125 155V545" stroke="#CBD5E1"/><path d="M60 285H450M190 155V545" stroke="#CBD5E1"/><path d="M60 350H450M255 155V545" stroke="#CBD5E1"/><path d="M60 415H450M320 155V545" stroke="#CBD5E1"/><path d="M60 480H450M385 155V545" stroke="#CBD5E1"/><path d="M60 545H450M450 155V545" stroke="#CBD5E1"/><rect x="570" y="155" width="390" height="390" fill="#059669" fill-opacity=".05" stroke="#059669" stroke-width="2"/><path d="M570 155H960M570 155V545" stroke="#CBD5E1"/><path d="M570 220H960M635 155V545" stroke="#CBD5E1"/><path d="M570 285H960M700 155V545" stroke="#CBD5E1"/><path d="M570 350H960M765 155V545" stroke="#CBD5E1"/><path d="M570 415H960M830 155V545" stroke="#CBD5E1"/><path d="M570 480H960M895 155V545" stroke="#CBD5E1"/><path d="M570 545H960M960 155V545" stroke="#CBD5E1"/><path d="M255 350H410" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M255 350V195" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><text x="405" y="390" fill="#2563EB" font-size="25">u₁</text><text x="210" y="197" fill="#2563EB" font-size="25">u₂</text><path d="M765 350L875 240" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M765 350L655 240" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="875" y="218" fill="#7C3AED" font-size="25">v₁</text><text x="605" y="222" fill="#7C3AED" font-size="25">v₂</text><rect x="40" y="604" width="440" height="95" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="151" y="663" fill="#D97706" font-size="28">P₁ = U₁U₁ᵀ</text><rect x="560" y="604" width="440" height="95" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="625" y="663" fill="#D97706" font-size="28">P₂ = U₂U₂ᵀ = P₁</text><text x="40" y="780" fill="#475569" font-size="26">Same span, different individual directions.</text><text x="40" y="842" fill="#475569" font-size="25">If both span the entire ambient space, P₁=P₂=I is uninformative.</text></g></svg>
