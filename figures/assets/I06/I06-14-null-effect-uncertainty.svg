<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 830" width="520" height="830" role="img"><title>null-effect-uncertainty</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="830" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Uncertainty and null effects</text><text x="40" y="137" fill="#2563EB" font-size="28">Wide uncertainty</text><path d="M70 240H450" stroke="#CBD5E1" stroke-width="2"/><path d="M170 185V295M350 185V295" stroke="#D97706" stroke-dasharray="5 5" stroke-width="2"/><path d="M95 240H425M95 228V252M425 228V252" stroke="#7C3AED" stroke-width="3" fill="none"/><circle cx="260" cy="240" r="7" fill="#0F172A"/><text x="150" y="329" fill="#D97706" font-size="25">−δ</text><text x="253" y="329" fill="#475569" font-size="25">0</text><text x="331" y="329" fill="#D97706" font-size="25">+δ</text><path d="M70 515H450" stroke="#CBD5E1" stroke-width="2"/><path d="M170 460V570M350 460V570" stroke="#D97706" stroke-dasharray="5 5" stroke-width="2"/><path d="M230 515H290M230 503V527M290 503V527" stroke="#7C3AED" stroke-width="3" fill="none"/><circle cx="260" cy="515" r="7" fill="#0F172A"/><text x="150" y="604" fill="#D97706" font-size="25">−δ</text><text x="253" y="604" fill="#475569" font-size="25">0</text><text x="331" y="604" fill="#D97706" font-size="25">+δ</text><text x="40" y="380" fill="#2563EB" font-size="25">Relevant effects remain possible.</text><text x="40" y="431" fill="#059669" font-size="28">Narrow uncertainty</text><text x="40" y="657" fill="#059669" font-size="24">Effects beyond ±δ are excluded here.</text><text x="40" y="716" fill="#475569" font-size="25">Neither interval proves exact zero.</text><text x="40" y="772" fill="#475569" font-size="24">Schematic, not measured intervals.</text></g></svg>
