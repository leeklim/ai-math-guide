<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 840" width="1040" height="840" role="img"><title>failure-versus-sensitivity</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="840" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Invalid contract and unstable result need different actions</text><rect x="40" y="115" width="960" height="90" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="75" y="171" fill="#2563EB" font-size="27">Check data alignment, split and evaluation contract</text><path d="M270 205V276" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><path d="M765 205V276" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="280" width="450" height="145" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="130" y="334" fill="#DC2626" font-size="28">Contract invalid</text><text x="77" y="388" fill="#DC2626" font-size="25">Hook mismatch / leakage</text><rect x="550" y="280" width="450" height="145" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="577" y="334" fill="#D97706" font-size="25">Contract valid, result sensitive</text><text x="588" y="388" fill="#D97706" font-size="25">Seed / outlier dependence</text><path d="M265 425V495" fill="none" stroke="#DC2626" stroke-width="3"  marker-end="url(#arrow)"/><path d="M775 425V495" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="499" width="450" height="122" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="60" y="550" fill="#DC2626" font-size="25">Stop, fix collection / evaluation</text><text x="58" y="597" fill="#DC2626" font-size="25">Then rerun the relevant procedure</text><rect x="550" y="499" width="450" height="122" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="621" y="550" fill="#D97706" font-size="28">Report the sensitivity</text><text x="573" y="597" fill="#D97706" font-size="25">Adjust uncertainty / claim scope</text><text x="40" y="719" fill="#475569" font-size="26">Do not cover invalid data with later analyses.</text><text x="40" y="781" fill="#475569" font-size="25">Do not remove inconvenient seeds after seeing the results.</text></g></svg>
