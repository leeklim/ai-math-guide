<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 900" width="520" height="900" role="img"><title>paired-selectivity-estimand</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="900" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Pair scores within each repeat</text><rect x="40" y="115" width="440" height="104" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="57" y="179" fill="#2563EB" font-size="25">Repeat r: same input split</text><path d="M140 219V282" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M380 219V282" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="285" width="195" height="100" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="96" y="325" fill="#059669" font-size="25">Task</text><text x="87" y="365" fill="#059669" font-size="25">A_taskʳ</text><rect x="280" y="285" width="200" height="100" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="326" y="325" fill="#7C3AED" font-size="25">Control</text><text x="329" y="365" fill="#7C3AED" font-size="25">A_ctrlʳ</text><path d="M137 385V430L170 479" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><path d="M380 385V430L350 479" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="80" y="489" width="360" height="100" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="90" y="549" fill="#D97706" font-size="25">Δʳ = A_taskʳ − A_ctrlʳ</text><text x="40" y="670" fill="#475569" font-size="24">Specify what changes across repeats:</text><text x="40" y="725" fill="#475569" font-size="24">inputs, control labels, or model seeds.</text><text x="40" y="789" fill="#0F172A" font-size="24">Estimate the stated expectation</text><text x="40" y="839" fill="#0F172A" font-size="25">and uncertainty across repeats.</text></g></svg>
