<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 990" width="1040" height="990" role="img"><title>pilot-provenance-links</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="990" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Connect shared inputs, resolved models and local artifacts</text><rect x="40" y="112" width="960" height="92" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="98" y="169" fill="#2563EB" font-size="28">Same 8 prompts: prompt hash + source hash</text><path d="M265 204V272" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M775 204V272" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="275" width="440" height="158" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="72" y="327" fill="#7C3AED" font-size="28">Pythia 160M, layer 5</text><text x="70" y="376" fill="#7C3AED" font-size="25">Resolved SHA: c54a0e0…</text><text x="63" y="415" fill="#7C3AED" font-size="24">Last-token MLP down projection</text><rect x="560" y="275" width="440" height="158" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="587" y="327" fill="#7C3AED" font-size="28">Pythia 410M, layer 11</text><text x="590" y="376" fill="#7C3AED" font-size="25">Resolved SHA: c66f746…</text><text x="583" y="415" fill="#7C3AED" font-size="24">Last-token MLP down projection</text><path d="M265 433V496" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><path d="M775 433V496" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="500" width="440" height="92" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/>