<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 905" width="520" height="905" role="img"><title>Individual removals count a shared interaction twice</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="905" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="29" text-anchor="start">One interaction, counted twice</text><text x="40" y="108" fill="#7C3AED" font-size="28" text-anchor="start">Product x₁x₂ = 6</text><rect x="166" y="139" width="88" height="51" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><rect x="264" y="139" width="88" height="51" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><rect x="166" y="200" width="88" height="51" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><rect x="264" y="200" width="88" height="51" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><rect x="166" y="261" width="88" height="51" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><rect x="264" y="261" width="88" height="51" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><path d="M230 325L230 360L140 360L140 411" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M290 325L290 360L380 360L380 411" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="413" width="200" height="100" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="140" y="452" fill="#DC2626" font-size="28" text-anchor="middle">Remove x₁</text><text x="140" y="488" fill="#64748B" font-size="24" text-anchor="middle">Effect 6</text><rect x="280" y="413" width="200" height="100" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="380" y="452" fill="#DC2626" font-size="28" text-anchor="middle">Remove x₂</text><text x="380" y="488" fill="#64748B" font-size="24" text-anchor="middle">Effect 6</text><text x="40" y="596" fill="#7C3AED" font-size="28" text-anchor="start">Square term x₃² = 1</text><rect x="40" y="631" width="62" height="62" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><path d="M126 662L238 662" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="265" y="619" width="215" height="100" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="372.5" y="658" fill="#DC2626" font-size="28" text-anchor="middle">Remove x₃</text><text x="372.5" y="694" fill="#64748B" font-size="24" text-anchor="middle">Effect 1</text><text x="40" y="793" fill="#059669" font-size="26" text-anchor="start">Separate effects: 6 + 6 + 1 = 13</text><text x="40" y="842" fill="#059669" font-size="26" text-anchor="start">Actual score: 6 + 1 = 7</text></g></svg>
