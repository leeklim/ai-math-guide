<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 715" width="520" height="715" role="img"><title>Two sampling rules at m = 4</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="715" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="50" fill="#0F172A" font-size="28" text-anchor="start">Which points are evaluated?</text><text x="40" y="135" fill="#7C3AED" font-size="28" text-anchor="start">Right endpoints</text><path d="M50 221L470 221" fill="none" stroke="#64748B" stroke-width="2.6"/><path d="M50 213L50 229" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="50" y="270" fill="#0F172A" font-size="24" text-anchor="middle">0</text><path d="M155 213L155 229" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="155" y="270" fill="#0F172A" font-size="24" text-anchor="middle">1/4</text><circle cx="155" cy="221" r="7" fill="#7C3AED"/><path d="M260 213L260 229" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="260" y="270" fill="#0F172A" font-size="24" text-anchor="middle">1/2</text><circle cx="260" cy="221" r="7" fill="#7C3AED"/><path d="M365 213L365 229" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="365" y="270" fill="#0F172A" font-size="24" text-anchor="middle">3/4</text><circle cx="365" cy="221" r="7" fill="#7C3AED"/><path d="M470 213L470 229" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="470" y="270" fill="#0F172A" font-size="24" text-anchor="middle">1</text><circle cx="470" cy="221" r="7" fill="#7C3AED"/><text x="40" y="335" fill="#2563EB" font-size="28" text-anchor="start">Endpoint-inclusive mean</text><path d="M50 421L470 421" fill="none" stroke="#64748B" stroke-width="2.6"/><path d="M50 413L50 429" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="50" y="470" fill="#0F172A" font-size="24" text-anchor="middle">0</text><circle cx="50" cy="421" r="7" fill="#2563EB"/><path d="M190 413L190 429" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="190" y="470" fill="#0F172A" font-size="24" text-anchor="middle">1/3</text><circle cx="190" cy="421" r="7" fill="#2563EB"/><path d="M330 413L330 429" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="330" y="470" fill="#0F172A" font-size="24" text-anchor="middle">2/3</text><circle cx="330" cy="421" r="7" fill="#2563EB"/><path d="M470 413L470 429" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="470" y="470" fill="#0F172A" font-size="24" text-anchor="middle">1</text><circle cx="470" cy="421" r="7" fill="#2563EB"/><text x="40" y="565" fill="#0F172A" font-size="26" text-anchor="start">Each mean uses weight 1/4.</text><text x="40" y="620" fill="#0F172A" font-size="26" text-anchor="start">Same m; different point sets.</text><text x="40" y="670" fill="#64748B" font-size="24" text-anchor="start">Illustrative sampling comparison</text></g></svg>
