<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 910" width="520" height="910" role="img"><title>Deletion shifts positions while replacement preserves length</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="910" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="50" fill="#0F172A" font-size="28" text-anchor="start">Delete or replace a token?</text><text x="40" y="105" fill="#2563EB" font-size="28" text-anchor="start">Original</text><text x="84" y="150" fill="#64748B" font-size="24" text-anchor="middle">1</text><rect x="40" y="175" width="88" height="74" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="84" y="220" fill="#2563EB" font-size="26" text-anchor="middle">I</text><text x="194" y="150" fill="#64748B" font-size="24" text-anchor="middle">2</text><rect x="150" y="175" width="88" height="74" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="194" y="220" fill="#2563EB" font-size="26" text-anchor="middle">like</text><text x="304" y="150" fill="#64748B" font-size="24" text-anchor="middle">3</text><rect x="260" y="175" width="88" height="74" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="304" y="220" fill="#2563EB" font-size="26" text-anchor="middle">this</text><text x="414" y="150" fill="#64748B" font-size="24" text-anchor="middle">4</text><rect x="370" y="175" width="88" height="74" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="414" y="220" fill="#2563EB" font-size="26" text-anchor="middle">book</text><text x="40" y="335" fill="#DC2626" font-size="28" text-anchor="start">Delete 'this'</text><text x="84" y="380" fill="#64748B" font-size="24" text-anchor="middle">1</text><rect x="40" y="405" width="88" height="74" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="84" y="450" fill="#DC2626" font-size="26" text-anchor="middle">I</text><text x="194" y="380" fill="#64748B" font-size="24" text-anchor="middle">2</text><rect x="150" y="405" width="88" height="74" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="194" y="450" fill="#DC2626" font-size="26" text-anchor="middle">like</text><text x="304" y="380" fill="#64748B" font-size="24" text-anchor="middle">3</text><rect x="260" y="405" width="88" height="74" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="304" y="450" fill="#DC2626" font-size="26" text-anchor="middle">book</text><text x="40" y="565" fill="#7C3AED" font-size="28" text-anchor="start">Replace 'this'</text><text x="84" y="610" fill="#64748B" font-size="24" text-anchor="middle">1</text><rect x="40" y="635" width="88" height="74" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="84" y="680" fill="#7C3AED" font-size="26" text-anchor="middle">I</text><text x="194" y="610" fill="#64748B" font-size="24" text-anchor="middle">2</text><rect x="150" y="635" width="88" height="74" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="194" y="680" fill="#7C3AED" font-size="26" text-anchor="middle">like</text><text x="304" y="610" fill="#64748B" font-size="24" text-anchor="middle">3</text><rect x="260" y="635" width="88" height="74" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="304" y="680" fill="#7C3AED" font-size="22" text-anchor="middle">[mask]</text><text x="414" y="610" fill="#64748B" font-size="24" text-anchor="middle">4</text><rect x="370" y="635" width="88" height="74" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="414" y="680" fill="#7C3AED" font-size="26" text-anchor="middle">book</text><text x="40" y="790" fill="#DC2626" font-size="26" text-anchor="start">Deletion shifts later positions.</text><text x="40" y="845" fill="#7C3AED" font-size="26" text-anchor="start">Replacement keeps the length.</text></g></svg>
