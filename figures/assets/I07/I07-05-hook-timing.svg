<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1170" width="520" height="1170" role="img"><title>Overwrite timing changes the manipulated tensor</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1170" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="50" fill="#0F172A" font-size="28" text-anchor="start">Where is the overwrite?</text><rect x="150" y="140" width="220" height="85" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="179" fill="#2563EB" font-size="28" text-anchor="middle">Residual r</text><path d="M260 249L260 349" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><circle cx="260" cy="297" r="7" fill="#DC2626"/><text x="40" y="305" fill="#DC2626" font-size="26" text-anchor="start">A: input</text><rect x="150" y="375" width="220" height="85" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="414" fill="#7C3AED" font-size="28" text-anchor="middle">Module F</text><path d="M260 484L260 584" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><circle cx="260" cy="530" r="7" fill="#DC2626"/><text x="40" y="538" fill="#DC2626" font-size="26" text-anchor="start">B: output</text><rect x="190" y="610" width="140" height="85" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="649" fill="#7C3AED" font-size="28" text-anchor="middle">+ r</text><path d="M394 183L455 183L455 652L354 652" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M260 719L260 819" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><circle cx="260" cy="771" r="7" fill="#DC2626"/><text x="40" y="779" fill="#DC2626" font-size="26" text-anchor="start">C: sum</text><rect x="150" y="845" width="220" height="85" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="884" fill="#059669" font-size="28" text-anchor="middle">Next residual</text><text x="40" y="1000" fill="#0F172A" font-size="26" text-anchor="start">A changes F's input.</text><text x="40" y="1055" fill="#0F172A" font-size="26" text-anchor="start">B leaves the skip r intact.</text><text x="40" y="1110" fill="#0F172A" font-size="26" text-anchor="start">C replaces the merged tensor.</text></g></svg>
