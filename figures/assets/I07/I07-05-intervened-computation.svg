<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 990" width="520" height="990" role="img"><title>Node override cuts the incoming rule but preserves the direct path</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="990" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="50" fill="#0F172A" font-size="28" text-anchor="start">Intervene only on H</text><rect x="150" y="140" width="220" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="179" fill="#2563EB" font-size="28" text-anchor="middle">X = 2</text><path d="M260 265L260 385" fill="none" stroke="#64748B" stroke-width="2.6" stroke-dasharray="7 6"/><path d="M245 317L275 347" fill="none" stroke="#DC2626" stroke-width="2.6"/><path d="M275 317L245 347" fill="none" stroke="#DC2626" stroke-width="2.6"/><text x="40" y="335" fill="#DC2626" font-size="26" text-anchor="start">Cut 2X</text><rect x="150" y="410" width="220" height="110" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="260" y="449" fill="#DC2626" font-size="28" text-anchor="middle">H := 2</text><text x="260" y="485" fill="#64748B" font-size="24" text-anchor="middle">do(H = 2)</text><path d="M260 545L260 665" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="150" y="690" width="220" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="729" fill="#059669" font-size="28" text-anchor="middle">Y = 4</text><text x="260" y="765" fill="#64748B" font-size="24" text-anchor="middle">Y = H + X</text><path d="M394 190L455 190L455 745L394 745" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><text x="410" y="425" fill="#2563EB" font-size="26" text-anchor="start">X</text><text x="40" y="870" fill="#2563EB" font-size="25" text-anchor="start">X stays 2; the direct path stays.</text><text x="40" y="930" fill="#059669" font-size="25" text-anchor="start">Recompute downstream: 2 + 2 = 4</text></g></svg>
