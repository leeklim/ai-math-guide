<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1060" width="520" height="1060" role="img"><title>Identical original norms can have different intervention distances</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1060" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="50" fill="#0F172A" font-size="28" text-anchor="start">Output norm or change norm?</text><text x="40" y="150" fill="#DC2626" font-size="28" text-anchor="start">Baseline b = 0</text><path d="M65 225L470 225" fill="none" stroke="#64748B" stroke-width="2.6"/><path d="M80 218L80 232" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="80" y="273" fill="#0F172A" font-size="22" text-anchor="middle">-3</text><path d="M260 218L260 232" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="260" y="273" fill="#0F172A" font-size="22" text-anchor="middle">0</text><path d="M380 218L380 232" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="380" y="273" fill="#0F172A" font-size="22" text-anchor="middle">2</text><path d="M440 218L440 232" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="440" y="273" fill="#0F172A" font-size="22" text-anchor="middle">3</text><circle cx="440" cy="225" r="7" fill="#2563EB"/><circle cx="260" cy="225" r="7" fill="#DC2626"/><path d="M428 200L272 200" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="330" fill="#DC2626" font-size="28" text-anchor="start">|h − b| = 3</text><text x="40" y="380" fill="#DC2626" font-size="28" text-anchor="start">Baseline b = 2</text><path d="M65 455L470 455" fill="none" stroke="#64748B" stroke-width="2.6"/><path d="M80 448L80 462" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="80" y="503" fill="#0F172A" font-size="22" text-anchor="middle">-3</text><path d="M260 448L260 462" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="260" y="503" fill="#0F172A" font-size="22" text-anchor="middle">0</text><path d="M380 448L380 462" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="380" y="503" fill="#0F172A" font-size="22" text-anchor="middle">2</text><path d="M440 448L440 462" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="440" y="503" fill="#0F172A" font-size="22" text-anchor="middle">3</text><circle cx="440" cy="455" r="7" fill="#2563EB"/><circle cx="380" cy="455" r="7" fill="#DC2626"/><path d="M428 430L392 430" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="560" fill="#DC2626" font-size="28" text-anchor="start">|h − b| = 1</text><text x="40" y="610" fill="#DC2626" font-size="28" text-anchor="start">Baseline b = -3</text><path d="M65 685L470 685" fill="none" stroke="#64748B" stroke-width="2.6"/><path d="M80 678L80 692" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="80" y="733" fill="#0F172A" font-size="22" text-anchor="middle">-3</text><path d="M260 678L260 692" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="260" y="733" fill="#0F172A" font-size="22" text-anchor="middle">0</text><path d="M380 678L380 692" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="380" y="733" fill="#0F172A" font-size="22" text-anchor="middle">2</text><path d="M440 678L440 692" fill="none" stroke="#64748B" stroke-width="2.6"/><text x="440" y="733" fill="#0F172A" font-size="22" text-anchor="middle">3</text><circle cx="440" cy="685" r="7" fill="#2563EB"/><circle cx="80" cy="685" r="7" fill="#DC2626"/><path d="M428 660L92 660" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="790" fill="#DC2626" font-size="28" text-anchor="start">|h − b| = 6</text><text x="40" y="885" fill="#2563EB" font-size="26" text-anchor="start">Same original h = 3; |h| = 3.</text><text x="40" y="945" fill="#DC2626" font-size="25" text-anchor="st