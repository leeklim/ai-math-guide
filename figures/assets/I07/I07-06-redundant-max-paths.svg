<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 950" width="520" height="950" role="img"><title>Redundant max components survive single but not joint removal</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="950" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="50" fill="#0F172A" font-size="28" text-anchor="start">Single versus joint ablation</text><text x="40" y="104" fill="#7C3AED" font-size="28" text-anchor="start">Y = max(h₁, h₂)</text><rect x="150" y="150" width="220" height="110" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="189" fill="#2563EB" font-size="28" text-anchor="middle">(1, 1)</text><text x="260" y="225" fill="#64748B" font-size="24" text-anchor="middle">Y = 1</text><path d="M235 285L140 365" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M285 285L380 365" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="390" width="200" height="110" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="140" y="429" fill="#DC2626" font-size="28" text-anchor="middle">(0, 1)</text><text x="140" y="465" fill="#64748B" font-size="24" text-anchor="middle">Y = 1</text><rect x="280" y="390" width="200" height="110" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="380" y="429" fill="#DC2626" font-size="28" text-anchor="middle">(1, 0)</text><text x="380" y="465" fill="#64748B" font-size="24" text-anchor="middle">Y = 1</text><path d="M140 525L235 605" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 525L285 605" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="150" y="630" width="220" height="110" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="260" y="669" fill="#DC2626" font-size="28" text-anchor="middle">(0, 0)</text><text x="260" y="705" fill="#64748B" font-size="24" text-anchor="middle">Y = 0</text><text x="40" y="830" fill="#0F172A" font-size="25" text-anchor="start">Either path alone preserves Y.</text><text x="40" y="889" fill="#DC2626" font-size="25" text-anchor="start">Remove both: outcome collapses.</text></g></svg>
