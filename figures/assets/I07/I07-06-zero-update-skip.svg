<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1190" width="520" height="1190" role="img"><title>Zero update ablation preserves the residual skip</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1190" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="50" fill="#0F172A" font-size="26" text-anchor="start">Zero the update, not the stream</text><rect x="150" y="140" width="220" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="179" fill="#2563EB" font-size="28" text-anchor="middle">Stream r</text><path d="M260 264L260 384" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="150" y="410" width="220" height="100" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="260" y="449" fill="#DC2626" font-size="28" text-anchor="middle">h_c := 0</text><text x="260" y="485" fill="#64748B" font-size="24" text-anchor="middle">Update overwrite</text><path d="M260 535L260 655" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="150" y="680" width="220" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="719" fill="#059669" font-size="28" text-anchor="middle">r + 0 = r</text><path d="M394 190L455 190L455 730L394 730" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><text x="410" y="420" fill="#2563EB" font-size="24" text-anchor="middle">r</text><path d="M260 805L260 925" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="150" y="950" width="220" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="989" fill="#7C3AED" font-size="28" text-anchor="middle">LayerNorm</text><text x="260" y="1025" fill="#64748B" font-size="24" text-anchor="middle">Recompute</text><text x="40" y="1130" fill="#2563EB" font-size="26" text-anchor="start">The existing residual survives.</text></g></svg>
