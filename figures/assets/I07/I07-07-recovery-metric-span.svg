<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 735" width="520" height="735" role="img"><title>Recovery compares two distances on the same metric axis</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="735" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="50" fill="#0F172A" font-size="24" text-anchor="start">Raw effect and normalized recovery</text><text x="40" y="115" fill="#0F172A" font-size="28" text-anchor="start">Raw metric</text><path d="M70 195L455 195" fill="none" stroke="#64748B" stroke-width="2.6"/><circle cx="130" cy="195" r="7" fill="#D97706"/><text x="130" y="245" fill="#D97706" font-size="24" text-anchor="middle">Corrupt 2</text><circle cx="250" cy="195" r="7" fill="#7C3AED"/><text x="250" y="165" fill="#7C3AED" font-size="24" text-anchor="middle">Patched 6</text><circle cx="370" cy="195" r="7" fill="#059669"/><text x="370" y="245" fill="#059669" font-size="24" text-anchor="middle">Clean 10</text><circle cx="430" cy="195" r="7" fill="#2563EB"/><text x="430" y="120" fill="#2563EB" font-size="24" text-anchor="end">Overshoot 12</text><path d="M130 335L370 335" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><text x="130" y="305" fill="#059669" font-size="26" text-anchor="start">Clean−corrupt gap 8</text><path d="M130 445L250 445" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="130" y="415" fill="#7C3AED" font-size="26" text-anchor="start">Patch effect 4</text><text x="40" y="535" fill="#7C3AED" font-size="28" text-anchor="start">Recovery = 4 / 8 = 0.5</text><text x="40" y="620" fill="#2563EB" font-size="25" text-anchor="start">Overshoot: (12 − 2) / 8 = 1.25</text><text x="40" y="675" fill="#0F172A" font-size="26" text-anchor="start">Raw metrics retain their units.</text></g></svg>
