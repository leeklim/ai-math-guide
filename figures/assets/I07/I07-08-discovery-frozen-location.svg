<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1070" width="520" height="1070" role="img"><title>Freeze the discovered location before held-out confirmation</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1070" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="50" fill="#0F172A" font-size="26" text-anchor="start">Separate search from confirmation</text><rect x="40" y="140" width="440" height="90" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="179" fill="#2563EB" font-size="28" text-anchor="middle">Discovery input set</text><rect x="40" y="290" width="90" height="90" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="85" y="343" fill="#D97706" font-size="28" text-anchor="middle">A</text><rect x="150" y="290" width="90" height="90" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="195" y="343" fill="#D97706" font-size="28" text-anchor="middle">B</text><rect x="260" y="290" width="90" height="90" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/><text x="305" y="343" fill="#DC2626" font-size="28" text-anchor="middle">C*</text><rect x="370" y="290" width="90" height="90" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="415" y="343" fill="#D97706" font-size="28" text-anchor="middle">D</text><path d="M315 404L315 450L260 450L260 500" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="525" width="440" height="90" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="260" y="564" fill="#DC2626" font-size="28" text-anchor="middle">Freeze location C*</text><path d="M260 639L260 749" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="775" width="440" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="814" fill="#2563EB" font-size="28" text-anchor="middle">Held-out input set</text><text x="260" y="850" fill="#64748B" font-size="24" text-anchor="middle">Evaluate only the fixed location</text><text x="40" y="955" fill="#0F172A" font-size="25" text-anchor="start">Do not search for a new peak here.</text><text x="40" y="1010" fill="#64748B" font-size="24" text-anchor="start">Illustrative candidate identifiers</text></g></svg>
