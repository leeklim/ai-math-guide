<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 835" width="520" height="835" role="img"><title>Multiple restoration sites and late upstream bypass</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="835" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="50" fill="#0F172A" font-size="28" text-anchor="start">Two peaks in one simple chain</text><text x="40" y="110" fill="#64748B" font-size="25" text-anchor="start">Illustrative: A = X, B = A, Y = B</text><text x="40" y="180" fill="#DC2626" font-size="28" text-anchor="start">Corrupt X = 0; restore A</text><rect x="40" y="225" width="100" height="90" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="90" y="280" fill="#DC2626" font-size="26" text-anchor="middle">A := 1</text><rect x="210" y="225" width="100" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="280" fill="#7C3AED" font-size="26" text-anchor="middle">B = 1</text><rect x="380" y="225" width="100" height="90" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="430" y="280" fill="#059669" font-size="26" text-anchor="middle">Y = 1</text><path d="M154 270L196 270" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M324 270L366 270" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="425" fill="#DC2626" font-size="28" text-anchor="start">Corrupt X = 0; restore B</text><rect x="40" y="470" width="100" height="90" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="90" y="525" fill="#64748B" font-size="26" text-anchor="middle">A = 0</text><rect x="210" y="470" width="100" height="90" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="260" y="525" fill="#DC2626" font-size="26" text-anchor="middle">B := 1</text><rect x="380" y="470" width="100" height="90" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="430" y="525" fill="#059669" font-size="26" text-anchor="middle">Y = 1</text><path d="M154 515L196 515" fill="none" stroke="#64748B" stroke-width="2.6" stroke-dasharray="6 4"/><path d="M170 501L182 529" fill="none" stroke="#DC2626" stroke-width="2.6"/><path d="M182 501L170 529" fill="none" stroke="#DC2626" stroke-width="2.6"/><path d="M324 515L366 515" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="655" fill="#0F172A" font-size="26" text-anchor="start">Late restoration bypasses A.</text><text x="40" y="716" fill="#059669" font-size="25" text-anchor="start">Both experiments recover Y = 1.</text><text x="40" y="777" fill="#0F172A" font-size="26" text-anchor="start">Their effects are not a sum.</text></g></svg>
