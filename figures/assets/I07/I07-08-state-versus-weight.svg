<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1190" width="520" height="1190" role="img"><title>Activation restoration and weight editing manipulate different objects</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1190" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="50" fill="#0F172A" font-size="26" text-anchor="start">State patch and weight edit differ</text><text x="40" y="130" fill="#DC2626" font-size="28" text-anchor="start">Activation restoration</text><rect x="40" y="170" width="190" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="135" y="209" fill="#7C3AED" font-size="28" text-anchor="middle">Fixed W</text><rect x="290" y="170" width="190" height="90" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="385" y="209" fill="#DC2626" font-size="28" text-anchor="middle">New h*</text><path d="M135 284L135 330L230 330L230 374" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M385 284L385 330L290 330L290 374" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="100" y="400" width="320" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="439" fill="#059669" font-size="28" text-anchor="middle">One run: f_W(x; h*)</text><text x="40" y="615" fill="#DC2626" font-size="28" text-anchor="start">Weight editing</text><rect x="40" y="655" width="190" height="85" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="135" y="694" fill="#7C3AED" font-size="28" text-anchor="middle">W</text><path d="M242 698L278 698" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="290" y="655" width="190" height="85" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="385" y="694" fill="#DC2626" font-size="28" text-anchor="middle">W′</text><path d="M385 764L385 820L135 820L135 869" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M385 764L385 869" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="895" width="190" height="85" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="135" y="934" fill="#059669" font-size="28" text-anchor="middle">f_W′(x₁)</text><rect x="290" y="895" width="190" height="85" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="385" y="934" fill="#059669" font-size="28" text-anchor="middle">f_W′(x₂)</text><text x="40" y="1070" fill="#0F172A" font-size="26" text-anchor="start">W′ changes the input function.</text><text x="40" y="1129" fill="#0F172A" font-size="24" text-anchor="start">A trace peak does not prove editing.</text></g></svg>
