<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1080" width="520" height="1080" role="img"><title>Edge patch: change A → B only</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1080" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="50" fill="#0F172A" font-size="29" text-anchor="start">Edge patch: change A → B only</text><rect x="190" y="140" width="240" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="310" y="179" fill="#2563EB" font-size="28" text-anchor="middle">A = -1</text><path d="M310 265L310 385" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><text x="350" y="335" fill="#7C3AED" font-size="28" text-anchor="start">× 2</text><rect x="190" y="410" width="240" height="110" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="310" y="449" fill="#7C3AED" font-size="28" text-anchor="middle">C = -2</text><text x="310" y="485" fill="#64748B" font-size="24" text-anchor="middle">C = 2A</text><path d="M310 545L310 665" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="350" y="615" fill="#7C3AED" font-size="28" text-anchor="start">× 5</text><rect x="190" y="690" width="240" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="310" y="729" fill="#059669" font-size="28" text-anchor="middle">B = -4</text><text x="310" y="765" fill="#64748B" font-size="24" text-anchor="middle">B = 3m + 5C</text><path d="M166 190L75 190L75 745L166 745" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><text x="125" y="445" fill="#DC2626" font-size="28" text-anchor="middle">× 3</text><text x="125" y="515" fill="#DC2626" font-size="24" text-anchor="middle">m=2</text><text x="40" y="875" fill="#0F172A" font-size="25" text-anchor="start">Only the direct message changes.</text><text x="40" y="945" fill="#059669" font-size="28" text-anchor="start">Effect: −4 − (−13) = 9</text><text x="40" y="1020" fill="#0F172A" font-size="26" text-anchor="start">C stays −2.</text></g></svg>
