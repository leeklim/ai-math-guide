<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 890" width="1080" height="890" role="img"><title>Receiver-specific sender contribution and downstream recomputation</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="890" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="50" fill="#0F172A" font-size="30" text-anchor="start">Replace the sender contribution for one receiver only</text><rect x="40" y="135" width="440" height="110" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="260" y="174" fill="#DC2626" font-size="28" text-anchor="middle">Selected receiver</text><text x="260" y="210" fill="#64748B" font-size="24" text-anchor="middle">r_r − h_r + h_c</text><path d="M260 269L260 339" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="365" width="440" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="404" fill="#7C3AED" font-size="28" text-anchor="middle">Normalization</text><path d="M260 479L260 549" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="575" width="440" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="614" fill="#7C3AED" font-size="28" text-anchor="middle">Projection / MLP</text><text x="40" y="750" fill="#0F172A" font-size="26" text-anchor="start">Recompute using changed input.</text><rect x="600" y="135" width="440" height="110" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="820" y="174" fill="#D97706" font-size="28" text-anchor="middle">Other receiver</text><text x="820" y="210" fill="#64748B" font-size="24" text-anchor="middle">Original r_r</text><path d="M820 269L820 339" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="600" y="365" width="440" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="820" y="404" fill="#7C3AED" font-size="28" text-anchor="middle">Normalization</text><path d="M820 479L820 549" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="600" y="575" width="440" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="820" y="614" fill="#7C3AED" font-size="28" text-anchor="middle">Projection / MLP</text><text x="600" y="750" fill="#0F172A" font-size="26" text-anchor="start">Keep this receiver at base.</text><text x="40" y="827" fill="#0F172A" font-size="26" text-anchor="start">Replacing the entire receiver output would also replace other inputs' effects.</text></g></svg>
