<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1200" width="520" height="1200" role="img"><title>Removing first hidden value leaves second hidden one in the full max model outputting one whereas the same removal from a circuit that omitted the second path outputs zero</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1200" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="27" text-anchor="start">Completeness: the same removal</text><text x="40" y="120" fill="#0F172A" font-size="28" text-anchor="start">Full model: remove h₁</text><rect x="40" y="175" width="200" height="105" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="140" y="214" fill="#DC2626" font-size="28" text-anchor="middle">h₁ = 0</text><text x="140" y="250" fill="#64748B" font-size="24" text-anchor="middle">Removed</text><rect x="280" y="175" width="200" height="105" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="380" y="214" fill="#2563EB" font-size="28" text-anchor="middle">h₂ = 1</text><text x="380" y="250" fill="#64748B" font-size="24" text-anchor="middle">Kept</text><path d="M140 280V345H215V386" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 280V345H305V386" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="150" y="410" width="220" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="449" fill="#059669" font-size="28" text-anchor="middle">Y = 1</text><text x="260" y="485" fill="#64748B" font-size="24" text-anchor="middle">max(h₁, h₂)</text><text x="40" y="575" fill="#64748B" font-size="25" text-anchor="start">Y stays 1 through the spare path.</text><text x="40" y="670" fill="#0F172A" font-size="28" text-anchor="start">Circuit C: remove h₁</text><rect x="40" y="725" width="200" height="105" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="140" y="764" fill="#DC2626" font-size="28" text-anchor="middle">h₁ = 0</text><text x="140" y="800" fill="#64748B" font-size="24" text-anchor="middle">Removed</text><rect x="280" y="725" width="200" height="105" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="380" y="764" fill="#64748B" font-size="28" text-anchor="middle">h₂ = 0</text><text x="380" y="800" fill="#64748B" font-size="24" text-anchor="middle">Excluded</text><path d="M140 830V895H215V936" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 830V895H305V936" fill="none" stroke="#64748B" stroke-width="2.6" stroke-dasharray="true" marker-end="url(#arrow)"/><rect x="150" y="960" width="220" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="999" fill="#059669" font-size="28" text-anchor="middle">Y = 0</text><text x="260" y="1035" fill="#64748B" font-size="24" text-anchor="middle">max(h₁, h₂)</text><text x="40" y="1125" fill="#64748B" font-size="25" text-anchor="start">Y becomes 0: responses disagree.</text></g></svg>
