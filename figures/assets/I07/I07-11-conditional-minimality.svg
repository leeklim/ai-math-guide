<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1250" width="520" height="1250" role="img"><title>Two before-after panels remove first hidden value from one to zero while fixed second path one yields no max-output change and fixed second path zero yields a drop of one</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1250" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="25" text-anchor="start">Minimality depends on what remains</text><text x="40" y="140" fill="#0F172A" font-size="28" text-anchor="start">Other path fixed: h₂ = 1</text><rect x="40" y="205" width="200" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="244" fill="#2563EB" font-size="28" text-anchor="middle">h₁ = 1</text><text x="140" y="280" fill="#64748B" font-size="24" text-anchor="middle">Before removal</text><rect x="280" y="205" width="200" height="100" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="380" y="244" fill="#DC2626" font-size="28" text-anchor="middle">h₁ = 0</text><text x="380" y="280" fill="#64748B" font-size="24" text-anchor="middle">After removal</text><text x="85" y="395" fill="#059669" font-size="28" text-anchor="start">Y = 1</text><text x="315" y="395" fill="#059669" font-size="28" text-anchor="start">Y = 1</text><text x="40" y="485" fill="#D97706" font-size="28" text-anchor="start">Removal effect = 0</text><text x="40" y="650" fill="#0F172A" font-size="28" text-anchor="start">Other path fixed: h₂ = 0</text><rect x="40" y="715" width="200" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="754" fill="#2563EB" font-size="28" text-anchor="middle">h₁ = 1</text><text x="140" y="790" fill="#64748B" font-size="24" text-anchor="middle">Before removal</text><rect x="280" y="715" width="200" height="100" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="380" y="754" fill="#DC2626" font-size="28" text-anchor="middle">h₁ = 0</text><text x="380" y="790" fill="#64748B" font-size="24" text-anchor="middle">After removal</text><text x="85" y="905" fill="#059669" font-size="28" text-anchor="start">Y = 1</text><text x="315" y="905" fill="#059669" font-size="28" text-anchor="start">Y = 0</text><text x="40" y="995" fill="#D97706" font-size="28" text-anchor="start">Removal effect = 1</text><text x="40" y="1185" fill="#64748B" font-size="25" text-anchor="start">Same node; different retained paths.</text></g></svg>
