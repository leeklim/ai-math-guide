<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1100" width="520" height="1100" role="img"><title>Four-node CPU DAG branches input into copy head and MLP gate then merges both at logit with no edge between the two middle nodes</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1100" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="28" text-anchor="start">CPU DAG: dependency order</text><rect x="140" y="140" width="240" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="179" fill="#2563EB" font-size="28" text-anchor="middle">Input</text><rect x="40" y="375" width="195" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="137.5" y="414" fill="#7C3AED" font-size="28" text-anchor="middle">Copy head</text><rect x="285" y="375" width="195" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="382.5" y="414" fill="#7C3AED" font-size="28" text-anchor="middle">MLP gate</text><rect x="140" y="700" width="240" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="739" fill="#059669" font-size="28" text-anchor="middle">Logit</text><path d="M200 240V290H137.5V351" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M320 240V290H382.5V351" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M137.5 475V600H200V676" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M382.5 475V600H320V676" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="870" fill="#0F172A" font-size="25" text-anchor="start">Input → copy head → MLP → logit</text><text x="40" y="930" fill="#64748B" font-size="26" text-anchor="start">Copy head and MLP can swap.</text><text x="40" y="1000" fill="#D97706" font-size="25" text-anchor="start">DAG structure is not causal proof.</text></g></svg>
