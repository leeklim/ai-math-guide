<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1070" width="520" height="1070" role="img"><title>Three vertical nodes A B C have forward edges and a red return edge from C to A making every node have an incoming edge and preventing any topological first node</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1070" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="26" text-anchor="start">A cycle blocks a dependency order</text><rect x="170" y="140" width="260" height="90" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="300" y="179" fill="#2563EB" font-size="28" text-anchor="middle">A</text><rect x="170" y="405" width="260" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="300" y="444" fill="#7C3AED" font-size="28" text-anchor="middle">B</text><rect x="170" y="670" width="260" height="90" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="300" y="709" fill="#059669" font-size="28" text-anchor="middle">C</text><path d="M300 230V381" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M300 495V646" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M170 715H65V185H146" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="102" fill="#DC2626" font-size="26" text-anchor="start">C → A</text><text x="40" y="840" fill="#0F172A" font-size="27" text-anchor="start">Remaining nodes: A, B, C</text><text x="40" y="910" fill="#DC2626" font-size="27" text-anchor="start">No node has indegree zero.</text><text x="40" y="990" fill="#DC2626" font-size="28" text-anchor="start">A → B → C → A</text></g></svg>
