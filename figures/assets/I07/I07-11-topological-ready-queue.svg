<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1140" width="520" height="1140" role="img"><title>Four queue states start with input then copy and MLP then MLP then logit reflecting incoming edges removed by the CPU topological-order algorithm</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1140" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="28" text-anchor="start">Indegree-zero queue</text><text x="40" y="120" fill="#0F172A" font-size="28" text-anchor="start">Initial</text><rect x="40" y="155" width="440" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="194" fill="#7C3AED" font-size="28" text-anchor="middle">input</text><text x="260" y="230" fill="#64748B" font-size="24" text-anchor="middle">No incoming edge</text><path d="M260 280V326" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="355" fill="#0F172A" font-size="28" text-anchor="start">After input</text><rect x="40" y="390" width="440" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="429" fill="#7C3AED" font-size="28" text-anchor="middle">copy, MLP</text><text x="260" y="465" fill="#64748B" font-size="24" text-anchor="middle">Both are ready</text><path d="M260 515V561" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="590" fill="#0F172A" font-size="28" text-anchor="start">After copy</text><rect x="40" y="625" width="440" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="664" fill="#7C3AED" font-size="28" text-anchor="middle">MLP</text><text x="260" y="700" fill="#64748B" font-size="24" text-anchor="middle">Logit still waits</text><path d="M260 750V796" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="825" fill="#0F172A" font-size="28" text-anchor="start">After MLP</text><rect x="40" y="860" width="440" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="899" fill="#7C3AED" font-size="28" text-anchor="middle">logit</text><text x="260" y="935" fill="#64748B" font-size="24" text-anchor="middle">Both inputs processed</text><text x="40" y="1080" fill="#64748B" font-size="25" text-anchor="start">Queue order selects one valid order.</text></g></svg>
