<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1220" width="520" height="1220" role="img"><title>Individual versus set removal</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1220" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="26" text-anchor="start">Remove a node or the whole set</text><text x="40" y="130" fill="#0F172A" font-size="28" text-anchor="start">Remove A only</text><rect x="40" y="180" width="440" height="190" rx="8" fill="none" stroke="#64748B" stroke-width="2"/><text x="55" y="218" fill="#64748B" font-size="25" text-anchor="start">Set C</text><rect x="70" y="235" width="170" height="105" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="155" y="274" fill="#DC2626" font-size="28" text-anchor="middle">A = 0</text><rect x="280" y="235" width="170" height="105" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="365" y="274" fill="#2563EB" font-size="28" text-anchor="middle">B = 1</text><path d="M155 370V415H225V450" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M365 370V415H295V450" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="150" y="475" width="220" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="514" fill="#059669" font-size="28" text-anchor="middle">Y = 1</text><text x="260" y="550" fill="#64748B" font-size="24" text-anchor="middle">max(A, B)</text><text x="40" y="625" fill="#D97706" font-size="28" text-anchor="start">Intact 1 → 1; effect 0</text><text x="40" y="680" fill="#0F172A" font-size="28" text-anchor="start">Remove C = {A, B}</text><rect x="40" y="730" width="440" height="190" rx="8" fill="none" stroke="#64748B" stroke-width="2"/><text x="55" y="768" fill="#64748B" font-size="25" text-anchor="start">Set C</text><rect x="70" y="785" width="170" height="105" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="155" y="824" fill="#DC2626" font-size="28" text-anchor="middle">A = 0</text><rect x="280" y="785" width="170" height="105" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="365" y="824" fill="#DC2626" font-size="28" text-anchor="middle">B = 0</text><path d="M155 920V965H225V1000" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M365 920V965H295V1000" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="150" y="1025" width="220" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="1064" fill="#059669" font-size="28" text-anchor="middle">Y = 0</text><text x="260" y="1100" fill="#64748B" font-size="24" text-anchor="middle">max(A, B)</text><text x="40" y="1175" fill="#D97706" font-size="28" text-anchor="start">Intact 1 → 0; effect 1</text></g></svg>
