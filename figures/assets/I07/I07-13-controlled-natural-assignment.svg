<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1180" width="1080" height="1180" role="img"><title>Controlled versus natural assignment</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="1180" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="28" text-anchor="start">Controlled: one m for every unit</text><text x="600" y="55" fill="#0F172A" font-size="28" text-anchor="start">Natural: each unit's M(0)</text><text x="40" y="135" fill="#64748B" font-size="26" text-anchor="start">Unit U; cached M(0) = 0</text><rect x="40" y="190" width="440" height="95" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="260" y="229" fill="#DC2626" font-size="28" text-anchor="middle">Set m = 0</text><path d="M170 285V320H140V356" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M350 285V320H380V356" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="380" width="200" height="90" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="419" fill="#2563EB" font-size="28" text-anchor="middle">T=0, m=0</text><rect x="280" y="380" width="200" height="90" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="380" y="419" fill="#2563EB" font-size="28" text-anchor="middle">T=1, m=0</text><text x="40" y="560" fill="#64748B" font-size="26" text-anchor="start">Unit V; cached M(0) = 1</text><rect x="40" y="615" width="440" height="95" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="260" y="654" fill="#DC2626" font-size="28" text-anchor="middle">Set m = 0</text><path d="M170 710V745H140V781" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M350 710V745H380V781" fill="none" stroke="#DC26