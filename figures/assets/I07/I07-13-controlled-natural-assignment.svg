</text><rect x="840" y="805" width="200" height="90" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="940" y="844" fill="#2563EB" font-size="28" text-anchor="middle">T=1, m=1</text><text x="40" y="1040" fill="#64748B" font-size="26" text-anchor="start">Illustrative units: natural baseline mediator values may differ.</text><text x="40" y="1100" fill="#64748B" font-size="26" text-anchor="start">Both definitions compare T=0 with T=1; the assigned m differs.</text></g></svg>
