<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1130" width="520" height="1130" role="img"><title>Treatment and mediator routes</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1130" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="27" text-anchor="start">Treatment has two routes to Y</text><rect x="175" y="140" width="260" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="305" y="179" fill="#2563EB" font-size="28" text-anchor="middle">T = 1</text><rect x="175" y="420" width="260" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="305" y="459" fill="#7C3AED" font-size="28" text-anchor="middle">M = 2</text><text x="305" y="495" fill="#64748B" font-size="24" text-anchor="middle">M = 2T</text><rect x="175" y="735" width="260" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="305" y="774" fill="#059669" font-size="28" text-anchor="middle">Y = 7</text><text x="305" y="810" fill="#64748B" font-size="24" text-anchor="middle">Y = T + 3M</text><path d="M305 240V396" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M305 525V711" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M175 190H65V790H151" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><text x="100" y="485" fill="#2563EB" font-size="28" text-anchor="start">+T</text><text x="345" y="345" fill="#7C3AED" font-size="28" text-anchor="start">×2</text><text x="345" y="630" fill="#7C3AED" font-size="28" text-anchor="start">×3</text><text x="40" y="920" fill="#2563EB" font-size="28" text-anchor="start">Direct route: 1</text><text x="40" y="985" fill="#7C3AED" font-size="28" text-anchor="start">Mediator route: 2 × 3 = 6</text><text x="40" y="1050" fill="#059669" font-size="28" text-anchor="start">CPU total: 1 + 6 = 7</text></g></svg>
