<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1110" width="520" height="1110" role="img"><title>Paired bootstrap copies entire units</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1110" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="27" text-anchor="start">Resample paired units together</text><text x="40" y="120" fill="#0F172A" font-size="28" text-anchor="start">Original paired units</text><rect x="40" y="160" width="130" height="120" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="105" y="199" fill="#7C3AED" font-size="28" text-anchor="middle">P1</text><text x="105" y="235" fill="#64748B" font-size="24" text-anchor="middle">1→3</text><rect x="195" y="160" width="130" height="120" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="199" fill="#7C3AED" font-size="28" text-anchor="middle">P2</text><text x="260" y="235" fill="#64748B" font-size="24" text-anchor="middle">3→4</text><rect x="350" y="160" width="130" height="120" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="415" y="199" fill="#7C3AED" font-size="28" text-anchor="middle">P3</text><text x="415" y="235" fill="#64748B" font-size="24" text-anchor="middle">2→5</text><path d="M260 304V369" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="393" width="440" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="432" fill="#7C3AED" font-size="28" text-anchor="middle">Draw indices [3,1,3]</text><text x="260" y="468" fill="#64748B" font-size="24" text-anchor="middle">Same pair copied for each index</text><path d="M260 522V587" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="611" width="130" height="120" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="105" y="650" fill="#7C3AED" font-size="28" text-anchor="middle">P3</text><text x="105" y="686" fill="#64748B" font-size="24" text-anchor="middle">2→5</text><rect x="195" y="611" width="130" height="120" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="650" fill="#7C3AED" font-size="28" text-anchor="middle">P1</text><text x="260" y="686" fill="#64748B" font-size="24" text-anchor="middle">1→3</text><rect x="350" y="611" width="130" height="120" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="415" y="650" fill="#7C3AED" font-size="28" text-anchor="middle">P3</text><text x="415" y="686" fill="#64748B" font-size="24" text-anchor="middle">2→5</text><text x="40" y="815" fill="#7C3AED" font-size="28" text-anchor="start">Differences: (3, 2, 3)</text><text x="40" y="890" fill="#059669" font-size="28" text-anchor="start">One resampled mean: 8 / 3</text><text x="40" y="975" fill="#D97706" font-size="24" text-anchor="start">Do not draw base and patched apart.</text><text x="40" y="1040" fill="#64748B" font-size="24" text-anchor="start">Repeats do not add independent units.</text></g></svg>
