<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 850" width="1080" height="850" role="img"><title>Prompt clusters not token independence</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="850" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="28" text-anchor="start">Tokens and seeds stay inside a prompt</text><text x="40" y="105" fill="#64748B" font-size="26" text-anchor="start">Shown: P1, P2 and P10 out of ten independent prompts</text><rect x="40" y="170" width="300" height="310" rx="8" fill="none" stroke="#64748B" stroke-width="2"/><text x="190" y="220" fill="#2563EB" font-size="28" text-anchor="middle">P1</text><rect x="60" y="255" width="260" height="85" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="190" y="294" fill="#2563EB" font-size="28" text-anchor="middle">t₁ … t₂₀</text><text x="190" y="385" fill="#64748B" font-size="25" text-anchor="middle">Seed repeats</text><text x="190" y="440" fill="#64748B" font-size="25" text-anchor="middle">Same input/state</text><path d="M190 480V550" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="574" width="300" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="190" y="613" fill="#7C3AED" font-size="28" text-anchor="middle">One unit: P1</text><text x="190" y="649" fill="#64748B" font-size="24" text-anchor="middle">Within-prompt summary</text><rect x="390" y="170" width="300" height="310" rx="8" fill="none" stroke="#64748B" stroke-width="2"/><text x="540" y="220" fill="#2563EB" font-size="28" text-anchor="middle">P2</text><rect x="410" y="255" width="260" height="85" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="540" y="294" fill="#2563EB" font-size="28" text-anchor="middle">t₁ … t₂₀</text><text x="540" y="385" fill="#64748B" font-size="25" text-anchor="middle">Seed repeats</text><text x="540" y="440" fill="#64748B" font-size="25" text-anchor="middle">Same input/state</text><path d="M540 480V550" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="390" y="574" width="300" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="540" y="613" fill="#7C3AED" font-size="28" text-anchor="middle">One unit: P2</text><text x="540" y="649" fill="#64748B" font-size="24" text-anchor="middle">Within-prompt summary</text><rect x="740" y="170" width="300" height="310" rx="8" fill="none" stroke="#64748B" stroke-width="2"/><text x="890" y="220" fill="#2563EB" font-size="28" text-anchor="middle">P10</text><rect x="760" y="255" width="260" height="85" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="890" y="294" fill="#2563EB" font-size="28" text-anchor="middle">t₁ … t₂₀</text><text x="890" y="385" fill="#64748B" font-size="25" text-anchor="middle">Seed repeats</text><text x="890" y="440" fill="#64748B" font-size="25" text-anchor="middle">Same input/state</text><path d="M890 480V550" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="740" y="574" width="300" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="890" y="613" fill="#7C3AED" font-size="28" text-anchor="middle">One unit: P10</text><text x="890" y="649" fill="#64748B" font-size="24" text-anchor="middle">Within-prompt summary</text><text x="40" y="770" fill="#D97706" font-size="26" text-anchor="start">Independent prompt units n = 10, not 200 token measurements.</text></g></svg>
