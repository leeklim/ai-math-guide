<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 875" width="520" height="875" role="img"><title>Twenty question indicator cells group five changed-answer ones and fifteen same-answer zeros whose sum five divided by twenty gives dependence zero point two five</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="875" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="28" text-anchor="start">One indicator per question</text><text x="40" y="115" fill="#64748B" font-size="26" text-anchor="start">1 = answer changed; 0 = same</text><rect x="40" y="190" width="72" height="72" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="76" y="238" fill="#DC2626" font-size="28" text-anchor="middle">1</text><rect x="132" y="190" width="72" height="72" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="168" y="238" fill="#DC2626" font-size="28" text-anchor="middle">1</text><rect x="224" y="190" width="72" height="72" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="260" y="238" fill="#DC2626" font-size="28" text-anchor="middle">1</text><rect x="316" y="190" width="72" height="72" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="352" y="238" fill="#DC2626" font-size="28" text-anchor="middle">1</text><rect x="408" y="190" width="72" height="72" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="444" y="238" fill="#DC2626" font-size="28" text-anchor="middle">1</text><rect x="40" y="300" width="72" height="72" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="76" y="348" fill="#64748B" font-size="28" text-anchor="middle">0</text><rect x="132" y="300" width="72" height="72" rx="8" fill="white" stroke="#64748B" stroke-width="2"/><text x="168" y="348" fill="#