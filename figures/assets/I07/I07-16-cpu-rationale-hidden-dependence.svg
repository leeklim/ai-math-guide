<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1140" width="1080" height="1140" role="img"><title>Two CPU binary-signal models both originally have hidden one rationale one answer one; after rationale alone becomes zero rationale-reading model answers zero while hidden-reading model still answers one</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="1140" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="28" text-anchor="start">Reads rationale signal</text><text x="600" y="55" fill="#0F172A" font-size="28" text-anchor="start">Reads hidden signal</text><text x="40" y="110" fill="#64748B" font-size="26" text-anchor="start">Original: H=1, R=1, A=1</text><text x="600" y="110" fill="#64748B" font-size="26" text-anchor="start">Original: H=1, R=1, A=1</text><rect x="120" y="160" width="360" height="110" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="300" y="199" fill="#2563EB" font-size="28" text-anchor="middle">H = 1</text><text x="300" y="235" fill="#64748B" font-size="24" text-anchor="middle">Not read by this answer</text><rect x="120" y="450" width="360" height="110" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="300" y="489" fill="#DC2626" font-size="28" text-anchor="middle">R = 0</text><text x="300" y="525" fill="#64748B" font-size="24" text-anchor="middle">Only R is changed</text><rect x="120" y="790" width="360" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="300" y="829" fill="#059669" font-size="28" text-anchor="middle">Answer A = 0</text><path d="M300 560V766" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="680" y="160" width="360" height="110" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="860" y="199" fill="#2563EB" font-size="28" text-anchor="middle">H = 1</text><text x="860" y="235" fill="#64748B" font-size="24" text-anchor="middle">Read by this answer</text><rect x="680" y="450" width="360" height="110" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="860" y="489" fill="#DC2626" font-size="28" text-anchor="middle">R = 0</text><text x="860" y="525" fill="#64748B" font-size="24" text-anchor="middle">Not read by this answer</text><rect x="680" y="790" width="360" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="860" y="829" fill="#059669" font-size="28" text-anchor="middle">Answer A = 1</text><path d="M680 215H620V845H656" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><text x="650" y="665" fill="#2563EB" font-size="26" text-anchor="start">Uses H</text><text x="40" y="1000" fill="#64748B" font-size="26" text-anchor="start">Same original rationale and answer; different causal dependence.</text><text x="40" y="1060" fill="#D97706" font-size="25" text-anchor="start">CPU binary signals, not a universal linguistic faithfulness score.</text></g></svg>
