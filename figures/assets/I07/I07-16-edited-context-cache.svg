<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 890" width="1080" height="890" role="img"><title>Original token and state row P R1 R2 R3 A contrasts edited row P R1 R2 prime R3 prime A prime with prefix cache reused only for P and R1 while the changed token and suffix are recomputed</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="890" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="28" text-anchor="start">Edit before answering; recompute the suffix</text><text x="40" y="125" fill="#0F172A" font-size="28" text-anchor="start">Original tokens and states</text><rect x="40" y="180" width="140" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="110" y="219" fill="#2563EB" font-size="28" text-anchor="middle">P</text><rect x="240" y="180" width="140" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="310" y="219" fill="#2563EB" font-size="28" text-anchor="middle">R₁</text><rect x="440" y="180" width="140" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="510" y="219" fill="#2563EB" font-size="28" text-anchor="middle">R₂</text><rect x="640" y="180" width="140" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="710" y="219" fill="#2563EB" font-size="28" text-anchor="middle">R₃</text><rect x="840" y="180" width="140" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="910" y="219" fill="#2563EB" font-size="28" text-anchor="middle">A</text><text x="40" y="400" fill="#64748B" font-size="27" text-anchor="start">Same prefix</text><text x="580" y="400" fill="#DC2626" font-size="28" text-anchor="start">Edit R₂</text><path d="M510 280V476" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="465" fill="#0F172A" font-size="28" text-anchor="start">Edited tokens and new states</text><rect x="40" y="500" width="140" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="110" y="539" fill="#2563EB" font-size="28" text-anchor="middle">P</text><rect x="240" y="500" width="140" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="310" y="539" fill="#2563EB" font-size="28" text-anchor="middle">R₁</text><rect x="440" y="500" width="140" height="100" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="510" y="539" fill="#DC2626" font-size="28" text-anchor="middle">R₂′</text><rect x="640" y="500" width="140" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="710" y="539" fill="#7C3AED" font-size="28" text-anchor="middle">R₃′</text><rect x="840" y="500" width="140" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="910" y="539" fill="#059669" font-size="28" text-anchor="middle">A′</text><path d="M580 550H640" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M780 550H840" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="735" fill="#64748B" font-size="27" text-anchor="start">Only P and R₁ can reuse their unchanged prefix cache.</text><text x="40" y="805" fill="#7C3AED" font-size="28" text-anchor="start">R₂′ → R₃′ → A′ must use the edited context.</text></g></svg>
