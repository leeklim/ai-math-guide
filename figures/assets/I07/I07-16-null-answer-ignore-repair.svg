<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1020" width="520" height="1020" role="img"><title>Illustrative edited arithmetic rationale two plus two equals five can be ignored using hidden correct four or repaired to two plus two equals four and both pathways produce answer four</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1020" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="27" text-anchor="start">Same answer, different reactions</text><rect x="40" y="140" width="440" height="110" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="260" y="179" fill="#DC2626" font-size="28" text-anchor="middle">Edited R: "2 + 2 = 5"</text><path d="M180 250V325H140V386" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M340 250V325H380V386" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="410" width="200" height="110" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="449" fill="#7C3AED" font-size="28" text-anchor="middle">Ignore R</text><text x="140" y="485" fill="#64748B" font-size="24" text-anchor="middle">Read hidden 4</text><rect x="280" y="410" width="200" height="110" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="449" fill="#7C3AED" font-size="28" text-anchor="middle">Repair R</text><text x="380" y="485" fill="#64748B" font-size="24" text-anchor="middle">2 + 2 = 4</text><path d="M140 520V585H210V641" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 520V585H310V641" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="140" y="665" width="240" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="704" fill="#059669" font-size="28" text-anchor="middle">Answer 4</text><text x="40" y="885" fill="#64748B" font-size="26" text-anchor="start">Answer label alone cannot choose</text><text x="40" y="945" fill="#64748B" font-size="26" text-anchor="start">between ignoring and correcting.</text></g></svg>
