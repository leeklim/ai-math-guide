<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1100" width="520" height="1100" role="img"><title>Known copy and gate graph</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1100" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="26" text-anchor="start">Known synthetic copy + gate graph</text><rect x="40" y="145" width="200" height="105" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="184" fill="#2563EB" font-size="28" text-anchor="middle">x₀ = 1</text><rect x="280" y="145" width="200" height="105" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="380" y="184" fill="#2563EB" font-size="28" text-anchor="middle">x₁ = −1</text><rect x="40" y="420" width="200" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="459" fill="#7C3AED" font-size="28" text-anchor="middle">Copy = 1</text><text x="140" y="495" fill="#64748B" font-size="24" text-anchor="middle">x₀</text><rect x="280" y="420" width="200" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="459" fill="#7C3AED" font-size="28" text-anchor="middle">Gate = −1</text><text x="380" y="495" fill="#64748B" font-size="24" text-anchor="middle">x₀ × x₁</text><path d="M140 250V396" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M180 250V325H330V396" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 250V396" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M140 525V625H210V696" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 525V625H310V696" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="140" y="720" width="240" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="759" fill="#059669" font-size="28" text-anchor="middle">m(x) = 0</text><text x="260" y="795" fill="#64748B" font-size="24" text-anchor="middle">Copy + gate</text><text x="40" y="955" fill="#059669" font-size="28" text-anchor="start">1 + (−1) = 0</text><text x="40" y="1020" fill="#64748B" font-size="25" text-anchor="start">Nonzero paths cancel at this input.</text></g></svg>
