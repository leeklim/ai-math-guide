<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1020" width="1080" height="1020" role="img"><title>Swapped input control equivalence</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="1020" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="55" fill="#0F172A" font-size="28" text-anchor="start">Original gate-only comparison</text><text x="600" y="55" fill="#0F172A" font-size="28" text-anchor="start">Code's swapped-input comparison</text><rect x="40" y="145" width="440" height="110" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="184" fill="#2563EB" font-size="28" text-anchor="middle">Input: (1, −1)</text><path d="M260 255V371" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="395" width="440" height="110" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="260" y="434" fill="#DC2626" font-size="28" text-anchor="middle">Copy path excluded</text><path d="M260 505V621" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="645" width="440" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="684" fill="#059669" font-size="28" text-anchor="middle">Gate output = −1</text><text x="260" y="720" fill="#64748B" font-size="24" text-anchor="middle">1 × (−1)</text><rect x="600" y="145" width="440" height="110" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="820" y="184" fill="#2563EB" font-size="28" text-anchor="middle">Input: (−1, 1)</text><path d="M820 255V371" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="600" y="395" width="440" height="110" rx="8" fill="white" stroke="#DC2626" stroke-width="2"/><text x="820" y="434" fill="#DC2626" font-size="28" text-anchor="middle">Copy path excluded</text><path d="M820 505V621" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="600" y="645" width="440" height="110" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="820" y="684" fill="#059669" font-size="28" text-anchor="middle">Gate output = −1</text><text x="820" y="720" fill="#64748B" font-size="24" text-anchor="middle">(−1) × 1</text><text x="40" y="870" fill="#7C3AED" font-size="26" text-anchor="start">x₀x₁ = x₁x₀: swapping coordinates leaves the gate term unchanged.</text><text x="40" y="940" fill="#D97706" font-size="27" text-anchor="start">This comparison is not a separate random-graph sample.</text></g></svg>
