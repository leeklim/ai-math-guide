<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 752" width="520" height="752" role="img"><title>microbatch-token-count</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="752" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Valid tokens in one update</text><rect x="40" y="114" width="440" height="124" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="84" y="161" fill="#2563EB" font-size="28">Micro-batches 1 … a</text><text x="61" y="206" fill="#2563EB" font-size="26">N₁, N₂, …, Nₐ valid tokens</text><path d="M260 241V309" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="321" width="440" height="120" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="95" y="367" fill="#7C3AED" font-size="27">Accumulate gradients</text><text x="108" y="408" fill="#7C3AED" font-size="27">Seen tokens = Σᵢ Nᵢ</text><path d="M260 444V511" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="522" width="440" height="97" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="104" y="578" fill="#059669" font-size="27">One optimizer update</text><text x="40" y="691" fill="#475569" font-size="24">Exclude padding from the token counts.</text></g></svg>
