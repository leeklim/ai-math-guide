<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 627" width="520" height="627" role="img"><title>relative-budget</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="627" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Relative training progress</text><text x="40" y="125" fill="#2563EB" font-size="25">Run A: total token budget T_A</text><text x="40" y="302" fill="#059669" font-size="25">Run B: total token budget T_B</text><rect x="40" y="175" width="440" height="45" fill="#E2E8F0"/><rect x="40" y="175" width="220" height="45" fill="#2563EB" fill-opacity=".18"/><path d="M260 163V230" stroke="#2563EB" stroke-width="3"/><text x="226" y="261" fill="#2563EB" font-size="27">50%</text><text x="69" y="207" fill="#2563EB" font-size="25">T_A / 2</text><rect x="40" y="352" width="440" height="45" fill="#E2E8F0"/><rect x="40" y="352" width="220" height="45" fill="#059669" fill-opacity=".18"/><path d="M260 340V407" stroke="#059669" stroke-width="3"/><text x="226" y="438" fill="#059669" font-size="27">50%</text><text x="69" y="384" fill="#059669" font-size="25">T_B / 2</text><text x="40" y="526" fill="#475569" font-size="25">Same fraction of different budgets</text><text x="40" y="570" fill="#475569" font-size="26">T_A / 2 ≠ T_B / 2 if T_A ≠ T_B.</text></g></svg>
