<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 775" width="520" height="775" role="img"><title>run-versus-checkpoints</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="775" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Run units and snapshots</text><rect x="40" y="113" width="440" height="92" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="170" y="169" fill="#7C3AED" font-size="28">Run seed s</text><path d="M260 206V265" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="274" width="440" height="122" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="94" y="327" fill="#2563EB" font-size="28">θ₀ → θ₁ → θ₂ → θ₃</text><text x="93" y="371" fill="#2563EB" font-size="25">One dependent trajectory</text><rect x="40" y="469" width="440" height="172" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="86" y="516" fill="#059669" font-size="26">Independent run seed s′</text><text x="77" y="568" fill="#059669" font-size="28">θ′₀ → θ′₁ → θ′₂ → θ′₃</text><text x="87" y="611" fill="#059669" font-size="24">A separate replication unit</text><text x="40" y="715" fill="#475569" font-size="24">Snapshots share one training seed.</text></g></svg>
