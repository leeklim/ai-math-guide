<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 885" width="1100" height="885" role="img"><title>row-feature-axes</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1100" height="885" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Row correspondence and feature alignment are different operations</text><text x="55" y="132" fill="#0F172A" font-size="26">X_s row IDs</text><text x="425" y="132" fill="#0F172A" font-size="26">X_t: unordered</text><text x="815" y="132" fill="#0F172A" font-size="26">X_t: paired rows</text><rect x="40" y="185" width="255" height="77" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="58" y="233" fill="#2563EB" font-size="26">A · same token</text><rect x="40" y="300" width="255" height="77" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="58" y="348" fill="#2563EB" font-size="26">B · same token</text><rect x="40" y="415" width="255" height="77" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="58" y="463" fill="#2563EB" font-size="26">C · same token</text><rect x="410" y="185" width="255" height="77" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="428" y="233" fill="#2563EB" font-size="26">C · same token</text><rect x="410" y="300" width="255" height="77" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="428" y="348" fill="#2563EB" font-size="26">A · same token</text><rect x="410" y="415" width="255" height="77" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="428" y="463" fill="#2563EB" font-size="26">B · same token</text><rect x="800" y="185" width="255" height="77" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="818" y="233" fill="#2563EB" font-size="26">A · same token</text><rect x="800" y="300" width="255" height="77" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="818" y="348" fill="#2563EB" font-size="26">B · same token</text><rect x="800" y="415" width="255" height="77" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="818" y="463" fill="#2563EB" font-size="26">C · same token</text><path d="M665 223L786 453" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><path d="M665 338L786 223" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><path d="M665 453L786 338" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><text x="394" y="619" fill="#D97706" font-size="27">Reorder rows by sample ID first</text><path d="M925 496V670" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="670" y="682" width="386" height="96" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="690" y="740" fill="#7C3AED" font-size="27">Then apply the same Q</text><text x="684" y="827" fill="#475569" font-size="26">to every feature row.</text></g></svg>
