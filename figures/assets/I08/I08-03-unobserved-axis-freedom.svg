<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 735" width="520" height="735" role="img"><title>unobserved-axis-freedom</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="735" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Ambiguity on an unseen axis</text><text x="40" y="112" fill="#2563EB" font-size="24">Observed rows: (−1,0), (0,0), (1,0)</text><path d="M100 165V495" stroke="#CBD5E1" stroke-width="1"/><path d="M180 165V495" stroke="#CBD5E1" stroke-width="1"/><path d="M260 165V495" stroke="#CBD5E1" stroke-width="1"/><path d="M340 165V495" stroke="#CBD5E1" stroke-width="1"/><path d="M420 165V495" stroke="#CBD5E1" stroke-width="1"/><path d="M90 170H430" stroke="#CBD5E1" stroke-width="1"/><path d="M90 250H430" stroke="#CBD5E1" stroke-width="1"/><path d="M90 330H430" stroke="#CBD5E1" stroke-width="1"/><path d="M90 410H430" stroke="#CBD5E1" stroke-width="1"/><path d="M90 490H430" stroke="#CBD5E1" stroke-width="1"/><path d="M90 330H430M260 165V497" fill="none" stroke="#475569" stroke-width="2"/><circle cx="100" cy="330" r="6" fill="#2563EB"/><text x="90" y="366" fill="#2563EB" font-size="25">-1</text><circle cx="260" cy="330" r="6" fill="#2563EB"/><text x="225" y="366" fill="#2563EB" font-size="25">0</text><circle cx="420" cy="330" r="6" fill="#2563EB"/><text x="410" y="366" fill="#2563EB" font-size="25">1</text><path d="M260 321V170" fill="none" stroke="#7C3AED" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M260 339V490" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="294" y="192" fill="#7C3AED" font-size="25">Q₁e₂ = e₂</text><text x="294" y="483" fill="#059669" font-size="24">Q₂e₂ = −e₂</text><text x="40" y="573" fill="#475569" font-size="25">Q₁ = I; Q₂ = diag(1,−1)</text><text x="40" y="625" fill="#475569" font-size="24">Both fit the observed rows exactly.</text><text x="40" y="679" fill="#475569" font-size="24">The dashed axis is not observed data.</text></g></svg>
