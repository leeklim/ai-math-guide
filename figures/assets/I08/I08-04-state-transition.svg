<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 790" width="520" height="790" role="img"><title>state-transition</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="790" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">One update is a state transition</text><rect x="40" y="125" width="440" height="105" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="125" y="188" fill="#2563EB" font-size="28">Current θ_k = 2</text><path d="M260 234V302" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="314" width="440" height="150" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="115" y="368" fill="#7C3AED" font-size="28">Gradient g_k = 3</text><text x="91" y="418" fill="#7C3AED" font-size="26">η = 0.1; ηg_k = 0.3</text><path d="M260 468V536" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="548" width="440" height="110" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="69" y="613" fill="#059669" font-size="27">Next θ = 2 − 0.3 = 1.7</text><text x="40" y="728" fill="#475569" font-size="26">Repeat F with the next state.</text></g></svg>
