<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1020" width="950" height="1020" role="img"><title>Hessian-vector product without materializing the full Hessian</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="950" height="1020" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Two differentiations, one vector output</text><rect x="40" y="120" width="350" height="125" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="80" y="175" fill="#2563EB" font-size="28">θ : p parameters</text><text x="80" y="217" fill="#2563EB" font-size="26">fixed v : length p</text><path d="M215 248V320" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="40" y="332" width="350" height="115" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="78" y="381" fill="#7C3AED" font-size="28">Differentiate L(θ)</text><text x="95" y="421" fill="#7C3AED" font-size="26">∇L : length p</text><path d="M394 389H481" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="493" y="332" width="400" height="115" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="560" y="381" fill="#7C3AED" font-size="28">Dot with fixed v</text><text x="550" y="422" fill="#7C3AED" font-size="26">s = ∇Lᵀv : scalar</text><path d="M693 450V534" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="493" y="546" width="400" height="115" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="517" y="595" fill="#7C3AED" font-size="26">Differentiate s in θ</text><text x="611" y="633" fill="#7C3AED" font-size="28">∇s = Hᵀv</text><path d="M693 664V750" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="493" y="762" width="400" height="110" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="597" y="826" fill="#059669" font-size="28">Hv : length p</text><rect x="40" y="568" width="350" height="202" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="77" y="628" fill="#D97706" font-size="26">C² loss ⇒ Hᵀ = H</text><text x="84" y="685" fill="#D97706" font-size="26">No p × p array</text><text x="61" y="727" fill="#D97706" font-size="26">needs to be stored.</text><text x="40" y="950" fill="#475569" font-size="25">Autodiff graph and intermediate values still require memory.</text></g></svg>
