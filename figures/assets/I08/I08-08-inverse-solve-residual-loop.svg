<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 900" width="1190" height="900" role="img"><title>An iterative inverse-Hessian solve uses HVPs and checks the residual</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1190" height="900" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Find u; a Hessian product alone is not the inverse</text><rect x="40" y="135" width="260" height="118" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="85" y="206" fill="#2563EB" font-size="28">Candidate uⱼ</text><path d="M304 194H385" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="397" y="135" width="300" height="118" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="466" y="206" fill="#7C3AED" font-size="28">HVP: H uⱼ</text><path d="M700 194H783" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="795" y="135" width="355" height="118" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="850" y="206" fill="#D97706" font-size="28">rⱼ = v − H uⱼ</text><path d="M972 257V352" fill="none" stroke="#D97706" stroke-width="3"  marker-end="url(#arrow)"/><rect x="795" y="364" width="355" height="120" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="851" y="435" fill="#D97706" font-size="28">Residual small?</text><path d="M790 424H701" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><text x="739" y="390" fill="#059669" font-size="24">yes</text><rect x="396" y="364" width="295" height="120" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="414" y="435" fill="#059669" font-size="26">Return candidate uⱼ</text><path d="M973 488V594H170V265" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="547" y="572" fill="#7C3AED" font-size="26">no: next candidate</text><rect x="40" y="683" width="1110" height="137" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="76" y="735" fill="#D97706" font-size="26">Small residual: the selected linear equation is solved well.</text><text x="76" y="787" fill="#D97706" font-size="26">Finite retraining approximation: a separate validation question.</text></g></svg>
