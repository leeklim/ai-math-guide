<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1040" width="1000" height="1040" role="img"><title>Implicit derivative of the stationary optimum under example upweighting</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1000" height="1040" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Balance the added training gradient</text><rect x="80" y="120" width="840" height="118" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="225" y="188" fill="#2563EB" font-size="30">∇L(θ̂_ε) + ε ∇ℓᵢ(θ̂_ε) = 0</text><path d="M260 242V316" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M740 242V316" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><text x="350" y="290" fill="#475569" font-size="25">Differentiate at ε=0</text><rect x="80" y="328" width="360" height="152" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="172" y="378" fill="#7C3AED" font-size="28">Chain rule</text><text x="135" y="440" fill="#7C3AED" font-size="28">H · dθ̂_ε/dε</text><rect x="560" y="328" width="360" height="152" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="642" y="378" fill="#7C3AED" font-size="28">Product rule</text><text x="581" y="440" fill="#7C3AED" font-size="26">∇ℓᵢ + 0 · (…) = ∇ℓᵢ</text><path d="M260 484V540H400V580" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M740 484V540H600V580" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="210" y="592" width="580" height="119" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="325" y="662" fill="#7C3AED" font-size="29">H · dθ̂_ε/dε = −∇ℓᵢ</text><path d="M500 715V790" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="160" y="804" width="680" height="118" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="300" y="877" fill="#059669" font-size="30">dθ̂_ε/dε = −H⁻¹ ∇ℓᵢ</text><text x="80" y="989" fill="#475569" font-size="26">Smooth local optimum branch; invertible H.</text></g></svg>
