<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 830" width="1130" height="830" role="img"><title>A bootstrap resample draws prompt trajectories together, including duplicate rows</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1130" height="830" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Resample complete prompt trajectories</text><text x="40" y="131" fill="#475569" font-size="28">Original rows</text><text x="675" y="131" fill="#475569" font-size="28">One bootstrap draw</text><rect x="40" y="180" width="420" height="112" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="61" y="222" fill="#2563EB" font-size="27">Prompt A</text><text x="62" y="267" fill="#2563EB" font-size="28">A₀ — A₁ — A₂</text><rect x="40" y="365" width="420" height="112" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="61" y="407" fill="#7C3AED" font-size="27">Prompt B</text><text x="62" y="452" fill="#7C3AED" font-size="28">B₀ — B₁ — B₂</text><rect x="40" y="550" width="420" height="112" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="61" y="592" fill="#059669" font-size="27">Prompt C</text><text x="62" y="637" fill="#059669" font-size="28">C₀ — C₁ — C₂</text><rect x="670" y="180" width="420" height="112" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="691" y="222" fill="#2563EB" font-size="27">Draw 1: prompt A</text><text x="692" y="267" fill="#2563EB" font-size="28">A₀ — A₁ — A₂</text><rect x="670" y="365" width="420" height="112" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="691" y="407" fill="#2563EB" font-size="27">Draw 2: prompt A</text><text x="692" y="452" fill="#2563EB" font-size="28">A₀ — A₁ — A₂</text><rect x="670" y="550" width="420" height="112" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="691" y="592" fill="#059669" font-size="27">Draw 3: prompt C</text><text x="692" y="637" fill="#059669" font-size="28">C₀ — C₁ — C₂</text><path d="M464 213H658" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M464 262L658 416" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><path d="M464 606H658" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><text x="40" y="749" fill="#475569" font-size="28">Each selected row keeps its checkpoint pairing.</text></g></svg>
