<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 945" width="1200" height="945" role="img"><title>Different random-call orders use different values for shuffle despite the same RNG seed</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1200" height="945" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Same RNG seed does not mean the same random condition</text><text x="40" y="135" fill="#475569" font-size="28">Method A: 3 calls</text><text x="40" y="425" fill="#475569" font-size="28">Method B: 4 calls</text><rect x="160" y="180" width="220" height="120" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="246" y="221" fill="#D97706" font-size="28">u1</text><text x="178" y="271" fill="#7C3AED" font-size="25">Initialization</text><path d="M384 240H408" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="420" y="180" width="220" height="120" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="506" y="221" fill="#D97706" font-size="28">u2</text><text x="438" y="271" fill="#7C3AED" font-size="25">Dropout</text><path d="M644 240H668" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="680" y="180" width="220" height="120" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="766" y="221" fill="#D97706" font-size="28">u3</text><text x="698" y="271" fill="#7C3AED" font-size="25">Shuffle</text><rect x="160" y="480" width="220" height="120" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="246" y="521" fill="#D97706" font-size="28">u1</text><text x="178" y="571" fill="#7C3AED" font-size="25">Initialization</text><path d="M384 540H408" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="420" y="480" width="220" height="120" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="506" y="521" fill="#D97706" font-size="28">u2</text><text x="438" y="571" fill="#7C3AED" font-size="25">Augmentation</text><path d="M644 540H668" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="680" y="480" width="220" height="120" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="766" y="521" fill="#D97706" font-size="28">u3</text><text x="698" y="571" fill="#7C3AED" font-size="25">Dropout</text><path d="M904 540H928" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="940" y="480" width="220" height="120" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="1026" y="521" fill="#D97706" font-size="28">u4</text><text x="958" y="571" fill="#7C3AED" font-size="25">Shuffle</text><text x="40" y="725" fill="#475569" font-size="28">One stream: u₁, u₂, u₃, u₄, …</text><text x="40" y="790" fill="#D97706" font-size="28">Shuffle uses u₃ above, but u₄ below.</text><text x="40" y="873" fill="#475569" font-size="26">Isolate roles with separate streams or store shared inputs.</text></g></svg>
