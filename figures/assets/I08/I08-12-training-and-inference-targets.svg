<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 930" width="1160" height="930" role="img"><title>Training-example attribution and present-input attribution concern different graph inputs</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1160" height="930" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Training history and current input are different targets</text><text x="40" y="126" fill="#475569" font-size="28">Training</text><rect x="40" y="153" width="240" height="120" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="91" y="200" fill="#2563EB" font-size="28">Training</text><text x="89" y="245" fill="#2563EB" font-size="28">example z</text><path d="M284 211H386" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="398" y="153" width="305" height="120" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="468" y="200" fill="#7C3AED" font-size="28">Optimizer</text><text x="440" y="245" fill="#7C3AED" font-size="27">θ₀ → θ₁ → θ₂</text><path d="M707 211H817" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="829" y="153" width="280" height="120" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="887" y="226" fill="#059669" font-size="28">Learned θ₂</text><path d="M968 277V397H551V506" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><text x="40" y="489" fill="#475569" font-size="28">Inference</text><rect x="40" y="518" width="240" height="120" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="107" y="565" fill="#2563EB" font-size="28">Current</text><text x="92" y="610" fill="#2563EB" font-size="28">prompt x′</text><path d="M284 576H386" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="398" y="518" width="305" height="120" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="460" y="565" fill="#7C3AED" font-size="28">Fixed model</text><text x="483" y="610" fill="#7C3AED" font-size="28">f_θ₂(x′)</text><path d="M707 576H817" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="829" y="518" width="280" height="120" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="890" y="565" fill="#059669" font-size="28">Prediction</text><text x="860" y="610" fill="#059669" font-size="26">and target loss</text><text x="40" y="760" fill="#D97706" font-size="27">Input attribution: which current input elements?</text><text x="40" y="814" fill="#D97706" font-size="27">Data attribution: which past training examples?</text><text x="40" y="883" fill="#475569" font-size="26">High candidate score alone does not prove past exposure.</text></g></svg>
