<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1010" width="1220" height="1010" role="img"><title>One held-out prompt is compared with centroids computed only from the remaining seven prompts</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1220" height="1010" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">One LOO fold excludes its test prompt from both means</text><rect x="40" y="155" width="240" height="122" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="59" y="205" fill="#2563EB" font-size="26">Held out: Paris</text><text x="73" y="252" fill="#2563EB" font-size="27">activation h</text><rect x="400" y="130" width="340" height="164" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="428" y="179" fill="#2563EB" font-size="26">Place train prompts</text><text x="420" y="224" fill="#2563EB" font-size="25">Berlin, Rome, Madrid</text><text x="471" y="268" fill="#2563EB" font-size="26">3 activations</text><path d="M744 211H818" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="830" y="130" width="300" height="164" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="920" y="206" fill="#7C3AED" font-size="29">μ_place</text><text x="912" y="257" fill="#7C3AED" font-size="27">mean of 3</text><rect x="400" y="400" width="340" height="164" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="412" y="449" fill="#2563EB" font-size="25">Animal train prompts</text><text x="478" y="492" fill="#2563EB" font-size="25">Robin, Salmon,</text><text x="476" y="536" fill="#2563EB" font-size="25">Tiger, Sparrow</text><path d="M744 481H818" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="830" y="400" width="300" height="164" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="918" y="475" fill="#7C3AED" font-size="29">μ_animal</text><text x="912" y="530" fill="#7C3AED" font-size="27">mean of 4</text><path d="M1142 210H1170V730H1142" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M1030 568V638" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M160 281V730H638" fill="none" stroke="#2563EB" stroke-width="3"  marker-end="url(#arrow)"/><rect x="650" y="650" width="480" height="164" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="681" y="702" fill="#059669" font-size="27">Compare distances from h</text><text x="694" y="748" fill="#059669" font-size="26">to μ_place and μ_animal</text><text x="687" y="792" fill="#059669" font-size="26">Nearest centroid → label</text><text x="40" y="898" fill="#D97706" font-size="27">Repeat 8 held-out judgments; accuracy increments by 1/8.</text><text x="40" y="958" fill="#475569" font-size="27">Overlapping training folds are not 8 independent seeds.</text></g></svg>
