<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1281 835" width="1281" height="835" role="img"><title>Six Pythia revisions execute sequentially with one checkpoint resident and manifest provenance</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1281" height="835" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Six revisions, one resident checkpoint at a time</text><text x="40" y="128" fill="#475569" font-size="27">Separate processes in order; load → measure → release</text><rect x="40" y="201" width="166" height="208" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="95" y="246" fill="#2563EB" font-size="27">step</text><text x="116" y="302" fill="#2563EB" font-size="28">0</text><text x="69" y="369" fill="#059669" font-size="25">free GPU</text><path d="M210 304H235" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="247" y="201" width="166" height="208" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="302" y="246" fill="#2563EB" font-size="27">step</text><text x="302" y="302" fill="#2563EB" font-size="28">1000</text><text x="276" y="369" fill="#059669" font-size="25">free GPU</text><path d="M417 304H442" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="454" y="201" width="166" height="208" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="509" y="246" fill="#2563EB" font-size="27">step</text><text x="502" y="302" fill="#2563EB" font-size="28">10000</text><text x="483" y="369" fill="#059669" font-size="25">free GPU</text><path d="M624 304H649" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="661" y="201" width="166" height="208" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="716" y="246" fill="#2563EB" font-size="27">step</text><text x="709" y="302" fill="#2563EB" font-size="28">50000</text><text x="690" y="369" fill="#059669" font-size="25">free GPU</text><path d="M831 304H856" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="868" y="201" width="166" height="208" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="923" y="246" fill="#2563EB" font-size="27">step</text><text x="909" y="302" fill="#2563EB" font-size="28">100000</text><text x="897" y="369" fill="#059669" font-size="25">free GPU</text><path d="M1038 304H1063" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="1075" y="201" width="166" height="208" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="1130" y="246" fill="#2563EB" font-size="27">step</text><text x="1116" y="302" fill="#2563EB" font-size="28">143000</text><text x="1104" y="369" fill="#059669" font-size="25">free GPU</text><rect x="40" y="527" width="1201" height="143" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="75" y="587" fill="#D97706" font-size="28">Same 8 prompts; layer 5; last token; seed 20261001</text><text x="75" y="638" fill="#D97706" font-size="26">Each resolved SHA and artifact hash goes into its local manifest.</text><text x="40" y="763" fill="#475569" font-size="27">Six time points from one training run ≠ six independent seeds.</text></g></svg>
