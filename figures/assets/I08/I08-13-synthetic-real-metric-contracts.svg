<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 860" width="1160" height="860" role="img"><title>Synthetic report behavior scores must not be concatenated with actual first-token NLL values</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1160" height="860" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Replace the metric contract; do not join incompatible values</text><rect x="40" y="135" width="470" height="164" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="88" y="185" fill="#2563EB" font-size="28">CPU synthetic behavior</text><text x="77" y="242" fill="#2563EB" font-size="27">0.49, 0.52, 0.61, …, 0.87</text><text x="76" y="276" fill="#2563EB" font-size="26">Arbitrary report-format score</text><rect x="650" y="135" width="470" height="164" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="697" y="185" fill="#059669" font-size="28">Actual local behavior</text><text x="735" y="239" fill="#059669" font-size="27">Mean first-token NLL</text><text x="794" y="278" fill="#059669" font-size="26">Lower is better</text><path d="M518 217H638" stroke="#DC2626" stroke-width="3" stroke-dasharray="8 7"/><path d="M561 197L595 237M561 237L595 197" stroke="#DC2626" stroke-width="3"/><text x="447" y="371" fill="#DC2626" font-size="27">No concatenation</text><path d="M275 303V461H429V531" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><path d="M885 303V461H733V531" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="230" y="544" width="700" height="160" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="346" y="599" fill="#7C3AED" font-size="27">Validate source, formula and units</text><text x="424" y="652" fill="#7C3AED" font-size="28">Replace the report column</text><text x="40" y="788" fill="#475569" font-size="27">A shared column name does not create a shared scale.</text></g></svg>
