<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1242 1010" width="1242" height="1010" role="img"><title>Whole MLP output zero-ablation keeps baseline-selected token IDs fixed within a margin comparison</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L9 6L1 11L3.3 6Z" fill="context-stroke"/></marker></defs><rect width="1242" height="1010" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A"><text x="40" y="52" fill="#0F172A" font-size="28">Zero the entire selected MLP output, not one feature</text><text x="40" y="132" fill="#475569" font-size="28">Baseline: choose token IDs A and B</text><rect x="40" y="169" width="280" height="156" rx="7" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="95" y="218" fill="#2563EB" font-size="28">MLP output h</text><text x="63" y="282" fill="#2563EB" font-size="26">[ h₁  h₂  …  h_d ]</text><path d="M324 247H390" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="402" y="169" width="275" height="156" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="432" y="257" fill="#7C3AED" font-size="27">Residual r + h</text><path d="M681 247H760" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="772" y="169" width="430" height="156" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="797" y="258" fill="#D97706" font-size="27">m_base = logit_A − logit_B</text><text x="40" y="435" fill="#475569" font-size="28">Ablated: keep the same token IDs A and B</text><rect x="40" y="472" width="280" height="156" rx="7" fill="#DC2626" fill-opacity=".07" stroke="#DC2626" stroke-width="2"/><text x="93" y="521" fill="#DC2626" font-size="28">Zero output</text><text x="80" y="585" fill="#DC2626" font-size="26">[ 0  0  …  0 ]</text><path d="M324 550H390" fill="none" stroke="#7C3AED" stroke-width="3"  marker-end="url(#arrow)"/><rect x="402" y="472" width="275" height="156" rx="7" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="432" y="562" fill="#7C3AED" font-size="27">Residual r + 0</text><path d="M681 550H760" fill="none" stroke="#059669" stroke-width="3"  marker-end="url(#arrow)"/><rect x="772" y="472" width="430" height="156" rx="7" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="838" y="562" fill="#D97706" font-size="27">m_ablated: same A, B</text><rect x="240" y="741" width="775" height="118" rx="7" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="459" y="812" fill="#059669" font-size="29">U = m_base − m_ablated</text><text x="40" y="947" fill="#475569" font-size="27">Other checkpoints may choose different baseline token pairs.</text></g></svg>
