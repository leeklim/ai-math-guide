<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" role="img" aria-labelledby="title desc">
  <title id="title">Different expressions for one value and different values for one symbol</title>
  <desc id="desc">The expressions three, three point zero, and six divided by two share the value three. Below, the symbol x remains unchanged while its assigned value is three, four, or negative one in separate calculations.</desc>
  <rect width="520" height="600" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="260" y="56" font-size="24" font-weight="700" fill="#0F172A">Expression and value</text>
    <text x="260" y="108" font-size="22" font-weight="700" fill="#475569">Different expressions</text>
    <g font-size="30" font-weight="700" fill="#1E3A8A">
      <text x="100" y="164">3</text>
      <text x="260" y="164">3.0</text>
      <text x="420" y="164">6 ÷ 2</text>
    </g>
    <path d="M100 184V210H420V184M260 210V240" fill="none" stroke="#64748B" stroke-width="2"/>
    <text x="260" y="278" font-size="30" font-weight="700" fill="#065F46">Same value: 3</text>
    <path d="M44 312H476" stroke="#CBD5E1" stroke-width="2"/>
    <text x="260" y="358" font-size="22" font-weight="700" fill="#475569">Same symbol, separate calculations</text>
    <g font-size="30" font-weight="700">
      <text x="200" y="416" fill="#1E3A8A">x</text><text x="260" y="416" fill="#475569">=</text><text x="324" y="416" fill="#065F46">3</text>
      <text x="200" y="470" fill="#1E3A8A">x</text><text x="260" y="470" fill="#475569">=</text><text x="324" y="470" fill="#065F46">4</text>
      <text x="200" y="524" fill="#1E3A8A">x</text><text x="260" y="524" fill="#475569">=</text><text x="324" y="524" fill="#065F46">−1</text>
    </g>
    <text x="260" y="560" font-size="22" fill="#334155">The name x stays the same.</text>
  </g>
</svg>
