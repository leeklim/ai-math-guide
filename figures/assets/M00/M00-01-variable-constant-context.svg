<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">The letter c is fixed in one calculation context and varied in another</title>
  <desc id="desc">For c x plus one, the left table fixes c at two and varies x to produce one, three, and seven. The right table fixes x at three and varies c to produce four, seven, and ten.</desc>
  <rect width="800" height="450" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="400" y="54" font-size="26" font-weight="700" fill="#0F172A">Same expression: cx + 1</text>
    <rect x="40" y="90" width="344" height="270" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="416" y="90" width="344" height="270" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="212" y="130" font-size="22" font-weight="700" fill="#5B21B6">Fix c = 2</text>
    <text x="588" y="130" font-size="22" font-weight="700" fill="#5B21B6">Fix x = 3</text>
    <g font-size="18" font-weight="700" fill="#475569">
      <text x="92" y="177">x varies</text><text x="254" y="177">2x + 1</text>
      <text x="468" y="177">c varies</text><text x="630" y="177">3c + 1</text>
    </g>
    <path d="M64 193H360M440 193H736" stroke="#CBD5E1" stroke-width="2"/>
    <g font-size="24" font-weight="700">
      <text x="92" y="236" fill="#1E3A8A">0</text><text x="254" y="236" fill="#065F46">2 × 0 + 1 = 1</text>
      <text x="92" y="284" fill="#1E3A8A">1</text><text x="254" y="284" fill="#065F46">2 × 1 + 1 = 3</text>
      <text x="92" y="332" fill="#1E3A8A">3</text><text x="254" y="332" fill="#065F46">2 × 3 + 1 = 7</text>
      <text x="468" y="236" fill="#1E3A8A">1</text><text x="630" y="236" fill="#065F46">3 × 1 + 1 = 4</text>
      <text x="468" y="284" fill="#1E3A8A">2</text><text x="630" y="284" fill="#065F46">3 × 2 + 1 = 7</text>
      <text x="468" y="332" fill="#1E3A8A">3</text><text x="630" y="332" fill="#065F46">3 × 3 + 1 = 10</text>
    </g>
    <text x="212" y="408" font-size="20" fill="#334155">Here c is a constant.</text>
    <text x="588" y="408" font-size="20" fill="#334155">Here c is a variable.</text>
  </g>
</svg>
