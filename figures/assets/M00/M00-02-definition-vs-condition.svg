<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Defining a score and finding an input ask different questions</title>
  <desc id="desc">With w equal to two and b equal to one, defining s as two x plus one computes s equal to seven from the known input three. Requiring s equal to seven instead gives the equation two x plus one equals seven and asks for x equal to three.</desc>
  <rect width="760" height="420" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="380" y="54" font-size="24" font-weight="700" fill="#0F172A">Same model, different known quantity</text>
    <text x="380" y="94" font-size="20" fill="#475569">w = 2, b = 1</text>
    <rect x="40" y="130" width="324" height="210" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="396" y="130" width="324" height="210" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <text x="202" y="170" font-size="22" font-weight="700" fill="#1E3A8A">Define a score</text><text x="558" y="170" font-size="22" font-weight="700" fill="#5B21B6">Require a score</text>
    <text x="202" y="222" font-size="26" font-weight="700" fill="#334155">s ≔ 2x + 1</text><text x="558" y="222" font-size="26" font-weight="700" fill="#334155">2x + 1 = 7</text>
    <text x="202" y="270" font-size="20" fill="#475569">Given x = 3</text><text x="558" y="270" font-size="20" fill="#475569">Given s = 7</text>
    <text x="202" y="316" font-size="24" font-weight="700" fill="#065F46">Calculate s = 7</text><text x="558" y="316" font-size="24" font-weight="700" fill="#065F46">Find x = 3</text>
    <text x="380" y="384" font-size="20" fill="#334155">The surrounding question determines the role of the equality.</text>
  </g>
</svg>
