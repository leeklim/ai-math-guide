<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">A function evaluation shown as a calculation and as a point on a graph</title>
  <desc id="desc">The left panel follows input three through multiply by two and add one to output seven. The right panel plots the same input-output pair as the point three comma seven on the line y equals two x plus one.</desc>
  <defs>
    <marker id="process-arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto">
      <path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="640" rx="18" fill="#F8FAFC"/>
  <g transform="translate(0 30)">
  <text x="480" y="40" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F172A">One function evaluation, two views</text>

  <rect x="44" y="72" width="408" height="420" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="248" y="108" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">Evaluation view</text>

  <text x="142" y="157" text-anchor="end" font-family="sans-serif" font-size="17" font-weight="700" fill="#475569">Input</text>
  <circle cx="248" cy="151" r="34" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
  <text x="248" y="158" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">x = 3</text>

  <path d="M248 190V216" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="butt" marker-end="url(#process-arrow)"/>
  <rect x="174" y="227" width="148" height="48" rx="24" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="248" y="258" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#5B21B6">multiply by 2</text>

  <path d="M248 284V310" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="butt" marker-end="url(#process-arrow)"/>
  <circle cx="248" cy="339" r="25" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="248" y="346" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#334155">6</text>

  <path d="M248 373V395" fill="none" stroke="#D97706" stroke-width="3" stroke-linecap="butt" marker-end="url(#process-arrow)"/>
  <rect x="188" y="406" width="120" height="44" rx="22" fill="#FFEDD5" stroke="#D97706" stroke-width="2"/>
  <text x="248" y="434" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#9A3412">add 1</text>

  <text x="378" y="391" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#475569">Output f(3)</text>
  <path d="M316 428H344" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="butt" marker-end="url(#process-arrow)"/>
  <circle cx="378" cy="428" r="25" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
  <text x="378" y="435" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#065F46">7</text>
  <text x="248" y="478" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">f(3) = 2 × 3 + 1 = 7</text>

  <rect x="508" y="72" width="408" height="420" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="712" y="108" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#065F46">Graph view</text>

  <g stroke="#E2E8F0" stroke-width="1">
    <path d="M572 142V438M638 142V438M704 142V438M770 142V438M836 142V438"/>
    <path d="M572 405H868M572 339H868M572 273H868M572 207H868M572 141H868"/>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="butt" marker-end="url(#process-arrow)">
    <path d="M572 438H878"/>
    <path d="M572 438V126"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#475569">
    <text x="572" y="464" text-anchor="middle">0</text>
    <text x="638" y="464" text-anchor="middle">1</text>
    <text x="704" y="464" text-anchor="middle">2</text>
    <text x="770" y="464" text-anchor="middle">3</text>
    <text x="836" y="464" text-anchor="middle">4</text>
    <text x="556" y="410" text-anchor="end">1</text>
    <text x="556" y="344" text-anchor="end">3</text>
    <text x="556" y="278" text-anchor="end">5</text>
    <text x="556" y="212" text-anchor="end">7</text>
    <text x="556" y="146" text-anchor="end">9</text>
    <text x="886" y="444" font-size="18" font-weight="700">x</text>
    <text x="565" y="120" font-size="18" font-weight="700">y</text>
  </g>

  <path d="M572 405L836 141" fill="none" stroke="#059669" stroke-width="4"/>
  <text x="746" y="146" text-anchor="end" font-family="sans-serif" font-size="18" font-weight="700" fill="#047857">y = 2x + 1</text>
  <path d="M770 438V207M572 207H770" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7 7"/>
  <circle cx="770" cy="207" r="8" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3"/>
  <text x="794" y="238" font-family="sans-serif" font-size="18" font-weight="700" fill="#5B21B6">(3, 7)</text>
  <text x="712" y="482" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">The pair (x, f(x)) becomes one point on the graph.</text>

  <text x="480" y="534" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">The calculation f(3) = 7 and the graph point (3, 7) describe the same input-output pair.</text>
  </g>
</svg>
