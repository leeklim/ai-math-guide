<rect width="720" height="520" rx="18" fill="#F8FAFC"/><g font-family="sans-serif">
<text x="360" y="54" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Declared outputs versus reached outputs</text><text x="172" y="110" text-anchor="middle" font-size="22" font-weight="700" fill="#1E3A8A">Domain A</text><text x="548" y="110" text-anchor="middle" font-size="22" font-weight="700" fill="#065F46">Codomain B</text><ellipse cx="172" cy="284" rx="98" ry="140" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><ellipse cx="548" cy="284" rx="118" ry="140" fill="#FFFFFF" stroke="#059669" stroke-width="2"/><text x="172" y="224" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A8A">1</text><text x="172" y="292" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A8A">2</text><text x="172" y="360" text-anchor="middle" font-size="26" font-weight="700" fill="#1E3A8A">3</text><text x="516" y="224" text-anchor="middle" font-size="26" font-weight="700" fill="#065F46">a</text><text x="590" y="258" text-anchor="middle" font-size="26" font-weight="700" fill="#475569">b</text><text x="516" y="360" text-anchor="middle" font-size="26" font-weight="700" fill="#065F46">c</text><text x="590" y="394" text-anchor="middle" font-size="26" font-weight="700" fill="#475569">d</text><circle cx="516" cy="216" r="24" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 4"/><circle cx="516" cy="352" r="24" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 4"/><path d="M198 216H484" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M198 284L484 216" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M198 352H484" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="474" text-anchor="middle" font-size="22" font-weight="400" fill="#334155">Marked outputs form the range: {a, c}.</text>
