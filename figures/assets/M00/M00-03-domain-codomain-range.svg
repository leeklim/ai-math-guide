<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">Only the outputs reached from the domain form the range</title><desc id="desc">The domain one two three maps to a a c inside codomain a b c d. Dashed circles mark a and c as the range.</desc>
