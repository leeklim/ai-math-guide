<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
<title id="title">A function permits shared outputs but excludes ambiguous and missing outputs</title><desc id="desc">The valid panel maps one and two to four and three to seven. The ambiguous panel maps one to four and six. The incomplete panel gives no output for input three.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="960" height="460" rx="18" fill="#F8FAFC"/><g font-family="sans-serif">
<text x="480" y="54" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A">Check every input, not every output</text><rect x="40" y="94" width="272" height="280" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="176" y="136" text-anchor="middle" font-size="22" font-weight="700" fill="#065F46">Valid function</text><text x="88" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">1</text><text x="88" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">2</text><text x="88" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">3</text><text x="176" y="414" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">Shared output is allowed.</text><rect x="344" y="94" width="272" height="280" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="480" y="136" text-anchor="middle" font-size="22" font-weight="700" fill="#9A3412">Ambiguous</text><text x="392" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">1</text><text x="392" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">2</text><text x="392" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">3</text><text x="480" y="414" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">Input 1 has two outputs.</text><rect x="648" y="94" width="272" height="280" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="784" y="136" text-anchor="middle" font-size="22" font-weight="700" fill="#9A3412">Incomplete</text><text x="696" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">1</text><text x="696" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">2</text><text x="696" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">3</text><text x="784" y="414" text-anchor="middle" font-size="18" font-weight="400" fill="#475569">Input 3 has no output.</text><text x="264" y="238" text-anchor="middle" font-size="20" font-weight="700" fill="#065F46">4</text><text x="264" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#065F46">7</text><path d="M112 200L236 232" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M112 264L236 232" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M112 328H236" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><text x="568" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#065F46">4</text><text x="568" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#065F46">6</text><text x="568" y="334" text-anchor="middle" font-size="20" font-weight="700" fill="#065F46">7</text><path d="M416 200H540" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M416 200L540 264" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M416 264L540 328" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M416 328H540" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><text x="872" y="206" text-anchor="middle" font-size="20" font-weight="700" fill="#065F46">4</text><text x="872" y="270" text-anchor="middle" font-size="20" font-weight="700" fill="#065F46">7</text><path d="M720 200H844" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 264H844" fill="none" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="696" cy="328" r="23" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 4"/>
</g></svg>
