<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" role="img" aria-labelledby="title desc">
<title id="title">The same function has different values at different inputs</title><desc id="desc">The fixed rule f multiplies by two and adds one. Input three gives seven, and input four gives nine.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="520" height="440" rx="18" fill="#F8FAFC"/><g font-family="sans-serif">
<text x="260" y="54" text-anchor="middle" font-size="24" font-weight="700" fill="#0F172A">Rule f versus a value f(x)</text><text x="260" y="112" text-anchor="middle" font-size="28" font-weight="700" fill="#5B21B6">f: multiply by 2, add 1</text><path d="M44 152H476M44 324H476" stroke="#CBD5E1" stroke-width="2"/><text x="260" y="212" text-anchor="middle" font-size="28" font-weight="700" fill="#1E3A8A">Input 3: f(3) = 7</text><text x="260" y="282" text-anchor="middle" font-size="28" font-weight="700" fill="#065F46">Input 4: f(4) = 9</text><text x="260" y="378" text-anchor="middle" font-size="22" font-weight="400" fill="#475569">Same rule, two evaluated values.</text>
</g></svg>
