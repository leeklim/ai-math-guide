<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" role="img" aria-labelledby="title desc">
<title id="title">The x intercept fixes output zero and the y intercept fixes input zero</title>
<desc id="desc">The line two x plus one meets the horizontal axis at negative zero point five comma zero and the vertical axis at zero comma one.</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto">
<path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/>
</marker>
</defs>
<rect width="520" height="560" rx="18" fill="#F8FAFC"/>
<text x="260" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Intercepts meet different axes</text>
<path d="M140 140V460" fill="none" stroke="#E2E8F0" stroke-width="1" />
<text x="140" y="368" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">-3</text>
<path d="M180 140V460" fill="none" stroke="#E2E8F0" stroke-width="1" />
<text x="180" y="368" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">-2</text>
<path d="M220 140V460" fill="none" stroke="#E2E8F0" stroke-width="1" />
<text x="220" y="368" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">-1</text>
<path d="M260 140V460" fill="none" stroke="#E2E8F0" stroke-width="1" />
<text x="260" y="368" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">0</text>
<path d="M300 140V460" fill="none" stroke="#E2E8F0" stroke-width="1" />
<text x="300" y="368" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">1</text>
<path d="M340 140V460" fill="none" stroke="#E2E8F0" stroke-width="1" />
<text x="340" y="368" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">2</text>
<path d="M380 140V460" fill="none" stroke="#E2E8F0" stroke-width="1" />
<text x="380" y="368" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">3</text>
<path d="M140 460H380" fill="none" stroke="#E2E8F0" stroke-width="1" />
<path d="M140 420H380" fill="none" stroke="#E2E8F0" stroke-width="1" />
<path d="M140 380H380" fill="none" stroke="#E2E8F0" stroke-width="1" />
<path d="M140 340H380" fill="none" stroke="#E2E8F0" stroke-width="1" />
<path d="M140 300H380" fill="none" stroke="#E2E8F0" stroke-width="1" />
<path d="M140 260H380" fill="none" stroke="#E2E8F0" stroke-width="1" />
<path d="M140 220H380" fill="none" stroke="#E2E8F0" stroke-width="1" />
<path d="M140 180H380" fill="none" stroke="#E2E8F0" stroke-width="1" />
<path d="M140 140H380" fill="none" stroke="#E2E8F0" stroke-width="1" />
<path d="M120 340H415" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M260 480V115" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
<text x="428" y="346" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="400" fill="#475569">x</text>
<text x="260" y="104" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="400" fill="#475569">y</text>
<path d="M180 460L340 140" fill="none" stroke="#059669" stroke-width="4" />
<circle cx="240" cy="340" r="7" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="260" cy="300" r="7" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
<text x="150" y="404" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#5B21B6">(−0.5, 0)</text>
<text x="350" y="282" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#5B21B6">(0, 1)</text>
<text x="170" y="116" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#065F46">y = 2x + 1</text>
<text x="260" y="516" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="400" fill="#475569">x-intercept: y = 0; y-intercept: x = 0.</text>
</svg>
