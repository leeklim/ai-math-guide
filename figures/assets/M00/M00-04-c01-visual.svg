<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Ordered pairs use the first value for horizontal position and the second for vertical position</title>
  <desc id="desc">Two coordinate panels compare the point three comma two with the point two comma three. Each panel traces the horizontal move first and the vertical move second, ending at different locations.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto">
      <path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="640" rx="18" fill="#F8FAFC"/>
  <text x="480" y="66" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F172A">Order assigns a different role to each coordinate</text>

  <g stroke="#E2E8F0" stroke-width="1">
    <path d="M90 150V500M140 150V500M190 150V500M240 150V500M290 150V500M340 150V500M390 150V500"/>
    <path d="M90 200H410M90 250H410M90 300H410M90 350H410M90 400H410M90 450H410M90 500H410"/>
    <path d="M550 150V500M600 150V500M650 150V500M700 150V500M750 150V500M800 150V500M850 150V500"/>
    <path d="M550 200H870M550 250H870M550 300H870M550 350H870M550 400H870M550 450H870M550 500H870"/>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="butt" marker-end="url(#arrow)">
    <path d="M90 450H422"/><path d="M190 510V138"/>
    <path d="M550 450H882"/><path d="M650 510V138"/>
  </g>
  <g font-family="sans-serif" font-size="18" font-weight="700">
    <text x="250" y="122" text-anchor="middle" font-size="22" fill="#1E3A8A">Point A = (3, 2)</text>
    <text x="710" y="122" text-anchor="middle" font-size="22" fill="#9A3412">Point B = (2, 3)</text>
    <text x="428" y="457" fill="#475569">x</text><text x="178" y="132" fill="#475569">y</text>
    <text x="888" y="457" fill="#475569">x</text><text x="638" y="132" fill="#475569">y</text>
  </g>

  <path d="M190 450H340V350" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="butt"/>
  <path d="M240 450H300M340 420V375" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <circle cx="340" cy="350" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/>
  <text x="355" y="337" font-family="sans-serif" font-size="18" font-weight="700" fill="#1E3A8A">A (3, 2)</text>
  <text x="264" y="478" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1E3A8A">first: x = 3</text>
  <text x="352" y="405" font-family="sans-serif" font-size="16" fill="#1E3A8A">second: y = 2</text>

  <path d="M650 450H750V300" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="butt"/>
  <path d="M675 450H725M750 405V330" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <rect x="742" y="292" width="16" height="16" rx="2" fill="#D97706" stroke="#FFFFFF" stroke-width="3"/>
  <text x="770" y="288" font-family="sans-serif" font-size="18" font-weight="700" fill="#9A3412">B (2, 3)</text>
  <text x="700" y="478" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#9A3412">first: x = 2</text>
  <text x="762" y="385" font-family="sans-serif" font-size="16" fill="#9A3412">second: y = 3</text>

  <text x="480" y="574" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">The same two numbers reach different points when their order changes.</text>
</svg>
