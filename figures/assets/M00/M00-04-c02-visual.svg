<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">Table columns become ordered pairs and then points on a function graph</title>
  <desc id="desc">A table for f of x equals two x plus one lists four inputs and outputs labeled A through D. Arrows lead to a coordinate graph where the corresponding ordered pairs lie on the line y equals two x plus one.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto">
      <path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect width="960" height="640" rx="18" fill="#F8FAFC"/>
  <text x="480" y="66" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F172A">Each input-output pair becomes one graph point</text>

  <rect x="46" y="108" width="360" height="428" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="226" y="148" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">Value table for f(x) = 2x + 1</text>
  <g stroke="#CBD5E1" stroke-width="2" fill="none">
    <path d="M80 190H372M80 250H372M80 310H372M80 370H372M80 430H372M80 490H372"/>
    <path d="M126 190V490M206 190V490M286 190V490"/>
  </g>
  <g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#334155">
    <text x="103" y="227" font-weight="700">ID</text><text x="166" y="227" font-weight="700">x</text><text x="246" y="227" font-weight="700">f(x)</text><text x="329" y="227" font-weight="700">(x, f(x))</text>
    <text x="103" y="287" font-weight="700" fill="#1D4ED8">A</text><text x="166" y="287">−1</text><text x="246" y="287">−1</text><text x="329" y="287">(−1, −1)</text>
    <text x="103" y="347" font-weight="700" fill="#047857">B</text><text x="166" y="347">0</text><text x="246" y="347">1</text><text x="329" y="347">(0, 1)</text>
    <text x="103" y="407" font-weight="700" fill="#9A3412">C</text><text x="166" y="407">1</text><text x="246" y="407">3</text><text x="329" y="407">(1, 3)</text>
    <text x="103" y="467" font-weight="700" fill="#6D28D9">D</text><text x="166" y="467">2</text><text x="246" y="467">5</text><text x="329" y="467">(2, 5)</text>
  </g>

  <path d="M426 322H490" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="butt" marker-end="url(#arrow)"/>
  <text x="458" y="300" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#475569">plot pairs</text>

  <rect x="508" y="108" width="406" height="428" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="711" y="148" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#065F46">Coordinate graph</text>
  <g stroke="#E2E8F0" stroke-width="1">
    <path d="M566 180V490M626 180V490M686 180V490M746 180V490M806 180V490M866 180V490"/>
    <path d="M550 210H878M550 270H878M550 330H878M550 390H878M550 450H878"/>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="butt" marker-end="url(#arrow)">
    <path d="M550 450H888"/><path d="M626 500V168"/>
  </g>
  <path d="M566 450L806 210" fill="none" stroke="#059669" stroke-width="4"/>
  <text x="826" y="202" text-anchor="end" font-family="sans-serif" font-size="18" font-weight="700" fill="#047857">y = 2x + 1</text>
  <g stroke="#FFFFFF" stroke-width="3">
    <circle cx="566" cy="450" r="8" fill="#2563EB"/><circle cx="626" cy="390" r="8" fill="#059669"/>
    <rect x="678" y="322" width="16" height="16" rx="2" fill="#D97706"/><path d="M746 262l9 16h-18z" fill="#7C3AED"/>
  </g>
  <g font-family="sans-serif" font-size="17" font-weight="700">
    <text x="548" y="478" fill="#1D4ED8">A</text><text x="638" y="384" fill="#047857">B</text>
    <text x="700" y="328" fill="#9A3412">C</text><text x="766" y="270" fill="#6D28D9">D</text>
  </g>
  <text x="711" y="516" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Every plotted point has the form (x, f(x)).</text>
  <text x="480" y="588" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">A table row fixes both the horizontal input and the vertical output.</text>
</svg>
