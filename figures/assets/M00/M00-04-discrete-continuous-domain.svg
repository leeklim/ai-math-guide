<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
<title id="title">The same formula has discrete or continuous graphs depending on its domain</title><desc id="desc">The left graph contains only four allowed inputs and four separate points. The right graph includes all real inputs and a line, including the midpoint zero point five comma two.</desc>
