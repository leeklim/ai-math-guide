<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-labelledby="title desc">
<title id="title">Increasing and decreasing concern differences rather than the sign of the output</title><desc id="desc">The left segment rises from negative one to one as input moves from negative one to zero. The right segment falls from one to negative one as input moves from zero to one.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="800" height="550" rx="18" fill="#F8FAFC"/>
<text x="400" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Compare heights as x increases</text><text x="210" y="108" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#065F46">Increase: 2x + 1</text><path d="M120 144V360" fill="none" stroke="#E2E8F0" stroke-width="1" /><text x="120" y="390" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">-1</text><path d="M180 144V360" fill="none" stroke="#E2E8F0" stroke-width="1" /><text x="180" y="390" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">0</text><path d="M240 144V360" fill="none" stroke="#E2E8F0" stroke-width="1" /><text x="240" y="390" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">1</text><path d="M300 144V360" fill="none" stroke="#E2E8F0" stroke-width="1" /><text x="300" y="390" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">2</text><path d="M120 360H300" fill="none" stroke="#E2E8F0" stroke-width="1" /><path d="M120 300H300" fill="none" stroke="#E2E8F0" stroke-width="1" /><path d="M120 240H300" fill="none" stroke="#E2E8F0" stroke-width="1" /><path d="M120 180H300" fill="none" stroke="#E2E8F0" stroke-width="1" /><path d="M120 120H300" fill="none" stroke="#E2E8F0" stroke-width="1" /><path d="M102 240H316" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 376V132" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="330" y="246" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="400" fill="#475569">x</text><text x="156" y="186" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">1</text><text x="156" y="306" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">−1</text><path d="M120 300L180 180" fill="none" stroke="#059669" stroke-width="4" /><circle cx="120" cy="300" r="7" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/><circle cx="180" cy="180" r="7" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/><text x="200" y="444" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#065F46">Output: −1 to 1</text><text x="610" y="108" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#9A3412">Decrease: −2x + 1</text><path d="M520 144V360" fill="none" stroke="#E2E8F0" stroke-width="1" /><text x="520" y="390" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">-1</text><path d="M580 144V360" fill="none" stroke="#E2E8F0" stroke-width="1" /><text x="580" y="390" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">0</text><path d="M640 144V360" fill="none" stroke="#E2E8F0" stroke-width="1" /><text x="640" y="390" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">1</text><path d="M700 144V360" fill="none" stroke="#E2E8F0" stroke-width="1" /><text x="700" y="390" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">2</text><path d="M520 360H700" fill="none" stroke="#E2E8F0" stroke-width="1" /><path d="M520 300H700" fill="none" stroke="#E2E8F0" stroke-width="1" /><path d="M520 240H700" fill="none" stroke="#E2E8F0" stroke-width="1" /><path d="M520 180H700" fill="none" stroke="#E2E8F0" stroke-width="1" /><path d="M520 120H700" fill="none" stroke="#E2E8F0" stroke-width="1" /><path d="M502 240H716" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 376V132" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="730" y="246" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="400" fill="#475569">x</text><text x="556" y="186" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">1</text><text x="556" y="306" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="400" fill="#475569">−1</text><path d="M580 180L640 300" fill="none" stroke="#D97706" stroke-width="4" /><circle cx="580" cy="180" r="7" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/><circle cx="640" cy="300" r="7" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/><text x="600" y="444" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#9A3412">Output: 1 to −1</text><text x="400" y="504" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="400" fill="#475569">An increasing output can start below zero.</text>
</svg>
