<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" role="img" aria-labelledby="title desc">
<title id="title">Adding exponents joins factor groups while multiplying exponents repeats groups</title><desc id="desc">Two cubed times two squared has groups of three and two factors, five in total. Two cubed squared repeats a three-factor group twice, six in total.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="720" height="570" rx="18" fill="#F8FAFC"/>
<text x="360" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Count factors before combining exponents</text>
<text x="360" y="112" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#5B21B6">2³ × 2² = 2⁵</text>
<text x="160" y="170" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E3A8A">2</text>
<text x="210" y="170" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">×</text>
