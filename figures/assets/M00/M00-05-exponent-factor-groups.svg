<text x="410" y="170" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">×</text>
<text x="460" y="170" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E3A8A">2</text>
<text x="510" y="170" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">×</text>
<text x="560" y="170" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E3A8A">2</text>
<path d="M135 190V216H385V190" fill="none" stroke="#CBD5E1" stroke-width="2" />
