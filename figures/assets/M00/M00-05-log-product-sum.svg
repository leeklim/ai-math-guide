<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">The product thirty two has logarithm five because exponents two and three add</title><desc id="desc">Four is two squared and eight is two cubed. Their product is two to the fifth. Log base two of that product equals the sum of their log values two and three.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="720" height="520" rx="18" fill="#F8FAFC"/>
<text x="360" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">A product of values adds their exponents</text>
<text x="360" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">Use base 2 in this example</text>
<text x="180" y="180" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E3A8A">4 = 2²</text>
<text x="540" y="180" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E3A8A">8 = 2³</text>
<path d="M180 214V250H540V214" fill="none" stroke="#CBD5E1" stroke-width="2" />
<path d="M360 250V292" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<text x="360" y="340" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#5B21B6">4 × 8 = 2² × 2³ = 2⁵ = 32</text>
<text x="360" y="406" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#065F46">log₂(4 × 8) = 5</text>
<text x="360" y="470" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#065F46">log₂ 4 + log₂ 8 = 2 + 3 = 5</text>
</svg>
