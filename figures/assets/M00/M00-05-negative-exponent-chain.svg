<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" role="img" aria-labelledby="title desc">
<title id="title">Negative exponents continue the same division pattern</title><desc id="desc">The exponent decreases from three to negative three while positive values halve from eight to one eighth.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="520" height="640" rx="18" fill="#F8FAFC"/>
<text x="260" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Decrease exponent; divide by 2</text>
<text x="128" y="108" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">Exponent n</text>
<text x="320" y="108" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">Value 2ⁿ</text>
<text x="128" y="166" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">3</text>
<text x="320" y="166" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">8</text>
<path d="M410 170V203" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="460" y="195" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#5B21B6">÷ 2</text>
<text x="128" y="226" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">2</text>
<text x="320" y="226" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">4</text>
<path d="M410 230V263" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="460" y="255" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#5B21B6">÷ 2</text>
<text x="128" y="286" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">1</text>
<text x="320" y="286" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">2</text>
<path d="M410 290V323" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="460" y="315" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#5B21B6">÷ 2</text>
<text x="128" y="346" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">0</text>
<text x="320" y="346" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">1</text>
<path d="M410 350V383" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="460" y="375" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#5B21B6">÷ 2</text>
<text x="128" y="406" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">-1</text>
<text x="320" y="406" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">1/2</text>
<path d="M410 410V443" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="460" y="435" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#5B21B6">÷ 2</text>
<text x="128" y="466" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">-2</text>
<text x="320" y="466" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">1/4</text>
<path d="M410 470V503" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="460" y="495" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#5B21B6">÷ 2</text>
<text x="128" y="526" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">-3</text>
<text x="320" y="526" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">1/8</text>
<text x="260" y="594" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">Negative exponent, positive value.</text>
</svg>
