<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
<title id="title">Softmax converts positive weights three and one into three quarters and one quarter</title><desc id="desc">Scores log three and zero exponentiate to three and one. Dividing by the shared total four gives probabilities three quarters and one quarter, shown as four equal shares.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="720" height="540" rx="18" fill="#F8FAFC"/>
<text x="360" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Exponentiate, then divide by the total</text>
<text x="180" y="118" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">z₁ = log 3</text>
<text x="540" y="118" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">z₂ = 0</text>
<text x="180" y="174" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#5B21B6">exp(z₁) = 3</text>
<text x="540" y="174" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#5B21B6">exp(z₂) = 1</text>
<path d="M180 208V236H540V208" fill="none" stroke="#CBD5E1" stroke-width="2" />
<text x="360" y="282" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#334155">Shared total: 3 + 1 = 4</text>
<text x="180" y="346" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">p₁ = 3/4</text>
<text x="540" y="346" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">p₂ = 1/4</text>
<rect x="80" y="390" width="140" height="56" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="150" y="426" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#065F46">p₁</text>
<rect x="220" y="390" width="140" height="56" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="290" y="426" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#065F46">p₁</text>
<rect x="360" y="390" width="140" height="56" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="430" y="426" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#065F46">p₁</text>
<rect x="500" y="390" width="140" height="56" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="570" y="426" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#065F46">p₂</text>
<text x="360" y="494" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">The four equal shares add to probability 1.</text>
</svg>
