<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Inclusive summation selects five values from indices three through seven</title><desc id="desc">Each index from three through seven points to its own term. Four steps between endpoints still include five terms because the first term counts.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="800" height="500" rx="18" fill="#F8FAFC"/>
<text x="400" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Both endpoints belong to the sum</text>
<text x="400" y="110" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B21B6">Sum xᵢ over i = 3, …, 7</text>
<text x="120" y="176" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">3</text>
<path d="M120 202V238" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="120" y="286" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">x₃</text>
<text x="190" y="286" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="400" fill="#475569">+</text>
<text x="260" y="176" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">4</text>
<path d="M260 202V238" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="260" y="286" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">x₄</text>
<text x="330" y="286" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="400" fill="#475569">+</text>
<text x="400" y="176" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">5</text>
<path d="M400 202V238" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="400" y="286" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">x₅</text>
<text x="470" y="286" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="400" fill="#475569">+</text>
<text x="540" y="176" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">6</text>
<path d="M540 202V238" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="540" y="286" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">x₆</text>
<text x="610" y="286" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="400" fill="#475569">+</text>
<text x="680" y="176" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">7</text>
<path d="M680 202V238" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="680" y="286" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">x₇</text>
<path d="M92 316V346H708V316" fill="none" stroke="#CBD5E1" stroke-width="2" />
<text x="400" y="394" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#334155">5 terms: 7 − 3 + 1 = 5</text>
<text x="400" y="450" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">Four moves between indices, but five selected values.</text>
</svg>
