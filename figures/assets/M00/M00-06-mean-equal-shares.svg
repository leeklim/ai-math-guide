<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="title desc">
<title id="title">The arithmetic mean preserves the total while equalizing three shares</title><desc id="desc">Three columns have heights two five eight. Three equal columns have height five, preserving the total fifteen. Dividing fifteen by three gives mean five.</desc>
