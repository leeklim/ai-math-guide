<text x="230" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">Original values</text>
<text x="650" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#065F46">Same sum, equal values</text>
