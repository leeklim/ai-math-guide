<text x="230" y="492" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#334155">2 + 5 + 8 = 15</text>
<text x="650" y="492" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#334155">5 + 5 + 5 = 15</text>
<text x="440" y="552" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B21B6">Mean = total / count = 15 / 3 = 5</text>
