<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 535" role="img" aria-labelledby="title desc">
<title id="title">A summand includes its constant at every index</title><desc id="desc">Using values four seven five, the entire term two x sub i plus one gives nine fifteen eleven, summing to thirty five. The constant one is added three times.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="720" height="535" rx="18" fill="#F8FAFC"/>
<text x="360" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Repeat the entire term at each index</text>
<text x="360" y="112" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#5B21B6">Sum (2xᵢ + 1) for i = 1, 2, 3</text>
<text x="132" y="190" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">x₁ = 4</text>
<text x="454" y="190" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#065F46">2 × 4 + 1 = 9</text>
<text x="132" y="262" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">x₂ = 7</text>
<text x="454" y="262" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#065F46">2 × 7 + 1 = 15</text>
<text x="132" y="334" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">x₃ = 5</text>
<text x="454" y="334" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#065F46">2 × 5 + 1 = 11</text>
<path d="M60 376H660" fill="none" stroke="#CBD5E1" stroke-width="2" />
<text x="360" y="432" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#334155">9 + 15 + 11 = 35</text>
<text x="360" y="490" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">The constant 1 appears in all three terms.</text>
</svg>
