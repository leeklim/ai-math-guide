<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 585" role="img" aria-labelledby="title desc">
<title id="title">The inner sum combines features per sample before the outer sum combines samples</title><desc id="desc">A two by three table holds values one two three and four five six. Summing features gives six and fifteen, then summing samples gives twenty one.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="880" height="585" rx="18" fill="#F8FAFC"/>
<text x="440" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Sum one index at a time</text>
<text x="214" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">i = 1</text>
<text x="300" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">i = 2</text>
<text x="386" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">i = 3</text>
<text x="95" y="208" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">n = 1</text>
<rect x="178" y="170" width="72" height="72" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="214" y="214" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">1</text>
<rect x="264" y="170" width="72" height="72" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="300" y="214" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">2</text>
<rect x="350" y="170" width="72" height="72" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="386" y="214" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">3</text>
<path d="M438 206H482" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="646" y="214" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#065F46">1 + 2 + 3 = 6</text>
<text x="95" y="328" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">n = 2</text>
<rect x="178" y="290" width="72" height="72" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="214" y="334" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">4</text>
<rect x="264" y="290" width="72" height="72" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="300" y="334" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">5</text>
<rect x="350" y="290" width="72" height="72" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="386" y="334" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">6</text>
<path d="M438 326H482" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="646" y="334" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#065F46">4 + 5 + 6 = 15</text>
<path d="M646 370V414" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="646" y="458" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">6 + 15 = 21</text>
<text x="270" y="438" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">Inner sum: feature i</text>
<text x="270" y="480" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">Outer sum: sample n</text>
<text x="440" y="540" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">Two samples × three features = six terms.</text>
</svg>
