<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 525" role="img" aria-labelledby="title desc">
<title id="title">The weighted mean seventeen point five lies closer to the more heavily weighted value twenty</title><desc id="desc">Weights one quarter and three quarters multiply ten and twenty to give contributions two point five and fifteen. The result seventeen point five is marked between ten and twenty.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="720" height="525" rx="18" fill="#F8FAFC"/>
<text x="360" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">A weighted mean gives unequal shares</text>
<text x="180" y="126" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">x₁ = 10</text>
<text x="540" y="126" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E3A8A">x₂ = 20</text>
<text x="180" y="180" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="400" fill="#475569">w₁ = 0.25</text>
<text x="540" y="180" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="400" fill="#475569">w₂ = 0.75</text>
<text x="180" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#5B21B6">0.25 × 10 = 2.5</text>
<text x="540" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#5B21B6">0.75 × 20 = 15</text>
<text x="360" y="302" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#065F46">2.5 + 15 = 17.5</text>
<path d="M100 370H620" fill="none" stroke="#64748B" stroke-width="2" />
<path d="M100 360V380" fill="none" stroke="#64748B" stroke-width="2" />
<text x="100" y="422" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">10</text>
<path d="M360 360V380" fill="none" stroke="#64748B" stroke-width="2" />
<text x="360" y="422" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#475569">15</text>
<path d="M490 360V380" fill="none" stroke="#64748B" stroke-width="2" />
<text x="490" y="422" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#065F46">17.5</text>
<path d="M620 360V380" fill="none" stroke="#64748B" stroke-width="2" />
<text x="620" y="422" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#1E3A8A">20</text>
<circle cx="490" cy="370" r="7" fill="#059669"/>
<text x="360" y="478" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">Weights sum to 1; the result is nearer 20.</text>
</svg>
