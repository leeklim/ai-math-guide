<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" role="img" aria-labelledby="title desc">
<title id="title">Multiples of four form a subset of even integers but the converse has counterexample two</title><desc id="desc">A green region of multiples of four sits inside the blue region of even integers. Four and eight lie inside both; two lies outside the smaller region but inside the larger one, and three lies outside both.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="720" height="550" rx="18" fill="#F8FAFC"/>
<text x="360" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">All multiples of 4 are even</text>
<ellipse cx="360" cy="264" rx="220" ry="138" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<ellipse cx="330" cy="264" rx="106" ry="82" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="506" y="240" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">Q: even</text>
<text x="506" y="272" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#1E3A8A">integers</text>
<text x="330" y="223" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#065F46">P:</text>
<text x="330" y="253" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#065F46">multiples of 4</text>
<text x="290" y="318" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#065F46">4</text>
<text x="372" y="318" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#065F46">8</text>
<text x="488" y="336" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E3A8A">2</text>
<text x="82" y="304" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#475569">3</text>
<text x="360" y="456" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#334155">P ⇒ Q: P is sufficient for Q.</text>
<text x="360" y="500" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#334155">Q is necessary for P; Q ⇒ P fails at n = 2.</text>
</svg>
