<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc">
<title id="title">The negation of an open interval is the union of two closed outer ranges</title><desc id="desc">The upper number line selects inputs strictly between zero and ten with open endpoints. The lower number line selects zero and everything below it, or ten and everything above it, with filled endpoints.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="720" height="510" rx="18" fill="#F8FAFC"/>
<text x="360" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Negation includes the excluded endpoints</text>
<text x="360" y="124" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">P and Q: 0 &lt; x &lt; 10</text>
<text x="360" y="292" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#9A3412">not (P and Q): x ≤ 0 or x ≥ 10</text>
<path d="M70 190H650" fill="none" stroke="#CBD5E1" stroke-width="2" />
<text x="200" y="238" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">0</text>
<text x="520" y="238" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">10</text>
<path d="M70 358H650" fill="none" stroke="#CBD5E1" stroke-width="2" />
<text x="200" y="406" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">0</text>
<text x="520" y="406" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">10</text>
<path d="M200 190H520" fill="none" stroke="#059669" stroke-width="5" />
<circle cx="200" cy="190" r="7" fill="#F8FAFC" stroke="#059669" stroke-width="3"/>
<circle cx="520" cy="190" r="7" fill="#F8FAFC" stroke="#059669" stroke-width="3"/>
<path d="M200 358H70" fill="none" stroke="#D97706" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M520 358H650" fill="none" stroke="#D97706" stroke-width="5" marker-end="url(#arrow)"/>
<circle cx="200" cy="358" r="7" fill="#D97706"/>
<circle cx="520" cy="358" r="7" fill="#D97706"/>
<text x="360" y="462" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="400" fill="#475569">Open endpoint: excluded. Filled endpoint: included.</text>
</svg>
