<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" role="img" aria-labelledby="title desc">
<title id="title">One failure refutes all; one success proves existence</title>
<desc id="desc">Of a few real inputs shown, zero fails the claim x squared greater than x and refutes the universal statement. Two satisfies x squared equal four and witnesses the existential statement. The diagrams do not enumerate all real inputs.</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto">
<path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/>
</marker>
</defs>
<rect width="800" height="620" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif">
<text x="400" y="54" text-anchor="middle" fill="#0F172A" font-size="24" font-weight="bold">One failure refutes all; one success proves existence</text>
<text x="200" y="121" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="bold">For every real x: x² > x?</text>
<text x="600" y="121" text-anchor="middle" fill="#065F46" font-size="22" font-weight="bold">For some real x: x² = 4?</text>
<text x="200" y="166" text-anchor="middle" fill="#475569" font-size="18" font-weight="normal">Some real inputs shown</text>
<text x="600" y="166" text-anchor="middle" fill="#475569" font-size="18" font-weight="normal">Some real inputs shown</text>
<ellipse cx="200" cy="285" rx="150" ry="105" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<ellipse cx="600" cy="285" rx="150" ry="105" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<circle cx="120" cy="242" r="24" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="120" y="250" text-anchor="middle" fill="#64748B" font-size="22" font-weight="bold">−1</text>
<circle cx="265" cy="242" r="24" fill="#FFEDD5" stroke="#D97706" stroke-width="2"/>
<text x="265" y="250" text-anchor="middle" fill="#D97706" font-size="22" font-weight="bold">0</text>
<circle cx="120" cy="322" r="24" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="120" y="330" text-anchor="middle" fill="#64748B" font-size="22" font-weight="bold">1</text>
<circle cx="265" cy="322" r="24" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="265" y="330" text-anchor="middle" fill="#64748B" font-size="22" font-weight="bold">2</text>
<circle cx="520" cy="242" r="24" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="520" y="250" text-anchor="middle" fill="#64748B" font-size="22" font-weight="bold">−1</text>
<circle cx="665" cy="242" r="24" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="665" y="250" text-anchor="middle" fill="#64748B" font-size="22" font-weight="bold">0</text>
<circle cx="520" cy="322" r="24" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="520" y="330" text-anchor="middle" fill="#64748B" font-size="22" font-weight="bold">1</text>
<circle cx="665" cy="322" r="24" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="665" y="330" text-anchor="middle" fill="#059669" font-size="22" font-weight="bold">2</text>
<text x="200" y="371" text-anchor="middle" fill="#64748B" font-size="22" font-weight="normal">…</text>
<text x="600" y="371" text-anchor="middle" fill="#64748B" font-size="22" font-weight="normal">…</text>
<path d="M301 242H378V422H264" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M665 362V422" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/>
<text x="200" y="472" text-anchor="middle" fill="#9A3412" font-size="24" font-weight="bold">0² > 0 is false</text>
<text x="600" y="472" text-anchor="middle" fill="#065F46" font-size="24" font-weight="bold">2² = 4 is true</text>
<text x="200" y="526" text-anchor="middle" fill="#9A3412" font-size="20" font-weight="normal">The universal claim is false.</text>
<text x="600" y="526" text-anchor="middle" fill="#065F46" font-size="20" font-weight="normal">An example exists.</text>
<text x="400" y="581" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">Testing a few values cannot prove a claim about all reals.</text>
</g>
</svg>
