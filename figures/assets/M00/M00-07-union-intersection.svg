<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">The same element three is included once in the union and is the entire intersection</title><desc id="desc">Two Venn diagrams use A one two three and B three four. Union shades both sets and includes one two three four, while intersection shades only their overlap with element three.</desc>
<defs><clipPath id="overlap"><circle cx="660" cy="250" r="92"/></clipPath><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="800" height="460" rx="18" fill="#F8FAFC"/>
<text x="400" y="54" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Union selects either set; intersection selects both</text>
<text x="200" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#065F46">A ∪ B = {1, 2, 3, 4}</text>
<circle cx="140" cy="250" r="92" fill="#D1FAE5"/>
<circle cx="260" cy="250" r="92" fill="#D1FAE5"/>
<circle cx="140" cy="250" r="92" fill="none" stroke="#2563EB" stroke-width="2"/>
<circle cx="260" cy="250" r="92" fill="none" stroke="#2563EB" stroke-width="2"/>
<text x="50" y="150" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">A</text>
<text x="350" y="150" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">B</text>
<text x="102" y="240" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">1</text>
<text x="142" y="294" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">2</text>
<text x="200" y="264" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">3</text>
<text x="306" y="264" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">4</text>
<text x="200" y="414" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="400" fill="#475569">Include the shared element once.</text>
<text x="600" y="112" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#5B21B6">A ∩ B = {3}</text>
<circle cx="540" cy="250" r="92" fill="#FFFFFF"/>
<circle cx="660" cy="250" r="92" fill="#FFFFFF"/>
<circle cx="540" cy="250" r="92" fill="#D1FAE5" clip-path="url(#overlap)"/>
<circle cx="540" cy="250" r="92" fill="none" stroke="#2563EB" stroke-width="2"/>
<circle cx="660" cy="250" r="92" fill="none" stroke="#2563EB" stroke-width="2"/>
<text x="450" y="150" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">A</text>
<text x="750" y="150" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">B</text>
<text x="502" y="240" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#475569">1</text>
<text x="542" y="294" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#475569">2</text>
<text x="600" y="264" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#065F46">3</text>
<text x="706" y="264" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#475569">4</text>
<text x="600" y="414" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="400" fill="#475569">Only the shared element.</text>
</svg>
