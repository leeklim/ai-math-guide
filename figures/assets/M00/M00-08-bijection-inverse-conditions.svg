<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" width="800" height="780" role="img" aria-labelledby="title desc">
<title id="title">Inverse needs one preimage for every output</title>
<desc id="desc">Two inputs merging create ambiguity; a missing codomain value has no source; one-to-one coverage allows every arrow to be reversed.</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto">
<path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/>
</marker>
</defs>
<rect width="800" height="780" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif">
<text x="400" y="54" text-anchor="middle" fill="#0F172A" font-size="24" font-weight="bold">Inverse needs one preimage for every output</text>
<text x="400" y="114" text-anchor="middle" fill="#9A3412" font-size="22" font-weight="bold">Not injective: two sources for one output</text>
<circle cx="200" cy="174" r="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="200" y="182" text-anchor="middle" fill="#2563EB" font-size="24" font-weight="bold">−2</text>
<circle cx="200" cy="244" r="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="200" y="252" text-anchor="middle" fill="#2563EB" font-size="24" font-weight="bold">2</text>
<circle cx="610" cy="209" r="28" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="610" y="217" text-anchor="middle" fill="#059669" font-size="24" font-weight="bold">4</text>
<path d="M234 174L570 194" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M234 244L570 224" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<text x="400" y="314" text-anchor="middle" fill="#9A3412" font-size="22" font-weight="bold">Not surjective: one output has no source</text>
<circle cx="200" cy="370" r="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="200" y="378" text-anchor="middle" fill="#2563EB" font-size="24" font-weight="bold">1</text>
<circle cx="200" cy="440" r="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="200" y="448" text-anchor="middle" fill="#2563EB" font-size="24" font-weight="bold">2</text>
<circle cx="530" cy="370" r="22" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="530" y="378" text-anchor="middle" fill="#059669" font-size="24" font-weight="bold">a</text>
<circle cx="530" cy="440" r="22" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="530" y="448" text-anchor="middle" fill="#059669" font-size="24" font-weight="bold">b</text>
<circle cx="680" cy="405" r="28" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
<text x="680" y="413" text-anchor="middle" fill="#64748B" font-size="24" font-weight="bold">c</text>
<path d="M234 370H496" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M234 440H496" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<text x="680" y="487" text-anchor="middle" fill="#64748B" font-size="20" font-weight="normal">No source for c</text>
<text x="400" y="539" text-anchor="middle" fill="#065F46" font-size="22" font-weight="bold">Bijective: exactly one source for each output</text>
<circle cx="160" cy="594" r="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="160" y="602" text-anchor="middle" fill="#2563EB" font-size="24" font-weight="bold">1</text>
<circle cx="160" cy="664" r="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="160" y="672" text-anchor="middle" fill="#2563EB" font-size="24" font-weight="bold">2</text>
<circle cx="640" cy="594" r="22" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="640" y="602" text-anchor="middle" fill="#059669" font-size="24" font-weight="bold">a</text>
<circle cx="640" cy="664" r="22" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="640" y="672" text-anchor="middle" fill="#059669" font-size="24" font-weight="bold">b</text>
<path d="M194 594H606" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M194 664H606" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<text x="400" y="732" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">Reverse each arrow to obtain a function.</text>
</g>
</svg>
