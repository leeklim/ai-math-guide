<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="title desc">
<title id="title">Undo the operations in reverse order</title>
<desc id="desc">For f of x equal three x minus two, input two goes to six then four. Inverse takes four, adds two, then divides by three to return two.</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto">
<path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/>
</marker>
</defs>
<rect width="800" height="480" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif">
<text x="400" y="54" text-anchor="middle" fill="#0F172A" font-size="24" font-weight="bold">Undo the operations in reverse order</text>
<text x="400" y="121" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="bold">Forward: f(x) = 3x − 2</text>
<circle cx="120" cy="207" r="32" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="120" y="215" text-anchor="middle" fill="#2563EB" font-size="24" font-weight="bold">2</text>
<circle cx="400" cy="207" r="32" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
<text x="400" y="215" text-anchor="middle" fill="#7C3AED" font-size="24" font-weight="bold">6</text>
<circle cx="680" cy="207" r="32" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="680" y="215" text-anchor="middle" fill="#059669" font-size="24" font-weight="bold">4</text>
<path d="M162 207H357" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M442 207H637" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<text x="260" y="172" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="normal">× 3</text>
<text x="540" y="172" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="normal">− 2</text>
<text x="400" y="303" text-anchor="middle" fill="#9A3412" font-size="22" font-weight="bold">Backward: f⁻¹(y) = (y + 2) / 3</text>
<circle cx="680" cy="385" r="32" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="680" y="393" text-anchor="middle" fill="#059669" font-size="24" font-weight="bold">4</text>
<circle cx="400" cy="385" r="32" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
<text x="400" y="393" text-anchor="middle" fill="#D97706" font-size="24" font-weight="bold">6</text>
<circle cx="120" cy="385" r="32" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="120" y="393" text-anchor="middle" fill="#2563EB" font-size="24" font-weight="bold">2</text>
<path d="M637 385H443" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M357 385H163" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#arrow)"/>
<text x="540" y="351" text-anchor="middle" fill="#9A3412" font-size="22" font-weight="normal">+ 2</text>
<text x="260" y="351" text-anchor="middle" fill="#9A3412" font-size="22" font-weight="normal">÷ 3</text>
<text x="400" y="447" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">The inverse starts from the original output.</text>
</g>
</svg>
