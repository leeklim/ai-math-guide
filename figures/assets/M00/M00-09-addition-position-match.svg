<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 485" width="800" height="485" role="img" aria-labelledby="title desc">
<title id="title">Equal element counts do not mean equal shape</title>
<desc id="desc">A two by three array and a three by two array both contain six values, but only a second two by three array has the same row-column positions.</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto">
<path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/>
</marker>
</defs>
<rect width="800" height="485" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif">
<text x="400" y="54" text-anchor="middle" fill="#0F172A" font-size="24" font-weight="bold">Equal element counts do not mean equal shape</text>
<text x="225" y="126" text-anchor="middle" fill="#1E3A8A" font-size="24" font-weight="bold">2 × 3</text>
<text x="575" y="126" text-anchor="middle" fill="#9A3412" font-size="24" font-weight="bold">3 × 2</text>
<rect x="125" y="165" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="158" y="205" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">1</text>
<rect x="191" y="165" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="224" y="205" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">2</text>
<rect x="257" y="165" width="66" height="64" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="290" y="205" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">3</text>
<rect x="125" y="229" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="158" y="269" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">4</text>
<rect x="191" y="229" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="224" y="269" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">5</text>
<rect x="257" y="229" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="290" y="269" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">6</text>
<rect x="509" y="165" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="542" y="205" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">1</text>
<rect x="575" y="165" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="608" y="205" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">2</text>
<rect x="509" y="229" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="542" y="269" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">3</text>
<rect x="575" y="229" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="608" y="269" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">4</text>
<rect x="509" y="293" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="542" y="333" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">5</text>
<rect x="575" y="293" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="608" y="333" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">6</text>
<text x="225" y="350" text-anchor="middle" fill="#1E3A8A" font-size="20" font-weight="normal">Position (1, 3) exists</text>
<text x="575" y="407" text-anchor="middle" fill="#9A3412" font-size="20" font-weight="normal">No column 3</text>
<text x="400" y="452" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">Six values each, but the positions cannot be paired.</text>
</g>
</svg>
