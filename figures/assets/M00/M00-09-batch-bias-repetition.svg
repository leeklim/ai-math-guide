<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
<title id="title">Repeat the bias across samples, not features</title>
<desc id="desc">Column bias one minus two becomes a row, then repeats twice to give a two by two matrix whose two rows are identical.</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto">
<path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/>
</marker>
</defs>
<rect width="800" height="500" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif">
<text x="400" y="54" text-anchor="middle" fill="#0F172A" font-size="24" font-weight="bold">Repeat the bias across samples, not features</text>
<text x="126" y="122" text-anchor="middle" fill="#1E3A8A" font-size="24" font-weight="bold">b: 2 × 1</text>
<rect x="93" y="205" width="66" height="64" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="126" y="245" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">1</text>
<rect x="93" y="269" width="66" height="64" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="126" y="309" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">−2</text>
<text x="379" y="122" text-anchor="middle" fill="#5B21B6" font-size="24" font-weight="bold">bᵀ: 1 × 2</text>
<rect x="313" y="238" width="66" height="64" fill="#F3E8FF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="346" y="278" text-anchor="middle" fill="#7C3AED" font-size="22" font-weight="bold">1</text>
<rect x="379" y="238" width="66" height="64" fill="#F3E8FF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="412" y="278" text-anchor="middle" fill="#7C3AED" font-size="22" font-weight="bold">−2</text>
<text x="658" y="122" text-anchor="middle" fill="#065F46" font-size="24" font-weight="bold">1 bᵀ: 2 × 2</text>
<rect x="592" y="205" width="66" height="64" fill="#D1FAE5" stroke="#94A3B8" stroke-width="1.5"/>
<text x="625" y="245" text-anchor="middle" fill="#059669" font-size="22" font-weight="bold">1</text>
<rect x="658" y="205" width="66" height="64" fill="#D1FAE5" stroke="#94A3B8" stroke-width="1.5"/>
<text x="691" y="245" text-anchor="middle" fill="#059669" font-size="22" font-weight="bold">−2</text>
<rect x="592" y="269" width="66" height="64" fill="#D1FAE5" stroke="#94A3B8" stroke-width="1.5"/>
<text x="625" y="309" text-anchor="middle" fill="#059669" font-size="22" font-weight="bold">1</text>
<rect x="658" y="269" width="66" height="64" fill="#D1FAE5" stroke="#94A3B8" stroke-width="1.5"/>
<text x="691" y="309" text-anchor="middle" fill="#059669" font-size="22" font-weight="bold">−2</text>
<path d="M183 269H285" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M470 269H564" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<text x="235" y="227" text-anchor="middle" fill="#5B21B6" font-size="18" font-weight="normal">transpose</text>
<text x="517" y="227" text-anchor="middle" fill="#5B21B6" font-size="20" font-weight="normal">B = 2</text>
<text x="658" y="397" text-anchor="middle" fill="#065F46" font-size="20" font-weight="normal">Same bias per row</text>
<text x="400" y="456" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">This is the explicit array that broadcasting reproduces.</text>
</g>
</svg>
