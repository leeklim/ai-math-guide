<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 565" width="800" height="565" role="img" aria-labelledby="title desc">
<title id="title">The shared dimension is summed; outer axes remain</title>
<desc id="desc">A two by three matrix takes each length-three column of a three by two matrix to a length-two output column, producing a two by two matrix.</desc>
