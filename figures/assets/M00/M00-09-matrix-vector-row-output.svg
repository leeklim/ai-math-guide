<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 535" width="760" height="535" role="img" aria-labelledby="title desc">
<title id="title">Each matrix row produces one output component</title>
<desc id="desc">The first row of a two by two matrix paired with vector five six gives seventeen, and the second row gives thirty-nine. Matching two column positions makes each dot product possible.</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto">
<path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/>
</marker>
</defs>
<rect width="760" height="535" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif">
<text x="380" y="54" text-anchor="middle" fill="#0F172A" font-size="24" font-weight="bold">Each matrix row produces one output component</text>
<text x="181" y="125" text-anchor="middle" fill="#5B21B6" font-size="24" font-weight="bold">A: 2 × 2</text>
<text x="393" y="125" text-anchor="middle" fill="#1E3A8A" font-size="24" font-weight="bold">x: 2 × 1</text>
<text x="645" y="125" text-anchor="middle" fill="#065F46" font-size="24" font-weight="bold">y: 2 × 1</text>
<rect x="115" y="177" width="66" height="64" fill="#F3E8FF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="148" y="217" text-anchor="middle" fill="#7C3AED" font-size="22" font-weight="bold">1</text>
<rect x="181" y="177" width="66" height="64" fill="#F3E8FF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="214" y="217" text-anchor="middle" fill="#7C3AED" font-size="22" font-weight="bold">2</text>
<rect x="115" y="241" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="148" y="281" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">3</text>
<rect x="181" y="241" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="214" y="281" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">4</text>
<rect x="360" y="177" width="66" height="64" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="393" y="217" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">5</text>
<rect x="360" y="241" width="66" height="64" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="393" y="281" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">6</text>
<rect x="612" y="177" width="66" height="64" fill="#D1FAE5" stroke="#94A3B8" stroke-width="1.5"/>
<text x="645" y="217" text-anchor="middle" fill="#059669" font-size="22" font-weight="bold">17</text>
<rect x="612" y="241" width="66" height="64" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="645" y="281" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">39</text>
<text x="300" y="253" text-anchor="middle" fill="#334155" font-size="28" font-weight="normal">×</text>
<text x="510" y="253" text-anchor="middle" fill="#334155" font-size="28" font-weight="normal">=</text>
<text x="380" y="399" text-anchor="middle" fill="#5B21B6" font-size="24" font-weight="normal">Row 1: 1 × 5 + 2 × 6 = 17</text>
<text x="380" y="454" text-anchor="middle" fill="#475569" font-size="24" font-weight="normal">Row 2: 3 × 5 + 4 × 6 = 39</text>
<text x="380" y="503" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">Two coefficients per row match two input components.</text>
</g>
</svg>
