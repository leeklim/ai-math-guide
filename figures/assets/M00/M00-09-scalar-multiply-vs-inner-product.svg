<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 535" width="800" height="535" role="img" aria-labelledby="title desc">
<title id="title">Scaling keeps components; inner product sums them</title>
<desc id="desc">Multiplying vector one two three by two retains three entries two four six. Pairing with four minus one two then summing gives the scalar eight.</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto">
<path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/>
</marker>
</defs>
<rect width="800" height="535" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif">
<text x="400" y="54" text-anchor="middle" fill="#0F172A" font-size="24" font-weight="bold">Scaling keeps components; inner product sums them</text>
<text x="225" y="119" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="bold">Scale every component</text>
<rect x="110" y="176" width="60" height="60" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="140" y="214" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">1</text>
<rect x="110" y="236" width="60" height="60" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="140" y="274" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">2</text>
<rect x="110" y="296" width="60" height="60" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="140" y="334" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">3</text>
<path d="M192 266H280" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<text x="236" y="236" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="normal">× 2</text>
<rect x="300" y="176" width="60" height="60" fill="#D1FAE5" stroke="#94A3B8" stroke-width="1.5"/>
<text x="330" y="214" text-anchor="middle" fill="#059669" font-size="22" font-weight="bold">2</text>
<rect x="300" y="236" width="60" height="60" fill="#D1FAE5" stroke="#94A3B8" stroke-width="1.5"/>
<text x="330" y="274" text-anchor="middle" fill="#059669" font-size="22" font-weight="bold">4</text>
<rect x="300" y="296" width="60" height="60" fill="#D1FAE5" stroke="#94A3B8" stroke-width="1.5"/>
<text x="330" y="334" text-anchor="middle" fill="#059669" font-size="22" font-weight="bold">6</text>
<text x="225" y="420" text-anchor="middle" fill="#065F46" font-size="20" font-weight="normal">3 components remain</text>
<text x="605" y="119" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="bold">Pair, multiply, then sum</text>
<rect x="495" y="176" width="60" height="60" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="525" y="214" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">1</text>
<rect x="555" y="176" width="60" height="60" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="585" y="214" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">4</text>
<rect x="495" y="236" width="60" height="60" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="525" y="274" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">2</text>
<rect x="555" y="236" width="60" height="60" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="585" y="274" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">−1</text>
<rect x="495" y="296" width="60" height="60" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="525" y="334" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">3</text>
<rect x="555" y="296" width="60" height="60" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="585" y="334" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">2</text>
<text x="525" y="154" text-anchor="middle" fill="#1E3A8A" font-size="20" font-weight="normal">x</text>
<text x="585" y="154" text-anchor="middle" fill="#1E3A8A" font-size="20" font-weight="normal">y</text>
<path d="M640 205H697" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M640 266H697" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M640 325H697" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<text x="735" y="213" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="normal">4</text>
<text x="735" y="274" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="normal">−2</text>
<text x="735" y="333" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="normal">6</text>
<text x="605" y="420" text-anchor="middle" fill="#065F46" font-size="24" font-weight="bold">4 − 2 + 6 = 8</text>
<text x="400" y="491" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">The inner product leaves one scalar, not a vector.</text>
</g>
</svg>
