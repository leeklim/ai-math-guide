<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" width="800" height="610" role="img" aria-labelledby="title desc">
<title id="title">Select one class per sample, then average samples</title>
<desc id="desc">Two sample rows share probabilities three quarters one quarter, but targets one and two select different entries. Their losses about point two eight eight and one point three eight six average to point eight three seven.</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto">
<path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/>
</marker>
</defs>
<rect width="800" height="610" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif">
<text x="400" y="54" text-anchor="middle" fill="#0F172A" font-size="24" font-weight="bold">Select one class per sample, then average samples</text>
<text x="270" y="126" text-anchor="middle" fill="#1E3A8A" font-size="22" font-weight="bold">Class probabilities</text>
<text x="220" y="179" text-anchor="middle" fill="#475569" font-size="20" font-weight="normal">c = 1</text>
<text x="320" y="179" text-anchor="middle" fill="#475569" font-size="20" font-weight="normal">c = 2</text>
<text x="83" y="258" text-anchor="middle" fill="#475569" font-size="18" font-weight="normal">n = 1</text>
<text x="83" y="293" text-anchor="middle" fill="#065F46" font-size="18" font-weight="normal">y₁ = 1</text>
<text x="83" y="358" text-anchor="middle" fill="#475569" font-size="18" font-weight="normal">n = 2</text>
<text x="83" y="393" text-anchor="middle" fill="#065F46" font-size="18" font-weight="normal">y₂ = 2</text>
<rect x="170" y="215" width="100" height="100" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
<text x="220" y="273" text-anchor="middle" fill="#065F46" font-size="24" font-weight="bold">3/4</text>
<rect x="270" y="215" width="100" height="100" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="320" y="273" text-anchor="middle" fill="#1E3A8A" font-size="24" font-weight="normal">1/4</text>
<rect x="170" y="315" width="100" height="100" fill="#DBEAFE" stroke="#94A3B8" stroke-width="1.5"/>
<text x="220" y="373" text-anchor="middle" fill="#1E3A8A" font-size="24" font-weight="normal">3/4</text>
<rect x="270" y="315" width="100" height="100" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
<text x="320" y="373" text-anchor="middle" fill="#065F46" font-size="24" font-weight="bold">1/4</text>
<rect x="490" y="225" width="230" height="80" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<rect x="490" y="325" width="230" height="80" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="605" y="257" text-anchor="middle" fill="#065F46" font-size="22" font-weight="normal">ℓ₁ = −log(3/4)</text>
<text x="605" y="290" text-anchor="middle" fill="#065F46" font-size="22" font-weight="normal">≈ 0.288</text>
<text x="605" y="357" text-anchor="middle" fill="#065F46" font-size="22" font-weight="normal">ℓ₂ = −log(1/4)</text>
<text x="605" y="390" text-anchor="middle" fill="#065F46" font-size="22" font-weight="normal">≈ 1.386</text>
<path d="M395 265H466" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M395 365H466" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="150" y="475" width="600" height="87" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
<text x="450" y="508" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="normal">Average the two sample losses</text>
<text x="450" y="545" text-anchor="middle" fill="#5B21B6" font-size="24" font-weight="normal">L = (0.288 + 1.386) / 2 ≈ 0.837</text>
</g>
</svg>
