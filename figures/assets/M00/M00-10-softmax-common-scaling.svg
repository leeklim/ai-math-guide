<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 670" width="800" height="670" role="img" aria-labelledby="title desc">
<title id="title">Common scaling leaves class proportions unchanged</title>
<desc id="desc">Adding log three to every logit scales scores two one one to six three three, changing total four to twelve but preserving normalized proportions one half one quarter one quarter.</desc>
<defs>
<marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto">
<path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/>
</marker>
</defs>
<rect width="800" height="670" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif">
<text x="400" y="54" text-anchor="middle" fill="#0F172A" font-size="24" font-weight="bold">Common scaling leaves class proportions unchanged</text>
<text x="400" y="116" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">Class order in every bar: 1, 2, 3</text>
<rect x="80" y="170" width="80" height="58" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="120" y="207" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">2</text>
<rect x="160" y="170" width="40" height="58" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="180" y="207" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">1</text>
<rect x="200" y="170" width="40" height="58" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="220" y="207" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">1</text>
<text x="650" y="207" text-anchor="middle" fill="#1E3A8A" font-size="22" font-weight="bold">Total: 4</text>
<path d="M160 252V300" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
<text x="350" y="280" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="normal">All scores × 3</text>
<rect x="80" y="323" width="240" height="58" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="200" y="360" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">6</text>
<rect x="320" y="323" width="120" height="58" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="380" y="360" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">3</text>
<rect x="440" y="323" width="120" height="58" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="500" y="360" text-anchor="middle" fill="#2563EB" font-size="22" font-weight="bold">3</text>
<text x="660" y="360" text-anchor="middle" fill="#1E3A8A" font-size="22" font-weight="bold">Total: 12</text>
<text x="400" y="446" text-anchor="middle" fill="#5B21B6" font-size="22" font-weight="normal">Normalize either bar by its own total</text>
<rect x="80" y="485" width="240" height="58" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="200" y="522" text-anchor="middle" fill="#059669" font-size="22" font-weight="bold">1/2</text>
<rect x="320" y="485" width="120" height="58" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="380" y="522" text-anchor="middle" fill="#059669" font-size="22" font-weight="bold">1/4</text>
<rect x="440" y="485" width="120" height="58" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="500" y="522" text-anchor="middle" fill="#059669" font-size="22" font-weight="bold">1/4</text>
<text x="660" y="522" text-anchor="middle" fill="#065F46" font-size="22" font-weight="bold">Total: 1</text>
<text x="400" y="594" text-anchor="middle" fill="#065F46" font-size="24" font-weight="normal">2/4 = 6/12; 1/4 = 3/12</text>
<text x="400" y="635" text-anchor="middle" fill="#475569" font-size="22" font-weight="normal">Raw scores change; normalized class shares do not.</text>
</g>
</svg>
