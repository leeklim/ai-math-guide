<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" role="img" aria-labelledby="title desc">
  <title id="title">The same interval supplies both changes and their units</title>
  <desc id="desc">Aligned time and position number lines show time from two to five seconds and position from ten to twenty-two meters. Dividing twelve meters by three seconds gives an average speed of four meters per second.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="640" height="530" rx="18" fill="#F8FAFC"/>
  <g transform="translate(0 20)" font-family="sans-serif" fill="#0F172A" font-size="22">
    <text x="320" y="44" text-anchor="middle" font-size="26" font-weight="700">Two changes, one interval</text>
    <text x="48" y="102" fill="#1E3A8A" font-size="24" font-weight="700">Time t (s)</text>
    <path d="M90 170H550" stroke="#94A3B8" stroke-width="2"/>
    <path d="M140 164V176M260 164V176M380 164V176M500 164V176" stroke="#64748B" stroke-width="2"/>
    <text x="140" y="205" text-anchor="middle">2</text><text x="260" y="205" text-anchor="middle">3</text><text x="380" y="205" text-anchor="middle">4</text><text x="500" y="205" text-anchor="middle">5</text>
    <path d="M140 140H500" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="320" y="126" text-anchor="middle" fill="#1E3A8A">Δt = 3 s</text>
    <text x="48" y="260" fill="#065F46" font-size="24" font-weight="700">Position s(t) (m)</text>
    <path d="M90 328H550" stroke="#94A3B8" stroke-width="2"/>
    <path d="M140 322V334M500 322V334" stroke="#64748B" stroke-width="2"/>
    <text x="140" y="363" text-anchor="middle">10</text><text x="500" y="363" text-anchor="middle">22</text>
    <path d="M140 298H500" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="320" y="284" text-anchor="middle" fill="#065F46">Δs = 12 m</text>
    <text x="320" y="419" text-anchor="middle" font-size="26" font-weight="700" fill="#5B21B6">Δs / Δt = 12 m / 3 s = 4 m/s</text>
    <text x="320" y="456" text-anchor="middle">Average over 2–5 s</text>
  </g>
</svg>
