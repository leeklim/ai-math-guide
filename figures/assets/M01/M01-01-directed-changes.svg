<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 610" role="img" aria-labelledby="title desc">
  <title id="title">A change has a start, an end, and a direction</title>
  <desc id="desc">Three number lines compare a change from two to five, the reversed change from five to two, and a change from four to nine. The endpoint nine differs from the change five.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="640" height="610" rx="18" fill="#F8FAFC"/>
  <g transform="translate(0 20)" font-family="sans-serif" fill="#0F172A" font-size="22">
    <text x="320" y="44" text-anchor="middle" font-size="26" font-weight="700">Change = end − start</text>
    <text x="48" y="102" font-size="24" font-weight="700">1. From 2 to 5</text>
    <path d="M90 176H550" stroke="#94A3B8" stroke-width="2"/>
    <path d="M150 170V182M240 170V182M330 170V182M420 170V182M510 170V182" stroke="#64748B" stroke-width="2"/>
    <text x="150" y="210" text-anchor="middle">2</text><text x="240" y="210" text-anchor="middle">3</text><text x="330" y="210" text-anchor="middle">4</text><text x="420" y="210" text-anchor="middle">5</text><text x="510" y="210" text-anchor="middle">6</text>
    <path d="M150 148H420" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="150" y="136" text-anchor="middle" fill="#1E3A8A">start</text><text x="420" y="136" text-anchor="middle" fill="#065F46">end</text>
    <text x="48" y="252" font-size="24" font-weight="700">2. From 5 to 2</text>
    <path d="M90 326H550" stroke="#94A3B8" stroke-width="2"/>
    <path d="M150 320V332M240 320V332M330 320V332M420 320V332M510 320V332" stroke="#64748B" stroke-width="2"/>
    <text x="150" y="360" text-anchor="middle">2</text><text x="240" y="360" text-anchor="middle">3</text><text x="330" y="360" text-anchor="middle">4</text><text x="420" y="360" text-anchor="middle">5</text><text x="510" y="360" text-anchor="middle">6</text>
    <path d="M420 298H150" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="150" y="286" text-anchor="middle" fill="#065F46">end</text><text x="420" y="286" text-anchor="middle" fill="#1E3A8A">start</text>
    <text x="48" y="402" font-size="24" font-weight="700">3. End value ≠ change</text>
    <path d="M90 476H550" stroke="#94A3B8" stroke-width="2"/>
    <path d="M150 470V482M510 470V482" stroke="#64748B" stroke-width="2"/>
    <text x="150" y="510" text-anchor="middle">4</text><text x="510" y="510" text-anchor="middle">9</text>
    <path d="M150 448H510" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="150" y="436" text-anchor="middle" fill="#1E3A8A">start</text><text x="510" y="436" text-anchor="middle" fill="#065F46">end</text>
    <text x="320" y="545" text-anchor="middle" font-size="24" fill="#5B21B6">Δx = 9 − 4 = 5; end = 9</text>
  </g>
  <g transform="translate(0 20)" font-family="sans-serif" font-size="22" fill="#5B21B6" text-anchor="middle"><text x="310" y="136">Δx = +3</text><text x="310" y="286">Δx = −3</text><text x="330" y="436">Δx = +5</text></g>
</svg>
