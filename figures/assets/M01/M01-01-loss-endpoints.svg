<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" role="img" aria-labelledby="title desc">
  <title id="title">Two observed losses do not determine the intermediate path</title>
  <desc id="desc">Observed loss points are one point eight at step one hundred and one point two at step three hundred. A secant and a curved illustrative path share both endpoints, so the average slope minus zero point zero zero three does not determine each step.</desc>
  <rect width="640" height="590" rx="18" fill="#F8FAFC"/>
  <g transform="translate(0 20)" font-family="sans-serif" font-size="22" fill="#0F172A">
    <text x="320" y="44" text-anchor="middle" font-size="26" font-weight="700">Same observations, different paths</text>
    <g stroke="#E2E8F0" stroke-width="1"><path d="M120 100V370M300 100V370M480 100V370"/><path d="M90 130H530M90 220H530M90 310H530"/></g>
    <path d="M90 370H540M90 380V90" stroke="#94A3B8" stroke-width="2"/>
    <text x="104" y="102">Loss L(t)</text><text x="400" y="438">Step t</text>
    <text x="72" y="138" text-anchor="end">1.8</text><text x="72" y="228" text-anchor="end">1.5</text><text x="72" y="318" text-anchor="end">1.2</text>
    <text x="120" y="408" text-anchor="middle">100</text><text x="300" y="408" text-anchor="middle">200</text><text x="480" y="408" text-anchor="middle">300</text>
    <path d="M120 130L480 310" stroke="#7C3AED" stroke-width="3" stroke-dasharray="10 8"/>
    <path d="M120 130C160 330 250 120 310 255S405 400 480 310" stroke="#94A3B8" stroke-width="3" fill="none"/>
    <circle cx="120" cy="130" r="6" fill="#D97706"/><circle cx="480" cy="310" r="6" fill="#D97706"/>
    <text x="154" y="130" fill="#92400E">(100, 1.8)</text><text x="382" y="240" fill="#92400E">(300, 1.2)</text>
    <text x="320" y="484" text-anchor="middle" font-size="24" fill="#5B21B6">Average: −0.6 / 200 = −0.003 loss/step</text>
    <text x="320" y="516" text-anchor="middle">Gray path: illustration, not measured data</text>
  </g>
</svg>
