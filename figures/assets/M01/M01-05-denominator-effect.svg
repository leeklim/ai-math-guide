<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="title desc">
  <title id="title">Increasing a positive denominator lowers the quotient</title>
  <desc id="desc">With numerator fixed at six, denominator two gives quotient three and denominator three gives quotient two. Two equal-height totals are partitioned into two and three equal shares.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="640" height="510" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" font-size="22" fill="#0F172A">
    <text x="320" y="64" text-anchor="middle" font-size="26" font-weight="700">Keep u = 6; increase v</text>
    <text x="320" y="122" text-anchor="middle">The same total, divided into more shares</text>
    <rect x="110" y="170" width="180" height="240" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M110 290H290" stroke="#2563EB" stroke-width="2"/>
    <rect x="390" y="170" width="180" height="240" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <path d="M390 250H570M390 330H570" stroke="#059669" stroke-width="2"/>
    <text x="200" y="239" text-anchor="middle">3</text><text x="200" y="359" text-anchor="middle">3</text>
    <text x="480" y="219" text-anchor="middle">2</text><text x="480" y="299" text-anchor="middle">2</text><text x="480" y="379" text-anchor="middle">2</text>
    <path d="M320 290H360" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="200" y="454" text-anchor="middle">v = 2; q = 3</text><text x="480" y="454" text-anchor="middle">v = 3; q = 2</text>
  </g>
</svg>
