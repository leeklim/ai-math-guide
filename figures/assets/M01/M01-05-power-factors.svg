<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 570" role="img" aria-labelledby="title desc">
  <title id="title">Differentiating x cubed selects each of three factors once</title>
  <desc id="desc">Three rows replace one factor x by its derivative one while keeping the other two x factors. Each row gives x squared and their sum gives three x squared.</desc>
  <rect width="640" height="570" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" font-size="24" fill="#0F172A">
    <text x="320" y="64" text-anchor="middle" font-size="26" font-weight="700">x³ = x · x · x</text>
    <text x="320" y="123" text-anchor="middle" font-size="22">Differentiate one factor in each contribution</text>
    <g text-anchor="middle">
      <rect x="100" y="170" width="80" height="58" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
      <text x="140" y="207" fill="#5B21B6">1</text><text x="220" y="207">·</text><text x="300" y="207">x</text><text x="380" y="207">·</text><text x="460" y="207">x</text><text x="550" y="207">= x²</text>
      <rect x="260" y="264" width="80" height="58" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
      <text x="140" y="301">x</text><text x="220" y="301">·</text><text x="300" y="301" fill="#5B21B6">1</text><text x="380" y="301">·</text><text x="460" y="301">x</text><text x="550" y="301">= x²</text>
      <rect x="420" y="358" width="80" height="58" rx="8" fill="#EDE9FE" stroke="#7C3AED"/>
      <text x="140" y="395">x</text><text x="220" y="395">·</text><text x="300" y="395">x</text><text x="380" y="395">·</text><text x="460" y="395" fill="#5B21B6">1</text><text x="550" y="395">= x²</text>
    </g>
    <text x="320" y="493" text-anchor="middle" font-size="28" font-weight="700" fill="#5B21B6">Sum = x² + x² + x² = 3x²</text>
    <text x="320" y="536" text-anchor="middle" font-size="22">Three contributions, with two factors remaining</text>
  </g>
</svg>
