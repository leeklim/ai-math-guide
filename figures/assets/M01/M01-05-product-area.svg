<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="title desc">
  <title id="title">Changing both factors adds two strips and a corner</title>
  <desc id="desc">A rectangle with sides u and v grows by delta u and delta v. The added area splits into v delta u, u delta v, and a smaller corner delta u delta v.</desc>
  <rect width="640" height="600" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" font-size="22" fill="#0F172A">
    <text x="320" y="64" text-anchor="middle" font-size="26" font-weight="700">A product changes in two directions</text>
    <rect x="110" y="200" width="300" height="200" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="410" y="200" width="60" height="200" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="110" y="150" width="300" height="50" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="410" y="150" width="60" height="50" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="260" y="302" text-anchor="middle" font-size="28">uv</text>
    <text x="260" y="183" text-anchor="middle" fill="#065F46">uΔv</text>
    <text x="449" y="300" text-anchor="middle" fill="#1E3A8A" transform="rotate(-90 449 300)">vΔu</text>
    <path d="M445 170L510 120" stroke="#64748B" stroke-width="1.5"/>
    <text x="500" y="107" fill="#5B21B6">ΔuΔv</text>
    <text x="260" y="438" text-anchor="middle">u</text><text x="440" y="438" text-anchor="middle">Δu</text>
    <text x="75" y="310" text-anchor="middle">v</text><text x="70" y="183" text-anchor="middle">Δv</text>
    <text x="320" y="498" text-anchor="middle" font-size="24" fill="#5B21B6">Δ(uv) = vΔu + uΔv + ΔuΔv</text>
    <text x="320" y="540" text-anchor="middle">For positive u, v, Δu, and Δv in this picture</text>
  </g>
</svg>
