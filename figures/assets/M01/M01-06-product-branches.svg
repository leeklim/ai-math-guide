<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" role="img" aria-labelledby="title desc">
  <title id="title">A product branches from one input</title>
  <desc id="desc">Input three independently produces f of three equal nine and g of three equal seven. Their product is sixty-three. The derivative adds six times seven and nine times two.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="640" height="600" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" font-size="22" fill="#0F172A" text-anchor="middle">
    <text x="320" y="64" font-size="26" font-weight="700">A product uses two branches</text>
    <rect x="220" y="110" width="200" height="66" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="320" y="153" font-size="28">x = 3</text>
    <path d="M270 176L175 260" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M370 176L465 260" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="65" y="270" width="220" height="90" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="355" y="270" width="220" height="90" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <text x="175" y="306">f(x) = x²</text><text x="175" y="340">f(3) = 9; f′(3) = 6</text>
    <text x="465" y="306">g(x) = 2x + 1</text><text x="465" y="340">g(3) = 7; g′(3) = 2</text>
    <path d="M175 360L280 428" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M465 360L360 428" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="210" y="438" width="220" height="65" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="320" y="479" font-size="26">p = 9 × 7 = 63</text>
    <text x="320" y="554" font-size="24" fill="#5B21B6">p′(3) = 6 × 7 + 9 × 2 = 60</text>
  </g>
</svg>
