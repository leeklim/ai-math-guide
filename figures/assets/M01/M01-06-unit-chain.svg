<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
  <title id="title">Derivative units connect through the intermediate quantity</title>
  <desc id="desc">Input seconds maps to meters and then score. The derivative units meters per second and score per meter multiply to score per second.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="640" height="460" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" font-size="22" fill="#0F172A" text-anchor="middle">
    <text x="320" y="64" font-size="26" font-weight="700">The intermediate unit connects both stages</text>
    <text x="125" y="138" font-size="28" fill="#1E3A8A">x</text><text x="320" y="138" font-size="28" fill="#5B21B6">u</text><text x="515" y="138" font-size="28" fill="#065F46">y</text>
    <text x="125" y="176">seconds</text><text x="320" y="176">meters</text><text x="515" y="176">score</text>
    <path d="M175 135H265" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M370 135H460" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="215" y="237" fill="#5B21B6">du/dx: m/s</text><text x="430" y="237" fill="#5B21B6">dy/du: score/m</text>
    <text x="320" y="319" font-size="26">(score/m) × (m/s) = score/s</text>
    <text x="320" y="376" fill="#92400E">The meter unit occurs in both local ratios.</text>
  </g>
</svg>
