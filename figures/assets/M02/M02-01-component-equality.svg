<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" role="img" aria-labelledby="title desc">
  <title id="title">Vector equality compares every corresponding component</title>
  <desc id="desc">Two dimension three column vectors have matching first and second components, one and minus two, but their third components are three and four. The last comparison makes the vectors unequal.</desc>
  <rect width="620" height="400" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="310" y="42" text-anchor="middle" font-size="24" font-weight="700">Equal dimension is only the first check</text>
    <text x="205" y="95" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">u ∈ R³</text>
    <text x="415" y="95" text-anchor="middle" font-size="20" font-weight="700" fill="#5B21B6">v ∈ R³</text>
    <rect x="60" y="250" width="500" height="54" rx="10" fill="#FFF7ED"/>
    <path d="M174 122H164V308H174M236 122H246V308H236M384 122H374V308H384M446 122H456V308H446" fill="none" stroke="#64748B" stroke-width="2"/>
    <g font-size="22" text-anchor="middle">
      <text x="205" y="158">1</text><text x="415" y="158">1</text>
      <text x="205" y="222">−2</text><text x="415" y="222">−2</text>
      <text x="205" y="286" fill="#9A3412">3</text><text x="415" y="286" fill="#9A3412">4</text>
      <text x="310" y="158" fill="#065F46">=</text><text x="310" y="222" fill="#065F46">=</text><text x="310" y="286" fill="#9A3412">≠</text>
    </g>
    <g stroke="#CBD5E1" stroke-width="1.5"><path d="M266 149H290M330 149H354M266 213H290M330 213H354M266 277H290M330 277H354"/></g>
    <g font-size="16" fill="#475569"><text x="75" y="158">i = 1</text><text x="75" y="222">i = 2</text><text x="75" y="286">i = 3</text></g>
    <text x="310" y="356" text-anchor="middle" font-size="20" font-weight="700">u ≠ v because u₃ ≠ v₃</text>
  </g>
</svg>
