<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
  <title id="title">Scaling the sum and summing scaled vectors reach the same endpoint</title>
  <desc id="desc">With u equal to one two and v equal to three minus one, the left grid doubles their sum four one to eight two. The right grid joins two u equal to two four and two v equal to six minus two and reaches the same endpoint eight two.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="880" height="500" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="440" y="42" text-anchor="middle" font-size="24" font-weight="700">2(u + v) = 2u + 2v</text>
    <text x="440" y="75" text-anchor="middle" font-size="18" fill="#475569">u = (1, 2), v = (3, −1)</text>
    <text x="235" y="116" text-anchor="middle" font-size="20" font-weight="700">1. Add, then scale</text>
    <text x="655" y="116" text-anchor="middle" font-size="20" font-weight="700">2. Scale, then add</text>
    <g stroke="#E2E8F0" stroke-width="1" fill="none">
      <path d="M110 155V370M140 155V370M170 155V370M200 155V370M230 155V370M260 155V370M290 155V370M320 155V370M350 155V370M380 155V370"/><path d="M110 160H380M110 190H380M110 220H380M110 250H380M110 280H380M110 310H380M110 340H380M110 370H380"/>
      <path d="M530 155V370M560 155V370M590 155V370M620 155V370M650 155V370M680 155V370M710 155V370M740 155V370M770 155V370M800 155V370"/><path d="M530 160H800M530 190H800M530 220H800M530 250H800M530 280H800M530 310H800M530 340H800M530 370H800"/>
    </g>
    <path d="M94 310H395M110 385V140M514 310H815M530 385V140" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <g font-size="16" fill="#475569"><text x="405" y="316">x₁</text><text x="110" y="140" text-anchor="middle">x₂</text><text x="90" y="335">0</text><text x="825" y="316">x₁</text><text x="530" y="140" text-anchor="middle">x₂</text><text x="510" y="335">0</text></g>
    <path d="M110 310L350 250" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <circle cx="230" cy="280" r="5" fill="#2563EB" stroke="#F8FAFC" stroke-width="2"/>
    <path d="M230 276V234" stroke="#64748B" stroke-width="1.5" fill="none"/>
    <text x="186" y="214" font-size="18" font-weight="700" fill="#1E3A8A">u + v = (4, 1)</text>
    <text x="295" y="296" font-size="18" font-weight="700" fill="#065F46">(8, 2)</text>
    <path d="M530 310L590 190" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M590 190L770 250" fill="none" stroke="#7C3AED" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
    <path d="M530 310L770 250" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="400" y="185" font-size="18" font-weight="700" fill="#1E3A8A">2u = (2, 4)</text>
    <text x="680" y="185" font-size="18" font-weight="700" fill="#5B21B6">2v = (6, −2)</text>
    <text x="726" y="296" font-size="18" font-weight="700" fill="#065F46">(8, 2)</text>
    <text x="235" y="420" text-anchor="middle" font-size="19">2(4, 1) = (8, 2)</text>
    <text x="655" y="420" text-anchor="middle" font-size="19">(2, 4) + (6, −2) = (8, 2)</text>
    <text x="440" y="467" text-anchor="middle" font-size="18" fill="#334155">Both orders of calculation produce the same vector.</text>
  </g>
</svg>
