<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
  <title id="title">Points mark positions while a vector marks their displacement</title>
  <desc id="desc">On a coordinate grid P is one two and Q is four minus one. The arrow from P to Q moves three units right and three units down, so its displacement is three minus three rather than the coordinates of either point.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="640" height="500" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="320" y="42" text-anchor="middle" font-size="24" font-weight="700">Position is not displacement</text>
    <g stroke="#E2E8F0" stroke-width="1" fill="none"><path d="M100 100V400M160 100V400M220 100V400M280 100V400M340 100V400M400 100V400M460 100V400"/><path d="M100 100H460M100 160H460M100 220H460M100 280H460M100 340H460M100 400H460"/></g>
    <path d="M80 280H480M160 422V80" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <g font-size="16" fill="#475569"><text x="494" y="286">x₁</text><text x="160" y="72" text-anchor="middle">x₂</text><text x="135" y="306">0</text><text x="220" y="304" text-anchor="middle">1</text><text x="400" y="304" text-anchor="middle">4</text><text x="128" y="166">2</text><text x="119" y="346">−1</text></g>
    <path d="M220 160H400V340" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="6 6"/>
    <path d="M220 160L396 336" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <circle cx="220" cy="160" r="5" fill="#2563EB"/><circle cx="400" cy="340" r="3" fill="#2563EB"/>
    <text x="185" y="127" font-size="20" font-weight="700" fill="#1E3A8A">P = (1, 2)</text>
    <text x="420" y="366" font-size="20" font-weight="700" fill="#1E3A8A">Q = (4, −1)</text>
    <text x="316" y="140" text-anchor="middle" font-size="18" font-weight="700" fill="#5B21B6">Δx₁ = +3</text>
    <text x="431" y="245" font-size="18" font-weight="700" fill="#5B21B6">Δx₂ = −3</text>
    <text x="232" y="357" font-size="20" font-weight="700" fill="#065F46">PQ = (3, −3)</text>
    <text x="320" y="459" text-anchor="middle" font-size="19" fill="#334155">Displacement = Q − P = (4 − 1, −1 − 2) = (3, −3)</text>
  </g>
</svg>
