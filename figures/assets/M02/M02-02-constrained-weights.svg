<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" role="img" aria-labelledby="title desc">
  <title id="title">Nonnegative weights summing to one restrict outputs inside a triangle</title>
  <desc id="desc">Three two dimensional value vectors at one one, four one and two four span the plane. Their nonnegative weighted averages with weights summing to one stay inside the triangle. Equal weights give seven thirds two inside it, while the origin lies outside.</desc>
  <defs><pattern id="grid" width="60" height="60" y="40" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#CBD5E1"/></pattern></defs>
  <rect width="640" height="530" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="320" y="42" text-anchor="middle" font-size="24" font-weight="700">Weight constraints narrow the reachable set</text>
    <text x="320" y="76" text-anchor="middle" font-size="18" fill="#475569">aᵢ ≥ 0 and a₁ + a₂ + a₃ = 1</text>
    <rect x="60" y="120" width="420" height="300" fill="#EFF6FF"/><rect x="60" y="120" width="420" height="300" fill="url(#grid)"/>
    <path d="M48 400H495M120 435V105" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M180 340L360 340L240 160Z" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/>
    <g fill="#2563EB"><circle cx="180" cy="340" r="5"/><circle cx="360" cy="340" r="5"/><circle cx="240" cy="160" r="5"/></g>
    <circle cx="260" cy="280" r="5" fill="#059669"/>
    <text x="185" y="380" font-size="18" font-weight="700" fill="#1E3A8A">v₁ = (1, 1)</text><text x="366" y="380" font-size="18" font-weight="700" fill="#1E3A8A">v₂ = (4, 1)</text><text x="262" y="144" font-size="18" font-weight="700" fill="#1E3A8A">v₃ = (2, 4)</text>
    <path d="M267 278L405 249" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <text x="425" y="245" font-size="19" font-weight="700" fill="#065F46">z = (7/3, 2)</text>
    <text x="95" y="425" font-size="16" fill="#475569">0</text><text x="507" y="406" font-size="16" fill="#475569">x₁</text><text x="120" y="99" text-anchor="middle" font-size="16" fill="#475569">x₂</text>
    <text x="320" y="473" text-anchor="middle" font-size="18" fill="#334155">Equal weights: z = (v₁ + v₂ + v₃)/3.</text>
    <text x="320" y="500" text-anchor="middle" font-size="18" fill="#334155">Unrestricted span: R². Constrained outputs: the triangle.</text>
  </g>
</svg>
