<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Two nonparallel generators can reach every point of a plane</title>
  <desc id="desc">For v one equal to one one and v two equal to one minus one, a coordinate path joins three v one and v two to reach four two. Component equations on the right give coefficients three and one.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#CBD5E1"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="500" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="400" y="42" text-anchor="middle" font-size="24" font-weight="700">Two directions reach b = (4, 2)</text>
    <text x="400" y="76" text-anchor="middle" font-size="18" fill="#475569">v₁ = (1, 1), v₂ = (1, −1)</text>
    <rect x="80" y="160" width="280" height="280" fill="#ECFDF5"/><rect x="80" y="160" width="280" height="280" fill="url(#grid)"/>
    <path d="M65 360H380M120 452V140" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M120 360L240 240" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M240 240L280 280" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M120 360L280 280" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="170" y="212" font-size="19" font-weight="700" fill="#1E3A8A">3v₁ = (3, 3)</text>
    <text x="304" y="247" font-size="19" font-weight="700" fill="#5B21B6">v₂</text>
    <text x="303" y="312" font-size="19" font-weight="700" fill="#065F46">b</text>
    <text x="97" y="385" font-size="16" fill="#475569">0</text><text x="388" y="366" font-size="16" fill="#475569">x₁</text><text x="120" y="133" text-anchor="middle" font-size="16" fill="#475569">x₂</text>
    <text x="574" y="150" text-anchor="middle" font-size="20" font-weight="700">Match both components</text>
    <text x="574" y="205" text-anchor="middle" font-size="21">c₁ + c₂ = 4</text><text x="574" y="250" text-anchor="middle" font-size="21">c₁ − c₂ = 2</text>
    <text x="574" y="313" text-anchor="middle" font-size="21" font-weight="700" fill="#065F46">c₁ = 3, c₂ = 1</text>
    <text x="574" y="375" text-anchor="middle" font-size="19">b = 3v₁ + v₂</text>
    <text x="400" y="466" text-anchor="middle" font-size="18" fill="#334155">For every real target (b₁, b₂), c₁ = (b₁ + b₂)/2 and c₂ = (b₁ − b₂)/2.</text>
  </g>
</svg>
