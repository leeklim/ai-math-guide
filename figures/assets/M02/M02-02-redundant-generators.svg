<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 450" role="img" aria-labelledby="title desc">
  <title id="title">Different coefficient lists can describe the same vector</title>
  <desc id="desc">A coordinate grid shows v three equal to the sum of v one and v two, where the first two vectors are the standard axes. The same endpoint one one is reached using coefficient lists zero zero one and one one zero.</desc>
  <defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="740" height="450" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="370" y="42" text-anchor="middle" font-size="24" font-weight="700">One endpoint, two coefficient lists</text>
    <rect x="60" y="120" width="240" height="240" fill="url(#grid)"/>
    <path d="M48 300H318M120 375V100" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M120 300L180 300" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M180 300L180 240" fill="none" stroke="#7C3AED" stroke-width="4" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
    <path d="M120 300L180 240" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="145" y="339" font-size="19" font-weight="700" fill="#1E3A8A">v₁</text><text x="218" y="277" font-size="19" font-weight="700" fill="#5B21B6">v₂</text><text x="206" y="216" font-size="19" font-weight="700" fill="#065F46">v₃ = (1, 1)</text>
    <text x="328" y="306" font-size="16" fill="#475569">x₁</text><text x="120" y="92" text-anchor="middle" font-size="16" fill="#475569">x₂</text><text x="98" y="325" font-size="16" fill="#475569">0</text>
    <text x="529" y="127" text-anchor="middle" font-size="20" font-weight="700">Coefficients of (v₁, v₂, v₃)</text>
    <text x="529" y="192" text-anchor="middle" font-size="22" fill="#065F46">(0, 0, 1) → v₃</text>
    <text x="529" y="257" text-anchor="middle" font-size="22" fill="#5B21B6">(1, 1, 0) → v₁ + v₂</text>
    <text x="529" y="326" text-anchor="middle" font-size="20" font-weight="700">v₃ = v₁ + v₂</text>
    <text x="370" y="412" text-anchor="middle" font-size="18" fill="#334155">Adding an already reachable generator does not enlarge the span.</text>
  </g>
</svg>
