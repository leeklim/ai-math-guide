<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 550" role="img" aria-labelledby="title desc">
  <title id="title">Sums and scalar multiples remain in the same span</title>
  <desc id="desc">On the line spanned by one one, x equals one one and y equals two two. Their sum three three and minus twice x equal to minus two minus two remain on the same line through the origin.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2E8F0"/></pattern></defs>
  <rect width="640" height="550" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="320" y="42" text-anchor="middle" font-size="24" font-weight="700">Closure: the result stays in the same span</text>
    <text x="320" y="78" text-anchor="middle" font-size="18" fill="#475569">span{(1, 1)}</text>
    <rect x="120" y="120" width="400" height="360" fill="url(#grid)"/>
    <path d="M105 320H535M320 495V105" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M160 480L520 120" fill="none" stroke="#059669" stroke-width="3"/>
    <circle cx="360" cy="280" r="5" fill="#2563EB"/><circle cx="400" cy="240" r="5" fill="#2563EB"/><circle cx="440" cy="200" r="5" fill="#059669"/><circle cx="240" cy="400" r="5" fill="#7C3AED"/>
    <text x="183" y="271" font-size="19" font-weight="700" fill="#1E3A8A">x = (1, 1)</text>
    <text x="180" y="212" font-size="19" font-weight="700" fill="#1E3A8A">y = (2, 2)</text>
    <text x="475" y="213" font-size="19" font-weight="700" fill="#065F46">x + y</text><text x="475" y="241" font-size="18" fill="#065F46">(3, 3)</text>
    <text x="58" y="393" font-size="19" font-weight="700" fill="#5B21B6">−2x = (−2, −2)</text>
    <text x="333" y="343" font-size="16" fill="#475569">0</text><text x="545" y="326" font-size="16" fill="#475569">x₁</text><text x="320" y="98" text-anchor="middle" font-size="16" fill="#475569">x₂</text>
    <text x="320" y="515" text-anchor="middle" font-size="18" fill="#334155">Adding coefficients or scaling them does not add a new direction.</text>
  </g>
</svg>
