<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" role="img" aria-labelledby="title desc">
  <title id="title">Distance is the length of the difference between positions</title>
  <desc id="desc">The points x equal to one minus two and y equal to four two differ by minus three minus four from y to x. Their difference arrow has length five, regardless of the order of the two points.</desc>
  <defs><pattern id="grid" width="45" height="45" x="25" y="10" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="640" height="540" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="320" y="42" text-anchor="middle" font-size="24" font-weight="700">First subtract positions, then measure the length</text>
    <rect x="115" y="100" width="360" height="315" fill="url(#grid)"/>
    <path d="M100 280H490M160 430V85" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M340 190H205V370" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="6 6"/>
    <path d="M340 190L208 366" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <circle cx="340" cy="190" r="4" fill="#2563EB"/><circle cx="205" cy="370" r="3" fill="#2563EB"/>
    <text x="360" y="166" font-size="20" font-weight="700" fill="#1E3A8A">y = (4, 2)</text><text x="229" y="409" font-size="20" font-weight="700" fill="#1E3A8A">x = (1, −2)</text>
    <text x="258" y="163" font-size="19" font-weight="700" fill="#5B21B6">−3</text><text x="65" y="333" font-size="19" font-weight="700" fill="#5B21B6">−4</text>
    <text x="365" y="304" font-size="20" font-weight="700" fill="#065F46">‖x − y‖₂ = 5</text>
    <text x="134" y="306" font-size="16" fill="#475569">0</text><text x="502" y="286" font-size="16" fill="#475569">x₁</text><text x="160" y="77" text-anchor="middle" font-size="16" fill="#475569">x₂</text>
    <text x="320" y="477" text-anchor="middle" font-size="20" fill="#334155">x − y = (−3, −4), d(x, y) = √(9 + 16) = 5</text>
    <text x="320" y="510" text-anchor="middle" font-size="18" fill="#334155">The two-dimensional positions give one scalar distance.</text>
  </g>
</svg>
