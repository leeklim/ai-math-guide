<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" role="img" aria-labelledby="title desc">
  <title id="title">The Euclidean norm is the hypotenuse of a coordinate triangle</title>
  <desc id="desc">A coordinate grid shows the vector three four from the origin. The perpendicular component displacements have lengths three and four, giving vector length five by the Pythagorean theorem.</desc>
  <defs><pattern id="grid" width="60" height="60" y="40" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="640" height="530" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="320" y="42" text-anchor="middle" font-size="24" font-weight="700">Component squares determine the vector length</text>
    <rect x="60" y="120" width="420" height="300" fill="url(#grid)"/>
    <path d="M48 400H495M120 435V105" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M120 400H300V160" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7 6"/>
    <path d="M282 400V382H300" fill="none" stroke="#7C3AED" stroke-width="2"/>
    <path d="M120 400L300 160" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="318" y="144" font-size="21" font-weight="700" fill="#1E3A8A">u = (3, 4)</text>
    <text x="139" y="248" font-size="21" font-weight="700" fill="#065F46">‖u‖₂ = 5</text>
    <text x="208" y="438" text-anchor="middle" font-size="20" font-weight="700" fill="#5B21B6">3</text><text x="335" y="288" font-size="20" font-weight="700" fill="#5B21B6">4</text>
    <text x="95" y="423" font-size="16" fill="#475569">0</text><text x="508" y="406" font-size="16" fill="#475569">x₁</text><text x="120" y="96" text-anchor="middle" font-size="16" fill="#475569">x₂</text>
    <text x="320" y="487" text-anchor="middle" font-size="21" fill="#334155">‖u‖₂ = √(3² + 4²) = 5</text>
  </g>
</svg>
