<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" role="img" aria-labelledby="title desc">
  <title id="title">Projection splits a vector into a parallel component and an orthogonal residual</title>
  <desc id="desc">For u equal to three two and v equal to one one, projection onto the line spanned by v gives five halves five halves. The remaining arrow one half minus one half is perpendicular to that line.</desc>
  <defs><pattern id="grid" width="70" height="70" x="0" y="30" patternUnits="userSpaceOnUse"><path d="M70 0H0V70" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker><marker id="small" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="9" refX="5.5" refY="4.5" orient="auto"><path d="M0.5 0.6L5.5 4.5L0.5 8.4L2 4.5Z" fill="context-stroke"/></marker></defs>
  <rect width="700" height="560" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="350" y="42" text-anchor="middle" font-size="24" font-weight="700">u = projection + orthogonal residual</text>
    <rect x="70" y="100" width="490" height="350" fill="url(#grid)"/>
    <path d="M55 380H575M140 467V85" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M90 430L420 100" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5 6"/>
    <path d="M140 380L350 240" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M140 380L315 205" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M315 205L350 240" fill="none" stroke="#7C3AED" stroke-width="3.5" marker-end="url(#small)"/>
    <path d="M325 195L335 205L325 215" fill="none" stroke="#D97706" stroke-width="2"/>
    <text x="245" y="425" font-size="20" font-weight="700" fill="#065F46">projᵥ u = (5/2, 5/2)</text>
    <text x="387" y="270" font-size="20" font-weight="700" fill="#1E3A8A">u = (3, 2)</text><text x="403" y="192" font-size="20" font-weight="700" fill="#5B21B6">r = (1/2, −1/2)</text>
    <text x="455" y="113" font-size="18" fill="#475569">span{v}, v = (1, 1)</text>
    <text x="153" y="407" font-size="16" fill="#475569">0</text><text x="588" y="386" font-size="16" fill="#475569">x₁</text><text x="140" y="77" text-anchor="middle" font-size="16" fill="#475569">x₂</text>
    <text x="350" y="503" text-anchor="middle" font-size="20" fill="#334155">c = (uᵀv)/(vᵀv) = 5/2, projection = cv</text>
    <text x="350" y="535" text-anchor="middle" font-size="18" fill="#334155">The coefficient c is not the projection vector or its length.</text>
  </g>
</svg>
