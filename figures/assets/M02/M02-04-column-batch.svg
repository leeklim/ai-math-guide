<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="title desc">
  <title id="title">Applying the same matrix to each input column forms the product columns</title>
  <desc id="desc">For A with rows one two zero and minus one three one, the input columns two zero five and one four minus two map to output columns two three and nine nine. Stacking them gives A B.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="820" height="430" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="410" y="42" text-anchor="middle" font-size="24" font-weight="700">Each input column produces one output column</text>
    <g font-size="19" font-weight="700" text-anchor="middle"><text x="155" y="111" fill="#1E3A8A">Columns of B</text><text x="425" y="111" fill="#5B21B6">Same A</text><text x="680" y="111" fill="#065F46">Columns of AB</text></g>
    <text x="155" y="196" text-anchor="middle" font-size="21" fill="#1E3A8A">b₁ = (2, 0, 5)ᵀ</text><text x="155" y="280" text-anchor="middle" font-size="21" fill="#1E3A8A">b₂ = (1, 4, −2)ᵀ</text>
    <rect x="328" y="148" width="194" height="174" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M350 174H342V297H350M500 174H508V297H500" fill="none" stroke="#64748B" stroke-width="2"/>
    <g font-size="21" text-anchor="middle"><text x="366" y="214">1</text><text x="425" y="214">2</text><text x="484" y="214">0</text><text x="366" y="272">−1</text><text x="425" y="272">3</text><text x="484" y="272">1</text></g>
    <path d="M267 188H309" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M267 272H309" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M541 188H583" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M541 272H583" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="680" y="196" text-anchor="middle" font-size="21" fill="#065F46">Ab₁ = (2, 3)ᵀ</text><text x="680" y="280" text-anchor="middle" font-size="21" fill="#065F46">Ab₂ = (9, 9)ᵀ</text>
    <text x="410" y="389" text-anchor="middle" font-size="20" fill="#334155">AB = [Ab₁  Ab₂]: the input column order is preserved.</text>
  </g>
</svg>
