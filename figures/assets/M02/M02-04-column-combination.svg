<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
  <title id="title">The same matrix vector product is a linear combination of its columns</title>
  <desc id="desc">A coordinate grid joins four times the column one minus one and five times the column two three. The path reaches fourteen eleven, the same output as the row inner products.</desc>
  <defs><pattern id="grid" width="28" height="28" x="20" y="24" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="640" height="560" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="320" y="42" text-anchor="middle" font-size="24" font-weight="700">Ax = 4a₁ + 5a₂ = (14, 11)</text>
    <text x="320" y="77" text-anchor="middle" font-size="18" fill="#475569">a₁ = (1, −1), a₂ = (2, 3); grid step = 2</text>
    <rect x="76" y="136" width="336" height="308" fill="url(#grid)"/>
    <path d="M60 360H429M160 460V120" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M160 360L216 416" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M216 416L356 206" fill="none" stroke="#7C3AED" stroke-width="4" stroke-dasharray="8 5" marker-end="url(#arrow)"/>
    <path d="M160 360L356 206" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="238" y="444" font-size="19" font-weight="700" fill="#1E3A8A">4a₁ = (4, −4)</text>
    <text x="362" y="328" font-size="19" font-weight="700" fill="#5B21B6">5a₂ = (10, 15)</text><text x="382" y="193" font-size="19" font-weight="700" fill="#065F46">y = (14, 11)</text>
    <text x="134" y="386" font-size="16" fill="#475569">0</text><text x="441" y="366" font-size="16" fill="#475569">y₁</text><text x="160" y="112" text-anchor="middle" font-size="16" fill="#475569">y₂</text>
    <text x="320" y="505" text-anchor="middle" font-size="20" fill="#334155">4(1, −1) + 5(2, 3) = (4, −4) + (10, 15)</text>
    <text x="320" y="535" text-anchor="middle" font-size="18" fill="#334155">Rows calculate components; columns build the whole vector.</text>
  </g>
</svg>
