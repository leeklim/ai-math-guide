<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">A selected row and column determine one matrix product entry</title>
  <desc id="desc">The two by three matrix A and three by two matrix B multiply to a two by two C. The second row of A, minus one three one, and second column of B, one four minus two, give C two two equal to nine.</desc>
  <rect width="900" height="520" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="450" y="42" text-anchor="middle" font-size="24" font-weight="700">c₂₂ = row 2 of A · column 2 of B</text>
    <g font-size="22" text-anchor="middle" font-weight="700"><text x="210" y="112" fill="#1E3A8A">A: 2 × 3</text><text x="490" y="112" fill="#5B21B6">B: 3 × 2</text><text x="749" y="112" fill="#065F46">C: 2 × 2</text></g>
    <rect x="93" y="232" width="235" height="53" rx="7" fill="#DBEAFE"/><rect x="507" y="153" width="62" height="166" rx="7" fill="#EDE9FE"/>
    <path d="M99 166H87V291H99M322 166H334V291H322M426 148H414V322H426M573 148H585V322H573M685 166H673V291H685M808 166H820V291H808" fill="none" stroke="#64748B" stroke-width="2"/>
    <g font-size="23" text-anchor="middle"><text x="130" y="206">1</text><text x="210" y="206">2</text><text x="290" y="206">0</text><text x="130" y="265">−1</text><text x="210" y="265">3</text><text x="290" y="265">1</text><text x="453" y="187">2</text><text x="537" y="187">1</text><text x="453" y="246">0</text><text x="537" y="246">4</text><text x="453" y="305">5</text><text x="537" y="305">−2</text><text x="710" y="206">2</text><text x="790" y="206">9</text><text x="710" y="265">3</text><text x="790" y="265" fill="#065F46" font-weight="700">9</text></g>
    <text x="372" y="240" text-anchor="middle" font-size="28">×</text><text x="632" y="240" text-anchor="middle" font-size="28">=</text><circle cx="790" cy="257" r="23" fill="none" stroke="#059669" stroke-width="2.5"/>
    <text x="450" y="378" text-anchor="middle" font-size="22">c₂₂ = (−1)·1 + 3·4 + 1·(−2) = 9</text>
    <text x="450" y="433" text-anchor="middle" font-size="20" fill="#334155">Inner dimension 3: three matching products are summed.</text>
    <text x="450" y="480" text-anchor="middle" font-size="19" fill="#334155">The outer dimensions remain: 2 × 3 times 3 × 2 gives 2 × 2.</text>
  </g>
</svg>
