<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" role="img" aria-labelledby="title desc">
  <title id="title">Each matrix row produces one output component</title>
  <desc id="desc">Two rows one two and minus one three are each dotted with the same input four five. Their sums fourteen and eleven form the output vector.</desc>
  <rect width="740" height="440" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="370" y="42" text-anchor="middle" font-size="24" font-weight="700">One row inner product gives one yᵢ</text>
    <g font-size="20" font-weight="700" text-anchor="middle"><text x="170" y="112" fill="#1E3A8A">Row of A</text><text x="372" y="112" fill="#1E3A8A">Same input x</text><text x="598" y="112" fill="#065F46">Output</text></g>
    <path d="M55 137H685M55 290H685" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
    <g font-size="23" text-anchor="middle"><text x="170" y="193">(1, 2)</text><text x="272" y="193">·</text><text x="372" y="193">(4, 5)</text><text x="482" y="193">=</text><text x="598" y="193" fill="#065F46">y₁ = 14</text><text x="170" y="259">(−1, 3)</text><text x="272" y="259">·</text><text x="372" y="259">(4, 5)</text><text x="482" y="259">=</text><text x="598" y="259" fill="#065F46">y₂ = 11</text></g>
    <text x="370" y="341" text-anchor="middle" font-size="21">y₁ = 1·4 + 2·5; y₂ = (−1)·4 + 3·5</text>
    <text x="370" y="397" text-anchor="middle" font-size="19" fill="#334155">Input dimension: 2. Number of rows and output dimension: 2.</text>
  </g>
</svg>
