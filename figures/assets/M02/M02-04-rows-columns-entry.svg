<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">A matrix entry is located by its row and then its column</title>
  <desc id="desc">A two by three matrix has rows two minus one four and zero three five. Row two and column three intersect at the entry a two three equal to five.</desc>
  <rect width="640" height="420" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="320" y="42" text-anchor="middle" font-size="24" font-weight="700">a₂₃: row 2, column 3</text>
    <text x="320" y="83" text-anchor="middle" font-size="18" fill="#475569">Shape 2 × 3: two rows, three columns</text>
    <rect x="160" y="240" width="360" height="60" fill="#DBEAFE"/><rect x="425" y="165" width="70" height="135" fill="#EDE9FE"/>
    <path d="M167 160H155V310H167M513 160H525V310H513" fill="none" stroke="#64748B" stroke-width="2"/>
    <g font-size="18" fill="#475569" text-anchor="middle"><text x="230" y="137">column 1</text><text x="345" y="137">column 2</text><text x="460" y="137">column 3</text></g>
    <g font-size="18" fill="#1E3A8A"><text x="60" y="208">row 1</text><text x="60" y="278">row 2</text></g>
    <g font-size="24" text-anchor="middle"><text x="230" y="208">2</text><text x="345" y="208">−1</text><text x="460" y="208">4</text><text x="230" y="278">0</text><text x="345" y="278">3</text><text x="460" y="278" font-weight="700" fill="#065F46">5</text></g>
    <circle cx="460" cy="270" r="24" fill="none" stroke="#059669" stroke-width="2.5"/>
    <text x="320" y="371" text-anchor="middle" font-size="20" font-weight="700">a₂₃ = 5; the index order matters.</text>
  </g>
</svg>
