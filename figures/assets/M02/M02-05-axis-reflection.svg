<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="title desc">
  <title id="title">A negative diagonal entry reflects one coordinate direction</title>
  <desc id="desc">A coordinate grid compares input three one with its reflected output minus three one. The vertical axis is the mirror, and only the horizontal component changes sign.</desc>
  <defs><pattern id="grid" width="60" height="60" x="20" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="640" height="520" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="320" y="42" text-anchor="middle" font-size="24" font-weight="700">diag(−1, 1): reflect across the vertical axis</text>
    <rect x="80" y="120" width="480" height="300" fill="url(#grid)"/>
    <path d="M65 360H575M320 435V105" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M320 120V420" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M140 300H500" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M320 360L500 300" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M320 360L140 300" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="435" y="267" font-size="20" font-weight="700" fill="#1E3A8A">(3, 1)</text><text x="81" y="267" font-size="20" font-weight="700" fill="#065F46">(−3, 1)</text>
    <text x="343" y="158" font-size="18" fill="#5B21B6">Mirror axis</text><text x="293" y="385" font-size="16" fill="#475569">0</text><text x="585" y="366" font-size="16" fill="#475569">x₁</text><text x="320" y="96" text-anchor="middle" font-size="16" fill="#475569">x₂</text>
    <text x="320" y="473" text-anchor="middle" font-size="20" fill="#334155">(x₁, x₂) → (−x₁, x₂)</text>
    <text x="320" y="500" text-anchor="middle" font-size="18" fill="#334155">Same height; the horizontal component changes sign.</text>
  </g>
</svg>
