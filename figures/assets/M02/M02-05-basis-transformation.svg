<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Basis vectors map to the columns of a matrix</title>
  <desc id="desc">Two coordinate grids show standard basis vectors on the input and the corresponding matrix columns on the output. A vector with coefficients two and one keeps those coefficients after the linear map.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="960" height="560" rx="18" fill="#F8FAFC"/>
  <text x="480" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F172A">The columns of A are the images of the input basis</text>

  <g stroke="#E2E8F0" stroke-width="1">
    <path d="M70 130V470M110 130V470M150 130V470M190 130V470M230 130V470M270 130V470M310 130V470M350 130V470M390 130V470"/>
    <path d="M70 150H390M70 190H390M70 230H390M70 270H390M70 310H390M70 350H390M70 390H390M70 430H390M70 470H390"/>
    <path d="M570 130V470M610 130V470M650 130V470M690 130V470M730 130V470M770 130V470M810 130V470M850 130V470M890 130V470"/>
    <path d="M570 150H890M570 190H890M570 230H890M570 270H890M570 310H890M570 350H890M570 390H890M570 430H890M570 470H890"/>
  </g>
  <g stroke="#94A3B8" stroke-width="2">
    <path d="M70 350H400M230 480V120"/><path d="M560 350H900M730 480V120"/>
  </g>
  <text x="230" y="92" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">Input coordinates</text>
  <text x="730" y="92" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#065F46">Output coordinates</text>

  <g fill="none" stroke-linecap="butt" stroke-width="5" marker-end="url(#arrow)">
    <path d="M230 350L290 350" stroke="#2563EB"/><path d="M230 350L230 290" stroke="#D97706"/><path d="M230 350L350 290" stroke="#059669"/>
    <path d="M730 350L790 320" stroke="#2563EB"/><path d="M730 350L790 260" stroke="#D97706"/><path d="M730 350L910 200" stroke="#059669"/>
  </g>
  <g font-family="sans-serif" font-size="18" font-weight="700">
    <text x="300" y="347" font-size="18" fill="#2563EB">e₁</text><text x="190" y="282" font-size="18" fill="#D97706">e₂</text><text x="274" y="258" font-size="18" fill="#059669">x = 2e₁ + e₂</text>
    <text x="800" y="316" font-size="18" fill="#2563EB">a₁ = Ae₁</text><text x="744" y="238" font-size="18" fill="#D97706">a₂ = Ae₂</text><text x="770" y="154" font-size="18" fill="#059669">Ax = 2a₁ + a₂</text>
  </g>
  <rect x="430" y="226" width="100" height="104" rx="16" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="480" y="270" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#5B21B6">A</text>
  <text x="480" y="306" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">linear map</text>
  <path d="M400 278H420M540 278H560" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="480" y="526" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">The coefficients 2 and 1 stay the same; the basis vectors change to the columns a₁ and a₂.</text>
</svg>
