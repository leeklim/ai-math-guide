<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 500" role="img" aria-labelledby="title desc">
  <title id="title">Rotation followed by scaling is represented by D R</title>
  <desc id="desc">Three equally scaled coordinate grids follow input one three, its ninety degree rotation minus three one, and the doubled result minus six two. The composition applies the rightmost matrix R first.</desc>
  <defs><pattern id="grid" width="25" height="25" y="15" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="1050" height="500" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="525" y="42" text-anchor="middle" font-size="24" font-weight="700">DRx: rotate first, then double the result</text>
    <text x="525" y="78" text-anchor="middle" font-size="18" fill="#475569">Same coordinate scale in all panels; one grid step = 1</text>
    <g font-size="21" font-weight="700" text-anchor="middle"><text x="200" y="126" fill="#1E3A8A">Input x</text><text x="480" y="126" fill="#5B21B6">After R: 90° rotation</text><text x="840" y="126" fill="#065F46">After D: scale by 2</text></g>
    <rect x="100" y="180" width="200" height="210" fill="url(#grid)"/><rect x="375" y="180" width="225" height="210" fill="url(#grid)"/><rect x="675" y="180" width="325" height="210" fill="url(#grid)"/>
    <path d="M85 340H315M200 408V165M360 340H615M500 408V165M660 340H1015M850 408V165" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M200 340L225 265" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M500 340L425 315" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/><path d="M850 340L700 290" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <g font-size="20" font-weight="700"><text x="250" y="270" fill="#1E3A8A">(1, 3)</text><text x="375" y="271" fill="#5B21B6">(−3, 1)</text><text x="694" y="256" fill="#065F46">(−6, 2)</text></g>
    <text x="525" y="464" text-anchor="middle" font-size="20" fill="#334155">R(1, 3) = (−3, 1), D(−3, 1) = (−6, 2).</text>
  </g>
</svg>
