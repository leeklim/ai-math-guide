<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 500" role="img" aria-labelledby="title desc">
  <title id="title">Inverse composition reverses the order of the applied operations</title>
  <desc id="desc">The forward route scales input one two by B to two two, then shears by A to four two. The return route traverses the stages from right to left, applying inverse A before inverse B.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="930" height="500" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="465" y="40" text-anchor="middle" font-size="24" font-weight="700">Undo the last operation first</text>
    <text x="160" y="92" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A8A">x = (1, 2)</text><text x="465" y="92" text-anchor="middle" font-size="21" font-weight="700" fill="#5B21B6">Bx = (2, 2)</text><text x="790" y="92" text-anchor="middle" font-size="21" font-weight="700" fill="#065F46">ABx = (4, 2)</text>
    <rect x="80" y="160" width="160" height="200" fill="url(#grid)"/><rect x="400" y="160" width="160" height="200" fill="url(#grid)"/><rect x="680" y="160" width="200" height="200" fill="url(#grid)"/>
    <path d="M65 320H255M120 375V145M385 320H575M440 375V145M665 320H895M720 375V145" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M120 320L160 240" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M440 320L520 240" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/><path d="M720 320L880 240" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M280 210H355" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 210H640" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="318" y="182" text-anchor="middle" font-size="19" fill="#5B21B6">B</text><text x="615" y="182" text-anchor="middle" font-size="19" fill="#5B21B6">A</text>
    <path d="M355 310H280" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 310H590" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="318" y="345" text-anchor="middle" font-size="19" fill="#065F46">B⁻¹</text><text x="615" y="345" text-anchor="middle" font-size="19" fill="#065F46">A⁻¹</text>
    <text x="465" y="424" text-anchor="middle" font-size="19" fill="#334155">B(x₁, x₂) = (2x₁, x₂); A(x₁, x₂) = (x₁ + x₂, x₂)</text>
    <text x="465" y="468" text-anchor="middle" font-size="20" fill="#334155">Return right to left: A⁻¹ first, then B⁻¹. Thus (AB)⁻¹ = B⁻¹A⁻¹.</text>
  </g>
</svg>
