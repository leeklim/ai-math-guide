<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Row elimination changes equations without changing their common solution</title>
  <desc id="desc">Two coordinate plots share the same intersection at thirteen sevenths, eleven sevenths. Subtracting three times row one from row two replaces the sloped second line with a horizontal line through that intersection.</desc>
  <defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#E2E8F0"/></pattern><pattern id="grid2" width="50" height="50" x="20" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="900" height="560" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700">Different equations, the same common solution</text>
    <text x="220" y="93" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A8A">Before elimination</text><text x="680" y="93" text-anchor="middle" font-size="21" font-weight="700" fill="#065F46">After R₂ ← R₂ − 3R₁</text>
    <rect x="100" y="200" width="200" height="200" fill="url(#grid)"/><rect x="570" y="200" width="200" height="200" fill="url(#grid2)"/>
    <path d="M75 400H325M100 420V180M545 400H795M570 420V180" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M100 275L300 375M570 275L770 375" fill="none" stroke="#2563EB" stroke-width="3"/>
    <path d="M166.667 400L233.333 200" fill="none" stroke="#7C3AED" stroke-width="3"/>
    <path d="M545 321.429H795" fill="none" stroke="#7C3AED" stroke-width="3"/>
    <circle cx="192.857" cy="321.429" r="5" fill="#059669"/><circle cx="662.857" cy="321.429" r="5" fill="#059669"/>
    <text x="113" y="247" font-size="18" fill="#1E3A8A">x + 2y = 5</text><text x="239" y="195" font-size="18" fill="#5B21B6">3x − y = 4</text>
    <text x="583" y="247" font-size="18" fill="#1E3A8A">x + 2y = 5</text><text x="687" y="293" font-size="18" fill="#5B21B6">−7y = −11</text>
    <path d="M220 345L268 443M684 345L718 443" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="270" y="468" text-anchor="middle" font-size="18" font-weight="700" fill="#065F46">(13/7, 11/7)</text><text x="720" y="468" text-anchor="middle" font-size="18" font-weight="700" fill="#065F46">(13/7, 11/7)</text>
    <path d="M360 305H495" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/><text x="427" y="276" text-anchor="middle" font-size="18" fill="#5B21B6">R₂ − 3R₁</text>
    <text x="335" y="406" font-size="16" fill="#475569">x</text><text x="805" y="406" font-size="16" fill="#475569">x</text><text x="96" y="167" font-size="16" fill="#475569">y</text><text x="566" y="167" font-size="16" fill="#475569">y</text><text x="82" y="423" font-size="16" fill="#475569">0</text><text x="552" y="423" font-size="16" fill="#475569">0</text>
    <text x="450" y="522" text-anchor="middle" font-size="20" fill="#334155">The equation changes; the intersection of both constraints stays fixed.</text>
  </g>
</svg>
