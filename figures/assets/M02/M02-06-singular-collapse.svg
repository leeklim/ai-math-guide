<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">A singular matrix erases a nonzero input direction</title>
  <desc id="desc">The matrix with rows one two and two four sends both the zero input and input minus two one to zero. The left coordinate plane shows the distinct inputs; the right output plane shows their shared image and the line of all possible outputs.</desc>
  <defs><pattern id="grid" width="60" height="60" x="40" y="40" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#E2E8F0"/></pattern><pattern id="grid2" width="60" height="60" x="0" y="40" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="900" height="540" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="450" y="40" text-anchor="middle" font-size="24" font-weight="700">Different inputs can become the same output</text>
    <text x="220" y="95" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A8A">Input space</text><text x="660" y="95" text-anchor="middle" font-size="21" font-weight="700" fill="#065F46">Output space</text>
    <rect x="100" y="160" width="240" height="240" fill="url(#grid)"/><rect x="540" y="160" width="240" height="240" fill="url(#grid2)"/>
    <path d="M80 280H360M220 420V140M520 280H800M660 420V140" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M220 280L100 220" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><circle cx="220" cy="280" r="4" fill="#2563EB"/>
    <text x="84" y="188" font-size="20" font-weight="700" fill="#1E3A8A">z = (−2, 1)</text><text x="242" y="309" font-size="18" fill="#1E3A8A">0 = (0, 0)</text>
    <path d="M600 400L720 160" fill="none" stroke="#A7F3D0" stroke-width="4"/><circle cx="660" cy="280" r="6" fill="#059669"/>
    <text x="697" y="328" font-size="20" font-weight="700" fill="#065F46">Bz = B0 = 0</text><text x="556" y="455" font-size="18" fill="#475569">All outputs lie on y₂ = 2y₁.</text>
    <path d="M380 263H495" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/><text x="437" y="220" text-anchor="middle" font-size="18" fill="#5B21B6">B = [[1, 2],</text><text x="437" y="245" text-anchor="middle" font-size="18" fill="#5B21B6">[2, 4]]</text>
    <text x="220" y="455" text-anchor="middle" font-size="18" fill="#334155">1·(−2) + 2·1 = 0</text><text x="220" y="483" text-anchor="middle" font-size="18" fill="#334155">2·(−2) + 4·1 = 0</text>
    <text x="450" y="517" text-anchor="middle" font-size="19" fill="#334155">The output cannot tell which of these inputs was used.</text>
    <g font-size="16" fill="#475569"><text x="370" y="286">x₁</text><text x="810" y="286">y₁</text><text x="214" y="126">x₂</text><text x="654" y="126">y₂</text></g>
  </g>
</svg>
