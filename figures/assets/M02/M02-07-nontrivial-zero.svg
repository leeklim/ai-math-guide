<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" role="img" aria-labelledby="title desc">
  <title id="title">Three pairwise different directions can still be linearly dependent</title>
  <desc id="desc">Vectors v one one zero, v two zero one, and v three one one form a closed path when combined with coefficients one one minus one. No pair is a scalar multiple, but the three-vector list is dependent.</desc>
  <defs><pattern id="grid" width="80" height="80" x="60" y="40" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="700" height="540" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="350" y="40" text-anchor="middle" font-size="24" font-weight="700">A nonzero coefficient list can return to zero</text>
    <text x="350" y="83" text-anchor="middle" font-size="20" fill="#334155">v₁ = (1, 0), v₂ = (0, 1), v₃ = (1, 1)</text>
    <rect x="140" y="200" width="320" height="240" fill="url(#grid)"/>
    <path d="M115 360H485M220 460V175" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M220 360H300" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M300 360V280" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/><path d="M300 280L220 360" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M220 360V280" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <text x="244" y="395" font-size="20" font-weight="700" fill="#1E3A8A">+v₁</text><text x="335" y="327" font-size="20" font-weight="700" fill="#5B21B6">+v₂</text><text x="162" y="321" font-size="20" font-weight="700" fill="#065F46">−v₃</text>
    <text x="196" y="387" font-size="16" fill="#475569">0</text><text x="495" y="366" font-size="16" fill="#475569">x₁</text><text x="215" y="160" font-size="16" fill="#475569">x₂</text>
    <text x="350" y="498" text-anchor="middle" font-size="21" font-weight="700" fill="#065F46">v₁ + v₂ − v₃ = 0; coefficients (1, 1, −1) are not all zero.</text>
  </g>
</svg>
