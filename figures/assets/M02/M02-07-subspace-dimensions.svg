<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" role="img" aria-labelledby="title desc">
  <title id="title">A line and a plane inside three-dimensional space have different dimensions</title>
  <desc id="desc">Two schematic perspective views in ambient R three show a line spanned by one nonzero vector and the coordinate plane spanned by two independent basis vectors. Both objects are stored with three coordinates, but their subspace dimensions are one and two.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="920" height="540" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="460" y="40" text-anchor="middle" font-size="24" font-weight="700">Stored with three coordinates; fewer directions may suffice</text>
    <text x="245" y="96" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A8A">A line: dim = 1</text><text x="675" y="96" text-anchor="middle" font-size="21" font-weight="700" fill="#065F46">A plane: dim = 2</text>
    <path d="M115 240L375 360M355 230L135 370M245 405V155" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M115 380L375 220" fill="none" stroke="#A7F3D0" stroke-width="5"/><path d="M245 300L310 260" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="95" y="194" font-size="20" font-weight="700" fill="#1E3A8A">v = (1, 0, 1)</text><text x="245" y="452" text-anchor="middle" font-size="20" fill="#334155">Every point is cv.</text>
    <path d="M660 202.5L855 292.5L690 397.5L495 307.5Z" fill="#D1FAE5" stroke="#A7F3D0" stroke-width="1.5"/>
    <path d="M692.5 217.5L527.5 322.5M757.5 247.5L592.5 352.5M822.5 277.5L657.5 382.5M632.5 220L827.5 310M577.5 255L772.5 345M522.5 290L717.5 380" fill="none" stroke="#A7F3D0" stroke-width="1"/>
    <path d="M545 240L805 360M785 230L565 370M675 405V155" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M675 300L740 330" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M675 300L620 335" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="767" y="379" font-size="20" font-weight="700" fill="#1E3A8A">e₁</text><text x="593" y="408" font-size="20" font-weight="700" fill="#5B21B6">e₂</text><text x="675" y="452" text-anchor="middle" font-size="20" fill="#334155">Every point is c₁e₁ + c₂e₂.</text>
    <g font-size="16" fill="#475569"><text x="384" y="370">x₁</text><text x="107" y="405">x₂</text><text x="238" y="140">x₃</text><text x="814" y="370">x₁</text><text x="546" y="385">x₂</text><text x="668" y="140">x₃</text></g>
    <text x="460" y="507" text-anchor="middle" font-size="18" fill="#475569">Ambient space: R³ in both views. Schematic perspective, not an angle measurement.</text>
  </g>
</svg>
