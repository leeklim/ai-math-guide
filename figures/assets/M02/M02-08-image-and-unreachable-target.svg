<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 570" role="img" aria-labelledby="title desc">
  <title id="title">An output target outside the image is unreachable</title>
  <desc id="desc">A schematic perspective in R three shows the output line spanned by one two zero, the reachable point one two zero on that line, and the unreachable target one two one displaced vertically from it. Every output of B has third component zero.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="730" height="570" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="365" y="40" text-anchor="middle" font-size="24" font-weight="700">Image is a subset of the output space</text>
    <text x="365" y="87" text-anchor="middle" font-size="20" fill="#334155">B = [[1, 2], [2, 4], [0, 0]]</text>
    <path d="M210 220L490 320M440 200L260 340M350 420V135" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M380 127.5L315 436.25" fill="none" stroke="#059669" stroke-width="4"/>
    <circle cx="330" cy="365" r="5" fill="#059669"/><circle cx="330" cy="290" r="5" fill="#D97706"/>
    <path d="M330 349V306" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <path d="M305 366H210M304 290H178" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="70" y="363" font-size="20" font-weight="700" fill="#065F46">(1, 2, 0)</text><text x="70" y="393" font-size="18" fill="#065F46">Reachable</text>
    <text x="70" y="279" font-size="20" font-weight="700" fill="#92400E">(1, 2, 1)</text><text x="70" y="309" font-size="18" fill="#92400E">No solution</text>
    <text x="431" y="166" font-size="19" fill="#065F46">im(B) = span{(1, 2, 0)}</text>
    <text x="365" y="491" text-anchor="middle" font-size="20" fill="#334155">Every possible output has third component 0.</text><text x="365" y="539" text-anchor="middle" font-size="18" fill="#475569">Ambient space: R³. Schematic perspective, not an angle measurement.</text>
    <g font-size="16" fill="#475569"><text x="506" y="329">y₁</text><text x="214" y="340">y₂</text><text x="343" y="121">y₃</text></g>
  </g>
</svg>
