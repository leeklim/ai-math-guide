<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-labelledby="title desc">
  <title id="title">Moving parallel to the kernel preserves the output</title>
  <desc id="desc">Three parallel input lines x plus two y equals zero, two, and four map to three distinct output points zero zero, two zero, and four zero. Each input line is a translated copy of the kernel, so all of its points share one output.</desc>
  <defs><pattern id="grid" width="45" height="45" x="15" y="20" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#E2E8F0"/></pattern><pattern id="grid2" width="45" height="45" x="35" y="20" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="940" height="560" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="470" y="40" text-anchor="middle" font-size="24" font-weight="700">A(x, y) = (x + 2y, 0): one output for each parallel line</text>
    <text x="240" y="95" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A8A">Input plane</text><text x="730" y="95" text-anchor="middle" font-size="21" font-weight="700" fill="#065F46">Output plane</text>
    <rect x="105" y="155" width="270" height="270" fill="url(#grid)"/><rect x="620" y="200" width="225" height="180" fill="url(#grid2)"/>
    <path d="M85 290H395M195 445V135M600 290H875M620 400V180" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M105 245L375 380" fill="none" stroke="#2563EB" stroke-width="3"/><path d="M105 200L375 335" fill="none" stroke="#7C3AED" stroke-width="3" stroke-dasharray="8 5"/><path d="M105 155L375 290" fill="none" stroke="#059669" stroke-width="3"/>
    <circle cx="195" cy="290" r="4" fill="#2563EB"/><circle cx="285" cy="290" r="4" fill="#7C3AED"/><circle cx="375" cy="290" r="4" fill="#059669"/>
    <path d="M430 270H555" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/><text x="492" y="242" text-anchor="middle" font-size="20" fill="#5B21B6">A</text>
    <circle cx="620" cy="290" r="5" fill="#2563EB"/><circle cx="710" cy="290" r="5" fill="#7C3AED"/><circle cx="800" cy="290" r="5" fill="#059669"/>
    <text x="620" y="333" text-anchor="middle" font-size="18" fill="#1E3A8A">(0, 0)</text><text x="710" y="333" text-anchor="middle" font-size="18" fill="#5B21B6">(2, 0)</text><text x="800" y="333" text-anchor="middle" font-size="18" fill="#065F46">(4, 0)</text>
    <text x="105" y="480" font-size="18" fill="#1E3A8A">Solid blue: x + 2y = 0, the kernel</text><text x="105" y="510" font-size="18" fill="#5B21B6">Dashed purple: x + 2y = 2</text><text x="105" y="540" font-size="18" fill="#065F46">Solid green: x + 2y = 4</text>
    <text x="718" y="481" text-anchor="middle" font-size="18" fill="#334155">Each line is x₀ + ker(A).</text><text x="718" y="515" text-anchor="middle" font-size="18" fill="#334155">Changing the input along it</text><text x="718" y="542" text-anchor="middle" font-size="18" fill="#334155">does not change the output.</text>
    <g font-size="16" fill="#475569"><text x="405" y="296">x</text><text x="885" y="296">y₁</text><text x="190" y="122">y</text><text x="613" y="167">y₂</text></g>
  </g>
</svg>
