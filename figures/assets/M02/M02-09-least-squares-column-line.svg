<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 540" role="img" aria-labelledby="title desc">
  <title id="title">Least squares chooses the closest attainable output on the column space</title>
  <desc id="desc">For A the column vector one one and target b three one, attainable outputs are c c on a diagonal line. The closest output is two two at coefficient c two, with residual one minus one perpendicular to the column.</desc>
  <defs><pattern id="grid" width="60" height="60" x="20" y="20" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="750" height="540" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="375" y="40" text-anchor="middle" font-size="24" font-weight="700">Choose the closest output that A can actually make</text>
    <text x="375" y="85" text-anchor="middle" font-size="20" fill="#334155">A = (1,1)ᵀ; Ac = (c,c), b = (3,1)</text>
    <rect x="140" y="140" width="300" height="300" fill="url(#grid)"/>
    <path d="M120 380H460M200 460V120" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M140 440L440 140" fill="none" stroke="#A7F3D0" stroke-width="4"/>
    <path d="M200 380L380 320" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M200 380L320 260" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/><path d="M320 260L380 320" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M310 270L320 280L330 270" fill="none" stroke="#D97706" stroke-width="2"/>
    <text x="425" y="177" font-size="19" fill="#065F46">im(A)</text><text x="241" y="231" font-size="19" font-weight="700" fill="#065F46">Aĉ = (2,2)</text><text x="405" y="342" font-size="20" font-weight="700" fill="#1E3A8A">b = (3,1)</text><text x="435" y="265" font-size="19" fill="#5B21B6">r = (1,−1)</text>
    <text x="375" y="487" text-anchor="middle" font-size="20" fill="#334155">ĉ = 2; Aᵀr = (1,1)·(1,−1) = 0</text><text x="375" y="523" text-anchor="middle" font-size="18" fill="#475569">No exact solution reaches b, but a unique nearest output exists.</text>
    <g font-size="16" fill="#475569"><text x="470" y="386">y₁</text><text x="193" y="107">y₂</text></g>
  </g>
</svg>
