<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" role="img" aria-labelledby="title desc">
  <title id="title">A singular transformation collapses a square into a line of zero area</title>
  <desc id="desc">The input unit square is transformed by the matrix with columns one two and two four. The four transformed corners lie on a single line, so length remains but two-dimensional area is zero.</desc>
  <defs><pattern id="grid" width="40" height="40" x="0" y="30" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2E8F0"/></pattern><pattern id="grid2" width="25" height="25" x="10" y="15" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="920" height="510" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="460" y="40" text-anchor="middle" font-size="24" font-weight="700">Area can disappear even when length remains</text>
    <text x="220" y="98" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A8A">Input square</text><text x="670" y="98" text-anchor="middle" font-size="21" font-weight="700" fill="#065F46">Collapsed output</text>
    <rect x="120" y="190" width="200" height="200" fill="url(#grid)"/><rect x="560" y="190" width="225" height="200" fill="url(#grid2)"/>
    <path d="M100 350H340M160 410V160M535 390H810M610 420V160" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M160 350H200V310H160Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <text x="200" y="379" text-anchor="middle" font-size="16" fill="#475569">1</text><text x="129" y="316" font-size="16" fill="#475569">1</text>
    <path d="M610 390L685 240" fill="none" stroke="#059669" stroke-width="5"/>
    <circle cx="610" cy="390" r="4" fill="#059669"/><circle cx="635" cy="340" r="4" fill="#059669"/><circle cx="660" cy="290" r="4" fill="#059669"/><circle cx="685" cy="240" r="4" fill="#059669"/>
    <text x="707" y="223" font-size="19" fill="#065F46">(3, 6)</text><text x="572" y="443" font-size="19" fill="#065F46">(0, 0)</text><text x="701" y="323" font-size="19" fill="#334155">All four corners</text><text x="701" y="352" font-size="19" fill="#334155">lie on one line.</text>
    <path d="M370 292H490" fill="none" stroke="#7C3AED" stroke-width="3" marker-end="url(#arrow)"/><text x="430" y="252" text-anchor="middle" font-size="18" fill="#5B21B6">B = [[1, 2],</text><text x="430" y="279" text-anchor="middle" font-size="18" fill="#5B21B6">[2, 4]]</text>
    <text x="460" y="480" text-anchor="middle" font-size="20" fill="#334155">The columns are dependent: rank 1, det(B) = 0, and no inverse.</text>
  </g>
</svg>
