<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">Rotation preserves ordered-axis orientation while reflection reverses it</title>
  <desc id="desc">Three equal-scale diagrams track the ordered first and second basis images. Identity and ninety-degree rotation have counterclockwise order and positive determinant. Reflection across the horizontal axis has clockwise order and negative determinant, while all three have area one.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#E2E8F0"/></pattern></defs>
  <rect width="1080" height="500" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="540" y="40" text-anchor="middle" font-size="24" font-weight="700">Orientation belongs to an ordered pair, not one vector</text>
    <text x="180" y="98" text-anchor="middle" font-size="21" font-weight="700">Identity</text><text x="540" y="98" text-anchor="middle" font-size="21" font-weight="700">Rotate 90°</text><text x="900" y="98" text-anchor="middle" font-size="21" font-weight="700">Reflect across x-axis</text>
    <rect x="60" y="180" width="240" height="240" fill="url(#grid)"/><rect x="420" y="180" width="240" height="240" fill="url(#grid)"/><rect x="780" y="180" width="240" height="240" fill="url(#grid)"/>
    <path d="M40 300H320M180 440V160M400 300H680M540 440V160M760 300H1040M900 440V160" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M180 300H240" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M180 300V240" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M540 300V240" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M540 300H480" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M900 300H960" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M900 300V360" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M214 300A34 34 0 0 0 180 266" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/><path d="M540 266A34 34 0 0 0 506 300" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/><path d="M934 300A34 34 0 0 1 900 334" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#arrow)"/>
    <g font-size="19" font-weight="700"><text x="256" y="330" fill="#1E3A8A">1st</text><text x="124" y="216" fill="#5B21B6">2nd</text><text x="566" y="216" fill="#1E3A8A">1st</text><text x="424" y="332" fill="#5B21B6">2nd</text><text x="976" y="276" fill="#1E3A8A">1st</text><text x="926" y="395" fill="#5B21B6">2nd</text></g>
    <text x="180" y="469" text-anchor="middle" font-size="19" fill="#065F46">Counterclockwise; det = 1</text><text x="540" y="469" text-anchor="middle" font-size="19" fill="#065F46">Counterclockwise; det = 1</text><text x="900" y="469" text-anchor="middle" font-size="19" fill="#92400E">Clockwise; det = −1</text>
  </g>
</svg>
