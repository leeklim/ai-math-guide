<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 570" role="img" aria-labelledby="title desc">
  <title id="title">A shear with eigenvalue one can still grow vectors outside its eigenspace</title>
  <desc id="desc">The shear matrix with rows one one and zero one keeps the horizontal eigenspace fixed. Starting at zero one, its successive outputs one one, two one, and three one move horizontally while the second component stays one, even though the only eigenvalue is one.</desc>
  <defs><pattern id="grid" width="55" height="55" x="15" y="40" patternUnits="userSpaceOnUse"><path d="M55 0H0V55" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="770" height="570" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="385" y="40" text-anchor="middle" font-size="24" font-weight="700">S = [[1, 1], [0, 1]] has only one eigenvector direction</text>
    <text x="385" y="86" text-anchor="middle" font-size="20" fill="#334155">Start at x = (0, 1): Sᵏx = (k, 1)</text>
    <rect x="125" y="150" width="330" height="330" fill="url(#grid)"/>
    <path d="M100 370H480M180 495V125" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M125 370H455" fill="none" stroke="#DDD6FE" stroke-width="5"/><path d="M180 315H345" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M180 370V315" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/><path d="M180 370L235 315" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M180 370L290 315" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M180 370L345 315" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <g font-size="18" fill="#334155" text-anchor="middle"><text x="132" y="286">k=0</text><text x="235" y="249">k=1</text><text x="290" y="286">k=2</text><text x="345" y="249">k=3</text></g>
    <text x="515" y="286" font-size="20" fill="#5B21B6">E₁ = span{(1,0)}</text><text x="515" y="330" font-size="19" fill="#334155">Only this line is fixed.</text><text x="515" y="391" font-size="19" fill="#065F46">The input x is outside E₁.</text>
    <text x="385" y="520" text-anchor="middle" font-size="19" fill="#475569">Eigenvalue magnitude 1 describes the eigenline,</text>
    <text x="385" y="550" text-anchor="middle" font-size="19" fill="#475569">not every input's repeated behavior.</text>
    <g font-size="16" fill="#475569"><text x="490" y="376">x₁</text><text x="173" y="112">x₂</text></g>
  </g>
</svg>
