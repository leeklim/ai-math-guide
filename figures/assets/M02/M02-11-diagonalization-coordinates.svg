<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 550" role="img" aria-labelledby="title desc">
  <title id="title">Diagonalization separates coordinate conversion, directional scaling, and reconstruction</title>
  <desc id="desc">Four equal-scale plots show x three one in standard coordinates, its eigenbasis coefficients two one, scaled coefficients four three under diagonal eigenvalues two and three, and reconstructed output seven three. Eigenvectors are one zero and one one.</desc>
  <defs><pattern id="grid" width="25" height="25" y="5" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="1220" height="550" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="610" y="40" text-anchor="middle" font-size="24" font-weight="700">A = VΛV⁻¹: change coordinates, scale, then rebuild</text>
    <text x="150" y="101" text-anchor="middle" font-size="20" font-weight="700" fill="#1E3A8A">x = (3, 1)</text><text x="445" y="101" text-anchor="middle" font-size="20" font-weight="700" fill="#5B21B6">c = (2, 1)</text><text x="720" y="101" text-anchor="middle" font-size="20" font-weight="700" fill="#5B21B6">Λc = (4, 3)</text><text x="1050" y="101" text-anchor="middle" font-size="20" font-weight="700" fill="#065F46">Ax = (7, 3)</text>
    <text x="150" y="141" text-anchor="middle" font-size="17" fill="#475569">Standard coordinates</text><text x="445" y="141" text-anchor="middle" font-size="17" fill="#475569">Eigenbasis coefficients</text><text x="720" y="141" text-anchor="middle" font-size="17" fill="#475569">Eigenbasis coefficients</text><text x="1050" y="141" text-anchor="middle" font-size="17" fill="#475569">Standard coordinates</text>
    <rect x="75" y="205" width="150" height="200" fill="url(#grid)"/><rect x="350" y="205" width="150" height="200" fill="url(#grid)"/><rect x="650" y="205" width="150" height="200" fill="url(#grid)"/><rect x="925" y="205" width="225" height="200" fill="url(#grid)"/>
    <path d="M55 355H245M100 425V185M330 355H520M375 425V185M630 355H820M675 425V185M905 355H1170M950 425V185" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M100 355L175 330" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M375 355L425 330" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/><path d="M675 355L775 280" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/><path d="M950 355L1125 280" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M265 295H305" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M545 295H605" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M845 295H880" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="285" y="260" text-anchor="middle" font-size="20" fill="#5B21B6">V⁻¹</text><text x="575" y="260" text-anchor="middle" font-size="20" fill="#5B21B6">Λ</text><text x="862" y="260" text-anchor="middle" font-size="20" fill="#5B21B6">V</text>
    <text x="610" y="481" text-anchor="middle" font-size="20" fill="#334155">v₁ = (1, 0), v₂ = (1, 1); λ₁ = 2, λ₂ = 3</text><text x="610" y="523" text-anchor="middle" font-size="18" fill="#475569">x = 2v₁ + v₂ becomes Ax = 4v₁ + 3v₂. Coefficient plots are not extra physical motions.</text>
  </g>
</svg>
