<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">Applying A and then A transpose squares singular gains</title>
  <desc id="desc">For A equal to diagonal three one, e one maps to three e one then nine e one, while e two remains e two. Shared-scale arrows show gains three and one for A and squared gains nine and one for A transpose A.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="980" height="560" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="490" y="42" text-anchor="middle" font-size="24" font-weight="700">AᵀA returns to input space with gain σᵢ²</text>
    <g font-size="21" font-weight="700" text-anchor="middle"><text x="140" y="106">Input</text><text x="410" y="106">After A = diag(3, 1)</text><text x="750" y="106">After AᵀA = diag(9, 1)</text></g>
    <g stroke="#CBD5E1" stroke-width="2"><path d="M75 230H235M75 350H235M310 230H535M310 350H535M635 230H900M635 350H900"/></g>
    <path d="M100 230H125" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M100 350H125" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M340 230H415" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/><path d="M340 350H365" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/><path d="M650 230H875" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/><path d="M650 350H675" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <g font-size="20" fill="#334155"><text x="80" y="192">v₁ = e₁</text><text x="80" y="312">v₂ = e₂</text><text x="343" y="192">σ₁u₁ = 3e₁</text><text x="343" y="312">σ₂u₂ = e₂</text><text x="650" y="192">σ₁²v₁ = 9e₁</text><text x="650" y="312">σ₂²v₂ = e₂</text></g>
    <text x="490" y="428" text-anchor="middle" font-size="19" fill="#475569">Each arrow is drawn along its own singular direction. Common length scale: 25 px per unit.</text>
    <text x="490" y="478" text-anchor="middle" font-size="20" fill="#334155">σ₁ = 3 is the largest single-step gain. ‖A‖F = √(3² + 1²) = √10 combines both.</text>
    <text x="490" y="522" text-anchor="middle" font-size="18" fill="#475569">The eigenvalues of AᵀA are 9 and 1; their positive square roots are the singular values.</text>
  </g>
</svg>
