<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc">
  <title id="title">A rank-one singular component reads one coefficient and produces one output direction</title>
  <desc id="desc">For diagonal matrix three one and input one two, the first singular component outputs three zero, the second outputs zero two, and their sum is three two. Keeping only the first component leaves a perpendicular residual zero two; the discarded singular value is one.</desc>
  <defs><pattern id="grid" width="40" height="40" x="20" y="20" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2E8F0"/></pattern><pattern id="grid2" width="40" height="40" x="10" y="20" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="1080" height="570" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="540" y="42" text-anchor="middle" font-size="24" font-weight="700">A = 3u₁v₁ᵀ + u₂v₂ᵀ, with x = (1, 2)</text>
    <g font-size="21" font-weight="700" text-anchor="middle"><text x="190" y="102">First component</text><text x="525" y="102">Second component</text><text x="870" y="102">Sum, then truncate</text></g>
    <g font-size="18" fill="#475569" text-anchor="middle"><text x="190" y="144">Read v₁ᵀx = 1</text><text x="525" y="144">Read v₂ᵀx = 2</text><text x="870" y="144">Keep only 3u₁v₁ᵀ</text></g>
    <rect x="100" y="180" width="200" height="220" fill="url(#grid)"/><rect x="435" y="180" width="180" height="220" fill="url(#grid2)"/><rect x="780" y="180" width="230" height="220" fill="url(#grid)"/>
    <path d="M80 340H320M140 420V160M415 340H635M490 420V160M760 340H1030M820 420V160" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M140 340H260" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/><path d="M490 340V260" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M820 340L940 260" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M820 340H940" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/><path d="M940 340V260" stroke="#7C3AED" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <path d="M940 325H925V340" fill="none" stroke="#64748B" stroke-width="2"/>
    <g font-size="20"><text x="180" y="376" fill="#065F46">(3, 0)</text><text x="511" y="248" fill="#5B21B6">(0, 2)</text><text x="861" y="230" fill="#1E3A8A">Ax = (3, 2)</text><text x="965" y="310" fill="#5B21B6">Residual</text><text x="861" y="376" fill="#065F46">A₁x = (3, 0)</text></g>
    <text x="540" y="466" text-anchor="middle" font-size="20" fill="#334155">Compact SVD keeps both positive components. Rank-1 truncation discards the second.</text>
    <text x="540" y="511" text-anchor="middle" font-size="18" fill="#475569">Here ‖A − A₁‖₂ = 1, but this particular residual has length 2 because v₂ᵀx = 2.</text>
    <text x="540" y="548" text-anchor="middle" font-size="16" fill="#475569">Common scale: 40 px per unit. Truncation error as a matrix norm is not a fixed per-input error.</text>
  </g>
</svg>
