<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 550" role="img" aria-labelledby="title desc">
  <title id="title">SVD aligns coordinates, scales singular directions, and changes output coordinates</title>
  <desc id="desc">At a common scale of forty pixels per unit, a unit vector along the forty-five-degree right singular direction becomes one zero, then three zero, then three times the thirty-degree left singular direction. Orthogonal steps preserve lengths, while the unit circle becomes an ellipse with semi-axes three and one.</desc>
  <defs><pattern id="grid" width="40" height="40" x="30" y="20" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2E8F0"/></pattern><pattern id="grid2" width="40" height="40" x="20" y="20" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2E8F0"/></pattern><pattern id="grid3" width="40" height="40" x="35" y="20" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="1160" height="550" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="580" y="42" text-anchor="middle" font-size="24" font-weight="700">A = UΣVᵀ: coordinate changes do not change length</text>
    <g font-size="20" font-weight="700" text-anchor="middle"><text x="150" y="100">Input x = v₁</text><text x="430" y="100">Vᵀx = (1, 0)</text><text x="700" y="100">ΣVᵀx = (3, 0)</text><text x="995" y="100">Ax = 3u₁</text></g>
    <g font-size="17" fill="#475569" text-anchor="middle"><text x="150" y="142">Standard input coordinates</text><text x="430" y="142">Right-singular coordinates</text><text x="700" y="142">Scaled coefficients</text><text x="995" y="142">Standard output coordinates</text></g>
    <rect x="50" y="200" width="200" height="200" fill="url(#grid)"/><rect x="330" y="200" width="200" height="200" fill="url(#grid)"/><rect x="565" y="200" width="270" height="200" fill="url(#grid2)"/><rect x="860" y="180" width="270" height="240" fill="url(#grid3)"/>
    <path d="M40 300H260M150 420V180M320 300H540M430 420V180M555 300H845M700 420V180M850 300H1140M995 440V160" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <g fill="none" stroke="#64748B" stroke-width="2.5"><circle cx="150" cy="300" r="40"/><circle cx="430" cy="300" r="40"/><ellipse cx="700" cy="300" rx="120" ry="40"/><ellipse cx="995" cy="300" rx="120" ry="40" transform="rotate(-30 995 300)"/></g>
    <path d="M150 300L178.284 271.716" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M430 300H470" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/><path d="M700 300H820" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/><path d="M995 300L1098.923 240" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M280 280H305" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M547 280H560" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M845 280H860" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g font-size="18" fill="#5B21B6" text-anchor="middle"><text x="292" y="248">Vᵀ</text><text x="554" y="248">Σ</text><text x="852" y="248">U</text></g>
    <g font-size="19" text-anchor="middle" fill="#334155"><text x="150" y="458">Norm 1</text><text x="430" y="458">Norm 1</text><text x="700" y="458">Norm 3</text><text x="995" y="458">Norm 3</text></g>
    <text x="580" y="509" text-anchor="middle" font-size="18" fill="#475569">Common scale: 40 px per unit. σ₁ = 3 and σ₂ = 1. Axes stay fixed in each coordinate plot.</text>
  </g>
</svg>
