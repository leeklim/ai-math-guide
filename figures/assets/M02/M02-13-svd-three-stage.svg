<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Singular value decomposition as rotation scaling and rotation</title>
  <desc id="desc">A vector and unit circle pass through V transpose, Sigma, and U, becoming a rotated ellipse in the output space.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <rect width="960" height="540" rx="18" fill="#F8FAFC"/>
  <text x="480" y="48" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#0F172A">A = U Σ Vᵀ</text>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="105" y="90" font-size="20" font-weight="700" fill="#0F172A">Input</text>
    <text x="335" y="90" font-size="20" font-weight="700" fill="#0F172A">Vᵀ</text>
    <text x="570" y="90" font-size="20" font-weight="700" fill="#0F172A">Σ</text>
    <text x="820" y="90" font-size="20" font-weight="700" fill="#0F172A">U</text>
  </g>
  <g transform="translate(105 275)" fill="none" stroke-width="3">
    <circle r="70" stroke="#64748B"/><path d="M-90 0H90M0-90V90" stroke="#CBD5E1"/>
    <path d="M0 0L48-38" stroke="#059669" stroke-width="5"/>
  </g>
  <g transform="translate(335 275) rotate(-28)" fill="none" stroke-width="3">
    <circle r="70" stroke="#64748B"/><path d="M-90 0H90M0-90V90" stroke="#CBD5E1"/>
    <path d="M0 0L62 0" stroke="#2563EB" stroke-width="5"/>
  </g>
  <g transform="translate(570 275)" fill="none" stroke-width="3">
    <ellipse rx="115" ry="43" stroke="#64748B"/><path d="M-130 0H130M0-80V80" stroke="#CBD5E1"/>
    <path d="M0 0L100 0" stroke="#D97706" stroke-width="5"/>
  </g>
  <g transform="translate(820 275) rotate(32)" fill="none" stroke-width="3">
    <ellipse rx="115" ry="43" stroke="#64748B"/><path d="M-130 0H130M0-80V80" stroke="#CBD5E1"/>
    <path d="M0 0L100 0" stroke="#DC2626" stroke-width="5"/>
  </g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
    <path d="M190 275H245"/><path d="M420 275H465"/><path d="M690 275H705"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#334155" text-anchor="middle">
    <text x="105" y="430">arbitrary coordinates</text><text x="335" y="430">align with right singular vectors</text>
    <text x="570" y="430">scale each singular direction</text><text x="820" y="430">orient in output space</text>
  </g>
  <text x="480" y="492" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">Vᵀ changes input coordinates, Σ changes lengths, and U changes output orientation.</text>
</svg>
