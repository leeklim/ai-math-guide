<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">Centering subtracts the same feature mean from every sample</title>
  <desc id="desc">Samples one two, three four and five six translate by minus the mean three four to minus two minus two, zero zero and two two. The relative displacements stay unchanged and the mean becomes the new origin.</desc>
  <defs><pattern id="grid" width="40" height="40" x="20" y="10" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2E8F0"/></pattern><pattern id="grid2" width="40" height="40" x="0" y="0" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="580" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700">Centering moves the mean to zero, not each sample's feature average</text>
    <text x="245" y="104" text-anchor="middle" font-size="21" font-weight="700">Original samples</text><text x="750" y="104" text-anchor="middle" font-size="21" font-weight="700">Centered samples</text>
    <rect x="100" y="150" width="280" height="300" fill="url(#grid)"/><rect x="610" y="170" width="280" height="280" fill="url(#grid2)"/>
    <path d="M80 410H400M100 465V130M590 320H910M760 465V150" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M140 330L300 170M680 400L840 240" fill="none" stroke="#CBD5E1" stroke-width="2"/>
    <g fill="#2563EB"><circle cx="140" cy="330" r="5"/><circle cx="220" cy="250" r="5"/><circle cx="300" cy="170" r="5"/></g><g fill="#059669"><circle cx="680" cy="400" r="5"/><circle cx="760" cy="320" r="5"/><circle cx="840" cy="240" r="5"/></g>
    <circle cx="220" cy="250" r="11" fill="none" stroke="#D97706" stroke-width="2.5"/><circle cx="760" cy="320" r="11" fill="none" stroke="#D97706" stroke-width="2.5"/>
    <g font-size="19"><text x="153" y="349" fill="#1E3A8A">(1, 2)</text><text x="250" y="260" fill="#92400E">μ = (3, 4)</text><text x="315" y="179" fill="#1E3A8A">(5, 6)</text><text x="610" y="429" fill="#065F46">(−2, −2)</text><text x="777" y="349" fill="#92400E">Mean (0, 0)</text><text x="848" y="225" fill="#065F46">(2, 2)</text></g>
    <path d="M420 285H565" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="492" y="247" text-anchor="middle" font-size="20" fill="#5B21B6">xₙ − μ</text><text x="492" y="329" text-anchor="middle" font-size="18" fill="#475569">Same μ for all rows</text>
    <text x="500" y="511" text-anchor="middle" font-size="19" fill="#334155">The displacement between neighboring samples stays (2, 2). Only the reference point changes.</text>
    <text x="500" y="551" text-anchor="middle" font-size="17" fill="#475569">Both coordinate plots use 40 px per unit. Orange rings mark the feature-wise sample mean.</text>
  </g>
</svg>
