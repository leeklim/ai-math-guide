<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" role="img" aria-labelledby="title desc">
  <title id="title">Covariance combines paired deviations, so its sign depends on their quadrant</title>
  <desc id="desc">Three centered sample sets show positive covariance from same-sign deviations, negative covariance from opposite-sign deviations, and zero covariance from cancellation in a nonlinearly dependent three-point set.</desc>
  <defs><pattern id="grid" width="60" height="60" x="0" y="0" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#E2E8F0"/></pattern><pattern id="grid2" width="60" height="60" x="0" y="0" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#E2E8F0"/></pattern></defs>
  <rect width="1080" height="540" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="540" y="42" text-anchor="middle" font-size="24" font-weight="700">Read covariance from paired deviations around the mean</text>
    <g font-size="21" font-weight="700" text-anchor="middle"><text x="180" y="106" fill="#065F46">Positive</text><text x="540" y="106" fill="#5B21B6">Negative</text><text x="900" y="106">Zero does not mean independent</text></g>
    <rect x="60" y="180" width="240" height="240" fill="url(#grid)"/><rect x="420" y="180" width="240" height="240" fill="url(#grid)"/><rect x="780" y="180" width="240" height="240" fill="url(#grid2)"/>
    <path d="M40 300H320M180 435V160M400 300H680M540 435V160M760 300H1040M900 435V160" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <g fill="#059669"><circle cx="120" cy="360" r="6"/><circle cx="180" cy="300" r="6"/><circle cx="240" cy="240" r="6"/></g><g fill="#7C3AED"><circle cx="480" cy="240" r="6"/><circle cx="540" cy="300" r="6"/><circle cx="600" cy="360" r="6"/></g><g fill="#2563EB"><circle cx="840" cy="280" r="6"/><circle cx="900" cy="340" r="6"/><circle cx="960" cy="280" r="6"/></g>
    <g font-size="18" fill="#475569" text-anchor="middle"><text x="180" y="151">y = x</text><text x="540" y="151">y = −x</text><text x="900" y="151">y = x² − 2/3, x ∈ {−1, 0, 1}</text></g>
    <g font-size="18"><text x="206" y="205" fill="#065F46">(+)(+) &gt; 0</text><text x="74" y="397" fill="#065F46">(−)(−) &gt; 0</text><text x="573" y="394" fill="#5B21B6">(+)(−) &lt; 0</text><text x="422" y="220" fill="#5B21B6">(−)(+) &lt; 0</text></g>
    <g font-size="20" text-anchor="middle" fill="#334155"><text x="180" y="468">s₁₂ = 1</text><text x="540" y="468">s₁₂ = −1</text><text x="900" y="468">s₁₂ = (−1/3 + 0 + 1/3)/2 = 0</text></g>
    <text x="540" y="515" text-anchor="middle" font-size="17" fill="#475569">N = 3 in each panel. Both feature means are zero. Grid spacing is one unit.</text>
  </g>
</svg>
