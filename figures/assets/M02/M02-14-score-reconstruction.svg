<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">A PCA score reconstructs a projection, then adding the mean restores its location</title>
  <desc id="desc">The centered sample three one projects to two two along the first principal direction one one divided by square root two, with score two square root two and perpendicular residual one minus one. Adding illustrative mean two three restores the original point five four and reconstructed point four five.</desc>
  <defs><pattern id="grid" width="45" height="45" x="30" y="40" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#E2E8F0"/></pattern><pattern id="grid2" width="45" height="45" x="25" y="35" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="600" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700">Score → projected vector → original location</text>
    <text x="225" y="104" text-anchor="middle" font-size="21" font-weight="700">Centered feature space</text><text x="745" y="104" text-anchor="middle" font-size="21" font-weight="700">Add mean μ = (2, 3)</text>
    <rect x="75" y="175" width="315" height="270" fill="url(#grid)"/><rect x="565" y="170" width="315" height="315" fill="url(#grid2)"/><path d="M55 355H415M120 465V155M545 440H910M565 500V150" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M75 400L300 175M565 395L835 125" fill="none" stroke="#CBD5E1" stroke-width="2.5"/>
    <path d="M120 355L255 310" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M120 355L210 265" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/><path d="M210 265L255 310" stroke="#7C3AED" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <path d="M210 280L220.607 290.607L231.213 280" fill="none" stroke="#64748B" stroke-width="2"/>
    <g font-size="19"><text x="270" y="330" fill="#1E3A8A">x꜀ = (3, 1)</text><text x="160" y="162" fill="#065F46">x̂꜀ = (2, 2)</text><text x="270" y="276" fill="#5B21B6">(1, −1)</text><text x="84" y="424" fill="#475569">z₁ = 2√2</text></g>
    <path d="M435 300H525" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="480" y="260" text-anchor="middle" font-size="20" fill="#5B21B6">+ μ</text>
    <path d="M655 305L790 260" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/><path d="M655 305L745 215" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 215L790 260" stroke="#7C3AED" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
    <g fill="#D97706"><circle cx="655" cy="305" r="6"/></g><circle cx="790" cy="260" r="5" fill="#2563EB"/><circle cx="745" cy="215" r="5" fill="#059669"/>
    <g font-size="19"><text x="595" y="402" fill="#92400E">μ = (2, 3)</text><text x="804" y="280" fill="#1E3A8A">x = (5, 4)</text><text x="800" y="215" fill="#065F46">x̂ = (4, 5)</text></g>
    <text x="500" y="531" text-anchor="middle" font-size="19" fill="#334155">The score is a scalar; the reconstruction is a vector. The discarded residual is not restored.</text>
    <text x="500" y="574" text-anchor="middle" font-size="17" fill="#475569">Common scale: 45 px per unit. The reconstructed line passes through μ after the mean is added back.</text>
  </g>
</svg>
