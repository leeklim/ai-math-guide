<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 610" role="img" aria-labelledby="title desc">
  <title id="title">Equal right-hand-side errors can be amplified differently by the inverse</title>
  <desc id="desc">With A diagonal one one quarter and baseline b and x both one zero, errors zero point zero two zero and zero zero point zero two have the same norm. Their solution errors are zero point zero two zero and zero zero point zero eight. Error-coordinate plots use the same scale, illustrating actual relative-error factors one and four.</desc>
  <defs><pattern id="grid" width="40" height="40" x="20" y="30" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2E8F0"/></pattern><pattern id="grid2" width="40" height="40" x="0" y="30" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="1060" height="610" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="530" y="42" text-anchor="middle" font-size="24" font-weight="700">A = diag(1, 1/4): inverse amplification depends on the error direction</text>
    <text x="530" y="88" text-anchor="middle" font-size="19" fill="#475569">Baseline b = x = (1, 0), so both reference norms equal 1. κ₂(A) = 4.</text>
    <text x="250" y="146" text-anchor="middle" font-size="21" font-weight="700">Right-hand-side errors δb</text><text x="790" y="146" text-anchor="middle" font-size="21" font-weight="700">Solution errors δx = A⁻¹δb</text>
    <rect x="140" y="190" width="240" height="260" fill="url(#grid)"/><rect x="650" y="190" width="250" height="260" fill="url(#grid2)"/><path d="M120 350H400M220 470V170M630 350H920M720 470V170" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <path d="M220 350H260" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M220 350V310" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/><path d="M720 350H760" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M720 350V190" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow)"/>
    <g font-size="19"><text x="250" y="399" fill="#1E3A8A">(0.02, 0)</text><text x="240" y="289" fill="#5B21B6">(0, 0.02)</text><text x="755" y="399" fill="#1E3A8A">(0.02, 0)</text><text x="750" y="211" fill="#5B21B6">(0, 0.08)</text></g>
    <path d="M435 320H590" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="512" y="276" text-anchor="middle" font-size="21" fill="#5B21B6">A⁻¹ = diag(1, 4)</text>
    <text x="530" y="512" text-anchor="middle" font-size="19" fill="#334155">Input relative error: 0.02 in either direction. Output relative error: 0.02 or 0.08.</text>
    <text x="530" y="553" text-anchor="middle" font-size="18" fill="#475569">The bound is 4 × 0.02 = 0.08. The blue error does not reach it; the purple error does.</text>
    <text x="530" y="589" text-anchor="middle" font-size="16" fill="#475569">These are magnified error coordinates, not the baseline vectors. Common scale: 40 px per 0.02.</text>
  </g>
</svg>
