<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Spectral norm bounds the largest output while Frobenius norm combines all squared singular gains</title>
  <desc id="desc">For diagonal three one, the image of the unit circle is an ellipse inside the radius three circle. The first singular direction reaches that bound. On the right, a three-by-three square and a one-by-one square show squared gains nine and one totaling ten.</desc>
  <defs><pattern id="grid" width="30" height="30" x="10" y="20" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#E2E8F0"/></pattern><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="1000" height="560" rx="18" fill="#F8FAFC"/>
  <g font-family="sans-serif" fill="#0F172A">
    <text x="500" y="42" text-anchor="middle" font-size="24" font-weight="700">A = diag(3, 1): maximum gain and combined size are different</text>
    <text x="250" y="105" text-anchor="middle" font-size="21" font-weight="700">Spectral norm = 3</text><text x="735" y="105" text-anchor="middle" font-size="21" font-weight="700">Frobenius norm = √10</text>
    <rect x="100" y="170" width="300" height="270" fill="url(#grid)"/><path d="M80 320H420M250 420V150" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <circle cx="250" cy="320" r="90" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6 5"/><ellipse cx="250" cy="320" rx="90" ry="30" fill="#D1FAE5" fill-opacity=".6" stroke="#059669" stroke-width="2.5"/>
    <path d="M250 320H340" stroke="#059669" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="120" y="144" font-size="18" fill="#475569">Radius-3 bound</text><text x="340" y="361" font-size="19" fill="#065F46">Ae₁ = 3e₁</text><text x="116" y="449" font-size="18" fill="#065F46">All ‖Ax‖₂ ≤ 3 for ‖x‖₂ = 1</text>
    <rect x="620" y="220" width="90" height="90" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><path d="M650 220V310M680 220V310M620 250H710M620 280H710" stroke="#93C5FD"/>
    <rect x="835" y="280" width="30" height="30" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="665" y="195" text-anchor="middle" font-size="20" fill="#1E3A8A">σ₁² = 9</text><text x="850" y="248" text-anchor="middle" font-size="20" fill="#065F46">σ₂² = 1</text><text x="770" y="280" text-anchor="middle" font-size="26" fill="#475569">+</text>
    <text x="735" y="377" text-anchor="middle" font-size="21" fill="#334155">‖A‖F² = 9 + 1 = 10</text>
    <text x="500" y="485" text-anchor="middle" font-size="19" fill="#334155">The ellipse's longest radius is 3. Combining squared gains gives √10, not another radius.</text>
    <text x="500" y="531" text-anchor="middle" font-size="17" fill="#475569">Common scale: 30 px per unit. Squares show squared magnitudes, not input or output regions.</text>
  </g>
</svg>
