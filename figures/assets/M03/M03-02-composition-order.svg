<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600" role="img"><title>First apply T then S while matrices multiply right to left</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="600" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="22"><text x="40" y="44" fill="#0F172A" font-size="24">Follow the map order</text><rect x="40" y="90" width="440" height="70" rx="6" fill="#2563EB" fill-opacity=".06" stroke="#2563EB" stroke-width="2"/><text x="65" y="132" fill="#2563EB" font-size="22">Input: [v]B</text><path d="M250 176L250 235" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="285" y="207" fill="#7C3AED" font-size="22">T  →  AT</text><rect x="40" y="253" width="440" height="70" rx="6" fill="#059669" fill-opacity=".06" stroke="#059669" stroke-width="2"/><text x="65" y="295" fill="#059669" font-size="22">Middle: [T(v)]C</text><path d="M250 339L250 398" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="285" y="370" fill="#7C3AED" font-size="22">S  →  AS</text><rect x="40" y="416" width="440" height="70" rx="6" fill="#059669" fill-opacity=".06" stroke="#059669" stroke-width="2"/><text x="65" y="458" fill="#059669" font-size="22">Output: [S(T(v))]D</text><text x="40" y="539" fill="#7C3AED" font-size="22">[S(T(v))]D = AS AT [v]B</text><text x="40" y="573" fill="#475569" font-size="20">The rightmost matrix acts first.</text></g></svg>
