<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 490" width="780" height="490" role="img"><title>The abstract map and its coordinate matrix agree</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="780" height="490" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="22"><text x="42" y="44" fill="#0F172A" font-size="24">One map, two calculation paths</text><rect x="42" y="92" width="285" height="92" rx="6" fill="#2563EB" fill-opacity=".06" stroke="#2563EB" stroke-width="2"/><text x="65" y="130" fill="#2563EB" font-size="22">p(t) = 2 − 3t + 4t²</text><text x="65" y="163" fill="#475569" font-size="20">Polynomial in P2</text><rect x="448" y="92" width="290" height="92" rx="6" fill="#059669" fill-opacity=".06" stroke="#059669" stroke-width="2"/><text x="470" y="130" fill="#059669" font-size="22">D(p)(t) = −3 + 8t</text><text x="470" y="163" fill="#475569" font-size="20">Polynomial in P1</text><path d="M340 136L433 136" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="374" y="112" fill="#7C3AED" font-size="22">D</text><path d="M170 198L170 300" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><text x="42" y="247" fill="#2563EB" font-size="20">Read B</text><path d="M590 198L590 300" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/><text x="610" y="247" fill="#059669" font-size="20">Read C</text><rect x="42" y="316" width="285" height="85" rx="6" fill="#2563EB" fill-opacity=".06" stroke="#2563EB" stroke-width="2"/><text x="66" y="354" fill="#2563EB" font-size="22">[p]B = (2, −3, 4)ᵀ</text><text x="66" y="383" fill="#475569" font-size="20">3 coefficients</text><rect x="448" y="316" width="290" height="85" rx="6" fill="#059669" fill-opacity=".06" stroke="#059669" stroke-width="2"/><text x="472" y="354" fill="#059669" font-size="22">[D(p)]C = (−3, 8)ᵀ</text><text x="472" y="383" fill="#475569" font-size="20">2 coefficients</text><path d="M340 358L433 358" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="382" y="330" fill="#7C3AED" font-size="22">A</text><text x="42" y="450" fill="#475569" font-size="20">A multiplies coordinates; D acts on polynomials.</text></g></svg>
