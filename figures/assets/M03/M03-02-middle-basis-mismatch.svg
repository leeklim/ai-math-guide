<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img"><title>Matching shape cannot guarantee matching middle bases</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="760" height="480" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="22"><text x="42" y="44" fill="#0F172A" font-size="24">Same array, different middle-basis meanings</text><text x="42" y="96" fill="#2563EB" font-size="22">Middle coordinate array: (−3, 8)ᵀ</text><path d="M280 119L185 174" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M430 119L574 174" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="192" width="300" height="138" rx="6" fill="#059669" fill-opacity=".06" stroke="#059669" stroke-width="2"/><text x="64" y="232" fill="#059669" font-size="22">C = (1, t)</text><text x="64" y="275" fill="#0F172A" font-size="22">−3·1 + 8·t = −3 + 8t</text><text x="64" y="308" fill="#059669" font-size="22">Derivative: 8</text><rect x="402" y="192" width="316" height="138" rx="6" fill="#D97706" fill-opacity=".06" stroke="#D97706" stroke-width="2"/><text x="424" y="232" fill="#D97706" font-size="22">C′ = (t, 1)</text><text x="424" y="275" fill="#0F172A" font-size="22">−3·t + 8·1 = −3t + 8</text><text x="424" y="308" fill="#D97706" font-size="22">Derivative: −3</text><text x="42" y="390" fill="#475569" font-size="20">If the next matrix expects C′, convert coordinates first.</text><text x="42" y="433" fill="#475569" font-size="20">The correct C′ coordinates of −3 + 8t are (8, −3)ᵀ.</text></g></svg>
