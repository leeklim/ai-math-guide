<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 730" width="520" height="730" role="img"><title>The same numeric multiplication can actively move a vector instead of changing its coordinates</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="730" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="44" fill="#0F172A" font-size="30">Active map, fixed axes</text><path d="M90 110L90 460" fill="none" stroke="#CBD5E1" stroke-width="1" /><path d="M90 460L440 460" fill="none" stroke="#CBD5E1" stroke-width="1" /><text x="82" y="485" fill="#64748B" font-size="22">0</text><text x="62" y="466" fill="#64748B" font-size="22">0</text><path d="M160 110L160 460" fill="none" stroke="#CBD5E1" stroke-width="1" /><path d="M90 390L440 390" fill="none" stroke="#CBD5E1" stroke-width="1" /><text x="152" y="485" fill="#64748B" font-size="22">1</text><text x="62" y="396" fill="#64748B" font-size="22">1</text><path d="M230 110L230 460" fill="none" stroke="#CBD5E1" stroke-width="1" /><path d="M90 320L440 320" fill="none" stroke="#CBD5E1" stroke-width="1" /><text x="222" y="485" fill="#64748B" font-size="22">2</text><text x="62" y="326" fill="#64748B" font-size="22">2</text><path d="M300 110L300 460" fill="none" stroke="#CBD5E1" stroke-width="1" /><path d="M90 250L440 250" fill="none" stroke="#CBD5E1" stroke-width="1" /><text x="292" y="485" fill="#64748B" font-size="22">3</text><text x="62" y="256" fill="#64748B" font-size="22">3</text><path d="M370 110L370 460" fill="none" stroke="#CBD5E1" stroke-width="1" /><path d="M90 180L440 180" fill="none" stroke="#CBD5E1" stroke-width="1" /><text x="362" y="485" fill="#64748B" font-size="22">4</text><text x="62" y="186" fill="#64748B" font-size="22">4</text><path d="M440 110L440 460" fill="none" stroke="#CBD5E1" stroke-width="1" /><path d="M90 110L440 110" fill="none" stroke="#CBD5E1" stroke-width="1" /><text x="432" y="485" fill="#64748B" font-size="22">5</text><text x="62" y="116" fill="#64748B" font-size="22">5</text><path d="M90 460L458 460" fill="none" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M90 460L90 93" fill="none" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/><text x="463" y="466" fill="#475569" font-size="22">x</text><text x="80" y="85" fill="#475569" font-size="22">y</text><path d="M90 460L300 390" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M90 460L370 320" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M307 380L361 327" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="272" y="437" fill="#2563EB" font-size="28">u = (3, 1)</text><text x="205" y="283" fill="#059669" font-size="28">R(u) = (4, 2)</text><text x="389" y="365" fill="#7C3AED" font-size="28">R</text><text x="40" y="539" fill="#475569" font-size="28">Both arrays use E.</text><text x="40" y="580" fill="#475569" font-size="28">The endpoint moves.</text><text x="40" y="637" fill="#475569" font-size="28">Passive change keeps</text><text x="40" y="678" fill="#475569" font-size="28">the earlier endpoint fixed.</text></g></svg>
