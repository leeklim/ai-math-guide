<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 540" width="660" height="540" role="img"><title>Basis vectors assemble coordinate transformation columns</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="660" height="540" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="22"><text x="42" y="44" fill="#0F172A" font-size="24">Columns assemble the original vector</text><rect x="42" y="91" width="250" height="95" rx="6" fill="#2563EB" fill-opacity=".06" stroke="#2563EB" stroke-width="2"/><text x="65" y="132" fill="#2563EB" font-size="22">b1 = (1, 1)ᵀ</text><text x="65" y="165" fill="#475569" font-size="18">First column in E</text><rect x="368" y="91" width="250" height="95" rx="6" fill="#D97706" fill-opacity=".06" stroke="#D97706" stroke-width="2"/><text x="391" y="132" fill="#D97706" font-size="22">b2 = (1, −1)ᵀ</text><text x="391" y="165" fill="#475569" font-size="18">Second column in E</text><path d="M167 204L292 247" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M493 204L375 247" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><text x="50" y="299" fill="#0F172A" font-size="22">P E←B =</text><text x="292" y="289" fill="#2563EB" font-size="26">1</text><text x="375" y="289" fill="#D97706" font-size="26">1</text><text x="292" y="332" fill="#2563EB" font-size="26">1</text><text x="375" y="332" fill="#D97706" font-size="26">−1</text><path d="M275 262H260V346H275M417 262H432V346H417" fill="none" stroke="#334155" stroke-width="2"/><text x="42" y="405" fill="#7C3AED" font-size="22">3 × first column + 1 × second column</text><text x="42" y="453" fill="#059669" font-size="22">= 3(1, 1)ᵀ + (1, −1)ᵀ = (4, 2)ᵀ</text><text x="42" y="499" fill="#475569" font-size="20">Input B coefficients → output E coefficients</text></g></svg>
