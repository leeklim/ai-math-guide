<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 720" width="520" height="720" role="img"><title>Coefficient norm is not automatically geometric vector length</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="720" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="44" fill="#0F172A" font-size="30">Coefficient ≠ vector length</text><path d="M120 115L120 385" fill="none" stroke="#CBD5E1" stroke-width="1" /><path d="M120 385L390 385" fill="none" stroke="#CBD5E1" stroke-width="1" /><text x="112" y="412" fill="#64748B" font-size="22">0</text><text x="87" y="392" fill="#64748B" font-size="22">0</text><path d="M255 115L255 385" fill="none" stroke="#CBD5E1" stroke-width="1" /><path d="M120 250L390 250" fill="none" stroke="#CBD5E1" stroke-width="1" /><text x="247" y="412" fill="#64748B" font-size="22">1</text><text x="87" y="257" fill="#64748B" font-size="22">1</text><path d="M390 115L390 385" fill="none" stroke="#CBD5E1" stroke-width="1" /><path d="M120 115L390 115" fill="none" stroke="#CBD5E1" stroke-width="1" /><text x="382" y="412" fill="#64748B" font-size="22">2</text><text x="87" y="122" fill="#64748B" font-size="22">2</text><path d="M120 385L412 385" fill="none" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M120 385L120 94" fill="none" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M120 385L255 250" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><text x="279" y="251" fill="#059669" font-size="28">b1 = (1, 1)</text><text x="40" y="461" fill="#059669" font-size="28">Vector length = √2</text><text x="40" y="512" fill="#2563EB" font-size="28">[b1]B = (1, 0)ᵀ</text><text x="40" y="553" fill="#2563EB" font-size="28">Coefficient norm = 1</text><text x="40" y="610" fill="#475569" font-size="28">The length remains √2.</text><text x="40" y="665" fill="#475569" font-size="28">B is not orthonormal.</text></g></svg>
