<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 730" width="520" height="730" role="img"><title>Similarity converts input coordinates applies the operator and converts output coordinates back</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="730" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="22"><text x="40" y="44" fill="#0F172A" font-size="23">Similarity is a three-step route</text><rect x="40" y="90" width="440" height="64" rx="6" fill="#2563EB" fill-opacity=".06" stroke="#2563EB" stroke-width="2"/><text x="62" y="131" fill="#2563EB" font-size="22">Start in B: (3, 1)ᵀ</text><path d="M230 173L230 224" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="260" y="202" fill="#7C3AED" font-size="20">P E←B</text><rect x="40" y="245" width="440" height="64" rx="6" fill="#2563EB" fill-opacity=".06" stroke="#2563EB" stroke-width="2"/><text x="62" y="286" fill="#2563EB" font-size="22">Same v in E: (4, 2)ᵀ</text><path d="M230 327L230 378" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="260" y="356" fill="#7C3AED" font-size="20">[T]E</text><rect x="40" y="399" width="440" height="64" rx="6" fill="#059669" fill-opacity=".06" stroke="#059669" stroke-width="2"/><text x="62" y="440" fill="#059669" font-size="22">T(v) in E: (8, 2)ᵀ</text><path d="M230 482L230 533" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="260" y="511" fill="#7C3AED" font-size="20">P B←E</text><rect x="40" y="555" width="440" height="64" rx="6" fill="#059669" fill-opacity=".06" stroke="#059669" stroke-width="2"/><text x="62" y="596" fill="#059669" font-size="22">T(v) in B: (5, 3)ᵀ</text><text x="40" y="665" fill="#7C3AED" font-size="20">[T]B = P B←E [T]E P E←B</text><text x="40" y="704" fill="#475569" font-size="20">Both paths send (3, 1)ᵀ to (5, 3)ᵀ.</text></g></svg>
