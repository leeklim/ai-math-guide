<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" role="img"><title>Squared length partitions into orthogonal component squared lengths</title><rect width="520" height="520" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="24"><text x="40" y="44" fill="#0F172A" font-size="27">Squared lengths add</text><text x="40" y="112" fill="#2563EB" font-size="28">hU</text><text x="280" y="112" fill="#D97706" font-size="28">Residual</text><rect x="40" y="148" width="240" height="120" fill="#2563EB" fill-opacity=".1" stroke="#2563EB" stroke-width="2"/><rect x="280" y="148" width="180" height="120" fill="#D97706" fill-opacity=".1" stroke="#D97706" stroke-width="2"/><text x="149" y="220" fill="#2563EB" font-size="32">8</text><text x="359" y="220" fill="#D97706" font-size="32">6</text><text x="40" y="326" fill="#059669" font-size="26">Total squared length: 14</text><text x="40" y="388" fill="#475569" font-size="24">Widths are proportional to 8 and 6.</text><text x="40" y="438" fill="#475569" font-size="24">No cross term: hU · residual = 0.</text><text x="40" y="482" fill="#475569" font-size="24">Length itself is not 8 + 6.</text></g></svg>
