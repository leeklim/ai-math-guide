<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img"><title>Counting a shared basis direction once in a subspace sum</title><rect width="700" height="440" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="24"><text x="42" y="44" fill="#0F172A" font-size="24">Shared directions count only once</text><text x="42" y="112" fill="#2563EB" font-size="24">U = span(e1,e2)</text><text x="371" y="112" fill="#D97706" font-size="24">W = span(e2,e3)</text><rect x="42" y="142" width="390" height="115" rx="8" fill="#2563EB" fill-opacity=".06" stroke="#2563EB" stroke-width="2"/><rect x="268" y="142" width="390" height="115" rx="8" fill="#D97706" fill-opacity=".06" stroke="#D97706" stroke-width="2"/><text x="117" y="207" fill="#2563EB" font-size="28">e1</text><text x="324" y="207" fill="#7C3AED" font-size="28">e2</text><text x="526" y="207" fill="#D97706" font-size="28">e3</text><text x="42" y="321" fill="#7C3AED" font-size="24">U ∩ W = span(e2)</text><text x="42" y="375" fill="#059669" font-size="24">dim(U+W) = 2 + 2 − 1 = 3</text><text x="42" y="416" fill="#475569" font-size="19">Boxes mark basis membership, not geometric regions.</text></g></svg>
