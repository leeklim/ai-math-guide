<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img"><title>Quotient map collapses each horizontal coset to one quotient vector</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="760" height="520" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="22"><text x="40" y="44" font-size="24">Many input points, one quotient vector</text><text x="40" y="106" fill="#2563EB">Input plane V</text><text x="490" y="106" fill="#059669">Output classes in V/U</text><path d="M70 390V141M50 370H348" fill="none" stroke="#94A3B8" stroke-width="1.5"/><text x="45" y="185" font-size="18">3</text><text x="45" y="305" font-size="18">1</text><text x="45" y="375" font-size="18">0</text><text x="65" y="133" font-size="18">y</text><text x="355" y="376" font-size="18">x</text>
<path d="M70 190H330" fill="none" stroke="#059669" stroke-width="2.5"/><circle cx="160" cy="190" r="5" fill="#059669"/><circle cx="260" cy="190" r="5" fill="#059669"/><path d="M378 190H469" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="490" y="160" width="230" height="62" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="516" y="199" fill="#059669">(2,3) + U</text>
<path d="M70 310H330" fill="none" stroke="#D97706" stroke-width="2.5"/><circle cx="160" cy="310" r="5" fill="#D97706"/><circle cx="260" cy="310" r="5" fill="#D97706"/><path d="M378 310H469" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="490" y="280" width="230" height="62" rx="6" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="516" y="319" fill="#D97706">(0,1) + U</text>
<path d="M70 370H330" fill="none" stroke="#2563EB" stroke-width="2.5"/><circle cx="160" cy="370" r="5" fill="#2563EB"/><circle cx="260" cy="370" r="5" fill="#2563EB"/><path d="M378 370H469" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="490" y="354" width="230" height="62" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="516" y="393" fill="#2563EB">U = zero class</text><text x="40" y="463" font-size="20" fill="#475569">The zero output is a whole coset U, not just the origin.</text><text x="40" y="498" font-size="20" fill="#475569">Two input dimensions minus one ignored direction leave one.</text></g></svg>
