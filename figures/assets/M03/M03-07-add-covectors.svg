<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 660" width="520" height="660" role="img"><title>Adding covectors adds their measuring rules on the same input</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="660" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="44" fill="#0F172A" font-size="28">Add the measuring rules</text><rect x="40" y="90" width="440" height="70" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="115" y="135" fill="#2563EB" font-size="28">v = (4,2)ᵀ</text><path d="M205 181L131 222" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M315 181L389 222" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="245" width="200" height="120" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="64" y="290" fill="#7C3AED" font-size="26">φ: 2x − y</text><text x="121" y="340" fill="#7C3AED" font-size="32">6</text><rect x="280" y="245" width="200" height="120" rx="6" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="316" y="290" fill="#D97706" font-size="26">ψ: y</text><text x="362" y="340" fill="#D97706" font-size="32">2</text><path d="M140 386L225 449" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M380 386L295 449" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="472" width="440" height="85" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="115" y="524" fill="#059669" font-size="30">6 + 2 = 8</text><text x="40" y="609" fill="#475569" font-size="27">(φ+ψ)(v) = 2x = 8</text></g></svg>
