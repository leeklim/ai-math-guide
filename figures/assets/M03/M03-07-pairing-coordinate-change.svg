<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590" role="img"><title>Vector and covector coordinates change oppositely while their scalar pairing stays six</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="760" height="590" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="42" y="44" fill="#0F172A" font-size="26">Two coordinate records, one scalar</text><text x="42" y="106" fill="#2563EB" font-size="24">E coordinates</text><text x="430" y="106" fill="#059669" font-size="24">B coordinates</text><rect x="42" y="133" width="286" height="94" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="171" fill="#475569" font-size="22">Vector column</text><text x="65" y="208" fill="#2563EB" font-size="28">(4,2)ᵀ</text><rect x="430" y="133" width="288" height="94" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="453" y="171" fill="#475569" font-size="22">Vector column</text><text x="453" y="208" fill="#059669" font-size="28">(3,1)ᵀ</text><path d="M345 180L410 180" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="371" y="155" fill="#7C3AED" font-size="22">P</text><rect x="42" y="278" width="286" height="94" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="316" fill="#475569" font-size="22">Covector row</text><text x="65" y="353" fill="#2563EB" font-size="28">(2,−1)</text><rect x="430" y="278" width="288" height="94" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="453" y="316" fill="#475569" font-size="22">Covector row</text><text x="453" y="353" fill="#059669" font-size="28">(1,3)</text><path d="M345 326L410 326" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="360" y="302" fill="#7C3AED" font-size="22">P⁻¹</text><path d="M182 390L182 422" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M574 390L574 422" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="444" width="286" height="63" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="486" fill="#2563EB" font-size="26">2·4 − 1·2 = 6</text><rect x="430" y="444" width="288" height="63" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="453" y="486" fill="#059669" font-size="26">1·3 + 3·1 = 6</text><text x="42" y="559" fill="#475569" font-size="21">P = P B←E; the covector row multiplies P⁻¹ on the right.</text></g></svg>
