<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 850" width="520" height="850" role="img"><title>Two attention projections produce one bilinear score before softmax</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="850" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">Two projections, then one dot</text><rect x="40" y="94" width="200" height="103" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><rect x="280" y="94" width="200" height="103" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="63" y="134" fill="#2563EB" font-size="26">x = (1,2)ᵀ</text><text x="305" y="134" fill="#2563EB" font-size="26">y = (3,−1)ᵀ</text><text x="63" y="175" fill="#2563EB" font-size="26">Query input</text><text x="305" y="175" fill="#2563EB" font-size="26">Key input</text><path d="M140 220L140 277" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M380 220L380 277" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="62" y="263" fill="#7C3AED" font-size="26">W Q</text><text x="300" y="263" fill="#7C3AED" font-size="26">W K</text><rect x="40" y="303" width="200" height="87" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><rect x="280" y="303" width="200" height="87" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="64" y="353" fill="#7C3AED" font-size="26">q = (1,3)ᵀ</text><text x="300" y="353" fill="#7C3AED" font-size="26">k = (2,−1)ᵀ</text><path d="M140 413L220 474" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M380 413L300 474" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="500" width="440" height="103" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="543" fill="#059669" font-size="26">qᵀk = 1×2 + 3×(−1)</text><text x="65" y="582" fill="#059669" font-size="30">Score = −1</text><text x="40" y="671" fill="#7C3AED" font-size="26">A = W Qᵀ W K = [[1,2],[0,1]]</text><text x="40" y="725" fill="#059669" font-size="28">Also xᵀAy = −1</text><text x="40" y="799" fill="#475569" font-size="26">Softmax is a later, nonlinear step.</text></g></svg>
