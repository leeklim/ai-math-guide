<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" width="760" height="530" role="img"><title>Skew symmetric off diagonal terms cancel for the same input</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="760" height="530" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="26">Same input: opposite cross terms cancel</text><text x="40" y="106" fill="#2563EB" font-size="28">x = (1,2)ᵀ</text><rect x="40" y="152" width="296" height="129" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><rect x="424" y="152" width="296" height="129" rx="6" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="65" y="196" fill="#7C3AED" font-size="28">A₁₂ x₁x₂</text><text x="65" y="245" fill="#7C3AED" font-size="25">3 × 1 × 2 = +6</text><text x="449" y="196" fill="#D97706" font-size="28">A₂₁ x₂x₁</text><text x="449" y="245" fill="#D97706" font-size="25">−3 × 2 × 1 = −6</text><path d="M188 307L330 371" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M572 307L430 371" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="221" y="396" width="320" height="64" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="253" y="439" fill="#059669" font-size="26">xᵀ A skew x = 0</text><text x="40" y="504" fill="#475569" font-size="22">The matrix is not zero; its quadratic contribution is zero.</text></g></svg>
