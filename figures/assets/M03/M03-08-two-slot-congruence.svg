<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1000" width="520" height="1000" role="img"><title>Both input coordinate vectors transform in a bilinear form</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1000" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">A scalar pairing has</text><text x="40" y="83" fill="#0F172A" font-size="28">two input coordinate slots</text><rect x="40" y="127" width="440" height="91" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="66" y="164" fill="#2563EB" font-size="26">C coordinates</text><text x="66" y="200" fill="#2563EB" font-size="26">x C = (1,0)ᵀ; y C = (0,1)ᵀ</text><path d="M145 244L145 302" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M371 244L371 302" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="110" y="286" fill="#7C3AED" font-size="26">P</text><text x="385" y="286" fill="#7C3AED" font-size="26">P</text><rect x="40" y="328" width="440" height="91" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="66" y="365" fill="#059669" font-size="26">B coordinates</text><text x="66" y="401" fill="#059669" font-size="26">x B = (1,0)ᵀ; y B = (1,1)ᵀ</text><path d="M260 447L260 507" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="533" width="440" height="91" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="569" fill="#059669" font-size="28">A B = diag(2,1)</text><text x="65" y="607" fill="#059669" font-size="28">x Bᵀ A B y B = 2</text><text x="40" y="691" fill="#0F172A" font-size="27">In C, combine both P factors:</text><text x="40" y="743" fill="#7C3AED" font-size="32">A C = Pᵀ A B P</text><text x="40" y="803" fill="#7C3AED" font-size="28">A C = [[2,2],[2,3]]</text><text x="40" y="858" fill="#059669" font-size="28">x Cᵀ A C y C = 2</text><text x="40" y="927" fill="#475569" font-size="26">P = [[1,1],[0,1]]</text><text x="40" y="967" fill="#475569" font-size="26">Both routes give the same scalar.</text></g></svg>
