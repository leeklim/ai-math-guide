   <text style="font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: middle" x="309.6" y="41.836875" transform="rotate(-0 309.6 41.836875)">Scaling both slots brings two factors</text>
  </g>
  <g id="text_24">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #475569" x="309.6" y="484.848" transform="rotate(-0 309.6 484.848)">At a = 2: B(2,4) = 8, not 2 B(1,2) = 4.</text>
  </g>
 </g>
