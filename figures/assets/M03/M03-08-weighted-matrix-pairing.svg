<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img"><title>Each matrix cell contributes x i times A i j times y j</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="760" height="580" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="26">Each pair of basis coefficients contributes</text><text x="40" y="102" fill="#2563EB" font-size="25">x = (1,2)ᵀ; y = (−1,1)ᵀ</text><text x="245" y="160" fill="#D97706" font-size="24">y₁ = −1</text><text x="493" y="160" fill="#D97706" font-size="24">y₂ = 1</text><text x="40" y="232" fill="#2563EB" font-size="24">x₁ = 1</text><text x="40" y="363" fill="#2563EB" font-size="24">x₂ = 2</text><rect x="220" y="187" width="230" height="106" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="234" y="224" fill="#7C3AED" font-size="22">1 × 2 × (−1)</text><text x="311" y="268" fill="#7C3AED" font-size="28">−2</text><rect x="470" y="187" width="230" height="106" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="484" y="224" fill="#7C3AED" font-size="22">1 × 4 × 1</text><text x="561" y="268" fill="#7C3AED" font-size="28">+4</text><rect x="220" y="320" width="230" height="106" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="234" y="357" fill="#7C3AED" font-size="22">2 × (−2) × (−1)</text><text x="311" y="401" fill="#7C3AED" font-size="28">+4</text><rect x="470" y="320" width="230" height="106" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="484" y="357" fill="#7C3AED" font-size="22">2 × 3 × 1</text><text x="561" y="401" fill="#7C3AED" font-size="28">+6</text><path d="M220 451V471H700V451M460 471V487" fill="none" stroke="#059669" stroke-width="2"/><text x="220" y="521" fill="#059669" font-size="24">B(x,y) = −2 + 4 + 4 + 6 = 12</text><text x="40" y="562" fill="#475569" font-size="22">Each cell uses its own Aᵢⱼ; this is a scalar sum.</text></g></svg>
