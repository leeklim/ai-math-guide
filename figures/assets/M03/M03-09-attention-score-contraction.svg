<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 625" width="760" height="625" role="img"><title>Query and key feature indices are summed to produce a token by token score matrix</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="760" height="625" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="25">Contract feature index i, keep token indices t and s</text><text x="40" y="113" fill="#2563EB" font-size="26">Q: rows t, columns i</text><text x="438" y="113" fill="#2563EB" font-size="26">K: rows s, columns i</text><rect x="82" y="145" width="68" height="68" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="101" y="188" fill="#2563EB" font-size="26">1</text><rect x="154" y="145" width="68" height="68" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="173" y="188" fill="#2563EB" font-size="26">2</text><rect x="82" y="217" width="68" height="68" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="101" y="260" fill="#2563EB" font-size="26">0</text><rect x="154" y="217" width="68" height="68" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="173" y="260" fill="#2563EB" font-size="26">1</text><rect x="473" y="145" width="68" height="68" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="492" y="188" fill="#2563EB" font-size="26">3</text><rect x="545" y="145" width="68" height="68" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="564" y="188" fill="#2563EB" font-size="26">1</text><rect x="473" y="217" width="68" height="68" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="492" y="260" fill="#2563EB" font-size="26">1</text><rect x="545" y="217" width="68" height="68" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="564" y="260" fill="#2563EB" font-size="26">0</text><path d="M163 314L322 389" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M544 314L414 389" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="478" y="466" fill="#7C3AED" font-size="24">S₁₁ = 1×3</text><text x="478" y="510" fill="#7C3AED" font-size="24">+ 2×1 = 5</text><rect x="299" y="416" width="68" height="68" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="318" y="459" fill="#059669" font-size="26">5</text><rect x="371" y="416" width="68" height="68" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="390" y="459" fill="#059669" font-size="26">1</text><rect x="299" y="488" width="68" height="68" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="318" y="531" fill="#059669" font-size="26">1</text><rect x="371" y="488" width="68" height="68" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="390" y="531" fill="#059669" font-size="26">0</text><text x="40" y="592" fill="#059669" font-size="24">Sₜₛ = Σᵢ Qₜᵢ Kₛᵢ; output rows t, columns s</text></g></svg>
