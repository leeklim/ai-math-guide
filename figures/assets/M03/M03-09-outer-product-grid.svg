<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 790" width="520" height="790" role="img"><title>Outer product creates four entries by combining each first coefficient with each second coefficient</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="790" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">One coefficient from each slot</text><text x="40" y="104" fill="#2563EB" font-size="27">a = (1,2)ᵀ; b = (3,−1)ᵀ</text><text x="206" y="177" fill="#D97706" font-size="27">b₁ = 3</text><text x="365" y="177" fill="#D97706" font-size="27">b₂ = −1</text><text x="40" y="259" fill="#2563EB" font-size="27">a₁ = 1</text><text x="40" y="380" fill="#2563EB" font-size="27">a₂ = 2</text><rect x="183" y="210" width="128" height="128" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="202" y="253" fill="#7C3AED" font-size="26">3</text><rect x="315" y="210" width="128" height="128" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="334" y="253" fill="#7C3AED" font-size="26">−1</text><rect x="183" y="342" width="128" height="128" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="202" y="385" fill="#7C3AED" font-size="26">6</text><rect x="315" y="342" width="128" height="128" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="334" y="385" fill="#7C3AED" font-size="26">−2</text><text x="40" y="532" fill="#7C3AED" font-size="27">Second row = 2 × first row</text><text x="40" y="590" fill="#0F172A" font-size="27">This matrix has rank 1,</text><text x="40" y="633" fill="#0F172A" font-size="27">but its tensor order is 2.</text><text x="40" y="704" fill="#059669" font-size="27">(aᵀx)(bᵀy) = xᵀ(abᵀ)y</text><text x="40" y="752" fill="#059669" font-size="27">Example output: 3 × 7 = 21</text></g></svg>
