<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 830" width="520" height="830" role="img"><title>Each scaled input contributes one independent factor to a trilinear output</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="830" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">Three slots, three factors</text><rect x="40" y="99" width="440" height="74" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="69" y="145" fill="#2563EB" font-size="30">T(u,v,w) = 72</text><path d="M410 199L410 253" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="234" fill="#7C3AED" font-size="26">Scale only u by 2</text><rect x="40" y="279" width="440" height="74" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="68" y="325" fill="#059669" font-size="28">T(2u,v,w) = 144</text><text x="40" y="426" fill="#0F172A" font-size="28">Scale all three inputs by 2</text><rect x="40" y="474" width="123" height="75" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><rect x="197" y="474" width="123" height="75" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><rect x="357" y="474" width="123" height="75" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="63" y="523" fill="#7C3AED" font-size="26">u: ×2</text><text x="220" y="523" fill="#7C3AED" font-size="26">v: ×2</text><text x="378" y="523" fill="#7C3AED" font-size="26">w: ×2</text><path d="M101 574L209 640" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M260 574L260 640" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M418 574L311 640" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="666" width="440" height="75" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="68" y="714" fill="#059669" font-size="27">2 × 2 × 2 × 72 = 576</text><text x="40" y="794" fill="#475569" font-size="26">One factor comes from each slot.</text></g></svg>
