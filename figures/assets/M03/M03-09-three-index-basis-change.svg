<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 615" width="760" height="615" role="img"><title>Each of three tensor indices contributes its own basis change factor</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="760" height="615" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="26">Every input slot carries its own basis change</text><text x="40" y="110" fill="#2563EB" font-size="28">Old components Tᵢⱼₖ</text><rect x="40" y="156" width="190" height="83" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="64" y="207" fill="#2563EB" font-size="25">Old index i</text><path d="M135 264L135 336" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="65" y="311" fill="#7C3AED" font-size="28">P<tspan baseline-shift="sub" font-size="18">ia</tspan></text><rect x="40" y="362" width="190" height="83" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="64" y="413" fill="#059669" font-size="25">New index a</text><rect x="285" y="156" width="190" height="83" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="309" y="207" fill="#2563EB" font-size="25">Old index j</text><path d="M380 264L380 336" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="310" y="311" fill="#7C3AED" font-size="28">P<tspan baseline-shift="sub" font-size="18">jb</tspan></text><rect x="285" y="362" width="190" height="83" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="309" y="413" fill="#059669" font-size="25">New index b</text><rect x="530" y="156" width="190" height="83" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="554" y="207" fill="#2563EB" font-size="25">Old index k</text><path d="M625 264L625 336" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="555" y="311" fill="#7C3AED" font-size="28">P<tspan baseline-shift="sub" font-size="18">kc</tspan></text><rect x="530" y="362" width="190" height="83" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="554" y="413" fill="#059669" font-size="25">New index c</text><text x="40" y="516" fill="#7C3AED" font-size="27">T′(a,b,c) = sum of weighted T(i,j,k)</text><text x="40" y="578" fill="#475569" font-size="22">All three old indices are summed for each new component.</text></g></svg>
