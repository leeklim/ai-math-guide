<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1120" width="520" height="1120" role="img"><title>Function composition fixes intermediate basepoints before composing local changes</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1120" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">First locate the basepoints</text><rect x="40" y="96" width="440" height="93" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="136" fill="#2563EB" font-size="28">Input x = (1,2)ᵀ</text><text x="65" y="177" fill="#2563EB" font-size="26">f(x) = (x+y, xy)</text><path d="M410 213L410 266" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="248" fill="#7C3AED" font-size="27">Apply f</text><rect x="40" y="291" width="440" height="93" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="65" y="331" fill="#7C3AED" font-size="27">Middle f(x) = (3,2)ᵀ</text><text x="65" y="373" fill="#7C3AED" font-size="26">g(u,v) = u²+v</text><path d="M410 412L410 465" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="448" fill="#7C3AED" font-size="27">Apply g</text><rect x="40" y="491" width="440" height="93" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="547" fill="#059669" font-size="28">Output g(f(x)) = 11</text><text x="40" y="666" fill="#0F172A" font-size="28">Then compose small changes</text><rect x="40" y="708" width="440" height="93" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="748" fill="#2563EB" font-size="28">h = ε(1,0)ᵀ</text><text x="65" y="786" fill="#2563EB" font-size="26">Input-space direction</text><path d="M410 826L410 878" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="858" fill="#7C3AED" font-size="27">Df(1,2)</text><rect x="40" y="902" width="440" height="93" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="65" y="942" fill="#7C3AED" font-size="28">Df h = ε(1,2)ᵀ</text><text x="65" y="981" fill="#7C3AED" font-size="26">Dg evaluated at (3,2)</text><text x="40" y="1048" fill="#059669" font-size="27">Dg(3,2) Df(1,2) h = 8ε</text><text x="40" y="1092" fill="#475569" font-size="25">This is the first-order output change.</text></g></svg>
