<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" width="520" height="760" role="img"><title>Input change maps to output change and must be added to the base output</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="760" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">A change is not an output point</text><rect x="40" y="94" width="440" height="93" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="134" fill="#2563EB" font-size="28">Input change h</text><text x="65" y="174" fill="#2563EB" font-size="28">(.01,−.02)ᵀ</text><path d="M410 213L410 266" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="248" fill="#7C3AED" font-size="27">Df at (1,0)</text><rect x="40" y="291" width="440" height="93" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="65" y="330" fill="#7C3AED" font-size="27">Predicted output change</text><text x="65" y="370" fill="#7C3AED" font-size="28">Lh = (0,−.02)ᵀ</text><path d="M410 410L410 467" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="449" fill="#059669" font-size="27">Add f(1,0) = (1,1)ᵀ</text><rect x="40" y="492" width="440" height="93" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="531" fill="#059669" font-size="27">Predicted output point</text><text x="65" y="572" fill="#059669" font-size="27">f(1,0)+Lh = (1,.98)ᵀ</text><text x="40" y="665" fill="#0F172A" font-size="26">Actual output is approximately</text><text x="40" y="709" fill="#0F172A" font-size="27">(.9999,.9801987)ᵀ</text></g></svg>
