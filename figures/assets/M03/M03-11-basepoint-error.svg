<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Jacobian direction and approximation error depend on the base point and step size</title>
  <desc id="desc">The left panel shows different tangent directions at two base points on a curved map. The right panel compares a close point with small linearization error and a distant point with larger error.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="960" height="540" rx="18" fill="#F8FAFC"/>
  <text x="480" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F172A">Base point and step size limit a Jacobian approximation</text>
  <text x="250" y="92" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1E3A8A">Different base points</text>
  <text x="720" y="92" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#5B21B6">Error grows away from x₀</text>
  <path d="M70 390C150 370 190 190 280 170C350 155 390 260 430 350" fill="none" stroke="#059669" stroke-width="5"/>
  <circle cx="155" cy="315" r="8" fill="#2563EB"/><circle cx="330" cy="180" r="8" fill="#D97706"/>
  <path d="M95 380L230 245" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/><path d="M265 170L405 230" stroke="#D97706" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="105" y="420" font-family="sans-serif" font-size="18" font-weight="700" fill="#2563EB">J_f(x_A)</text><text x="330" y="145" font-family="sans-serif" font-size="18" font-weight="700" fill="#B45309">J_f(x_B)</text>
  <path d="M565 390C625 370 650 210 760 170C835 145 875 235 900 340" fill="none" stroke="#059669" stroke-width="5"/>
  <circle cx="650" cy="300" r="8" fill="#0F172A"/><circle cx="702" cy="230" r="7" fill="#2563EB"/><circle cx="835" cy="175" r="7" fill="#EF4444"/>
  <path d="M600 365L875 145" stroke="#7C3AED" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M702 230L716 219" stroke="#2563EB" stroke-width="5"/><path d="M835 175L798 206" stroke="#EF4444" stroke-width="5"/>
  <text x="675" y="338" font-family="sans-serif" font-size="17" fill="#2563EB">small Δx, small error</text><text x="748" y="118" font-family="sans-serif" font-size="17" fill="#B91C1C">large Δx, larger error</text>
  <text x="480" y="500" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">Report both the base point x₀ and the perturbation scale used for the approximation.</text>
</svg>
