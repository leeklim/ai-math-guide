<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 920" width="520" height="920" role="img"><title>A two dimensional change maps through a two by two Jacobian and one by two outer Jacobian</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="920" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">The middle dimension must match</text><rect x="40" y="96" width="440" height="86" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="149" fill="#2563EB" font-size="28">Input change h: 2 × 1</text><path d="M410 208L410 260" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="243" fill="#7C3AED" font-size="28">J f: 2 × 2</text><rect x="40" y="286" width="440" height="110" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="65" y="327" fill="#7C3AED" font-size="28">J f = [[1,1],[2,1]]</text><text x="65" y="376" fill="#7C3AED" font-size="27">Middle change J f h: 2 × 1</text><path d="M410 422L410 475" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="458" fill="#7C3AED" font-size="28">J g: 1 × 2</text><rect x="40" y="501" width="440" height="109" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="542" fill="#059669" font-size="30">J g = [6,1]</text><text x="65" y="590" fill="#059669" font-size="27">Output change: 1 × 1</text><text x="40" y="699" fill="#7C3AED" font-size="32">J(g∘f) = J g J f</text><text x="40" y="754" fill="#7C3AED" font-size="30">(1×2)(2×2) → 1×2</text><text x="40" y="809" fill="#059669" font-size="32">J(g∘f) = [8,7]</text><text x="40" y="885" fill="#475569" font-size="27">The inner Jacobian acts first.</text></g></svg>
