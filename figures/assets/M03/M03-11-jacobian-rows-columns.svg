<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Rows and columns of a three by two Jacobian</title>
  <desc id="desc">A function maps two input coordinates to three output coordinates. Jacobian columns collect changes caused by one input coordinate, while rows collect the gradient of one output component.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M1 0.8L6 3L1 5.2" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="960" height="560" rx="18" fill="#F8FAFC"/>
  <text x="480" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F172A">J maps 2 input coordinates to 3 output coordinates</text>

  <rect x="60" y="145" width="220" height="300" rx="18" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="170" y="184" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1E3A8A">Input x ∈ R²</text>
  <text x="105" y="270" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#2563EB">x₁</text>
  <text x="235" y="270" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#D97706">x₂</text>
  <text x="170" y="380" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">one column per input</text>

  <rect x="345" y="120" width="300" height="350" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="495" y="158" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#0F172A">J_f(x) ∈ R³ˣ²</text>
  <rect x="403" y="202" width="84" height="198" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
  <rect x="487" y="202" width="84" height="198" fill="#FFFBEB" stroke="#FBBF24" stroke-width="2"/>
  <rect x="393" y="268" width="188" height="66" fill="#EDE9FE" fill-opacity="0.65" stroke="#8B5CF6" stroke-width="3"/>
  <path d="M403 268H571M403 334H571" stroke="#94A3B8" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="19" text-anchor="middle" fill="#0F172A">
    <text x="445" y="243" font-size="19">∂f₁/∂x₁</text><text x="529" y="243" font-size="19">∂f₁/∂x₂</text>
    <text x="445" y="309" font-size="19">∂f₂/∂x₁</text><text x="529" y="309" font-size="19">∂f₂/∂x₂</text>
    <text x="445" y="375" font-size="19">∂f₃/∂x₁</text><text x="529" y="375" font-size="19">∂f₃/∂x₂</text>
  </g>
  <text x="445" y="425" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#2563EB">column 1: change from x₁</text>
  <text x="495" y="454" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="#6D28D9">row 2: differential of f₂</text>

  <rect x="700" y="145" width="200" height="300" rx="18" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
  <text x="800" y="184" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#065F46">Output f(x) ∈ R³</text>
  <g font-family="sans-serif" font-size="21" font-weight="700" fill="#047857" text-anchor="middle"><text x="800" y="255" font-size="21">f₁</text><text x="800" y="315" font-size="21">f₂</text><text x="800" y="375" font-size="21">f₃</text></g>
  <text x="800" y="416" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">one row per output</text>
  <g fill="none" stroke-width="4" marker-end="url(#arrow)"><path d="M285 295H335" stroke="#2563EB"/><path d="M650 295H690" stroke="#059669"/></g>
  <text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">Entry Jᵢⱼ measures how output fᵢ changes when input coordinate xⱼ changes.</text>
</svg>
