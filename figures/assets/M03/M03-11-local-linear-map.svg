<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">The Jacobian replaces a small curved output patch with a parallelogram</title>
  <desc id="desc">Three panels show a small square input neighborhood, its true curved image under a nonlinear function, and the parallelogram produced by the Jacobian at the base point.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M1 0.8L6 3L1 5.2" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="1080" height="560" rx="18" fill="#F8FAFC"/>
  <text x="540" y="44" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F172A">The Jacobian is a local replacement for the nonlinear map</text>
  <g font-family="sans-serif" text-anchor="middle"><text x="180" y="92" font-size="21" font-weight="700" fill="#1E3A8A">Input patch</text><text x="540" y="92" font-size="21" font-weight="700" fill="#065F46">True nonlinear image</text><text x="900" y="92" font-size="21" font-weight="700" fill="#5B21B6">Jacobian approximation</text></g>
  <g stroke="#E2E8F0" stroke-width="1"><path d="M60 150H300M60 200H300M60 250H300M60 300H300M60 350H300M60 400H300M60 450H300M80 130V470M130 130V470M180 130V470M230 130V470M280 130V470"/><path d="M780 150H1020M780 200H1020M780 250H1020M780 300H1020M780 350H1020M780 400H1020M780 450H1020M800 130V470M850 130V470M900 130V470M950 130V470M1000 130V470"/></g>
  <rect x="140" y="270" width="80" height="80" fill="#DBEAFE" fill-opacity="0.85" stroke="#2563EB" stroke-width="3"/>
  <circle cx="140" cy="350" r="7" fill="#0F172A"/>
  <path d="M480 345C520 300 575 315 610 275L630 360C585 405 535 385 495 430Z" fill="#D1FAE5" stroke="#059669" stroke-width="3"/>
  <circle cx="495" cy="430" r="7" fill="#0F172A"/>
  <path d="M835 390L945 330L985 225L875 285Z" fill="#EDE9FE" stroke="#7C3AED" stroke-width="3"/>
  <circle cx="835" cy="390" r="7" fill="#0F172A"/>
  <g fill="none" stroke-width="4" marker-end="url(#arrow)"><path d="M325 300H430" stroke="#059669"/><path d="M650 300H755" stroke="#7C3AED"/><path d="M835 390L945 330" stroke="#2563EB"/><path d="M835 390L875 285" stroke="#D97706"/></g>
  <text x="378" y="278" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#047857">nonlinear f</text><text x="702" y="278" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#6D28D9">replace by J_f(x₀)</text>
  <text x="924" y="355" font-family="sans-serif" font-size="17" font-weight="700" fill="#2563EB">J e₁</text><text x="882" y="275" font-family="sans-serif" font-size="17" font-weight="700" fill="#D97706">J e₂</text>
  <text x="540" y="518" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">The parallelogram matches first-order directions at x₀; curvature remains in the true image.</text>
</svg>
