<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 820" width="520" height="820" role="img"><title>ReLU derivatives multiply whole weight rows by one or zero</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="820" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">ReLU gates whole weight rows</text><rect x="40" y="96" width="440" height="90" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="133" fill="#2563EB" font-size="27">At input x = (2,1)ᵀ</text><text x="65" y="172" fill="#2563EB" font-size="27">Pre-activation z = (4,−1)ᵀ</text><path d="M410 212L410 268" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="249" fill="#7C3AED" font-size="27">ReLU slopes: (1,0)</text><rect x="40" y="294" width="440" height="102" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="335" fill="#059669" font-size="26">Row 1: positive pre-activation</text><text x="65" y="374" fill="#059669" font-size="28">1 × (1,2) = (1,2)</text><rect x="40" y="437" width="440" height="102" rx="6" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="65" y="478" fill="#D97706" font-size="26">Row 2: negative pre-activation</text><text x="65" y="517" fill="#D97706" font-size="28">0 × (−1,1) = (0,0)</text><text x="40" y="619" fill="#7C3AED" font-size="30">J h = [[1,2],[0,0]]</text><text x="40" y="682" fill="#059669" font-size="27">The output has one active row.</text><text x="40" y="750" fill="#475569" font-size="26">At z = 0, a classical ReLU</text><text x="40" y="794" fill="#475569" font-size="26">derivative is not defined.</text></g></svg>
