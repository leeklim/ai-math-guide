<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 960" width="520" height="960" role="img"><title>The Hessian maps a direction to gradient change before a second measurement gives scalar curvature</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="960" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">HVP versus scalar curvature</text><rect x="40" y="99" width="440" height="88" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="138" fill="#2563EB" font-size="28">Direction v = (1,−1)ᵀ</text><text x="65" y="173" fill="#2563EB" font-size="26">Basepoint: the origin</text><path d="M410 213L410 266" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="248" fill="#7C3AED" font-size="28">Move by εv</text><rect x="40" y="292" width="440" height="88" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="65" y="330" fill="#7C3AED" font-size="26">Gradient change = ε(1,−3)ᵀ</text><text x="65" y="365" fill="#7C3AED" font-size="26">For f = x²+xy+2y²</text><path d="M410 406L410 458" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="441" fill="#7C3AED" font-size="28">Divide by ε</text><rect x="40" y="484" width="440" height="88" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="65" y="523" fill="#7C3AED" font-size="30">H v = (1,−3)ᵀ</text><text x="65" y="558" fill="#7C3AED" font-size="25">H = J(gradient f)</text><path d="M410 599L410 652" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="636" fill="#059669" font-size="28">Measure by vᵀ</text><rect x="40" y="679" width="440" height="88" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="718" fill="#059669" font-size="25">vᵀHv = 1×1 + (−1)×(−3)</text><text x="65" y="754" fill="#059669" font-size="28">Scalar curvature = 4</text><text x="40" y="852" fill="#0F172A" font-size="26">Gradient finite difference</text><text x="40" y="896" fill="#0F172A" font-size="26">is exact for this quadratic f.</text></g></svg>
