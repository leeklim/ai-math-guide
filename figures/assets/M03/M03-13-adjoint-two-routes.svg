<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 710" width="760" height="710" role="img"><title>Pushing the input tangent forward or pulling the output measurement back gives the same scalar seven</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="760" height="710" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">Two routes, one scalar pairing</text><rect x="40" y="106" width="290" height="100" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><rect x="430" y="106" width="290" height="100" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="145" fill="#2563EB" font-size="28">Input v</text><text x="65" y="185" fill="#2563EB" font-size="28">(3,−1)ᵀ</text><text x="455" y="145" fill="#059669" font-size="28">Output Jv</text><text x="455" y="185" fill="#059669" font-size="28">(5,5,4)ᵀ</text><path d="M354 156L406 156" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="363" y="124" fill="#7C3AED" font-size="26">J</text><rect x="40" y="280" width="290" height="109" rx="6" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><rect x="430" y="280" width="290" height="109" rx="6" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="65" y="320" fill="#D97706" font-size="24">Input measurement</text><text x="65" y="366" fill="#D97706" font-size="27">Jᵀu = (1,−4)ᵀ</text><text x="455" y="320" fill="#D97706" font-size="24">Output measurement</text><text x="455" y="366" fill="#D97706" font-size="27">u = (1,−2,3)ᵀ</text><path d="M406 335L354 335" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="361" y="300" fill="#7C3AED" font-size="26">Jᵀ</text><path d="M185 417L185 479" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 417L575 479" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="505" width="290" height="93" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><rect x="430" y="505" width="290" height="93" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="550" fill="#059669" font-size="24">1×3 − 4×(−1)</text><text x="156" y="585" fill="#059669" font-size="30">7</text><text x="452" y="550" fill="#059669" font-size="24">1×5 − 2×5 + 3×4</text><text x="546" y="585" fill="#059669" font-size="30">7</text><text x="40" y="655" fill="#059669" font-size="30">(Jᵀu)ᵀv = uᵀ(Jv)</text><text x="40" y="698" fill="#475569" font-size="25">No square or invertible Jacobian is required.</text></g></svg>
