<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 665" width="760" height="665" role="img"><title>Standard basis products select Jacobian columns or rows without changing the matrix</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="760" height="665" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">Basis seeds select columns or rows</text><text x="40" y="118" fill="#7C3AED" font-size="30">J = [[2,1],[2,1],[1,−1]]</text><rect x="40" y="167" width="300" height="286" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><rect x="420" y="167" width="300" height="286" rx="6" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="65" y="210" fill="#2563EB" font-size="26">Input basis seeds</text><text x="445" y="210" fill="#D97706" font-size="26">Output basis seeds</text><text x="65" y="278" fill="#2563EB" font-size="26">J e₁ = (2,2,1)ᵀ</text><text x="65" y="328" fill="#2563EB" font-size="26">J e₂ = (1,1,−1)ᵀ</text><text x="65" y="405" fill="#2563EB" font-size="30">2 columns</text><text x="445" y="278" fill="#D97706" font-size="26">Jᵀ e₁ = (2,1)ᵀ</text><text x="445" y="328" fill="#D97706" font-size="26">Jᵀ e₂ = (2,1)ᵀ</text><text x="445" y="378" fill="#D97706" font-size="26">Jᵀ e₃ = (1,−1)ᵀ</text><text x="445" y="428" fill="#D97706" font-size="30">3 rows</text><text x="40" y="535" fill="#059669" font-size="25">One chosen product does not require all 6 entries.</text><text x="40" y="592" fill="#475569" font-size="24">Full reconstruction uses every basis seed on one side.</text><text x="40" y="642" fill="#475569" font-size="23">The best mode depends on the products actually needed.</text></g></svg>
