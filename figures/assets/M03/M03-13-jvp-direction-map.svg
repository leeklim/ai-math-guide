<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 780" width="520" height="780" role="img"><title>A two dimensional input tangent is sent through a three by two Jacobian to a three dimensional output tangent</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="780" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">JVP moves an input direction</text><rect x="40" y="96" width="440" height="96" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="136" fill="#2563EB" font-size="26">Input tangent: v = (3,−1)ᵀ</text><text x="65" y="174" fill="#2563EB" font-size="26">Input space: 2 components</text><path d="M410 218L410 275" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="254" fill="#7C3AED" font-size="28">J: 3 × 2</text><text x="40" y="342" fill="#7C3AED" font-size="27">J = [[2,1],[2,1],[1,−1]]</text><path d="M410 373L410 430" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="457" width="440" height="113" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="500" fill="#059669" font-size="28">Output tangent: Jv</text><text x="65" y="548" fill="#059669" font-size="27">(5,5,4)ᵀ: 3 components</text><text x="40" y="650" fill="#0F172A" font-size="26">This is a rate of output change,</text><text x="40" y="695" fill="#0F172A" font-size="26">not the original output value.</text><text x="40" y="747" fill="#475569" font-size="25">Derivatives use one fixed basepoint.</text></g></svg>
