<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 850" width="520" height="850" role="img"><title>Reverse: g first, then f on the fixed example Jacobians</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="850" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">Reverse: g first, then f</text><rect x="40" y="96" width="440" height="102" rx="6" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="65" y="135" fill="#D97706" font-size="27">Scalar output seed</text><text x="65" y="179" fill="#D97706" font-size="30">1</text><path d="M410 225L410 298" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="270" fill="#7C3AED" font-size="27">J gᵀ</text><rect x="40" y="324" width="440" height="102" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="65" y="363" fill="#7C3AED" font-size="27">Middle covector</text><text x="65" y="407" fill="#7C3AED" font-size="30">(4,−1)ᵀ</text><path d="M410 453L410 526" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="498" fill="#7C3AED" font-size="27">J fᵀ</text><rect x="40" y="552" width="440" height="102" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="591" fill="#059669" font-size="27">Input gradient</text><text x="65" y="635" fill="#059669" font-size="30">(4,5)ᵀ</text><text x="40" y="744" fill="#059669" font-size="28">(4,5)ᵀ · (2,−1) = 3</text><text x="40" y="808" fill="#475569" font-size="25">One seed gives the input gradient.</text></g></svg>
