<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 820" width="520" height="820" role="img"><title>An output covector measuring three components is pulled back to a two component input covector without inverting the function</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="820" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">VJP pulls back a measurement</text><rect x="40" y="96" width="440" height="105" rx="6" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="65" y="136" fill="#D97706" font-size="27">Output measurement uᵀ</text><text x="65" y="180" fill="#D97706" font-size="29">u = (1,−2,3)ᵀ</text><path d="M410 227L410 283" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="261" fill="#7C3AED" font-size="28">Multiply by Jᵀ</text><text x="40" y="348" fill="#7C3AED" font-size="29">Jᵀ: 2 × 3</text><path d="M410 379L410 436" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="463" width="440" height="113" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="506" fill="#059669" font-size="27">Input measurement (Jᵀu)ᵀ</text><text x="65" y="548" fill="#059669" font-size="29">Jᵀu = (1,−4)ᵀ</text><text x="40" y="653" fill="#0F172A" font-size="27">For input change Δx,</text><text x="40" y="700" fill="#059669" font-size="27">the scalar rate is (1,−4) Δx.</text><text x="40" y="765" fill="#475569" font-size="26">This is not an inverse-function</text><text x="40" y="803" fill="#475569" font-size="26">calculation.</text></g></svg>
