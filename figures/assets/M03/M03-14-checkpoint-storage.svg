<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" role="img"><title>Saving all intermediate nodes differs from checkpointing selected nodes and recomputing the rest</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="760" height="540" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="25">Same derivative, different storage and recomputation</text><text x="40" y="111" fill="#2563EB" font-size="27">Save every intermediate value</text><rect x="40" y="140" width="100" height="74" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="70" y="188" fill="#2563EB" font-size="28">z1</text><path d="M164 177L201 177" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><text x="63" y="248" fill="#2563EB" font-size="22">Store</text><rect x="225" y="140" width="100" height="74" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="255" y="188" fill="#2563EB" font-size="28">z2</text><path d="M349 177L386 177" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><text x="248" y="248" fill="#2563EB" font-size="22">Store</text><rect x="410" y="140" width="100" height="74" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="440" y="188" fill="#2563EB" font-size="28">z3</text><path d="M534 177L571 177" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><text x="433" y="248" fill="#2563EB" font-size="22">Store</text><rect x="595" y="140" width="100" height="74" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="625" y="188" fill="#2563EB" font-size="28">z4</text><text x="618" y="248" fill="#2563EB" font-size="22">Store</text><r