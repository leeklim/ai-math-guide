<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 860" width="520" height="860" role="img"><title>Backpropagation computes gradients and a separate optimizer step changes parameters</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="860" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">Gradient is not an update</text><rect x="40" y="95" width="440" height="89" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="148" fill="#2563EB" font-size="28">Current parameters θ</text><path d="M410 211L410 267" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="249" fill="#7C3AED" font-size="28">Forward pass</text><rect x="40" y="293" width="440" height="89" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="346" fill="#059669" font-size="28">Scalar loss L</text><path d="M410 409L410 465" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="447" fill="#D97706" font-size="26">Backward pass: local VJPs</text><rect x="40" y="491" width="440" height="89" rx="6" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="65" y="544" fill="#D97706" font-size="28">Gradient ∇θ L</text><path d="M410 607L410 663" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="645" fill="#7C3AED" font-size="28">Optimizer step</text><rect x="40" y="689" width="440" height="89" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="742" fill="#059669" font-size="28">New parameters θ next</text><text x="40" y="833" fill="#475569" font-size="24">Only the last step changes θ.</text></g></svg>
