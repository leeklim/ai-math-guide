<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 910" width="520" height="910" role="img"><title>Two transformed linear layers insert and cancel a basis change and its inverse</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="910" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28">Compensate at both linear layers</text><rect x="40" y="95" width="440" height="88" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="148" fill="#2563EB" font-size="28">Input x</text><path d="M410 210L410 266" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="248" fill="#7C3AED" font-size="28">W1′ = P W1</text><rect x="40" y="292" width="440" height="105" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="65" y="335" fill="#7C3AED" font-size="28">New hidden h′ = P h</text><text x="65" y="378" fill="#7C3AED" font-size="27">h = W1 x</text><path d="M410 424L410 480" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="462" fill="#7C3AED" font-size="28">W2′ = W2 P⁻¹</text><rect x="40" y="506" width="440" height="112" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><text x="65" y="549" fill="#059669" font-size="27">Output W2 P⁻¹ P h</text><text x="65" y="595" fill="#059669" font-size="30">= W2 h</text><text x="40" y="716" fill="#059669" font-size="28">The middle P⁻¹P cancels.</text><text x="40" y="782" fill="#0F172A" font-size="26">No intervening nonlinear operation</text><text x="40" y="826" fill="#0F172A" font-size="26">is allowed in this cancellation.</text><text x="40" y="884" fill="#475569" font-size="26">P must be invertible.</text></g></svg>
