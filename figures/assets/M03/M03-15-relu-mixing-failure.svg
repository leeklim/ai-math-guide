<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760" role="img"><title>Applying an invertible mixing matrix before ReLU differs from applying it after ReLU</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="760" height="760" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="26">An invertible mix need not commute with ReLU</text><text x="40" y="102" fill="#2563EB" font-size="28">z = (1,−2)ᵀ; P = [[1,1],[0,1]]</text><rect x="40" y="144" width="290" height="86" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><rect x="430" y="144" width="290" height="86" rx="6" fill="#2563EB" fill-opacity=".07" stroke="#2563EB" stroke-width="2"/><text x="65" y="195" fill="#2563EB" font-size="25">First P, then ReLU</text><text x="455" y="195" fill="#2563EB" font-size="25">First ReLU, then P</text><path d="M185 256L185 312" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 256L575 312" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="338" width="290" height="91" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><rect x="430" y="338" width="290" height="91" rx="6" fill="#7C3AED" fill-opacity=".07" stroke="#7C3AED" stroke-width="2"/><text x="65" y="392" fill="#7C3AED" font-size="27">Pz = (−1,−2)ᵀ</text><text x="455" y="392" fill="#7C3AED" font-size="26">ReLU(z) = (1,0)ᵀ</text><path d="M185 455L185 511" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M575 455L575 511" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="537" width="290" height="100" rx="6" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-width="2"/><rect x="430" y="537" width="290" height="100" rx="6" fill="#D97706" fill-opacity=".07" stroke="#D97706" stroke-width="2"/><text x="65" y="580" fill="#059669" font-size="27">ReLU(Pz)</text><text x="65" y="619" fill="#059669" font-size="30">(0,0)ᵀ</text><text x="455" y="580" fill="#D97706" font-size="27">P ReLU(z)</text><text x="455" y="619" fill="#D97706" font-size="30">(1,0)ᵀ</text><text x="362" y="597" fill="#0F172A" font-size="36">≠</text><text x="40" y="718" fill="#475569" font-size="25">P mixes coordinates; it is not a permutation.</text></g></svg>
