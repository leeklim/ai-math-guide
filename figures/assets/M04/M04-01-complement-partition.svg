<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="title desc">
  <title id="title">An event and its complement fill the sample space</title>
  <desc id="desc">Four equally likely ordered coin outcomes each have mass one quarter. C, at least one head, contains HH, HT, and TH. Its complement contains only TT. The two disjoint groups contain all outcomes.</desc>
  <rect width="800" height="420" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">All outcomes = C plus its complement</text><text x="400" y="102" font-size="20">Each ordered outcome has probability 1/4.</text></g>
  <rect x="56" y="135" width="516" height="153" rx="16" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <rect x="600" y="135" width="144" height="153" rx="16" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <g font-family="sans-serif" font-size="23" text-anchor="middle" fill="#065F46"><text x="145" y="193">HH</text><text x="314" y="193">HT</text><text x="483" y="193">TH</text><text x="145" y="230" font-size="20">1/4</text><text x="314" y="230" font-size="20">1/4</text><text x="483" y="230" font-size="20">1/4</text><text x="314" y="271" font-size="20">C: at least one H</text></g>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="672" y="193" font-size="23">TT</text><text x="672" y="230" font-size="20">1/4</text><text x="672" y="271" font-size="20">Cᶜ: no H</text><text x="400" y="344" font-size="24">P(C) = 1 − P(Cᶜ) = 1 − 1/4 = 3/4</text><text x="400" y="388" font-size="18">No outcome is omitted or counted twice.</text></g>
</svg>
