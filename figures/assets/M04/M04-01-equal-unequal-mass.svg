<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="title desc">
  <title id="title">Equal counts give probabilities only under equal masses</title>
  <desc id="desc">Two sample spaces contain a, b, c and select the same event b and c. In the first, three equal segments give probability two thirds. In the second, segment widths 0.6, 0.3, 0.1 give selected probability 0.4. Both have total mass one.</desc>
  <rect width="800" height="520" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Same event size, different probability</text><text x="400" y="104" font-size="20">Select A = {b, c} from Ω = {a, b, c}.</text></g>
  <g font-family="sans-serif" font-size="20" fill="#475569"><text x="100" y="151">Equal masses</text><text x="100" y="303">Unequal masses</text></g>
  <rect x="100" y="174" width="200" height="72" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><rect x="300" y="174" width="200" height="72" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="500" y="174" width="200" height="72" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <rect x="100" y="326" width="360" height="72" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><rect x="460" y="326" width="180" height="72" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="640" y="326" width="60" height="72" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" font-size="22" fill="#334155"><text x="200" y="218">a: 1/3</text><text x="400" y="218" fill="#1E3A8A">b: 1/3</text><text x="600" y="218" fill="#065F46">c: 1/3</text><text x="280" y="370">a: 0.6</text><text x="550" y="370" fill="#1E3A8A">b: 0.3</text><text x="670" y="354" font-size="18" fill="#065F46">c</text><text x="670" y="383" font-size="18" fill="#065F46">0.1</text></g>
  <path d="M300 255V269H700V255" fill="none" stroke="#7C3AED" stroke-width="2"/><path d="M460 407V421H700V407" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#5B21B6"><text x="500" y="295" font-size="20">P(A) = 2/3</text><text x="580" y="450" font-size="20">P(A) = 0.4</text><text x="400" y="494" font-size="18" fill="#475569">Bar width represents mass, not the number of outcomes.</text></g>
</svg>
