<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Probability adds the masses of outcomes in an event</title>
  <desc id="desc">A mass bar of total width 600 is split into masses 0.6, 0.3, and 0.1 for a, b, and c. Event A selects b and c, totaling 0.4. The whole sample space has probability 1.</desc>
  <rect width="800" height="500" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Probability is assigned to a set</text><text x="400" y="107" font-size="20">Ω = {a, b, c}, total mass = 1</text></g>
  <rect x="100" y="150" width="360" height="110" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <rect x="460" y="150" width="180" height="110" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <rect x="640" y="150" width="60" height="110" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" font-size="22" fill="#334155"><text x="280" y="194">a</text><text x="280" y="229">0.6</text><text x="550" y="194" fill="#1E3A8A">b</text><text x="550" y="229" fill="#1E3A8A">0.3</text><text x="670" y="194" fill="#065F46">c</text><text x="670" y="229" font-size="20" fill="#065F46">0.1</text></g>
  <path d="M460 284V302H700V284" fill="none" stroke="#7C3AED" stroke-width="2.5"/>
  <g font-family="sans-serif" text-anchor="middle"><text x="580" y="336" font-size="22" fill="#5B21B6">A = {b, c}</text><text x="400" y="402" font-size="24" fill="#065F46">P(A) = 0.3 + 0.1 = 0.4</text><text x="400" y="458" font-size="18" fill="#475569">Disjoint masses add; the empty event selects no mass.</text></g>
</svg>
