<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc">
  <title id="title">A fixed model probability and two observed frequencies</title>
  <desc id="desc">An illustrative model assigns event A probability 0.7. Two illustrative observation sequences each contain ten trials. Eight successes produce frequency 0.8 in the first, and six produce 0.6 in the second. They do not change the fixed model probability.</desc>
  <rect width="800" height="540" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">A model number is not a sample count</text><text x="400" y="94" font-size="18">Illustrative observations, not measured experimental results</text></g>
  <rect x="176" y="120" width="448" height="62" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="400" y="159" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#5B21B6">Fixed model: P(A) = 0.7</text>
  <g font-family="sans-serif" fill="#334155" font-size="20"><text x="72" y="230">Sequence 1</text><text x="72" y="350">Sequence 2</text></g>
  <g fill="#DBEAFE" stroke="#2563EB" stroke-width="2"><circle cx="100" cy="268" r="17"/><circle cx="160" cy="268" r="17"/><circle cx="220" cy="268" r="17"/><circle cx="280" cy="268" r="17"/><circle cx="340" cy="268" r="17"/><circle cx="400" cy="268" r="17"/><circle cx="460" cy="268" r="17"/><circle cx="520" cy="268" r="17"/><circle cx="100" cy="388" r="17"/><circle cx="160" cy="388" r="17"/><circle cx="220" cy="388" r="17"/><circle cx="280" cy="388" r="17"/><circle cx="340" cy="388" r="17"/><circle cx="400" cy="388" r="17"/></g>
  <g fill="#FFFFFF" stroke="#64748B" stroke-width="2"><circle cx="580" cy="268" r="17"/><circle cx="640" cy="268" r="17"/><circle cx="460" cy="388" r="17"/><circle cx="520" cy="388" r="17"/><circle cx="580" cy="388" r="17"/><circle cx="640" cy="388" r="17"/></g>
  <g font-family="sans-serif" font-size="20" fill="#065F46" text-anchor="end"><text x="728" y="307">8/10 = 0.8</text><text x="728" y="427">6/10 = 0.6</text></g>
  <circle cx="95" cy="473" r="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="119" y="480" font-family="sans-serif" font-size="18" fill="#1E3A8A">A occurred</text><circle cx="299" cy="473" r="12" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/><text x="323" y="480" font-family="sans-serif" font-size="18" fill="#475569">A did not occur</text>
  <text x="400" y="516" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">A different sample can give a different empirical frequency.</text>
</svg>
