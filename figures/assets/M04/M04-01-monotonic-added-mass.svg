<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc">
  <title id="title">A larger event adds only nonnegative mass</title>
  <desc id="desc">In a sample space with masses a 0.6, b 0.3, c 0.1, event A contains c and event B contains b and c. The extra region B minus A contains b with mass 0.3, so P(B) equals P(A) plus 0.3.</desc>
  <rect width="800" height="540" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Containment can only add mass</text><text x="400" y="101" font-size="20">Ω = {a, b, c}</text></g>
  <rect x="64" y="126" width="672" height="248" rx="16" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <rect x="340" y="156" width="364" height="190" rx="16" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
  <rect x="532" y="218" width="144" height="100" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="196" y="245" font-size="23">a</text><text x="196" y="282" font-size="20">mass 0.6</text><text x="522" y="190" font-size="20" fill="#5B21B6">B = {b, c}</text><text x="433" y="245" font-size="23" fill="#5B21B6">b</text><text x="433" y="282" font-size="20" fill="#5B21B6">mass 0.3</text><text x="604" y="249" font-size="20" fill="#065F46">A = {c}</text><text x="604" y="289" font-size="20" fill="#065F46">mass 0.1</text></g>
  <g font-family="sans-serif" text-anchor="middle"><text x="400" y="426" font-size="22" fill="#334155">P(B) = P(A) + P(B ∖ A)</text><text x="400" y="466" font-size="24" fill="#065F46">0.4 = 0.1 + 0.3</text><text x="400" y="511" font-size="18" fill="#475569">The added mass is nonnegative, so P(A) ≤ P(B).</text></g>
</svg>
