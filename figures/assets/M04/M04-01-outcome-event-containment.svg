<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="title desc">
  <title id="title">One outcome inside an event inside the sample space</title>
  <desc id="desc">The sample space contains die outcomes 1 through 6. The even event A contains 2, 4, and 6. Observed outcome omega equals 4 and is an element of A, not the whole event.</desc>
  <rect width="800" height="520" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Outcome ≠ event</text><text x="400" y="105" font-size="20">Ω = {1, 2, 3, 4, 5, 6}</text></g>
  <rect x="56" y="135" width="688" height="280" rx="18" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <rect x="400" y="164" width="312" height="216" rx="18" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" font-size="22">
    <text x="556" y="201" fill="#5B21B6" font-size="20">A = {2, 4, 6}</text>
    <circle cx="156" cy="232" r="29" fill="#E2E8F0"/><text x="156" y="240" fill="#334155">1</text>
    <circle cx="285" cy="232" r="29" fill="#E2E8F0"/><text x="285" y="240" fill="#334155">3</text>
    <circle cx="220" cy="339" r="29" fill="#E2E8F0"/><text x="220" y="347" fill="#334155">5</text>
    <circle cx="472" cy="273" r="29" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="472" y="281" fill="#5B21B6">2</text>
    <circle cx="556" cy="273" r="29" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/><text x="556" y="281" fill="#1E3A8A">4</text>
    <circle cx="640" cy="273" r="29" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/><text x="640" y="281" fill="#5B21B6">6</text>
    <text x="556" y="347" font-size="20" fill="#1E3A8A">Observed ω = 4</text>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="455" font-size="22">4 ∈ A ⊆ Ω</text><text x="400" y="492" font-size="18">The observed outcome belongs to the event.</text></g>
</svg>
