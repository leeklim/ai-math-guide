<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Bayes rule as filtering a population by a positive test</title>
  <desc id="desc">A population is split into condition present and condition absent groups, then each group contributes true positives or false positives to the smaller positive-test population.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="context-stroke"/></marker></defs>
  <rect width="960" height="540" rx="18" fill="#F8FAFC"/>
  <text x="480" y="48" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Bayes rule changes the reference population</text>
  <rect x="55" y="105" width="220" height="310" rx="18" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <text x="165" y="145" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#0F172A">All cases</text>
  <text x="165" y="180" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#475569">prior population</text>
  <rect x="90" y="225" width="150" height="55" rx="10" fill="#FDE68A"/><text x="165" y="259" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#78350F">Condition A</text>
  <rect x="90" y="305" width="150" height="55" rx="10" fill="#CBD5E1"/><text x="165" y="339" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">Not A</text>
  <path d="M285 252H390M285 332H390" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="405" y="190" width="180" height="115" rx="15" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
    <text x="495" y="225" font-size="19" font-weight="700" fill="#14532D">True positives</text><text x="495" y="258" font-size="16" fill="#475569">P(B | A)P(A)</text>
    <rect x="405" y="330" width="180" height="115" rx="15" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="495" y="365" font-size="19" font-weight="700" fill="#7F1D1D">False positives</text><text x="495" y="398" font-size="16" fill="#475569">P(B | not A)P(not A)</text>
  </g>
  <path d="M600 248C670 248 670 275 720 275M600 388C670 388 670 315 720 315" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="735" y="180" width="175" height="245" rx="18" fill="#E0E7FF" stroke="#6366F1" stroke-width="2"/>
  <text x="822" y="220" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#312E81">Observed B</text>
  <rect x="770" y="255" width="105" height="58" rx="9" fill="#86EFAC"/><text x="822" y="290" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#14532D">A and B</text>
  <rect x="770" y="326" width="105" height="58" rx="9" fill="#FCA5A5"/><text x="822" y="361" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#7F1D1D">not A and B</text>
  <text x="480" y="493" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">Posterior P(A | B) is the true-positive share among all observed B cases.</text>
</svg>
