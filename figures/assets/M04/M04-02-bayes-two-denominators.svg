<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 710" width="800" height="710" role="img" aria-labelledby="title desc">
<title id="title">Two denominators in a 100-case Bayes example</title>
<desc id="desc">A ten by ten grid has ten actual positives in its first row and ninety actual negatives in nine other rows. Nine true positives and eighteen false positives give twenty-seven positive tests. Sensitivity uses nine out of ten, whereas the posterior uses nine out of twenty-seven.</desc>
