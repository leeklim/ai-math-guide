<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="title desc">
  <title id="title">An observational association can arise from a common cause</title>
  <desc id="desc">A possible common factor U has directed arrows to hidden pattern H and concept label C. A dashed undirected line represents their observed association. There is no H-to-C causal arrow. This is a possible alternative explanation, not an inferred causal graph of a model.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="480" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Association can have another explanation</text><text x="400" y="96" font-size="18">A possible graph, not a graph inferred from observations</text></g>
  <rect x="310" y="128" width="180" height="62" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <path d="M338 202L225 276" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M462 202L575 276" stroke="#64748B" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="98" y="292" width="216" height="62" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="486" y="292" width="216" height="62" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <path d="M338 323H462" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7 6"/>
  <g font-family="sans-serif" text-anchor="middle" font-size="20"><text x="400" y="167" fill="#334155">Common factor U</text><text x="206" y="331" fill="#1E3A8A">Hidden pattern H</text><text x="594" y="331" fill="#065F46">Concept label C</text><text x="400" y="392" fill="#9A3412" font-size="18">Dashed line: observed association, not a causal arrow</text><text x="400" y="443" fill="#475569" font-size="18">A high P(C | H) alone does not establish functional use of H.</text></g>
</svg>
