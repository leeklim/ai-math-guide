<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1008" width="800" height="1008" role="img" aria-labelledby="title desc">
<title id="title">Conditional independence need not survive pooling</title>
<desc id="desc">Three probability mosaics use area to represent joint mass. Within C, both event rates are 0.8 and the joint mass is 0.64; within its complement, rates are 0.2 and the joint mass is 0.04. Each stratum is independent. Mixing strata equally gives marginal rates 0.5 and joint mass 0.34, not 0.25. In the pooled mosaic, the height of B differs between A and not A.</desc>
<rect width="800" height="1008" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Keep the conditioning group in the claim</text><text x="400" y="92" font-size="18">Illustrative model: P(C) = P(Cᶜ) = 1/2; cell area = joint mass</text></g>
<text x="400" y="150" font-family="sans-serif" font-size="22" fill="#334155">Given C</text>
<rect x="144" y="145" width="160" height="160" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="224" y="231" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">0.64</text>
<rect x="144" y="305" width="160" height="40" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="224" y="331" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">0.16</text>
<rect x="304" y="145" width="40" height="160" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/><text x="324" y="231" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">0.16</text>
<rect x="304" y="305" width="40" height="40" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text x="324" y="331" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">0.04</text>
<text x="224" y="371" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1E3A8A">A</text><text x="324" y="371" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">Not A</text>
<text x="114" y="231" text-anchor="end" font-family="sans-serif" font-size="18" fill="#5B21B6">B</text><text x="114" y="331" text-anchor="end" font-family="sans-serif" font-size="18" fill="#475569">Not B</text>
<text x="400" y="205" font-family="sans-serif" font-size="20" fill="#334155">P(A | C) = P(B | C) = 0.8</text>
<text x="400" y="255" font-family="sans-serif" font-size="20" fill="#334155">P(A ∩ B | C) = 0.64 = 0.8²</text>
<text x="400" y="305" font-family="sans-serif" font-size="18" fill="#475569">Independent within C</text>
<text x="400" y="419" font-family="sans-serif" font-size="22" fill="#334155">Given Cᶜ</text>
<rect x="144" y="414" width="40" height="40" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="164" y="440" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">0.04</text>
<rect x="144" y="454" width="40" height="160" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="164" y="540" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">0.16</text>
<rect x="184" y="414" width="160" height="40" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/><text x="264" y="440" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">0.16</text>
<rect x="184" y="454" width="160" height="160" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text x="264" y="540" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">0.64</text>
<text x="164" y="640" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1E3A8A">A</text><text x="264" y="640" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">Not A</text>
<text x="114" y="440" text-anchor="end" font-family="sans-serif" font-size="18" fill="#5B21B6">B</text><text x="114" y="540" text-anchor="end" font-family="sans-serif" font-size="18" fill="#475569">Not B</text>
<text x="400" y="474" font-family="sans-serif" font-size="20" fill="#334155">P(A | Cᶜ) = P(B | Cᶜ) = 0.2</text>
<text x="400" y="524" font-family="sans-serif" font-size="20" fill="#334155">P(A ∩ B | Cᶜ) = 0.04 = 0.2²</text>
<text x="400" y="574" font-family="sans-serif" font-size="18" fill="#475569">Independent within Cᶜ</text>
<text x="400" y="688" font-family="sans-serif" font-size="22" fill="#334155">Pool both groups equally</text>
<rect x="144" y="683" width="100" height="136" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="194" y="757" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">0.34</text>
<rect x="144" y="819" width="100" height="64" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="194" y="857" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">0.16</text>
<rect x="244" y="683" width="100" height="64" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/><text x="294" y="721" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">0.16</text>
<rect x="244" y="747" width="100" height="136" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><text x="294" y="821" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">0.34</text>
<text x="194" y="909" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1E3A8A">A</text><text x="294" y="909" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">Not A</text>
<text x="114" y="753" text-anchor="end" font-family="sans-serif" font-size="18" fill="#5B21B6">B</text><text x="114" y="853" text-anchor="end" font-family="sans-serif" font-size="18" fill="#475569">Not B</text>
<text x="400" y="743" font-family="sans-serif" font-size="20" fill="#334155">P(A) = P(B) = 0.5</text>
<text x="400" y="793" font-family="sans-serif" font-size="20" fill="#334155">P(A ∩ B) = 0.34 ≠ 0.5²</text>
<text x="400" y="843" font-family="sans-serif" font-size="18" fill="#475569">Not independent in the pooled group</text>
<text x="400" y="958" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#475569">Within each fixed group, B has the same height in both A columns.</text>
</svg>
