<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" width="800" height="610" role="img" aria-labelledby="title desc">
  <title id="title">Conditioning rescales retained masses</title>
  <desc id="desc">Original masses a 0.6, b 0.3, c 0.1 total one. Given B containing b and c, a is discarded. Remaining mass 0.4 is rescaled to one, producing 0.75 for b and 0.25 for c, preserving their three-to-one ratio.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="610" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Conditioning does not make masses equal</text><text x="400" y="102" font-size="20">B = {b, c}, P(B) = 0.4</text></g>
  <rect x="100" y="143" width="360" height="84" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/><rect x="460" y="143" width="180" height="84" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="640" y="143" width="60" height="84" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155" font-size="22"><text x="280" y="195">a: 0.6</text><text x="550" y="195" fill="#1E3A8A">b: 0.3</text><text x="670" y="176" fill="#065F46" font-size="18">c</text><text x="670" y="208" fill="#065F46" font-size="18">0.1</text></g>
  <path d="M166 253L194 281M194 253L166 281" stroke="#64748B" stroke-width="2.5"/>
  <text x="214" y="274" font-family="sans-serif" font-size="18" fill="#475569">Outside B: excluded</text>
  <path d="M580 249V328" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="548" y="322" text-anchor="end" font-family="sans-serif" font-size="20" fill="#5B21B6">Divide retained masses by 0.4</text>
  <rect x="100" y="358" width="450" height="104" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="550" y="358" width="150" height="104" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" font-size="22"><text x="325" y="401" fill="#1E3A8A">b</text><text x="325" y="436" fill="#1E3A8A">0.3/0.4 = 0.75</text><text x="625" y="401" fill="#065F46">c</text><text x="625" y="436" font-size="20" fill="#065F46">0.1/0.4 = 0.25</text></g>
  <g font-family="sans-serif" text-anchor="middle" fill="#475569"><text x="400" y="514" font-size="22">New total = 1; relative mass b:c remains 3:1.</text><text x="400" y="566" font-size="18">The denominator is the mass of the conditioning event.</text></g>
</svg>
