<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650" role="img" aria-labelledby="title desc">
  <title id="title">Independence does not mean mutually exclusive</title>
  <desc id="desc">In four equally likely ordered coin outcomes, event A is the first H and B is the second H. Their overlap HH has mass one quarter, so they are independent and can occur together. For a fair die, events C containing 1 and D containing 2 are disjoint; observing C makes D impossible, changing its probability from one sixth to zero.</desc>
  <rect width="800" height="650" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Independent ≠ mutually exclusive</text><text x="400" y="102" font-size="20">Four ordered coin outcomes: each has mass 1/4.</text></g>
  <rect x="170" y="128" width="240" height="100" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><rect x="410" y="128" width="240" height="100" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="170" y="228" width="240" height="100" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/><rect x="410" y="228" width="240" height="100" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" font-size="23" fill="#334155"><text x="290" y="171">HH</text><text x="290" y="207" font-size="18" fill="#065F46">A and B</text><text x="530" y="171">HT</text><text x="530" y="207" font-size="18" fill="#1E3A8A">A only</text><text x="290" y="271">TH</text><text x="290" y="307" font-size="18" fill="#5B21B6">B only</text><text x="530" y="271">TT</text><text x="530" y="307" font-size="18">Neither</text><text x="400" y="367" font-size="22">P(A ∩ B) = 1/4 = (1/2)(1/2)</text></g>
  <path d="M64 398H736" stroke="#CBD5E1" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="441" font-size="20">Fair die: C = {1}, D = {2}</text></g>
  <g stroke-width="2"><circle cx="145" cy="496" r="27" fill="#DBEAFE" stroke="#2563EB"/><circle cx="247" cy="496" r="27" fill="#F3E8FF" stroke="#7C3AED"/><circle cx="349" cy="496" r="27" fill="#E2E8F0" stroke="#64748B"/><circle cx="451" cy="496" r="27" fill="#E2E8F0" stroke="#64748B"/><circle cx="553" cy="496" r="27" fill="#E2E8F0" stroke="#64748B"/><circle cx="655" cy="496" r="27" fill="#E2E8F0" stroke="#64748B"/></g>
  <g font-family="sans-serif" font-size="22" text-anchor="middle" fill="#334155"><text x="145" y="504">1</text><text x="247" y="504">2</text><text x="349" y="504">3</text><text x="451" y="504">4</text><text x="553" y="504">5</text><text x="655" y="504">6</text><text x="400" y="568">P(D) = 1/6, but P(D | C) = 0</text><text x="400" y="616" font-size="18">Knowing C changes D: these disjoint events are not independent.</text></g>
</svg>
