<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" width="800" height="570" role="img" aria-labelledby="title desc">
  <title id="title">Weighted contributions to an observed event</title>
  <desc id="desc">The A group has mass 0.1 and a positive rate 0.9, contributing 0.09. The not-A group has mass 0.9 and a positive rate 0.2, contributing 0.18. These disjoint contributions total P(B)=0.27. The larger group contributes more positives despite its lower positive rate.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="570" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Multiply along a path, add across paths</text><text x="400" y="99" font-size="18">B: positive test; A: actual positive</text></g>
  <rect x="64" y="145" width="196" height="104" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="64" y="328" width="196" height="104" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" font-size="22"><text x="162" y="184" fill="#1E3A8A">A group</text><text x="162" y="222" fill="#1E3A8A">P(A) = 0.1</text><text x="162" y="367" fill="#334155">Not-A group</text><text x="162" y="405" fill="#334155">P(Aᶜ) = 0.9</text></g>
  <path d="M276 197H453" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M276 380H453" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#5B21B6" font-size="18"><text x="365" y="158">P(B | A) = 0.9</text><text x="365" y="341">P(B | Aᶜ) = 0.2</text></g>
  <rect x="468" y="145" width="268" height="104" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><rect x="468" y="328" width="268" height="104" rx="12" fill="#FFEDD5" stroke="#D97706" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" font-size="20"><text x="602" y="184" fill="#065F46">A ∩ B</text><text x="602" y="222" fill="#065F46">0.1 × 0.9 = 0.09</text><text x="602" y="367" fill="#9A3412">Aᶜ ∩ B</text><text x="602" y="405" fill="#9A3412">0.9 × 0.2 = 0.18</text></g>
  <path d="M64 455V471H736V455" fill="none" stroke="#64748B" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle"><text x="400" y="509" font-size="24" fill="#334155">P(B) = 0.09 + 0.18 = 0.27</text><text x="400" y="548" font-size="18" fill="#475569">The two rates are weighted by different group sizes.</text></g>
</svg>
