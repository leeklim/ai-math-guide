<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">A conditional distribution renormalizes one joint row</title>
  <desc id="desc">The joint row for X one has probabilities 0.10 for Y zero and 0.40 for Y one. Its sum is 0.50. Dividing this selected row by 0.50 gives conditional probabilities 0.20 and 0.80 totaling one.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="500" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Select one row, then normalize it</text><text x="400" y="103" font-size="20">Given X = 1: row mass p_X(1) = 0.50</text></g>
  <rect x="100" y="137" width="60" height="78" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="160" y="137" width="240" height="78" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><rect x="400" y="137" width="300" height="78" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" font-size="20"><text x="130" y="185" fill="#1E3A8A">0.10</text><text x="280" y="185" fill="#065F46">0.40</text><text x="550" y="185" fill="#475569">Other X values</text></g>
  <path d="M400 239V284" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="434" y="269" font-family="sans-serif" font-size="20" fill="#5B21B6">Divide the selected row by 0.50</text>
  <rect x="100" y="314" width="120" height="91" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="220" y="314" width="480" height="91" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" font-size="20"><text x="160" y="349" fill="#1E3A8A">Y = 0</text><text x="160" y="382" fill="#1E3A8A">0.20</text><text x="460" y="349" fill="#065F46">Y = 1</text><text x="460" y="382" fill="#065F46">0.80</text><text x="400" y="459" font-size="22" fill="#334155">The conditional row sums to 1.</text></g>
</svg>
