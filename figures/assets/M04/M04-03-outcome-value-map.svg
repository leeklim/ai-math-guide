<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" width="800" height="610" role="img" aria-labelledby="title desc">
  <title id="title">A random variable maps each outcome to one value</title>
  <desc id="desc">The head-count function X maps TT to zero, HT and TH to one, and HH to two. HT and TH are different outcomes with the same value. Once HT is observed, the recorded lowercase value is x equals one. No outcome probabilities are assumed in this function diagram.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="610" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">X is a function, not one observed value</text><text x="185" y="106" font-size="20">Outcomes in Ω</text><text x="625" y="106" font-size="20">Values of X</text></g>
  <rect x="95" y="132" width="180" height="314" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="546" y="132" width="158" height="314" rx="16" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <g fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"><path d="M240 183H584"/><path d="M240 253L584 281"/><path d="M240 327L584 299"/><path d="M240 399H584"/></g>
  <g font-family="sans-serif" text-anchor="middle" font-size="23" fill="#1E3A8A"><text x="185" y="191">TT</text><text x="185" y="261">HT</text><text x="185" y="335">TH</text><text x="185" y="407">HH</text></g>
  <g font-family="sans-serif" text-anchor="middle" font-size="23" fill="#065F46"><text x="625" y="191">0</text><text x="625" y="297">1</text><text x="625" y="407">2</text></g>
  <g font-family="sans-serif" text-anchor="middle"><text x="400" y="483" font-size="20" fill="#5B21B6">Rule X: count the heads</text><text x="400" y="529" font-size="22" fill="#334155">Observed HT → recorded x = 1</text><text x="400" y="574" font-size="18" fill="#475569">Different outcomes may have the same value; no probabilities yet.</text></g>
</svg>
