<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530" role="img" aria-labelledby="title desc">
  <title id="title">A value condition gathers all matching outcomes</title>
  <desc id="desc">Each of four ordered coin outcomes has probability one quarter. The condition X equals one selects the two matching outcomes HT and TH. Their separate masses add to one half; the preimage is a set of outcomes, not an inverse function selecting one outcome.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
  <rect width="800" height="530" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Ask for a value, then collect its preimage</text><text x="400" y="98" font-size="18">Each ordered outcome has mass 1/4.</text></g>
  <rect x="82" y="135" width="296" height="280" rx="16" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <rect x="112" y="235" width="236" height="108" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <g font-family="sans-serif" text-anchor="middle" font-size="22" fill="#334155"><text x="230" y="186">TT: 1/4</text><text x="230" y="269" fill="#1E3A8A">HT: 1/4</text><text x="230" y="315" fill="#1E3A8A">TH: 1/4</text><text x="230" y="383">HH: 1/4</text></g>
  <rect x="526" y="247" width="196" height="84" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <text x="624" y="297" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#065F46">X = 1</text>
  <path d="M504 289H401" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="456" y="224" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5B21B6">Select all</text>
  <text x="456" y="251" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#5B21B6">matches</text>
  <g font-family="sans-serif" text-anchor="middle"><text x="400" y="460" font-size="24" fill="#065F46">P(X = 1) = P({HT, TH}) = 1/2</text><text x="400" y="505" font-size="18" fill="#475569">Two outcome masses meet at one value.</text></g>
</svg>
