<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="title desc">
  <title id="title">Equal marginals do not determine the joint distribution</title>
  <desc id="desc">Two joint tables have identical row marginals 0.50, 0.50 and column marginals 0.40, 0.60. The first has cells 0.30, 0.20, 0.10, 0.40 and the second 0.20, 0.30, 0.20, 0.30. In their X-one row, the conditional Y-one probability changes from 0.80 to 0.60.</desc>
  <rect width="800" height="560" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Same marginals, different joint cells</text><text x="240" y="102" font-size="20">Joint model 1</text><text x="608" y="102" font-size="20">Joint model 2</text><text x="186" y="145" font-size="18">Y = 0</text><text x="294" y="145" font-size="18">Y = 1</text><text x="554" y="145" font-size="18">Y = 0</text><text x="662" y="145" font-size="18">Y = 1</text></g>
  <g stroke="#64748B" stroke-width="2"><rect x="132" y="170" width="108" height="90" fill="#E2E8F0"/><rect x="240" y="170" width="108" height="90" fill="#E2E8F0"/><rect x="132" y="260" width="108" height="90" fill="#DBEAFE"/><rect x="240" y="260" width="108" height="90" fill="#D1FAE5"/><rect x="500" y="170" width="108" height="90" fill="#E2E8F0"/><rect x="608" y="170" width="108" height="90" fill="#E2E8F0"/><rect x="500" y="260" width="108" height="90" fill="#DBEAFE"/><rect x="608" y="260" width="108" height="90" fill="#D1FAE5"/></g>
  <g font-family="sans-serif" text-anchor="middle" font-size="22" fill="#334155"><text x="186" y="224">0.30</text><text x="294" y="224">0.20</text><text x="186" y="314">0.10</text><text x="294" y="314">0.40</text><text x="554" y="224">0.20</text><text x="662" y="224">0.30</text><text x="554" y="314">0.20</text><text x="662" y="314">0.30</text></g>
  <g font-family="sans-serif" text-anchor="end" font-size="18" fill="#334155"><text x="104" y="223">X = 0</text><text x="104" y="313">X = 1</text><text x="472" y="223">X = 0</text><text x="472" y="313">X = 1</text></g>
  <g font-family="sans-serif" text-anchor="middle" font-size="20" fill="#065F46"><text x="240" y="396">0.40/0.50 = 0.80</text><text x="608" y="396">0.30/0.50 = 0.60</text></g>
  <g font-family="sans-serif" text-anchor="middle" font-size="18" fill="#475569"><text x="400" y="442">Above ratios: P(Y = 1 | X = 1)</text><text x="400" y="481">Both row sums: 0.50, 0.50; both column sums: 0.40, 0.60</text><text x="400" y="521">Marginal totals cannot recover each joint cell.</text></g>
</svg>
