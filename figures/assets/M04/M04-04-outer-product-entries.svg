<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650" role="img" aria-labelledby="title desc">
  <title id="title">An outer product records every pair of centered components</title>
  <desc id="desc">In the binary joint example the outcome (1,1) minus mean (0.5,0.6) gives centered vector (0.5,0.4). Its outer product has entries 0.25, 0.20, 0.20, 0.16. This is one outcome's contribution matrix, not the final covariance matrix. Covariance averages such matrices over the distribution.</desc>
  <rect width="800" height="650" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Every component pair gets one matrix entry</text><text x="400" y="103" font-size="20">One outcome: (1, 1) − mean (0.5, 0.6) = (0.5, 0.4)</text></g>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155" font-size="20"><text x="397" y="163">Column component 1</text><text x="623" y="163">Column component 2</text><text x="397" y="203" fill="#1E3A8A">0.5</text><text x="623" y="203" fill="#5B21B6">0.4</text><text x="161" y="294">Row 1: 0.5</text><text x="161" y="414">Row 2: 0.4</text></g>
  <g stroke="#64748B" stroke-width="2"><rect x="286" y="237" width="222" height="120" fill="#DBEAFE"/><rect x="508" y="237" width="222" height="120" fill="#D1FAE5"/><rect x="286" y="357" width="222" height="120" fill="#D1FAE5"/><rect x="508" y="357" width="222" height="120" fill="#F3E8FF"/></g>
  <g font-family="sans-serif" text-anchor="middle" font-size="22" fill="#334155"><text x="397" y="290">0.5 × 0.5</text><text x="397" y="330">0.25</text><text x="619" y="290">0.5 × 0.4</text><text x="619" y="330">0.20</text><text x="397" y="410">0.4 × 0.5</text><text x="397" y="450">0.20</text><text x="619" y="410">0.4 × 0.4</text><text x="619" y="450">0.16</text></g>
  <g font-family="sans-serif" text-anchor="middle"><text x="400" y="533" font-size="22" fill="#065F46">Σ = probability-weighted mean of all outcome matrices</text><text x="400" y="580" font-size="18" fill="#475569">Diagonal: squared deviations; off-diagonal: pairwise products.</text><text x="400" y="619" font-size="18" fill="#475569">The matrix above is one contribution, not Σ itself.</text></g>
</svg>
