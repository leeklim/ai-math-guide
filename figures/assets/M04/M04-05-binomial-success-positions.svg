<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 590" width="800" height="590" role="img" aria-labelledby="title desc">
  <title id="title">Three distinct positions for two successes in three trials</title>
  <desc id="desc">Three independent Bernoulli trials each have success probability one half. The distinct two-success arrays are 110, 101, and 011. Each has probability one eighth, so the probability of exactly two successes is three eighths. The two selected positions are unordered within an array.</desc>
  <rect width="800" height="590" rx="16" fill="#F8FAFC"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#334155"><text x="400" y="48" font-size="24" font-weight="700">Count arrangements, not a success order</text><text x="400" y="100" font-size="18">Three independent trials; the same p = 1/2 in each trial</text><text x="210" y="152" font-size="20">X₁</text><text x="350" y="152" font-size="20">X₂</text><text x="490" y="152" font-size="20">X₃</text><text x="661" y="152" font-size="20">Mass</text></g>
  <g stroke-width="2"><rect x="160" y="180" width="100" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB"/><rect x="300" y="180" width="100" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB"/><rect x="440" y="180" width="100" height="64" rx="10" fill="#E2E8F0" stroke="#64748B"/><rect x="160" y="275" width="100" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB"/><rect x="300" y="275" width="100" height="64" rx="10" fill="#E2E8F0" stroke="#64748B"/><rect x="440" y="275" width="100" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB"/><rect x="160" y="370" width="100" height="64" rx="10" fill="#E2E8F0" stroke="#64748B"/><rect x="300" y="370" width="100" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB"/><rect x="440" y="370" width="100" height="64" rx="10" fill="#DBEAFE" stroke="#2563EB"/></g>
  <g font-family="sans-serif" text-anchor="middle" font-size="24" fill="#334155"><text x="210" y="221">1</text><text x="350" y="221">1</text><text x="490" y="221">0</text><text x="210" y="316">1</text><text x="350" y="316">0</text><text x="490" y="316">1</text><text x="210" y="411">0</text><text x="350" y="411">1</text><text x="490" y="411">1</text><text x="661" y="221" font-size="22">1/8</text><text x="661" y="316" font-size="22">1/8</text><text x="661" y="411" font-size="22">1/8</text></g>
  <g font-family="sans-serif" text-anchor="middle"><text x="400" y="487" font-size="22" fill="#065F46">3 choose 2 = 3 arrangements; P(S = 2) = 3/8</text><text x="400" y="542" font-size="18" fill="#475569">Each row is a different event; their masses add.</text></g>
</svg>
