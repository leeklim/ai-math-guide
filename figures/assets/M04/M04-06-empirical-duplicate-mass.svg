<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" role="img" aria-labelledby="title desc">
<title id="title">Repeated observed values contribute repeated empirical mass</title>
<desc id="desc">Four illustrative observed records two four four six each contribute a quarter. The two records with value four combine to a half at that location. Mean four and squared deviations totaling eight give empirical variance two and unbiased sample variance eight thirds.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="800" height="680" rx="18" fill="#F8FAFC"/>
<g font-family="sans-serif" text-anchor="middle" font-size="22" fill="#334155">
<text x="400" y="54" font-size="26" font-weight="700">Records combine at the same value</text>
<text x="400" y="102">Observed records; mass 1/4 each</text>
<g fill="#DBEAFE" stroke="#2563EB" stroke-width="2"><rect x="92" y="136" width="100" height="68" rx="10"/><rect x="264" y="136" width="100" height="68" rx="10"/><rect x="436" y="136" width="100" height="68" rx="10"/><rect x="608" y="136" width="100" height="68" rx="10"/></g>
<text x="142" y="180">2</text><text x="314" y="180">4</text><text x="486" y="180">4</text><text x="658" y="180">6</text>
<path d="M142 224L180 280" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M314 224L380 280" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M486 224L420 280" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M658 224L620 280" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M92 444H708" stroke="#64748B" stroke-width="2"/>
<path d="M180 444V380 M400 444V316 M620 444V380" stroke="#059669" stroke-width="5"/>
<text x="180" y="369" fill="#065F46">1/4</text><text x="400" y="305" fill="#065F46">1/2</text><text x="620" y="369" fill="#065F46">1/4</text>
<text x="180" y="481">2</text><text x="400" y="481">4</text><text x="620" y="481">6</text>
<text x="400" y="537">Same squared-deviation sum: 4 + 0 + 0 + 4 = 8</text>
<text x="400" y="592" fill="#5B21B6">Empirical variance: 8/4 = 2</text>
<text x="400" y="637" fill="#065F46">Sample variance: 8/(4 − 1) = 8/3</text>
</g></svg>
