<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 650" role="img" aria-labelledby="title desc">
<title id="title">Equal Bernoulli marginals with different joint probabilities</title>
<desc id="desc">Two joint probability grids have identical half-half marginals. Independent draws put a quarter in all four cells. Copying the first draw to the second puts a half in each diagonal cell and zero elsewhere, giving mean variance one quarter rather than one eighth.</desc>
<rect width="840" height="650" rx="18" fill="#F8FAFC"/>
<g font-family="sans-serif" text-anchor="middle" font-size="22" fill="#334155">
<text x="420" y="54" font-size="26" font-weight="700">Same marginals ≠ independent draws</text>
<text x="420" y="98">Both: P(X₁ = 1) = P(X₂ = 1) = 1/2</text>
<text x="240" y="160" font-weight="700" fill="#1E3A8A">Independent</text>
<text x="630" y="160" font-weight="700" fill="#5B21B6">Copied: X₂ = X₁</text>
<text x="240" y="202">X₂</text><text x="630" y="202">X₂</text>
<text x="183" y="240">0</text><text x="297" y="240">1</text><text x="573" y="240">0</text><text x="687" y="240">1</text>
<text x="74" y="325">X₁</text><text x="464" y="325">X₁</text>
<text x="111" y="301">0</text><text x="111" y="415">1</text><text x="501" y="301">0</text><text x="501" y="415">1</text>
<path d="M126 258H354V486H126Z M126 372H354 M240 258V486" fill="#DBEAFE" stroke="#64748B" stroke-width="2"/>
<rect x="516" y="258" width="114" height="114" fill="#F3E8FF"/><rect x="630" y="372" width="114" height="114" fill="#F3E8FF"/>
<path d="M516 258H744V486H516Z M516 372H744 M630 258V486" fill="none" stroke="#64748B" stroke-width="2"/>
<text x="183" y="325">1/4</text><text x="297" y="325">1/4</text><text x="183" y="439">1/4</text><text x="297" y="439">1/4</text>
<text x="573" y="325">1/2</text><text x="687" y="325">0</text><text x="573" y="439">0</text><text x="687" y="439">1/2</text>
<text x="240" y="542" fill="#1E3A8A">Var(X̄) = 1/8</text><text x="630" y="542" fill="#5B21B6">Var(X̄) = 1/4</text>
<text x="420" y="604">Copying makes the list longer, not more independent.</text>
</g></svg>
