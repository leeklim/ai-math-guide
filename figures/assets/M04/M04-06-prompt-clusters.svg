<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" role="img" aria-labelledby="title desc">
<title id="title">Token records and prompt sampling units are different levels</title>
<desc id="desc">An illustrative hierarchy has two separately sampled prompts with three token records inside each. The six observed records share two prompt contexts. Treating all six tokens as independent is not justified by record count.</desc>
<rect width="800" height="540" rx="18" fill="#F8FAFC"/>
<g font-family="sans-serif" text-anchor="middle" font-size="24" fill="#334155">
<text x="400" y="54" font-size="26" font-weight="700">Count records and sampling units separately</text>
<text x="400" y="104">Illustration: independently sampled prompts</text>
<rect x="48" y="148" width="328" height="228" rx="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="424" y="148" width="328" height="228" rx="16" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
<text x="212" y="196" font-weight="700" fill="#1E3A8A">Prompt 1 context</text><text x="588" y="196" font-weight="700" fill="#5B21B6">Prompt 2 context</text>
<g fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"><rect x="76" y="238" width="80" height="68" rx="8"/><rect x="172" y="238" width="80" height="68" rx="8"/><rect x="268" y="238" width="80" height="68" rx="8"/><rect x="452" y="238" width="80" height="68" rx="8"/><rect x="548" y="238" width="80" height="68" rx="8"/><rect x="644" y="238" width="80" height="68" rx="8"/></g>
<text x="116" y="281">t₁</text><text x="212" y="281">t₂</text><text x="308" y="281">t₃</text><text x="492" y="281">t₁</text><text x="588" y="281">t₂</text><text x="684" y="281">t₃</text>
<text x="212" y="347" font-size="22">Shared prompt context</text><text x="588" y="347" font-size="22">Shared prompt context</text>
<text x="400" y="436" fill="#065F46">6 token records; 2 prompt-level units</text>
<text x="400" y="487" font-size="22">The generalization target determines the relevant unit.</text>
</g></svg>
