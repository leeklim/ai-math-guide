<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" role="img" aria-labelledby="title desc">
<title id="title">Population, random sample and one observed statistic</title>
<desc id="desc">A fixed Bernoulli population with mean one half generates a size-two random sample. One illustrative observation zero one gives an observed mean one half. Other sample outcomes give zero or one, while the population parameter stays fixed.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="520" height="760" rx="18" fill="#F8FAFC"/>
<g font-family="sans-serif" text-anchor="middle" font-size="26" fill="#334155">
<text x="260" y="54" font-size="28" font-weight="700">What changes across samples?</text>
<rect x="48" y="92" width="424" height="134" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="260" y="136" font-weight="700" fill="#1E3A8A">Population P</text>
<text x="260" y="177">Bernoulli(0.5)</text>
<text x="260" y="210">Fixed parameter: μ = 0.5</text>
<path d="M260 242V282" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="306" width="424" height="112" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
<text x="260" y="348" font-weight="700" fill="#5B21B6">Before observation</text>
<text x="260" y="388">(X₁, X₂) → X̄ = (X₁ + X₂)/2</text>
<path d="M260 434V474" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="498" width="424" height="112" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="260" y="540" font-weight="700" fill="#065F46">One observed sample</text>
<text x="260" y="580">(x₁, x₂) = (0, 1); x̄ = 0.5</text>
<text x="260" y="663" font-size="24">Another sample may give x̄ = 0 or 1.</text>
<text x="260" y="702" font-size="24">The parameter μ does not change.</text>
</g></svg>
