<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" role="img" aria-labelledby="title desc">
<title id="title">Precision and recall select different confusion-matrix groups</title>
<desc id="desc">The same confusion matrix is shown twice with rows actual positive and negative and columns predicted positive and negative. Counts are true positive thirty false negative twenty false positive ten true negative forty. Precision uses the predicted-positive column of forty and recall the actual-positive row of fifty.</desc>
<rect width="900" height="630" rx="18" fill="#F8FAFC"/>
<g font-family="sans-serif" text-anchor="middle" font-size="22" fill="#334155">
<text x="450" y="54" font-size="26" font-weight="700">Same correct positives, different denominator groups</text>
<text x="245" y="123" font-weight="700" fill="#1E3A8A">Precision</text><text x="665" y="123" font-weight="700" fill="#9A3412">Recall</text>
<text x="245" y="168">Predicted</text><text x="665" y="168">Predicted</text>
<text x="185" y="217">+</text><text x="305" y="217">−</text><text x="605" y="217">+</text><text x="725" y="217">−</text>
<text x="50" y="337" transform="rotate(-90 50 337)">Actual</text><text x="470" y="337" transform="rotate(-90 470 337)">Actual</text>
<text x="94" y="307">+</text><text x="94" y="427">−</text><text x="514" y="307">+</text><text x="514" y="427">−</text>
<rect x="125" y="246" width="120" height="240" fill="#DBEAFE"/><rect x="545" y="246" width="240" height="120" fill="#FFEDD5"/>
<path d="M125 246H365V486H125Z M125 366H365 M245 246V486 M545 246H785V486H545Z M545 366H785 M665 246V486" fill="none" stroke="#64748B" stroke-width="1.5"/>
<rect x="125" y="246" width="120" height="240" fill="none" stroke="#2563EB" stroke-width="3"/><rect x="545" y="246" width="240" height="120" fill="none" stroke="#D97706" stroke-width="3"/>
<text x="185" y="312">TP 30</text><text x="305" y="312">FN 20</text><text x="185" y="432">FP 10</text><text x="305" y="432">TN 40</text>
<text x="605" y="312">TP 30</text><text x="725" y="312">FN 20</text><text x="605" y="432">FP 10</text><text x="725" y="432">TN 40</text>
<text x="245" y="547" fill="#1E3A8A">30/(30 + 10) = 0.75</text><text x="665" y="547" fill="#9A3412">30/(30 + 20) = 0.60</text>
<text x="450" y="595">Accuracy uses all four cells: (30 + 40)/100 = 0.70</text>
</g></svg>
