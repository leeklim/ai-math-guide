<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 610" role="img" aria-labelledby="title desc">
<title id="title">A probe readout is a separate branch from the original model</title>
<desc id="desc">An activation H feeds the continuation of the original model and separately feeds a fitted probe. The probe predicts a supervised concept label on held-out examples. This separate readout branch does not show that the model uses the label information in its own output.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="820" height="610" rx="18" fill="#F8FAFC"/>
<g font-family="sans-serif" text-anchor="middle" font-size="24" fill="#334155">
<text x="410" y="54" font-size="26" font-weight="700">Readable by a probe ≠ used by the model</text>
<rect x="272" y="94" width="276" height="74" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="410" y="140" fill="#1E3A8A" font-weight="700">Activation H</text>
<path d="M330 188L225 251" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M490 188L595 251" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="62" y="276" width="324" height="84" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/><text x="224" y="311" fill="#5B21B6">Original model</text><text x="224" y="341" fill="#5B21B6">continuation</text>
<rect x="434" y="276" width="324" height="84" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/><text x="596" y="327" fill="#5B21B6">Separately fitted probe</text>
<path d="M224 380V422" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M596 380V422" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="62" y="446" width="324" height="74" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="224" y="492" fill="#065F46">Original output</text>
<rect x="434" y="446" width="324" height="74" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="596" y="492" fill="#065F46">Predicted concept label</text>
<text x="410" y="573" font-size="22">Probe evaluation requires held-out data and baselines.</text>
</g></svg>
