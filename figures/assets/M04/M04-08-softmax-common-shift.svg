<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 680" role="img" aria-labelledby="title desc">
<title id="title">A common logit shift cancels after normalization</title>
<desc id="desc">Logits zero log two log three exponentiate to one two three. Adding log five to all logits multiplies all exponentials by five, giving five ten fifteen. Normalizing either vector produces class masses one sixth two sixths three sixths, drawn with proportional widths.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="820" height="680" rx="18" fill="#F8FAFC"/>
<g font-family="sans-serif" text-anchor="middle" font-size="22" fill="#334155">
<text x="410" y="54" font-size="26" font-weight="700">Shift all logits; keep their probability ratios</text>
<text x="225" y="123" fill="#1E3A8A">z = (0, log 2, log 3)</text><text x="612" y="123" fill="#5B21B6">z + log 5</text>
<path d="M400 117H481" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M225 147V193" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M612 147V193" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="70" y="220" width="310" height="108" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="450" y="220" width="324" height="108" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
<text x="225" y="259">exp(z) = (1, 2, 3)</text><text x="225" y="301">Total = 6</text>
<text x="612" y="259">5 exp(z) = (5, 10, 15)</text><text x="612" y="301">Total = 30</text>
<path d="M225 348V405" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M612 348V405" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="225" y="448">Divide by 6</text><text x="612" y="448">Divide by 30</text>
<text x="410" y="504" font-weight="700" fill="#065F46">Same probability vector</text>
<rect x="80" y="536" width="110" height="64" fill="#DBEAFE"/><rect x="190" y="536" width="220" height="64" fill="#F3E8FF"/><rect x="410" y="536" width="330" height="64" fill="#D1FAE5"/>
<path d="M80 536H740V600H80Z M190 536V600 M410 536V600" fill="none" stroke="#64748B" stroke-width="1.5"/>
<text x="135" y="577">1/6</text><text x="300" y="577">2/6</text><text x="575" y="577">3/6</text>
<text x="410" y="641">Common scale cancels in numerator and denominator.</text>
</g></svg>
