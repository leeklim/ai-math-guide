<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 670" role="img" aria-labelledby="title desc">
<title id="title">Ordered size-two bootstrap samples from two fixed records</title>
<desc id="desc">Fixed observed data one three define equal empirical index probabilities. With replacement, four ordered size-two samples one one, one three, three one and three three each have probability one quarter. Applying the same sample-mean rule gives one two two three.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="820" height="670" rx="18" fill="#F8FAFC"/>
<g font-family="sans-serif" text-anchor="middle" font-size="24" fill="#334155">
<text x="410" y="54" font-size="26" font-weight="700">Draw from fixed records, with replacement</text>
<rect x="214" y="95" width="392" height="104" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="410" y="134" fill="#1E3A8A">Observed data: (1, 3)</text><text x="410" y="174" font-size="22">Each index has mass 1/2.</text>
<path d="M310 218L120 278" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M375 218L315 278" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M445 218L505 278" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M510 218L700 278" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<g fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"><rect x="48" y="305" width="144" height="104" rx="10"/><rect x="243" y="305" width="144" height="104" rx="10"/><rect x="433" y="305" width="144" height="104" rx="10"/><rect x="628" y="305" width="144" height="104" rx="10"/></g>
<text x="120" y="347">(1, 1)</text><text x="315" y="347">(1, 3)</text><text x="505" y="347">(3, 1)</text><text x="700" y="347">(3, 3)</text>
<text x="120" y="386" font-size="22">mass 1/4</text><text x="315" y="386" font-size="22">mass 1/4</text><text x="505" y="386" font-size="22">mass 1/4</text><text x="700" y="386" font-size="22">mass 1/4</text>
<path d="M120 428V474" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M315 428V474" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M505 428V474" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M700 428V474" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="410" y="533" font-size="22">Apply the same mean rule to each size-two sample.</text>
<text x="120" y="579" font-size="30" fill="#065F46">1</text><text x="315" y="579" font-size="30" fill="#065F46">2</text><text x="505" y="579" font-size="30" fill="#065F46">2</text><text x="700" y="579" font-size="30" fill="#065F46">3</text>
<text x="410" y="627" font-size="22">All possible resamples; not new population records.</text>
</g></svg>
