<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 590" role="img" aria-labelledby="title desc">
<title id="title">Candidate discovery and independent confirmation use different data</title>
<desc id="desc">Data A feeds a search over neurons layers and metrics. Choices are frozen before confirmation on new data B not used for selection. Prespecified correction belongs to confirmation, which is not a causal intervention by itself.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="820" height="590" rx="18" fill="#F8FAFC"/>
<g font-family="sans-serif" text-anchor="middle" font-size="24" fill="#334155">
<text x="410" y="54" font-size="28" font-weight="700">Separate discovery from confirmation</text>
<rect x="48" y="100" width="318" height="118" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="454" y="100" width="318" height="118" rx="12" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
<text x="207" y="147" font-weight="700" fill="#1E3A8A">Data A</text><text x="207" y="187" font-size="22">Observed patterns</text><text x="613" y="147" fill="#5B21B6">Search candidates</text><text x="613" y="187" font-size="22">neurons, layers, metrics</text>
<path d="M390 160H430" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M613 242V306" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="374" y="282" fill="#5B21B6">Freeze choices before testing</text>
<rect x="48" y="330" width="318" height="118" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="454" y="330" width="318" height="118" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="207" y="377" font-weight="700" fill="#1E3A8A">New data B</text><text x="207" y="417" font-size="22">No candidate selection</text><text x="613" y="377" fill="#065F46" font-size="22">Confirm frozen choices</text><text x="613" y="417" font-size="22">Prespecified correction</text>
<path d="M390 390H430" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="410" y="521" font-size="22">Confirmation alone does not establish causation.</text>
</g></svg>
