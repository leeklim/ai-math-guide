<svg xmlns="http://www.w3.org/2000/svg" width="940" height="620" viewBox="0 0 940 620">
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="940" height="620" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif" font-size="24" fill="#334155" text-anchor="middle">
<text x="470" y="54" font-size="28" font-weight="700">Four iid Bernoulli observations; fix p = 0.75</text>
<g fill="#DBEAFE" stroke="#2563EB" stroke-width="2"><rect x="48" y="98" width="188" height="112" rx="10"/><rect x="267" y="98" width="188" height="112" rx="10"/><rect x="486" y="98" width="188" height="112" rx="10"/><rect x="705" y="98" width="188" height="112" rx="10"/></g>
<text x="142" y="140">x₁ = 1</text><text x="142" y="179" fill="#1E3A8A">p = 0.75</text>
<text x="361" y="140">x₂ = 0</text><text x="361" y="179" fill="#1E3A8A">1 − p = 0.25</text>
<text x="580" y="140">x₃ = 1</text><text x="580" y="179" fill="#1E3A8A">p = 0.75</text>
<text x="799" y="140">x₄ = 1</text><text x="799" y="179" fill="#1E3A8A">p = 0.75</text>
<text x="470" y="263" fill="#5B21B6">multiply observation probabilities</text>
<rect x="100" y="293" width="740" height="82" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
<text x="470" y="327">L = 0.75 × 0.25 × 0.75 × 0.75</text><text x="470" y="358" fill="#5B21B6">= 0.10546875</text>
<text x="470" y="430" fill="#065F46">take log: product becomes a sum</text>
<rect x="100" y="460" width="740" height="100" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="470" y="499">log L = log 0.75 + log 0.25</text><text x="470" y="534">+ log 0.75 + log 0.75 ≈ −2.24934</text>
</g>
<g stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M470 217V240"/><path d="M470 383V406"/></g>
</svg>
