<text x="260" y="514">Context: A, B</text><text x="260" y="553">q(C ∣ A, B) = 1</text><text x="260" y="587">NLL = 0</text>
<rect x="48" y="666" width="424" height="226" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="260" y="711">Sequence probability = 0.125</text><text x="260" y="753">Total NLL = log 8 ≈ 2.079</text><text x="260" y="795">Mean NLL = log 2 ≈ 0.693</text><text x="260" y="849" fill="#065F46" font-size="28">Perplexity = 2</text>
<text x="260" y="937" font-size="24">Conditional product, not iid</text>
