<svg xmlns="http://www.w3.org/2000/svg" width="520" height="970" viewBox="0 0 520 970">
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="520" height="970" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif" font-size="26" fill="#334155" text-anchor="middle">
<text x="260" y="53" font-size="28" font-weight="700">Observed sequence A, B, C</text>
<rect x="48" y="96" width="424" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="260" y="134">Context: empty</text><text x="260" y="173">q(A) = 0.5</text><text x="260" y="207">NLL ≈ 0.693</text>
<rect x="48" y="286" width="424" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="260" y="324">Context: A</text><text x="260" y="363">q(B ∣ A) = 0.25</text><text x="260" y="397">NLL ≈ 1.386</text>
