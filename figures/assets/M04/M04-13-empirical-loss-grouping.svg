<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs>
<rect width="960" height="620" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif" font-size="24" fill="#334155" text-anchor="middle">
<text x="480" y="54" font-size="28" font-weight="700">Same observations, grouped by outcome</text>
<rect x="48" y="102" width="384" height="158" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="528" y="102" width="384" height="158" rx="10" fill="#F3E8FF" stroke="#7C3AED" stroke-width="2"/>
<text x="240" y="146">Observed: A, A, A, B</text><text x="240" y="187">q(A)=q(B)=0.5</text><text x="240" y="229">Four observation losses</text>
<text x="720" y="146">Empirical weights</text><text x="720" y="187">p̂(A)=3/4, p̂(B)=1/4</text><text x="720" y="229">Two grouped log-loss terms</text>
<text x="480" y="317">average NLL = empirical cross entropy</text>
<rect x="48" y="354" width="864" height="104" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="480" y="394">−(3 log 0.5 + log 0.5)/4</text><text x="480" y="431">= −0.75 log 0.5 − 0.25 log 0.5 ≈ 0.693</text>
<rect x="48" y="502" width="864" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
<text x="480" y="546">0.693 ≈ target entropy 0.562 + KL 0.131</text>
</g>
<g fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"><path d="M448 180H512"/></g>
</svg>
