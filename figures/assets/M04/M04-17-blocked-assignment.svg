<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720">
<rect width="1000" height="720" rx="16" fill="#F8FAFC"/>
<g font-family="sans-serif" font-size="28" text-anchor="middle" fill="#334155">
<text x="500" y="68" font-weight="700">Randomize within blocks; weight the target separately</text>
<g fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"><rect x="48" y="126" width="440" height="326" rx="12"/><rect x="512" y="126" width="440" height="326" rx="12"/></g>
<text x="268" y="179">Easy block</text><text x="732" y="179">Hard block</text>
<g fill="#FFEDD5" stroke="#D97706" stroke-width="2"><circle cx="108" cy="261" r="36"/><circle cx="420" cy="261" r="36"/><circle cx="680" cy="261" r="36"/><circle cx="784" cy="261" r="36"/></g>
<g fill="#DBEAFE" stroke="#2563EB" stroke-width="2"><circle cx="212" cy="261" r="36"/><circle cx="316" cy="261" r="36"/><circle cx="576" cy="261" r="36"/><circle cx="888" cy="261" r="36"/></g>
<text x="108" y="271">E1</text><text x="212" y="271">E2</text><text x="316" y="271">E3</text><text x="420" y="271">E4</text><text x="576" y="271">H1</text><text x="680" y="271">H2</text><text x="784" y="271">H3</text><text x="888" y="271">H4</text>
<g font-size="26"><text x="108" y="333">A</text><text x="212" y="333">B</text><text x="316" y="333">B</text><text x="420" y="333">A</text><text x="576" y="333">B</text><text x="680" y="333">A</text><text x="784" y="333">A</text><text x="888" y="333">B</text></g>
<text x="268" y="405">Mean A=.9; B=.8; Δ=.1</text><text x="732" y="405">Mean A=.6; B=.4; Δ=.2</text>
<text x="500" y="526">Equal sampled block weights: (.1+.2)/2 = .15</text><text x="500" y="584" fill="#065F46">Target weights (.25,.75): .25(.1)+.75(.2) = .175</text><text x="500" y="666" font-size="26">Within-block balance ≠ target population proportions</text>
</g>
</svg>
