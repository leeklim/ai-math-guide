<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 670" width="520" height="670" role="img"><title>Connected path with zero local derivative</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="670" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="30" text-anchor="start">Connection with zero slope</text><text x="40" y="100" fill="#7C3AED" font-size="28" text-anchor="start">Hold wᵢ = 0 fixed.</text><rect x="40" y="145" width="125" height="62" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="102.5" y="184" fill="#2563EB" font-size="28" text-anchor="middle">xᵢ = 0</text><path d="M166 176L235 281" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="250" width="125" height="62" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="102.5" y="289" fill="#2563EB" font-size="28" text-anchor="middle">xᵢ = 1</text><path d="M166 281L235 281" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="355" width="125" height="62" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="102.5" y="394" fill="#2563EB" font-size="28" text-anchor="middle">xᵢ = 2</text><path d="M166 386L235 281" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="237" y="238" width="180" height="86" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="327" y="277" fill="#7C3AED" font-size="28" text-anchor="middle">Multiply</text><text x="327" y="313" fill="#64748B" font-size="24" text-anchor="middle">by 0</text><path d="M327 325L327 427" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="237" y="430" width="180" height="80" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="327" y="469" fill="#059669" font-size="28" text-anchor="middle">pᵢ = 0</text><text x="327" y="505" fill="#64748B" font-size="24" text-anchor="middle">for each xᵢ</text><text x="40" y="575" fill="#7C3AED" font-size="28" text-anchor="start">dpᵢ / dxᵢ = 0</text><text x="40" y="625" fill="#2563EB" font-size="28" text-anchor="start">dy / dxᵢ = 1 × 0 = 0</text></g></svg>
