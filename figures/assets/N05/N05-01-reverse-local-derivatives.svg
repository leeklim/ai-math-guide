<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 790" width="520" height="790" role="img"><title>Reverse products of local derivatives</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="790" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="30" text-anchor="start">Reverse derivative flow</text><rect x="155" y="90" width="210" height="85" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="129" fill="#059669" font-size="28" text-anchor="middle">dy / dy = 1</text><text x="260" y="165" fill="#64748B" font-size="24" text-anchor="middle">output seed</text><path d="M235 176L235 216L130 216L130 265" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M285 176L285 216L390 216L390 265" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="267" width="180" height="78" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="130" y="306" fill="#059669" font-size="28" text-anchor="middle">dy / dp₁</text><text x="130" y="342" fill="#64748B" font-size="24" text-anchor="middle">= 1</text><rect x="300" y="267" width="180" height="78" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="390" y="306" fill="#059669" font-size="28" text-anchor="middle">dy / dp₂</text><text x="390" y="342" fill="#64748B" font-size="24" text-anchor="middle">= 1</text><path d="M130 346L130 397" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M390 346L390 397" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="399" width="180" height="92" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="130" y="438" fill="#7C3AED" font-size="28" text-anchor="middle">× w₁</text><text x="130" y="474" fill="#64748B" font-size="24" text-anchor="middle">× 3</text><rect x="300" y="399" width="180" height="92" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="390" y="438" fill="#7C3AED" font-size="28" text-anchor="middle">× w₂</text><text x="390" y="474" fill="#64748B" font-size="24" text-anchor="middle">× 4</text><path d="M130 492L130 545" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M390 492L390 545" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="547" width="180" height="90" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="130" y="586" fill="#2563EB" font-size="28" text-anchor="middle">dy / dx₁</text><text x="130" y="622" fill="#64748B" font-size="24" text-anchor="middle">= 3</text><rect x="300" y="547" width="180" height="90" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="390" y="586" fill="#2563EB" font-size="28" text-anchor="middle">dy / dx₂</text><text x="390" y="622" fill="#64748B" font-size="24" text-anchor="middle">= 4</text><text x="260" y="707" fill="#2563EB" font-size="30" text-anchor="middle">∇ₓy = (3, 4)</text><text x="260" y="752" fill="#64748B" font-size="25" text-anchor="middle">Each lane uses its own wᵢ.</text></g></svg>
