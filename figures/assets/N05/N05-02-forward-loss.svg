<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 820" width="520" height="820" role="img"><title>Distinct pre-activation activation and loss nodes</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="820" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="30" text-anchor="start">A neuron, then its loss</text><rect x="60" y="90" width="400" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="129" fill="#7C3AED" font-size="28" text-anchor="middle">Weighted sum + bias</text><text x="260" y="165" fill="#64748B" font-size="24" text-anchor="middle">3 − 0.5 − 0.5</text><path d="M260 181L260 225" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="160" y="227" width="200" height="64" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="266" fill="#059669" font-size="28" text-anchor="middle">z = 2</text><path d="M260 292L260 338" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="160" y="340" width="200" height="64" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="379" fill="#7C3AED" font-size="28" text-anchor="middle">ReLU</text><path d="M260 405L260 451" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="160" y="453" width="200" height="64" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="492" fill="#059669" font-size="28" text-anchor="middle">a = 2</text><path d="M260 518L260 618" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="534" width="140" height="62" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="110" y="573" fill="#D97706" font-size="28" text-anchor="middle">target 1</text><path d="M180 565L210 565L210 618" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="150" y="620" width="270" height="82" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="285" y="659" fill="#7C3AED" font-size="28" text-anchor="middle">Square the error</text><text x="285" y="695" fill="#64748B" font-size="24" text-anchor="middle">(2 − 1)²</text><path d="M285 703L285 743" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="285" y="784" fill="#059669" font-size="30" text-anchor="middle">L = 1</text></g></svg>
