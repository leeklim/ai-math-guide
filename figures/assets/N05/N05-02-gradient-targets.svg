<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1010" width="520" height="1010" role="img"><title>Different differentiation targets share one upstream derivative</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1010" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="30" text-anchor="start">One upstream derivative</text><rect x="150" y="95" width="220" height="85" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="134" fill="#059669" font-size="28" text-anchor="middle">dL / da = 2</text><text x="260" y="170" fill="#64748B" font-size="24" text-anchor="middle">2(a − 1)</text><path d="M260 181L260 225" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="130" y="227" width="260" height="84" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="266" fill="#7C3AED" font-size="28" text-anchor="middle">ReLU slope = 1</text><text x="260" y="302" fill="#64748B" font-size="24" text-anchor="middle">at z = 2</text><path d="M260 312L260 358" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="140" y="360" width="240" height="64" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="399" fill="#059669" font-size="28" text-anchor="middle">dL / dz = 2</text><path d="M230 425L230 465L140 465L140 510" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M290 425L290 465L390 465L390 510" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="512" width="200" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="551" fill="#7C3AED" font-size="28" text-anchor="middle">× x</text><text x="140" y="587" fill="#64748B" font-size="24" text-anchor="middle">× (2, −1)</text><rect x="280" y="512" width="200" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="551" fill="#7C3AED" font-size="28" text-anchor="middle">× w</text><text x="380" y="587" fill="#64748B" font-size="24" text-anchor="middle">× (1.5, 0.5)</text><path d="M140 618L140 669" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M390 618L390 669" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="671" width="200" height="96" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="710" fill="#2563EB" font-size="28" text-anchor="middle">∇w L</text><text x="140" y="746" fill="#64748B" font-size="24" text-anchor="middle">(4, −2)</text><rect x="280" y="671" width="200" height="96" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="380" y="710" fill="#2563EB" font-size="28" text-anchor="middle">∇x L</text><text x="380" y="746" fill="#64748B" font-size="24" text-anchor="middle">(3, 1)</text><text x="40" y="839" fill="#7C3AED" font-size="28" text-anchor="start">Bias branch: × 1</text><text x="40" y="887" fill="#2563EB" font-size="28" text-anchor="start">dL / db = 2</text><text x="40" y="961" fill="#64748B" font-size="25" text-anchor="start">Same upstream, different targets.</text></g></svg>
