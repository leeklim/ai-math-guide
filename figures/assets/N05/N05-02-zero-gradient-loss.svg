<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 800" width="520" height="800" role="img"><title>Equal losses do not imply equal gradients</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="800" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="30" text-anchor="start">Equal loss, different slope</text><text x="140" y="102" fill="#2563EB" font-size="26" text-anchor="middle">b = −0.5</text><text x="390" y="102" fill="#D97706" font-size="26" text-anchor="middle">b = −3</text><rect x="40" y="134" width="200" height="64" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="173" fill="#2563EB" font-size="28" text-anchor="middle">z = 2</text><rect x="290" y="134" width="190" height="64" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="385" y="173" fill="#D97706" font-size="28" text-anchor="middle">z = −0.5</text><path d="M140 199L140 243" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M385 199L385 243" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="245" width="200" height="94" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="140" y="284" fill="#059669" font-size="28" text-anchor="middle">a = 2</text><text x="140" y="320" fill="#64748B" font-size="24" text-anchor="middle">ReLU slope 1</text><rect x="290" y="245" width="190" height="94" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="385" y="284" fill="#059669" font-size="28" text-anchor="middle">a = 0</text><text x="385" y="320" fill="#64748B" font-size="24" text-anchor="middle">ReLU slope 0</text><path d="M140 340L140 389" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M385 340L385 389" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="391" width="200" height="64" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="140" y="430" fill="#059669" font-size="28" text-anchor="middle">L = 1</text><rect x="290" y="391" width="190" height="64" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="385" y="430" fill="#059669" font-size="28" text-anchor="middle">L = 1</text><text x="140" y="516" fill="#64748B" font-size="25" text-anchor="middle">dL / da = 2</text><text x="385" y="516" fill="#64748B" font-size="25" text-anchor="middle">dL / da = −2</text><path d="M140 544L140 590" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M385 544L385 590" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="592" width="200" height="92" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="631" fill="#2563EB" font-size="28" text-anchor="middle">2 × 1 = 2</text><text x="140" y="667" fill="#64748B" font-size="24" text-anchor="middle">dL / dz</text><rect x="290" y="592" width="190" height="92" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="385" y="631" fill="#2563EB" font-size="28" text-anchor="middle">−2 × 0 = 0</text><text x="385" y="667" fill="#64748B" font-size="24" text-anchor="middle">dL / dz</text><text x="40" y="756" fill="#64748B" font-size="24" text-anchor="start">The local factors decide the gradient.</text></g></svg>
