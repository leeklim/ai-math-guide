<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 790" width="520" height="790" role="img"><title>Each weight row computes one neuron</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="790" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="30" text-anchor="start">One row, one neuron</text><rect x="140" y="85" width="280" height="64" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="280" y="124" fill="#2563EB" font-size="28" text-anchor="middle">x = (1, 2)</text><path d="M140 117L75 117L75 668" fill="none" stroke="#2563EB" stroke-width="2.6"/><path d="M75 259L120 259" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="122" y="215" width="350" height="140" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="145" y="253" fill="#7C3AED" font-size="26" text-anchor="start">W₁ row 1: (1, 0)</text><text x="145" y="299" fill="#64748B" font-size="24" text-anchor="start">1 × 1 + 0 × 2 + 0.5</text><text x="145" y="339" fill="#059669" font-size="28" text-anchor="start">z₁ = 1.5</text><path d="M75 439L120 439" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="122" y="395" width="350" height="140" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="145" y="433" fill="#7C3AED" font-size="26" text-anchor="start">W₁ row 2: (0, 1)</text><text x="145" y="479" fill="#64748B" font-size="24" text-anchor="start">0 × 1 + 1 × 2 − 0.5</text><text x="145" y="519" fill="#059669" font-size="28" text-anchor="start">z₂ = 1.5</text><path d="M75 619L120 619" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="122" y="575" width="350" height="140" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="145" y="613" fill="#7C3AED" font-size="26" text-anchor="start">W₁ row 3: (1, −1)</text><text x="145" y="659" fill="#64748B" font-size="24" text-anchor="start">1 × 1 − 1 × 2 + 0</text><text x="145" y="699" fill="#059669" font-size="28" text-anchor="start">z₃ = −1</text></g></svg>
