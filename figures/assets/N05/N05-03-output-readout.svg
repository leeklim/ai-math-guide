<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 845" width="520" height="845" role="img"><title>Signed output weights read nonnegative hidden values</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="845" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="30" text-anchor="start">Read the hidden values</text><rect x="60" y="88" width="400" height="87" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="127" fill="#7C3AED" font-size="28" text-anchor="middle">W₂ = (2, −1, 0.5)</text><text x="260" y="163" fill="#64748B" font-size="24" text-anchor="middle">b₂ = 0.25</text><text x="40" y="234" fill="#2563EB" font-size="26" text-anchor="start">Sample 1: H = (1.5, 1.5, 0)</text><rect x="40" y="265" width="440" height="95" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="304" fill="#7C3AED" font-size="28" text-anchor="middle">3 − 1.5 + 0 + 0.25</text><text x="260" y="340" fill="#64748B" font-size="24" text-anchor="middle">Y₁ = 1.75</text><text x="40" y="490" fill="#2563EB" font-size="26" text-anchor="start">Sample 2: H = (0, 2.5, 0)</text><rect x="40" y="522" width="440" height="95" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="561" fill="#7C3AED" font-size="28" text-anchor="middle">0 − 2.5 + 0 + 0.25</text><text x="260" y="597" fill="#64748B" font-size="24" text-anchor="middle">Y₂ = −2.25</text><path d="M260 361L260 400" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="260" y="430" fill="#059669" font-size="28" text-anchor="middle">Positive output</text><path d="M260 618L260 661" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="260" y="697" fill="#059669" font-size="28" text-anchor="middle">Negative output</text><text x="40" y="796" fill="#64748B" font-size="25" text-anchor="start">No ReLU follows this output layer.</text></g></svg>
