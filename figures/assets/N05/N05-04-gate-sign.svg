<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 900" width="520" height="900" role="img"><title>Gate sign changes the same content</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="900" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="29" text-anchor="start">Same content, opposite signs</text><rect x="140" y="85" width="240" height="86" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="124" fill="#2563EB" font-size="28" text-anchor="middle">g₁ = −1</text><text x="260" y="160" fill="#64748B" font-size="24" text-anchor="middle">gate input</text><path d="M230 172L230 210L140 210L140 259" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M290 172L290 210L390 210L390 259" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="261" width="200" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="300" fill="#7C3AED" font-size="28" text-anchor="middle">sigmoid</text><text x="140" y="336" fill="#64748B" font-size="24" text-anchor="middle">0.2689</text><rect x="280" y="261" width="200" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="300" fill="#7C3AED" font-size="28" text-anchor="middle">SiLU</text><text x="380" y="336" fill="#64748B" font-size="24" text-anchor="middle">−0.2689</text><path d="M140 352L140 474" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M390 352L390 474" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="476" width="200" height="82" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="515" fill="#2563EB" font-size="28" text-anchor="middle">× c₁ = 2</text><rect x="280" y="476" width="200" height="82" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="380" y="515" fill="#2563EB" font-size="28" text-anchor="middle">× c₁ = 2</text><path d="M140 559L140 620" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M390 559L390 620" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="622" width="200" height="93" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="140" y="661" fill="#059669" font-size="28" text-anchor="middle">GLU</text><text x="140" y="697" fill="#64748B" font-size="24" text-anchor="middle">0.5379</text><rect x="280" y="622" width="200" height="93" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="380" y="661" fill="#059669" font-size="28" text-anchor="middle">SwiGLU</text><text x="380" y="697" fill="#64748B" font-size="24" text-anchor="middle">−0.5379</text><text x="40" y="798" fill="#64748B" font-size="26" text-anchor="start">Only matching positions multiply.</text><text x="40" y="850" fill="#64748B" font-size="26" text-anchor="start">A SiLU gate can reverse the sign.</text></g></svg>
