<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 855" width="520" height="855" role="img"><title>Zero output does not erase every local derivative</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="855" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="29" text-anchor="start">Zero content, two derivatives</text><rect x="40" y="94" width="200" height="93" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="133" fill="#2563EB" font-size="28" text-anchor="middle">c = 0</text><text x="140" y="169" fill="#64748B" font-size="24" text-anchor="middle">content</text><rect x="280" y="94" width="200" height="93" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="380" y="133" fill="#2563EB" font-size="28" text-anchor="middle">g = 0</text><text x="380" y="169" fill="#64748B" font-size="24" text-anchor="middle">gate input</text><path d="M380 188L380 237" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="280" y="239" width="200" height="91" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="278" fill="#7C3AED" font-size="28" text-anchor="middle">σ(g) = 0.5</text><text x="380" y="314" fill="#64748B" font-size="24" text-anchor="middle">σ′(g) = 0.25</text><path d="M140 188L140 402L230 402L230 444" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 331L380 402L290 402L290 444" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="135" y="446" width="250" height="91" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="485" fill="#059669" font-size="28" text-anchor="middle">u = cσ(g) = 0</text><text x="40" y="624" fill="#2563EB" font-size="28" text-anchor="start">du / dc = σ(g) = 0.5</text><text x="40" y="682" fill="#7C3AED" font-size="28" text-anchor="start">du / dg = cσ′(g) = 0</text><text x="40" y="766" fill="#64748B" font-size="26" text-anchor="start">Changing c can change u.</text><text x="40" y="811" fill="#64748B" font-size="24" text-anchor="start">Changing g alone cannot, at c = 0.</text></g></svg>
