<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 770" width="520" height="770" role="img"><title>Removing a common logit offset</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="770" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="30" text-anchor="start">Remove a common offset</text><rect x="40" y="100" width="200" height="86" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="139" fill="#2563EB" font-size="28" text-anchor="middle">(2, 1, 0)</text><rect x="280" y="100" width="200" height="86" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="380" y="139" fill="#2563EB" font-size="28" text-anchor="middle">(102,101,100)</text><path d="M140 187L140 236" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 187L380 236" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="238" width="200" height="86" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="277" fill="#7C3AED" font-size="28" text-anchor="middle">Subtract 2</text><text x="140" y="313" fill="#64748B" font-size="24" text-anchor="middle">its maximum</text><rect x="280" y="238" width="200" height="86" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="277" fill="#7C3AED" font-size="28" text-anchor="middle">Subtract 102</text><text x="380" y="313" fill="#64748B" font-size="24" text-anchor="middle">its maximum</text><path d="M140 325L140 382L230 382L230 431" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 325L380 382L290 382L290 431" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="105" y="433" width="310" height="90" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="472" fill="#059669" font-size="28" text-anchor="middle">(0, −1, −2)</text><text x="260" y="508" fill="#64748B" font-size="24" text-anchor="middle">same relative scores</text><path d="M260 524L260 580" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="125" y="582" width="270" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="621" fill="#7C3AED" font-size="28" text-anchor="middle">Same softmax</text><text x="260" y="657" fill="#64748B" font-size="24" text-anchor="middle">same probabilities</text><text x="40" y="736" fill="#64748B" font-size="27" text-anchor="start">Only score differences survive.</text></g></svg>
