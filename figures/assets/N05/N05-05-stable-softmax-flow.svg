<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 830" width="520" height="830" role="img"><title>Stable softmax retains class positions while normalizing</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="830" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="29" text-anchor="start">Exponentiate, then normalize</text><rect x="80" y="98" width="360" height="87" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="137" fill="#2563EB" font-size="28" text-anchor="middle">(0, −1, −2)</text><text x="260" y="173" fill="#64748B" font-size="24" text-anchor="middle">after max subtraction</text><path d="M260 186L260 235" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="100" y="237" width="320" height="64" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="276" fill="#7C3AED" font-size="28" text-anchor="middle">Elementwise exp</text><path d="M260 302L260 350" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="352" width="440" height="92" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="391" fill="#059669" font-size="28" text-anchor="middle">(1, 0.3679, 0.1353)</text><path d="M260 445L260 499" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="80" y="501" width="360" height="91" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="540" fill="#7C3AED" font-size="28" text-anchor="middle">Divide every entry</text><text x="260" y="576" fill="#64748B" font-size="24" text-anchor="middle">by Z ≈ 1.5032</text><path d="M260 593L260 648" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="650" width="440" height="93" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="689" fill="#059669" font-size="28" text-anchor="middle">(0.6652, 0.2447, 0.0900)</text><text x="40" y="801" fill="#64748B" font-size="25" text-anchor="start">Sum p = 1; the class axis remains.</text></g></svg>
