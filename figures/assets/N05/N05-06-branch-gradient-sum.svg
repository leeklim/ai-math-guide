<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 795" width="520" height="795" role="img"><title>Branch derivatives add at a shared input</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="795" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="30" text-anchor="start">Two paths, one input</text><text x="40" y="102" fill="#64748B" font-size="26" text-anchor="start">a = u², b = 3u, L = a + b</text><text x="40" y="150" fill="#2563EB" font-size="28" text-anchor="start">Evaluate at u = 1.</text><rect x="40" y="222" width="200" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="261" fill="#7C3AED" font-size="28" text-anchor="middle">a path</text><text x="140" y="297" fill="#64748B" font-size="24" text-anchor="middle">1 × 2u = 2</text><rect x="280" y="222" width="200" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="261" fill="#7C3AED" font-size="28" text-anchor="middle">b path</text><text x="380" y="297" fill="#64748B" font-size="24" text-anchor="middle">1 × 3 = 3</text><path d="M140 313L140 385L230 385L230 442" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 313L380 385L290 385L290 442" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="120" y="444" width="280" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="483" fill="#7C3AED" font-size="28" text-anchor="middle">Add contributions</text><text x="260" y="519" fill="#64748B" font-size="24" text-anchor="middle">2 + 3</text><path d="M260 535L260 597" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="125" y="599" width="270" height="90" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="638" fill="#2563EB" font-size="28" text-anchor="middle">dL / du = 5</text><text x="40" y="753" fill="#64748B" font-size="25" text-anchor="start">Add paths; multiply within a path.</text></g></svg>
