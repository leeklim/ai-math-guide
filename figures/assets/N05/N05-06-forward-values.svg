<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 900" width="520" height="900" role="img"><title>Forward scalar values stored for backward</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="900" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="30" text-anchor="start">Forward values</text><text x="40" y="100" fill="#2563EB" font-size="27" text-anchor="start">x = 2, w = 1, b = −1</text><rect x="95" y="142" width="330" height="90" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="181" fill="#059669" font-size="28" text-anchor="middle">z = wx + b = 1</text><text x="260" y="217" fill="#64748B" font-size="24" text-anchor="middle">save z</text><path d="M260 233L260 280" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="95" y="282" width="330" height="90" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="321" fill="#059669" font-size="28" text-anchor="middle">h = z² = 1</text><text x="260" y="357" fill="#64748B" font-size="24" text-anchor="middle">save h</text><path d="M260 373L260 430" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="95" y="432" width="330" height="90" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="471" fill="#059669" font-size="28" text-anchor="middle">ŷ = vh + c = 3</text><text x="260" y="507" fill="#64748B" font-size="24" text-anchor="middle">v = 3, c = 0</text><path d="M260 523L260 648" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="552" width="130" height="62" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="105" y="591" fill="#D97706" font-size="28" text-anchor="middle">y = 1</text><path d="M170 583L205 583L205 648" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="85" y="650" width="350" height="94" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="689" fill="#059669" font-size="28" text-anchor="middle">L = (ŷ − y)² = 4</text><text x="40" y="803" fill="#64748B" font-size="26" text-anchor="start">Backward uses these fixed values.</text><text x="40" y="851" fill="#64748B" font-size="26" text-anchor="start">It does not recover an inverse.</text></g></svg>
