<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 810" width="520" height="810" role="img"><title>Repeated backward calls accumulate grad but do not update a parameter</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="810" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="30" text-anchor="start">Accumulate gradients</text><text x="40" y="103" fill="#64748B" font-size="25" text-anchor="start">Recompute the same forward graph.</text><rect x="40" y="145" width="200" height="85" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="184" fill="#2563EB" font-size="28" text-anchor="middle">w = 1</text><text x="140" y="220" fill="#64748B" font-size="24" text-anchor="middle">parameter</text><rect x="280" y="145" width="200" height="85" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="380" y="184" fill="#D97706" font-size="28" text-anchor="middle">w.grad = 0</text><text x="380" y="220" fill="#64748B" font-size="24" text-anchor="middle">explicit zero</text><path d="M140 231L140 377" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 231L380 377" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><text x="250" y="293" fill="#7C3AED" font-size="25" text-anchor="middle">Backward 1</text><text x="250" y="334" fill="#7C3AED" font-size="25" text-anchor="middle">contribution +48</text><rect x="40" y="379" width="200" height="85" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="418" fill="#2563EB" font-size="28" text-anchor="middle">w = 1</text><rect x="280" y="379" width="200" height="85" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="380" y="418" fill="#D97706" font-size="28" text-anchor="middle">w.grad = 48</text><path d="M140 465L140 613" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 465L380 613" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><text x="250" y="529" fill="#7C3AED" font-size="25" text-anchor="middle">Backward 2</text><text x="250" y="570" fill="#7C3AED" font-size="25" text-anchor="middle">contribution +48</text><rect x="40" y="615" width="200" height="85" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="654" fill="#2563EB" font-size="28" text-anchor="middle">w = 1</text><rect x="280" y="615" width="200" height="85" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="380" y="654" fill="#D97706" font-size="28" text-anchor="middle">w.grad = 96</text><text x="40" y="771" fill="#64748B" font-size="26" text-anchor="start">No optimizer step is performed.</text></g></svg>
