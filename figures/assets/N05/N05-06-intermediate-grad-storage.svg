<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 845" width="520" height="845" role="img"><title>Derivative propagation differs from optional storage</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="845" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="30" text-anchor="start">Compute versus store</text><rect x="60" y="100" width="400" height="90" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="139" fill="#059669" font-size="28" text-anchor="middle">Intermediate z</text><text x="260" y="175" fill="#64748B" font-size="24" text-anchor="middle">adjoint z̄ = 24 is computed</text><path d="M140 191L140 423" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M360 191L360 258" fill="none" stroke="#D97706" stroke-width="2.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="250" y="260" width="230" height="103" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="365" y="299" fill="#D97706" font-size="28" text-anchor="middle">Store z̄?</text><text x="365" y="335" fill="#64748B" font-size="24" text-anchor="middle">optional record</text><path d="M360 364L360 423" fill="none" stroke="#D97706" stroke-width="2.6" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="40" y="425" width="200" height="115" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="464" fill="#7C3AED" font-size="28" text-anchor="middle">Use z̄ · w</text><text x="140" y="500" fill="#64748B" font-size="24" text-anchor="middle">x.grad = 24</text><rect x="270" y="425" width="210" height="115" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="375" y="464" fill="#D97706" font-size="28" text-anchor="middle">z.grad</text><text x="375" y="500" fill="#64748B" font-size="24" text-anchor="middle">None by default</text><text x="40" y="623" fill="#64748B" font-size="26" text-anchor="start">Propagation does not wait for</text><text x="40" y="665" fill="#64748B" font-size="26" text-anchor="start">intermediate .grad storage.</text><text x="40" y="751" fill="#D97706" font-size="25" text-anchor="start">With optional record: z.grad = 24</text></g></svg>
