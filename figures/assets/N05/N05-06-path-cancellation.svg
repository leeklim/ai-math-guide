<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 620" width="520" height="620" role="img"><title>Nonzero paths can cancel in the total derivative</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="620" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="30" text-anchor="start">Paths can cancel</text><text x="40" y="107" fill="#64748B" font-size="26" text-anchor="start">a = u, b = −u; L = a + b</text><rect x="40" y="185" width="200" height="92" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="224" fill="#7C3AED" font-size="28" text-anchor="middle">a path</text><text x="140" y="260" fill="#64748B" font-size="24" text-anchor="middle">+1</text><rect x="280" y="185" width="200" height="92" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="224" fill="#7C3AED" font-size="28" text-anchor="middle">b path</text><text x="380" y="260" fill="#64748B" font-size="24" text-anchor="middle">−1</text><path d="M140 278L140 327L230 327L230 375" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 278L380 327L290 327L290 375" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="125" y="377" width="270" height="95" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="416" fill="#2563EB" font-size="28" text-anchor="middle">dL / du = 0</text><text x="260" y="452" fill="#64748B" font-size="24" text-anchor="middle">1 + (−1)</text><text x="40" y="565" fill="#64748B" font-size="27" text-anchor="start">Both paths remain connected.</text></g></svg>
