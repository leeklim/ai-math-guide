<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 950" width="520" height="950" role="img"><title>Changing parameters changes the next sample gradient</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="950" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28" text-anchor="start">Keep the evaluation point fixed</text><rect x="140" y="88" width="240" height="86" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="127" fill="#2563EB" font-size="28" text-anchor="middle">θ = (0, 0)</text><path d="M230 175L230 221L140 221L140 269" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M290 175L290 221L390 221L390 269" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="271" width="200" height="102" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="140" y="310" fill="#059669" font-size="28" text-anchor="middle">Sample 1</text><text x="140" y="346" fill="#64748B" font-size="24" text-anchor="middle">(−6, −6)</text><rect x="280" y="271" width="200" height="102" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="380" y="310" fill="#059669" font-size="28" text-anchor="middle">Sample 2</text><text x="380" y="346" fill="#64748B" font-size="24" text-anchor="middle">(−20, −10)</text><text x="40" y="436" fill="#64748B" font-size="24" text-anchor="start">These two gradients can be averaged.</text><path d="M40 482L480 482" fill="none" stroke="#CBD5E1" stroke-width="1.5"/><text x="40" y="534" fill="#D97706" font-size="27" text-anchor="start">If sample 1 updates θ first:</text><rect x="95" y="576" width="330" height="86" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="615" fill="#2563EB" font-size="28" text-anchor="middle">θ = (0.6, 0.6)</text><text x="260" y="651" fill="#64748B" font-size="24" text-anchor="middle">after −0.1(−6, −6)</text><path d="M260 663L260 716" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="718" width="400" height="102" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="757" fill="#059669" font-size="28" text-anchor="middle">Sample 2 at the new θ</text><text x="260" y="793" fill="#64748B" font-size="24" text-anchor="middle">gradient (−12.8, −6.4)</text><text x="40" y="903" fill="#64748B" font-size="25" text-anchor="start">Prediction 1.8 gives residual −3.2.</text></g></svg>
