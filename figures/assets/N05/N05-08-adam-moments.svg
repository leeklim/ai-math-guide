<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1050" width="520" height="1050" role="img"><title>Adam first step has two different moment routes</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1050" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28" text-anchor="start">Two moments from one gradient</text><rect x="145" y="90" width="230" height="80" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="129" fill="#2563EB" font-size="28" text-anchor="middle">g₁ = 3</text><path d="M230 171L230 218L140 218L140 265" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M290 171L290 218L390 218L390 265" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="267" width="200" height="115" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="306" fill="#7C3AED" font-size="28" text-anchor="middle">× 0.1</text><text x="140" y="342" fill="#64748B" font-size="24" text-anchor="middle">m₁ = 0.3</text><rect x="280" y="267" width="200" height="115" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="306" fill="#7C3AED" font-size="28" text-anchor="middle">g₁² = 9</text><text x="380" y="341" fill="#64748B" font-size="26" text-anchor="middle">× 0.001</text><text x="380" y="374" fill="#059669" font-size="26" text-anchor="middle">v₁ = 0.009</text><path d="M140 383L140 441" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 383L380 441" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="443" width="200" height="110" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="482" fill="#7C3AED" font-size="28" text-anchor="middle">÷ 0.1</text><text x="140" y="518" fill="#64748B" font-size="24" text-anchor="middle">m̂₁ = 3</text><rect x="280" y="443" width="200" height="110" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="482" fill="#7C3AED" font-size="28" text-anchor="middle">÷ 0.001</text><text x="380" y="518" fill="#64748B" font-size="24" text-anchor="middle">v̂₁ = 9</text><path d="M140 554L140 625L230 625L230 672" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 554L380 625L290 625L290 672" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="90" y="674" width="340" height="91" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="713" fill="#7C3AED" font-size="28" text-anchor="middle">m̂₁ / √v̂₁ = 1</text><path d="M260 766L260 826" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="90" y="828" width="340" height="95" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="867" fill="#059669" font-size="28" text-anchor="middle">η × 1 = 0.1</text><text x="260" y="903" fill="#64748B" font-size="24" text-anchor="middle">η = 0.1; ε negligible</text><text x="40" y="1000" fill="#64748B" font-size="26" text-anchor="start">v tracks squares, not variance.</text></g></svg>
