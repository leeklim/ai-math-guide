<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1130" width="520" height="1130" role="img"><title>L2 gradient and decoupled decay enter at different places</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1130" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28" text-anchor="start">Where decay enters the update</text><text x="40" y="105" fill="#D97706" font-size="28" text-anchor="start">L2 in the loss</text><rect x="90" y="145" width="340" height="87" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="184" fill="#2563EB" font-size="28" text-anchor="middle">g + λθ</text><path d="M260 233L260 280" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="90" y="282" width="340" height="87" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="321" fill="#7C3AED" font-size="28" text-anchor="middle">Moment state</text><text x="260" y="357" fill="#64748B" font-size="24" text-anchor="middle">includes λθ</text><path d="M260 370L260 417" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="90" y="419" width="340" height="87" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="458" fill="#059669" font-size="28" text-anchor="middle">Adaptive update</text><path d="M40 554L480 554" fill="none" stroke="#CBD5E1" stroke-width="1.5"/><text x="40" y="612" fill="#D97706" font-size="28" text-anchor="start">AdamW: decoupled</text><rect x="60" y="657" width="220" height="76" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="170" y="696" fill="#2563EB" font-size="28" text-anchor="middle">Loss gradient g</text><path d="M170 734L170 778" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="780" width="220" height="88" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="170" y="819" fill="#7C3AED" font-size="28" text-anchor="middle">Moment state</text><text x="170" y="855" fill="#64748B" font-size="24" text-anchor="middle">loss g only</text><path d="M170 869L170 928" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="930" width="400" height="91" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="969" fill="#059669" font-size="28" text-anchor="middle">Parameter update</text><text x="260" y="1005" fill="#64748B" font-size="24" text-anchor="middle">subtract adaptive + decay</text><rect x="325" y="695" width="155" height="101" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="402.5" y="734" fill="#D97706" font-size="28" text-anchor="middle">ηλθ</text><text x="402.5" y="770" fill="#64748B" font-size="24" text-anchor="middle">decay</text><path d="M402 797L402 926" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><text x="40" y="1089" fill="#64748B" font-size="24" text-anchor="start">Decay enters at different points.</text></g></svg>
