<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 890" width="520" height="890" role="img"><title>Rounding before cancellation cannot be repaired by later casting</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="890" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="29" text-anchor="start">Rounding, then cancellation</text><rect x="65" y="94" width="390" height="85" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="133" fill="#2563EB" font-size="28" text-anchor="middle">Requested 10⁸ + 1</text><path d="M230 180L230 226L140 226L140 272" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M290 180L290 226L390 226L390 272" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="274" width="200" height="112" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="313" fill="#7C3AED" font-size="28" text-anchor="middle">float32</text><text x="140" y="349" fill="#64748B" font-size="24" text-anchor="middle">100000000</text><rect x="280" y="274" width="200" height="112" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="313" fill="#7C3AED" font-size="28" text-anchor="middle">float64</text><text x="380" y="349" fill="#64748B" font-size="24" text-anchor="middle">100000001</text><path d="M140 387L140 439" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 387L380 439" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="441" width="200" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="480" fill="#7C3AED" font-size="28" text-anchor="middle">Subtract 10⁸</text><rect x="280" y="441" width="200" height="90" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="480" fill="#7C3AED" font-size="28" text-anchor="middle">Subtract 10⁸</text><path d="M140 532L140 587" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 532L380 587" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="589" width="200" height="85" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="140" y="628" fill="#059669" font-size="28" text-anchor="middle">Result 0</text><rect x="280" y="589" width="200" height="85" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="380" y="628" fill="#059669" font-size="28" text-anchor="middle">Result 1</text><text x="40" y="760" fill="#64748B" font-size="24" text-anchor="start">Cast after rounding keeps 100000000.</text><text x="40" y="820" fill="#64748B" font-size="25" text-anchor="start">Higher precision cannot restore +1.</text></g></svg>
