<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 850" width="520" height="850" role="img"><title>Two derivative routes give the same scalar</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="850" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28" text-anchor="start">Same scalar, different routes</text><rect x="65" y="87" width="390" height="82" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="126" fill="#2563EB" font-size="28" text-anchor="middle">Input r = (1, −1)</text><path d="M260 169L260 224" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="226" width="390" height="86" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="265" fill="#059669" font-size="28" text-anchor="middle">Jr = (1, 3)</text><path d="M260 312L260 370" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="372" width="390" height="92" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="260" y="411" fill="#D97706" font-size="28" text-anchor="middle">Pair with u = (2, −1)</text><text x="260" y="447" fill="#64748B" font-size="24" text-anchor="middle">2 × 1 − 1 × 3 = −1</text><text x="40" y="534" fill="#7C3AED" font-size="28" text-anchor="start">Pull u back instead</text><rect x="65" y="568" width="390" height="85" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="607" fill="#7C3AED" font-size="28" text-anchor="middle">Jᵀu = (2, 3)</text><path d="M260 653L260 711" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="713" width="390" height="94" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="260" y="752" fill="#D97706" font-size="28" text-anchor="middle">Pair with r = (1, −1)</text><text x="260" y="788" fill="#64748B" font-size="24" text-anchor="middle">2 × 1 + 3 × (−1) = −1</text></g></svg>
