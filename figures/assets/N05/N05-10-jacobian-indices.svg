<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 630" width="520" height="630" role="img"><title>Jacobian output rows and input columns</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="630" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28" text-anchor="start">Rows: outputs; columns: inputs</text><text x="40" y="100" fill="#2563EB" font-size="28" text-anchor="start">At x = (2, 3)</text><text x="240" y="180" fill="#2563EB" font-size="28" text-anchor="middle">x₁</text><text x="340" y="180" fill="#2563EB" font-size="28" text-anchor="middle">x₂</text><text x="105" y="245" fill="#059669" font-size="28" text-anchor="start">f₁</text><text x="105" y="313" fill="#059669" font-size="28" text-anchor="start">f₂</text><rect x="194" y="204" width="92" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="240" y="242" fill="#D97706" font-size="28" text-anchor="middle">3</text><rect x="294" y="204" width="92" height="60" rx="8" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="340" y="242" fill="#7C3AED" font-size="28" text-anchor="middle">2</text><rect x="194" y="272" width="92" height="60" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="240" y="310" fill="#D97706" font-size="28" text-anchor="middle">4</text><rect x="294" y="272" width="92" height="60" rx="8" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="340" y="310" fill="#7C3AED" font-size="28" text-anchor="middle">1</text><text x="40" y="410" fill="#D97706" font-size="26" text-anchor="start">Column 1: x₁ only → (3, 4)</text><text x="40" y="465" fill="#059669" font-size="27" text-anchor="start">Row 1: inputs → f₁</text><text x="40" y="516" fill="#7C3AED" font-size="28" text-anchor="start">df₁ = 3 dx₁ + 2 dx₂</text><text x="40" y="585" fill="#64748B" font-size="24" text-anchor="start">These entries are rates, not f(x).</text></g></svg>
