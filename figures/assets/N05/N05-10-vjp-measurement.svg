<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 900" width="520" height="900" role="img"><title>VJP pulls a scalar measurement derivative back</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="900" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28" text-anchor="start">Choose a scalar measurement</text><rect x="65" y="88" width="390" height="90" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="260" y="127" fill="#D97706" font-size="28" text-anchor="middle">q = 2f₁ − f₂</text><text x="260" y="163" fill="#64748B" font-size="24" text-anchor="middle">u is fixed: (2, −1)</text><path d="M230 178L230 215L140 215L140 258" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M290 178L290 215L380 215L380 258" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="260" width="200" height="96" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="299" fill="#7C3AED" font-size="28" text-anchor="middle">2 × row 1</text><text x="140" y="335" fill="#64748B" font-size="24" text-anchor="middle">2 × (3, 2)</text><rect x="280" y="260" width="200" height="96" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="299" fill="#7C3AED" font-size="28" text-anchor="middle">−1 × row 2</text><text x="380" y="335" fill="#64748B" font-size="24" text-anchor="middle">−1 × (4, 1)</text><path d="M140 356L140 413" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 356L380 413" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="415" width="200" height="82" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="454" fill="#7C3AED" font-size="28" text-anchor="middle">(6, 4)</text><rect x="280" y="415" width="200" height="82" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="454" fill="#7C3AED" font-size="28" text-anchor="middle">(−4, −1)</text><path d="M140 497L140 544L232 544L232 590" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 497L380 544L288 544L288 590" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="592" width="390" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="631" fill="#059669" font-size="28" text-anchor="middle">Input gradient: (2, 3)</text><text x="260" y="667" fill="#64748B" font-size="24" text-anchor="middle">Add at each input coordinate</text><text x="40" y="767" fill="#059669" font-size="28" text-anchor="start">dq = 2 dx₁ + 3 dx₂</text><text x="40" y="836" fill="#64748B" font-size="24" text-anchor="start">Row uᵀJ and column Jᵀu agree.</text></g></svg>
