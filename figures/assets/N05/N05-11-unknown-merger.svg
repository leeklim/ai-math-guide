<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" width="520" height="760" role="img"><title>Unknown mapping loses the original distinction</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="760" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="29" text-anchor="start">Unknown words merge</text><rect x="40" y="100" width="200" height="130" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="139" fill="#2563EB" font-size="28" text-anchor="middle">ocean</text><text x="140" y="175" fill="#64748B" font-size="24" text-anchor="middle">Unregistered</text><rect x="280" y="100" width="200" height="130" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="380" y="139" fill="#2563EB" font-size="25" text-anchor="middle">Other unknown</text><text x="380" y="178" fill="#2563EB" font-size="28" text-anchor="middle">word</text><path d="M140 230L140 272L230 272L230 325" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 230L380 272L290 272L290 325" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="85" y="327" width="350" height="105" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="366" fill="#059669" font-size="28" text-anchor="middle">&lt;unk&gt;: ID 0</text><text x="260" y="402" fill="#64748B" font-size="24" text-anchor="middle">No original-word field</text><path d="M260 432L260 505" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="507" width="390" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="546" fill="#7C3AED" font-size="28" text-anchor="middle">decode(0) → &lt;unk&gt;</text><text x="40" y="681" fill="#64748B" font-size="25" text-anchor="start">Cannot choose the original word.</text></g></svg>
