<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 885" width="520" height="885" role="img"><title>Repeated lookup positions share one gradient destination</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="885" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28" text-anchor="start">Two positions, one learned row</text><rect x="40" y="101" width="200" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="140" fill="#2563EB" font-size="28" text-anchor="middle">Position 0</text><text x="140" y="176" fill="#64748B" font-size="24" text-anchor="middle">ID 2</text><rect x="280" y="101" width="200" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="380" y="140" fill="#2563EB" font-size="28" text-anchor="middle">Position 1</text><text x="380" y="176" fill="#64748B" font-size="24" text-anchor="middle">ID 2</text><path d="M140 201L140 264" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 201L380 264" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="266" width="200" height="105" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="140" y="305" fill="#059669" font-size="28" text-anchor="middle">Hidden 0</text><text x="140" y="341" fill="#64748B" font-size="24" text-anchor="middle">E[2]</text><rect x="280" y="266" width="200" height="105" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="380" y="305" fill="#059669" font-size="28" text-anchor="middle">Hidden 1</text><text x="380" y="341" fill="#64748B" font-size="24" text-anchor="middle">E[2]</text><text x="40" y="449" fill="#7C3AED" font-size="26" text-anchor="start">Back to the shared parameter</text><path d="M140 478L140 532L230 532L230 594" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 478L380 532L290 532L290 594" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="90" y="516" fill="#7C3AED" font-size="28" text-anchor="start">g₀</text><text x="401" y="516" fill="#7C3AED" font-size="28" text-anchor="start">g₁</text><rect x="65" y="596" width="390" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="635" fill="#7C3AED" font-size="28" text-anchor="middle">Gradient of E row 2</text><text x="260" y="671" fill="#64748B" font-size="24" text-anchor="middle">g₀ + g₁</text><text x="40" y="791" fill="#64748B" font-size="24" text-anchor="start">Only lookup contributions are shown.</text><text x="40" y="846" fill="#64748B" font-size="24" text-anchor="start">Other lookup rows: direct gradient 0</text></g></svg>
