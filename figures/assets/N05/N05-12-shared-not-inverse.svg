<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 865" width="520" height="865" role="img"><title>Shared weights still do not invert lookup</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="865" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="29" text-anchor="start">Tying is not an inverse</text><rect x="65" y="95" width="390" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="134" fill="#2563EB" font-size="28" text-anchor="middle">One-hot ID 0</text><text x="260" y="170" fill="#64748B" font-size="24" text-anchor="middle">(1, 0, 0, 0)</text><path d="M260 195L260 256" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="258" width="390" height="92" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="297" fill="#7C3AED" font-size="28" text-anchor="middle">Eᵀ lookup</text><text x="260" y="333" fill="#64748B" font-size="24" text-anchor="middle">Hidden: (1, 0, 0)</text><path d="M260 350L260 412" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="414" width="390" height="95" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="453" fill="#7C3AED" font-size="28" text-anchor="middle">Shared E readout</text><text x="260" y="489" fill="#64748B" font-size="24" text-anchor="middle">Logits: (1, 0, 0, 1)</text><text x="40" y="603" fill="#059669" font-size="27" text-anchor="start">Row 0: (1, 0, 0) · h = 1</text><text x="40" y="657" fill="#059669" font-size="27" text-anchor="start">Row 3: (1, 1, 0) · h = 1</text><text x="40" y="747" fill="#64748B" font-size="25" text-anchor="start">Both rows respond to this hidden.</text><text x="40" y="807" fill="#64748B" font-size="26" text-an