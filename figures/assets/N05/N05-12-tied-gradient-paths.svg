<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 915" width="520" height="915" role="img"><title>Untied and tied gradient destinations</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="915" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28" text-anchor="start">Different parameter ownership</text><text x="40" y="112" fill="#7C3AED" font-size="28" text-anchor="start">Untied: two tables</text><rect x="40" y="157" width="200" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="196" fill="#2563EB" font-size="28" text-anchor="middle">Lookup</text><text x="140" y="232" fill="#64748B" font-size="24" text-anchor="middle">Rows 0 and 2</text><rect x="280" y="157" width="200" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="380" y="196" fill="#059669" font-size="28" text-anchor="middle">Readout</text><text x="380" y="232" fill="#64748B" font-size="24" text-anchor="middle">All candidates</text><path d="M140 257L140 316" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 257L380 316" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="318" width="200" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="357" fill="#7C3AED" font-size="28" text-anchor="middle">E gradient</text><text x="140" y="393" fill="#64748B" font-size="24" text-anchor="middle">Rows 1, 3: 0</text><rect x="280" y="318" width="200" height="105" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="357" fill="#7C3AED" font-size="28" text-anchor="middle">U gradient</text><text x="380" y="393" fill="#64748B" font-size="24" text-anchor="middle">Separate tensor</text><text x="40" y="506" fill="#7C3AED" font-size="28" text-anchor="start">Tied: one table</text><rect x="40" y="549" width="200" height="94" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="588" fill="#2563EB" font-size="28" text-anchor="middle">Lookup path</text><rect x="280" y="549" width="200" height="94" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="380" y="588" fill="#059669" font-size="28" text-anchor="middle">Readout path</text><path d="M140 643L140 690L230 690L230 741" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 643L380 690L290 690L290 741" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="743" width="390" height="100" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="782" fill="#7C3AED" font-size="28" text-anchor="middle">Shared-table gradient</text><text x="260" y="818" fill="#64748B" font-size="24" text-anchor="middle">Lookup + readout</text></g></svg>
