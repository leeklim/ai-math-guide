<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 905" width="520" height="905" role="img"><title>Separate feature pairs have separate rotations</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="905" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="27" text-anchor="start">Mix inside pairs, not across pairs</text><rect x="65" y="95" width="390" height="92" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="134" fill="#2563EB" font-size="28" text-anchor="middle">Input: (1, 0 | 0, 1)</text><path d="M230 187L230 225L140 225L140 276" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M290 187L290 225L380 225L380 276" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="278" width="200" height="98" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="317" fill="#2563EB" font-size="28" text-anchor="middle">Pair 1</text><text x="140" y="353" fill="#64748B" font-size="24" text-anchor="middle">(1, 0)</text><rect x="280" y="278" width="200" height="98" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="380" y="317" fill="#2563EB" font-size="28" text-anchor="middle">Pair 2</text><text x="380" y="353" fill="#64748B" font-size="24" text-anchor="middle">(0, 1)</text><path d="M140 376L140 436" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 376L380 436" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="438" width="200" height="104" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="477" fill="#7C3AED" font-size="28" text-anchor="middle">R(1)</text><text x="140" y="513" fill="#64748B" font-size="24" text-anchor="middle">ω₁ = 1</text><rect x="280" y="438" width="200" height="104" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="380" y="477" fill="#7C3AED" font-size="28" text-anchor="middle">R(0.01)</text><text x="380" y="513" fill="#64748B" font-size="24" text-anchor="middle">ω₂ = 0.01</text><path d="M140 542L140 600" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 542L380 600" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="602" width="200" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="140" y="641" fill="#059669" font-size="28" text-anchor="middle">cos 1</text><text x="140" y="681" fill="#059669" font-size="28" text-anchor="middle">sin 1</text><rect x="280" y="602" width="200" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="380" y="641" fill="#059669" font-size="28" text-anchor="middle">−sin 0.01</text><text x="380" y="681" fill="#059669" font-size="28" text-anchor="middle">cos 0.01</text><text x="40" y="799" fill="#059669" font-size="26" text-anchor="start">Join pairs in the original order.</text><text x="40" y="863" fill="#64748B" font-size="26" text-anchor="start">Position p = 1 for both pairs.</text></g></svg>
