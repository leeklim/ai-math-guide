<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 955" width="520" height="955" role="img"><title>Addition and rotary positions enter at different locations</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="955" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="29" text-anchor="start">Different places for position</text><text x="40" y="105" fill="#7C3AED" font-size="28" text-anchor="start">Absolute addition</text><rect x="40" y="145" width="200" height="98" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="184" fill="#2563EB" font-size="28" text-anchor="middle">Token lookup</text><rect x="280" y="145" width="200" height="98" rx="8" fill="white" stroke="#D97706" stroke-width="2"/><text x="380" y="184" fill="#D97706" font-size="28" text-anchor="middle">Position</text><text x="380" y="220" fill="#D97706" font-size="28" text-anchor="middle">vector</text><path d="M140 243L140 280L230 280L230 333" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 243L380 280L290 280L290 333" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="95" y="335" width="330" height="83" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="374" fill="#7C3AED" font-size="28" text-anchor="middle">Add, then later layers</text><text x="40" y="499" fill="#7C3AED" font-size="29" text-anchor="start">RoPE</text><rect x="65" y="540" width="390" height="90" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="579" fill="#2563EB" font-size="28" text-anchor="middle">Q / K projections</text><text x="260" y="615" fill="#64748B" font-size="24" text-anchor="middle">From hidden</text><path d="M260 630L260 688" fill="none" stroke="#7C