dle">Q / K hooks</text><path d="M140 572L140 631" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="633" width="200" height="105" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="140" y="672" fill="#059669" font-size="28" text-anchor="middle">Scores</text><text x="140" y="708" fill="#64748B" font-size="24" text-anchor="middle">Then weights</text><path d="M140 738L140 811L230 811L230 873" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 406L380 811L290 811L290 873" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="875" width="390" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="914" fill="#059669" font-size="28" text-anchor="middle">Weighted sum with V</text><text x="40" y="1046" fill="#64748B" font-size="26" text-anchor="start">The V branch bypasses RoPE.</text></g></svg>
