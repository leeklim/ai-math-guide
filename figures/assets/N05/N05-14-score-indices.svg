<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" width="520" height="760" role="img"><title>Raw score matrix query rows and key columns</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="760" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="29" text-anchor="start">Compare two position indices</text><text x="160" y="109" fill="#7C3AED" font-size="28" text-anchor="start">Key position j</text><text x="230" y="175" fill="#64748B" font-size="28" text-anchor="middle">0</text><text x="378" y="175" fill="#64748B" font-size="28" text-anchor="middle">1</text><text x="100" y="261" fill="#64748B" font-size="28" text-anchor="middle">0</text><text x="100" y="369" fill="#64748B" font-size="28" text-anchor="middle">1</text><rect x="160" y="204" width="140" height="100" rx="8" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="230" y="263" fill="#059669" font-size="30" text-anchor="middle">1</text><rect x="308" y="204" width="140" height="100" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/><text x="378" y="263" fill="#D97706" font-size="30" text-anchor="middle">5</text><rect x="160" y="312" width="140" height="100" rx="8" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="230" y="371" fill="#059669" font-size="30" text-anchor="middle">5</text><rect x="308" y="312" width="140" height="100" rx="8" fill="white" stroke="#CBD5E1" stroke-width="2"/><text x="378" y="371" fill="#059669" font-size="30" text-anchor="middle">17</text><text x="40" y="480" fill="#2563EB" font-size="27" text-anchor="start">Row index: query position i</text><text x="40" y="555" fill="#D97706" font-size="27" text-anchor="start">q₀ = (1, 2); k₁ = (7, −1)</text><text x="40" y="613" fill="#D97706" font-size="28" text-anchor="start">1 ×