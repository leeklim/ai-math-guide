<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 820" width="520" height="820" role="img"><title>One projection weight is reused for each token</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="820" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="40" y="45" fill="#0F172A" font-size="28" text-anchor="start">Reuse weights, keep token rows</text><rect x="40" y="105" width="200" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="140" y="144" fill="#2563EB" font-size="28" text-anchor="middle">Position 0</text><text x="140" y="180" fill="#64748B" font-size="24" text-anchor="middle">h₀ = (1, 2)</text><rect x="280" y="105" width="200" height="100" rx="8" fill="white" stroke="#2563EB" stroke-width="2"/><text x="380" y="144" fill="#2563EB" font-size="28" text-anchor="middle">Position 1</text><text x="380" y="180" fill="#64748B" font-size="24" text-anchor="middle">h₁ = (3, 4)</text><path d="M140 205L140 266" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 205L380 266" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="268" width="200" height="145" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><rect x="280" y="268" width="200" height="145" rx="8" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="140" y="307" fill="#7C3AED" font-size="28" text-anchor="middle">W_K</text><text x="380" y="307" fill="#7C3AED" font-size="28" text-anchor="middle">W_K</text><text x="140" y="351" fill="#7C3AED" font-size="26" text-anchor="middle">(1, 1)</text><text x="380" y="351" fill="#7C3AED" font-size="26" text-anchor="middle">(1, 1)</text><text x="140" y="389" fill="#7C3AED" font-size="26" text-anchor="middle">(1, −1)</text><text x="380" y="389" fill="#7C3AED" font-size="26" text-anchor="middle">(1, −1)</text><path d="M140 413L140 482" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M380 413L380 482" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="40" y="484" width="200" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="140" y="523" fill="#059669" font-size="28" text-anchor="middle">k₀</text><text x="140" y="559" fill="#64748B" font-size="24" text-anchor="middle">(3, −1)</text><rect x="280" y="484" width="200" height="100" rx="8" fill="white" stroke="#059669" stroke-width="2"/><text x="380" y="523" fill="#059669" font-size="28" text-anchor="middle">k₁</text><text x="380" y="559" fill="#64748B" font-size="24" text-anchor="middle">(7, −1)</text><text x="40" y="677" fill="#64748B" font-size="24" text-anchor="start">Each row sums model features only.</text><text x="40" y="735" fill="#7C3AED" font-size="26" text-anchor="start">The two W_K boxes mean reuse,</text><text x="40" y="784" fill="#7C3AED" font-size="26" text-anchor="start">not two independent parameters.</text></g></svg>
