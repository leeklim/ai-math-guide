<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">Shape-aware causal attention pipeline</title>
  <desc id="desc">Five separated stages show score computation, scaling, causal masking, row-wise softmax, and value mixing, with matrix shapes below each stage.</desc>
  <defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
  <rect width="1080" height="360" rx="18" fill="#F8FAFC"/>
  <text x="540" y="46" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F172A">Causal scaled dot-product attention</text>

  <g font-family="sans-serif" text-anchor="middle">
    <rect x="45" y="100" width="160" height="156" rx="16" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="125" y="138" font-size="20" font-weight="700" fill="#1E3A8A">Scores</text><text x="125" y="180" font-size="25" fill="#1E3A8A">QKᵀ</text><text x="125" y="222" font-size="17" fill="#334155">T × T</text>

    <rect x="255" y="100" width="160" height="156" rx="16" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
    <text x="335" y="138" font-size="20" font-weight="700" fill="#5B21B6">Scale</text><text x="335" y="180" font-size="25" fill="#5B21B6">÷ √dₖ</text><text x="335" y="222" font-size="17" fill="#334155">T × T scores</text>

    <rect x="465" y="100" width="160" height="156" rx="16" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="545" y="138" font-size="20" font-weight="700" fill="#78350F">Causal mask</text><text x="545" y="180" font-size="25" fill="#78350F">+ M</text><text x="545" y="222" font-size="17" fill="#334155">future → −∞</text>

    <rect x="675" y="100" width="160" height="156" rx="16" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
    <text x="755" y="138" font-size="20" font-weight="700" fill="#14532D">Row softmax</text><text x="755" y="180" font-size="25" fill="#14532D">A</text><text x="755" y="222" font-size="17" fill="#334155">each row sums to 1</text>

    <rect x="885" y="100" width="150" height="156" rx="16" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="960" y="138" font-size="20" font-weight="700" fill="#7F1D1D">Mix values</text><text x="960" y="180" font-size="25" fill="#7F1D1D">AV</text><text x="960" y="222" font-size="17" fill="#334155">T × dᵥ</text>
  </g>

  <g fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
    <path d="M213 178H245"/><path d="M423 178H455"/><path d="M633 178H665"/><path d="M843 178H875"/>
  </g>
  <text x="540" y="314" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#334155">Scores become probabilities only after masking and row-wise normalization.</text>
</svg>
