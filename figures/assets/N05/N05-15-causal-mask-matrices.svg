<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">A causal mask changes future scores into zero attention weights</title>
  <desc id="desc">Three token-labeled four by four matrices show raw scores, scores after the causal mask, and attention weights after row-wise softmax. The row for sat is highlighted from left to right.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker>
    <pattern id="futureHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FEE2E2"/><line x1="0" y1="0" x2="0" y2="10" stroke="#F87171" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="700" rx="18" fill="#F8FAFC"/>
  <text x="600" y="46" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#0F172A">Follow one query row through masking and softmax</text>
  <text x="600" y="82" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">Rows are queries i; columns are keys j. Hatched cells are future keys where j &gt; i.</text>

  <g font-family="sans-serif">
    <text x="195" y="132" text-anchor="middle" font-size="21" font-weight="700" fill="#1E3A8A">1. Raw scores S</text>
    <text x="195" y="164" text-anchor="middle" font-size="17" fill="#475569">key position j →</text>
    <text x="42" y="360" text-anchor="middle" font-size="17" fill="#475569" transform="rotate(-90 42 360)">query position i →</text>
    <g font-size="16" fill="#334155" text-anchor="end"><text x="105" y="254">The</text><text x="105" y="314">cat</text><text x="105" y="374" font-weight="700" fill="#6D28D9">sat</text><text x="105" y="434">down</text></g>
    <g font-size="16" fill="#334155" text-anchor="middle"><text x="140" y="202">The</text><text x="200" y="202">cat</text><text x="260" y="202">sat</text><text x="320" y="202">down</text></g>
    <rect x="110" y="218" width="240" height="240" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
    <path d="M170 218V458M230 218V458M290 218V458M110 278H350M110 338H350M110 398H350" stroke="#93C5FD"/>
    <g font-size="17" fill="#1E3A8A" text-anchor="middle"><text x="140" y="254">1.0</text><text x="200" y="254">0.2</text><text x="260" y="254">−0.4</text><text x="320" y="254">0.7</text><text x="140" y="314">0.3</text><text x="200" y="314">1.1</text><text x="260" y="314">0.5</text><text x="320" y="314">−0.2</text><text x="140" y="374">1.2</text><text x="200" y="374">0.8</text><text x="260" y="374">1.0</text><text x="320" y="374">0.4</text><text x="140" y="434">0.1</text><text x="200" y="434">0.6</text><text x="260" y="434">0.9</text><text x="320" y="434">1.3</text></g>
    <rect x="106" y="338" width="248" height="60" rx="5" fill="none" stroke="#7C3AED" stroke-width="4"/>

    <text x="600" y="132" text-anchor="middle" font-size="21" font-weight="700" fill="#78350F">2. Masked scores S + M</text>
    <text x="600" y="164" text-anchor="middle" font-size="17" fill="#475569">future cells are replaced by −∞</text>
    <g font-size="16" fill="#334155" text-anchor="end"><text x="510" y="254">The</text><text x="510" y="314">cat</text><text x="510" y="374" font-weight="700" fill="#6D28D9">sat</text><text x="510" y="434">down</text></g>
    <g font-size="16" fill="#334155" text-anchor="middle"><text x="545" y="202">The</text><text x="605" y="202">cat</text><text x="665" y="202">sat</text><text x="725" y="202">down</text></g>
    <rect x="515" y="218" width="240" height="240" fill="#ECFDF5" stroke="#34D399" stroke-width="2"/>
    <rect x="575" y="218" width="180" height="60" fill="url(#futureHatch)"/><rect x="635" y="278" width="120" height="60" fill="url(#futureHatch)"/><rect x="695" y="338" width="60" height="60" fill="url(#futureHatch)"/>
    <path d="M575 218V458M635 218V458M695 218V458M515 278H755M515 338H755M515 398H755" stroke="#6EE7B7"/>
    <g font-size="17" fill="#14532D" text-anchor="middle"><text x="545" y="254">1.0</text><text x="605" y="254" fill="#991B1B">−∞</text><text x="665" y="254" fill="#991B1B">−∞</text><text x="725" y="254" fill="#991B1B">−∞</text><text x="545" y="314">0.3</text><text x="605" y="314">1.1</text><text x="665" y="314" fill="#991B1B">−∞</text><text x="725" y="314" fill="#991B1B">−∞</text><text x="545" y="374">1.2</text><text x="605" y="374">0.8</text><text x="665" y="374">1.0</text><text x="725" y="374" fill="#991B1B">−∞</text><text x="545" y="434">0.1</text><text x="605" y="434">0.6</text><text x="665" y="434">0.9</text><text x="725" y="434">1.3</text></g>
    <rect x="511" y="338" width="248" height="60" rx="5" fill="none" stroke="#7C3AED" stroke-width="4"/>

    <text x="1005" y="132" text-anchor="middle" font-size="21" font-weight="700" fill="#14532D">3. Attention weights A</text>
    <text x="1005" y="164" text-anchor="middle" font-size="17" fill="#475569">row-wise softmax</text>
    <g font-size="16" fill="#334155" text-anchor="end"><text x="915" y="254">The</text><text x="915" y="314">cat</text><text x="915" y="374" font-weight="700" fill="#6D28D9">sat</text><text x="915" y="434">down</text></g>
    <g font-size="16" fill="#334155" text-anchor="middle"><text x="950" y="202">The</text><text x="1010" y="202">cat</text><text x="1070" y="202">sat</text><text x="1130" y="202">down</text></g>
    <rect x="920" y="218" width="240" height="240" fill="#ECFDF5" stroke="#22C55E" stroke-width="2"/>
    <rect x="980" y="218" width="180" height="60" fill="url(#futureHatch)" opacity="0.62"/><rect x="1040" y="278" width="120" height="60" fill="url(#futureHatch)" opacity="0.62"/><rect x="1100" y="338" width="60" height="60" fill="url(#futureHatch)" opacity="0.62"/>
    <path d="M980 218V458M1040 218V458M1100 218V458M920 278H1160M920 338H1160M920 398H1160" stroke="#86EFAC"/>
    <g font-size="17" fill="#14532D" text-anchor="middle"><text x="950" y="254">1.00</text><text x="1010" y="254" fill="#991B1B">0</text><text x="1070" y="254" fill="#991B1B">0</text><text x="1130" y="254" fill="#991B1B">0</text><text x="950" y="314">0.31</text><text x="1010" y="314">0.69</text><text x="1070" y="314" fill="#991B1B">0</text><text x="1130" y="314" fill="#991B1B">0</text><text x="950" y="374">0.40</text><text x="1010" y="374">0.27</text><text x="1070" y="374">0.33</text><text x="1130" y="374" fill="#991B1B">0</text><text x="950" y="434">0.12</text><text x="1010" y="434">0.20</text><text x="1070" y="434">0.27</text><text x="1130" y="434">0.41</text></g>
    <rect x="916" y="338" width="248" height="60" rx="5" fill="none" stroke="#7C3AED" stroke-width="4"/>
  </g>

  <g fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"><path d="M370 368H487"/><path d="M775 368H892"/></g>
  <g font-family="sans-serif" font-size="17" font-weight="700" fill="#475569" text-anchor="middle"><text x="429" y="344">add M</text><text x="834" y="344">softmax</text></g>
  <g font-family="sans-serif" text-anchor="middle"><text x="600" y="530" font-size="20" font-weight="700" fill="#6D28D9">For query “sat”, future key “down”: 0.4 → −∞ → 0</text><text x="600" y="570" font-size="18" fill="#334155">Allowed entries remain ordinary scores and are normalized together within the same row.</text><text x="600" y="608" font-size="18" fill="#334155">The hatch pattern, numerical value, and row/column labels all identify the blocked relation.</text></g>
</svg>
