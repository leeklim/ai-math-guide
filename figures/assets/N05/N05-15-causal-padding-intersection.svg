<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 550" width="1040" height="550" role="img"><title>Causal and padding masks intersect in the same query row</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FEE2E2"/><path d="M0 0V12" stroke="#DC2626" stroke-width="2"/></pattern></defs><rect width="1040" height="550" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="26"><text x="520" y="44" fill="#0F172A" font-size="29" text-anchor="middle">Causal order and padding are separate filters</text><text x="520" y="90" fill="#64748B" font-size="26" text-anchor="middle">Query i = 2 (sat); columns are key positions j</text><text x="255" y="143" fill="#2563EB" font-size="28" text-anchor="middle">0: The</text><text x="475" y="143" fill="#2563EB" font-size="28" text-anchor="middle">1: PAD</text><text x="695" y="143" fill="#2563EB" font-size="28" text-anchor="middle">2: sat</text><text x="915" y="143" fill="#2563EB" font-size="28" text-anchor="middle">3: down</text><text x="150" y="222" fill="#7C3AED" font-size="26" text-anchor="end">causal</text><rect x="175" y="176" width="160" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="255" y="223" fill="#065F46" font-size="28" text-anchor="middle">allow</text><rect x="395" y="176" width="160" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="475" y="223" fill="#065F46" font-size="28" text-anchor="middle">allow</text><rect x="615" y="176" width="160" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="695" y="223" fill="#065F46" font-size="28" text-anchor="middle">allow</text><rect x="835" y="176" width="160" height="72" rx="10" fill="url(#hatch)" stroke="#DC2626" stroke-width="2"/><text x="915" y="223" fill="#991B1B" font-size="28" text-anchor="middle">block</text><text x="150" y="342" fill="#7C3AED" font-size="26" text-anchor="end">padding</text><rect x="175" y="296" width="160" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="255" y="343" fill="#065F46" font-size="28" text-anchor="middle">allow</text><rect x="395" y="296" width="160" height="72" rx="10" fill="url(#hatch)" stroke="#DC2626" stroke-width="2"/><text x="475" y="343" fill="#991B1B" font-size="28" text-anchor="middle">block</text><rect x="615" y="296" width="160" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="695" y="343" fill="#065F46" font-size="28" text-anchor="middle">allow</text><rect x="835" y="296" width="160" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="915" y="343" fill="#065F46" font-size="28" text-anchor="middle">allow</text><text x="150" y="462" fill="#7C3AED" font-size="26" text-anchor="end">both</text><rect x="175" y="416" width="160" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="255" y="463" fill="#065F46" font-size="28" text-anchor="middle">allow</text><rect x="395" y="416" width="160" height="72" rx="10" fill="url(#hatch)" stroke="#DC2626" stroke-width="2"/><text x="475" y="463" fill="#991B1B" font-size="28" text-anchor="middle">block</text><rect x="615" y="416" width="160" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="695" y="463" fill="#065F46" font-size="28" text-anchor="middle">allow</text><rect x="835" y="416" width="160" height="72" rx="10" fill="url(#hatch)" stroke="#DC2626" stroke-width="2"/><text x="915" y="463" fill="#991B1B" font-size="28" text-anchor="middle">block</text></g></svg>
