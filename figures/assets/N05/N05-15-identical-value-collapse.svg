<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 710" width="960" height="710" role="img"><title>Different normalized attention rows give the same output for identical values</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FEE2E2"/><path d="M0 0V12" stroke="#DC2626" stroke-width="2"/></pattern></defs><rect width="960" height="710" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="26"><text x="480" y="44" fill="#0F172A" font-size="29" text-anchor="middle">Identical values collapse the output choice</text><rect x="315" y="108" width="330" height="205" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="480" y="144" fill="#2563EB" font-size="28" text-anchor="middle">Shared value rows</text><text x="480" y="195" fill="#2563EB" font-size="28" text-anchor="middle">v₁ = (1, 1)</text><text x="480" y="240" fill="#2563EB" font-size="28" text-anchor="middle">v₂ = (1, 1)</text><text x="480" y="285" fill="#2563EB" font-size="28" text-anchor="middle">v₃ = (1, 1)</text><path d="M480 313V347H245V387" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M480 313V347H715V387" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="50" y="400" width="390" height="110" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="245" y="440" fill="#7C3AED" font-size="28" text-anchor="middle">Attention row A</text><text x="245" y="483" fill="#7C3AED" font-size="27" text-anchor="middle">(0.40, 0.27, 0.33)</text><path d="M245 510V559" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="50" y="572" width="390" height="90" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="245" y="627" fill="#059669" font-size="30" text-anchor="middle">output = (1, 1)</text><rect x="520" y="400" width="390" height="110" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="715" y="440" fill="#7C3AED" font-size="28" text-anchor="middle">Attention row B</text><text x="715" y="483" fill="#7C3AED" font-size="27" text-anchor="middle">(0.10, 0.20, 0.70)</text><path d="M715 510V559" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="520" y="572" width="390" height="90" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="715" y="627" fill="#059669" font-size="30" text-anchor="middle">output = (1, 1)</text></g></svg>
