<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 780" width="1040" height="780" role="img"><title>Mask before normalization or remove probability after normalization</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#FEE2E2"/><path d="M0 0V12" stroke="#DC2626" stroke-width="2"/></pattern></defs><rect width="1040" height="780" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="26"><text x="520" y="45" fill="#0F172A" font-size="30" text-anchor="middle">Masking order changes the row sum</text><text x="520" y="95" fill="#64748B" font-size="26" text-anchor="middle">Scores (0, ln 3, ln 6); key 2 is forbidden</text><text x="255" y="150" fill="#7C3AED" font-size="29" text-anchor="middle">Mask first</text><rect x="55" y="205" width="400" height="100" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="255" y="193" fill="#2563EB" font-size="25" text-anchor="middle">exponentiated entries</text><text x="127" y="263" fill="#2563EB" font-size="30" text-anchor="middle">1</text><text x="255" y="263" fill="#2563EB" font-size="30" text-anchor="middle">3</text><text x="383" y="263" fill="#DC2626" font-size="30" text-anchor="middle">0</text><path d="M255 305V378" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="311" y="351" fill="#7C3AED" font-size="24" text-anchor="start">normalize</text><rect x="55" y="390" width="400" height="100" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="127" y="449" fill="#059669" font-size="30" text-anchor="middle">0.25</text><text x="255" y="449" fill="#059669" font-size="30" text-anchor="middle">0.75</text><text x="383" y="449" fill="#DC2626" font-size="30" text-anchor="middle">0</text><path d="M255 490V562" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="311" y="535" fill="#64748B" font-size="24" text-anchor="start">retain</text><rect x="55" y="576" width="400" height="100" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="127" y="635" fill="#059669" font-size="30" text-anchor="middle">0.25</text><text x="255" y="635" fill="#059669" font-size="30" text-anchor="middle">0.75</text><text x="383" y="635" fill="#DC2626" font-size="30" text-anchor="middle">0</text><text x="255" y="723" fill="#059669" font-size="30" text-anchor="middle">sum = 1</text><text x="785" y="150" fill="#7C3AED" font-size="29" text-anchor="middle">Normalize first</text><rect x="585" y="205" width="400" height="100" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="785" y="193" fill="#2563EB" font-size="25" text-anchor="middle">exponentiated entries</text><text x="657" y="263" fill="#2563EB" font-size="30" text-anchor="middle">1</text><text x="785" y="263" fill="#2563EB" font-size="30" text-anchor="middle">3</text><text x="913" y="263" fill="#DC2626" font-size="30" text-anchor="middle">6</text><path d="M785 305V378" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="841" y="351" fill="#7C3AED" font-size="24" text-anchor="start">normalize</text><rect x="585" y="390" width="400" height="100" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="657" y="449" fill="#059669" font-size="30" text-anchor="middle">0.10</text><text x="785" y="449" fill="#059669" font-size="30" text-anchor="middle">0.30</text><text x="913" y="449" fill="#DC2626" font-size="30" text-anchor="middle">0.60</text><path d="M785 490V562" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="841" y="535" fill="#DC2626" font-size="24" text-anchor="start">zero key 2</text><rect x="585" y="576" width="400" height="100" rx="10" fill="white" stroke="#DC2626" stroke-width="2"/><text x="657" y="635" fill="#059669" font-size="30" text-anchor="middle">0.10</text><text x="785" y="635" fill="#059669" font-size="30" text-anchor="middle">0.30</text><text x="913" y="635" fill="#DC2626" font-size="30" text-anchor="middle">0</text><text x="785" y="723" fill="#DC2626" font-size="30" text-anchor="middle">sum = 0.40</text></g></svg>
