<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" role="img"><title>One token's four head outputs concatenate along their feature axis</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="620" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="26"><text x="540" y="45" fill="#0F172A" font-size="30" text-anchor="middle">Concatenate heads within one token</text><text x="540" y="98" fill="#64748B" font-size="28" text-anchor="middle">Head output axis: (B, hq, T, dh)</text><rect x="40" y="160" width="205" height="110" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="142" y="202" fill="#2563EB" font-size="27" text-anchor="middle">head 0</text><text x="142" y="245" fill="#2563EB" font-size="29" text-anchor="middle">(1, 0)</text><path d="M142 270V346" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="305" y="160" width="205" height="110" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="407" y="202" fill="#2563EB" font-size="27" text-anchor="middle">head 1</text><text x="407" y="245" fill="#2563EB" font-size="29" text-anchor="middle">(0, 2)</text><path d="M407 270V346" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="570" y="160" width="205" height="110" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="672" y="202" fill="#2563EB" font-size="27" text-anchor="middle">head 2</text><text x="672" y="245" fill="#2563EB" font-size="29" text-anchor="middle">(3, 1)</text><path d="M672 270V346" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="835" y="160" width="205" height="110" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="937" y="202" fill="#2563EB" font-size="27" text-anchor="middle">head 3</text><text x="937" y="245" fill="#2563EB" font-size="29" text-anchor="middle">(2, −1)</text><path d="M937 270V346" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="360" width="950" height="106" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="540" y="402" fill="#7C3AED" font-size="28" text-anchor="middle">One token's concatenated feature row</text><text x="540" y="445" fill="#7C3AED" font-size="29" text-anchor="middle">(1, 0 | 0, 2 | 3, 1 | 2, −1)</text><text x="540" y="536" fill="#64748B" font-size="27" text-anchor="middle">(B, T, hq·dh) before the output projection</text><text x="540" y="580" fill="#64748B" font-size="26" text-anchor="middle">Concatenation preserves the separate feature slots.</text></g></svg>
