<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" width="1040" height="670" role="img"><title>Changing a shared value entry affects both queries in its group before output projection</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="670" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="26"><text x="520" y="45" fill="#0F172A" font-size="30" text-anchor="middle">One shared V change reaches two query outputs</text><text x="250" y="110" fill="#7C3AED" font-size="28" text-anchor="middle">Group 0: Q0, Q1</text><rect x="70" y="146" width="360" height="125" rx="10" fill="white" stroke="#DC2626" stroke-width="2"/><text x="250" y="186" fill="#DC2626" font-size="27" text-anchor="middle">V0, token 0</text><text x="250" y="235" fill="#DC2626" font-size="28" text-anchor="middle">(1, 0) → (2, 0)</text><path d="M250 271V303H145V396" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="53" y="326" width="184" height="40" fill="#F8FAFC"/><text x="145" y="354" fill="#7C3AED" font-size="24" text-anchor="middle">A0,0 = 0.25</text><rect x="60" y="410" width="170" height="123" rx="10" fill="white" stroke="#DC2626" stroke-width="2"/><text x="145" y="451" fill="#DC2626" font-size="28" text-anchor="middle">Δo0</text><text x="145" y="498" fill="#DC2626" font-size="26" text-anchor="middle">(0.25, 0)</text><path d="M250 271V303H355V396" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="263" y="326" width="184" height="40" fill="#F8FAFC"/><text x="355" y="354" fill="#7C3AED" font-size="24" text-anchor="middle">A1,0 = 0.75</text><rect x="270" y="410" width="170" height="123" rx="10" fill="white" stroke="#DC2626" stroke-width="2"/><text x="355" y="451" fill="#DC2626" font-size="28" text-anchor="middle">Δo1</text><text x="355" y="498" fill="#DC2626" font-size="26" text-anchor="middle">(0.75, 0)</text><text x="790" y="110" fill="#7C3AED" font-size="28" text-anchor="middle">Group 1: Q2, Q3</text><rect x="610" y="146" width="360" height="125" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="790" y="186" fill="#2563EB" font-size="27" text-anchor="middle">V1 unchanged</text><text x="790" y="235" fill="#2563EB" font-size="28" text-anchor="middle">ΔV1 = (0, 0)</text><path d="M790 271V303H685V396" fill="none" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="593" y="326" width="184" height="40" fill="#F8FAFC"/><text x="685" y="354" fill="#64748B" font-size="24" text-anchor="middle">no changed V</text><rect x="600" y="410" width="170" height="123" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="685" y="451" fill="#059669" font-size="28" text-anchor="middle">Δo2</text><text x="685" y="498" fill="#059669" font-size="26" text-anchor="middle">(0, 0)</text><path d="M790 271V303H895V396" fill="none" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="803" y="326" width="184" height="40" fill="#F8FAFC"/><text x="895" y="354" fill="#64748B" font-size="24" text-anchor="middle">no changed V</text><rect x="810" y="410" width="170" height="123" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="895" y="451" fill="#059669" font-size="28" text-anchor="middle">Δo3</text><text x="895" y="498" fill="#059669" font-size="26" text-anchor="middle">(0, 0)</text><text x="520" y="605" fill="#64748B" font-size="27" text-anchor="middle">Hold Q, K and weights fixed; compare outputs before Wo.</text></g></svg>
