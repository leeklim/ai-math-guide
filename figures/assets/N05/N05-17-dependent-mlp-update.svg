<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 655" width="1080" height="655" role="img"><title>Removing attention changes the MLP input and therefore its update in the lesson's toy linear block</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="655" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="540" y="45" fill="#0F172A" font-size="29" text-anchor="middle">Changing attention also changes the next MLP update</text><text x="540" y="115" fill="#64748B" font-size="27" text-anchor="middle">Keep the attention update</text><rect x="40" y="145" width="205" height="100" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="142.5" y="178" fill="#2563EB" font-size="25" text-anchor="middle">R_in</text><text x="142.5" y="220" fill="#2563EB" font-size="25" text-anchor="middle">(1, −1)</text><path d="M245 195H291" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="305" y="145" width="205" height="100" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="407.5" y="178" fill="#059669" font-size="25" text-anchor="middle">R_mid</text><text x="407.5" y="220" fill="#059669" font-size="25" text-anchor="middle">(1.5, −0.5)</text><path d="M510 195H556" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="570" y="145" width="205" height="100" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="672.5" y="178" fill="#7C3AED" font-size="25" text-anchor="middle">M(R_mid)</text><text x="672.5" y="220" fill="#7C3AED" font-size="25" text-anchor="middle">(−0.125, 0.375)</text><path d="M775 195H821" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="835" y="145" width="205" height="100" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="937.5" y="178" fill="#059669" font-size="25" text-anchor="middle">R_out</text><text x="937.5" y="220" fill="#059669" font-size="25" text-anchor="middle">(1.375, −0.125)</text><text x="540" y="335" fill="#DC2626" font-size="27" text-anchor="middle">Remove the attention update</text><rect x="40" y="365" width="205" height="100" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="142.5" y="398" fill="#2563EB" font-size="25" text-anchor="middle">R_in</text><text x="142.5" y="440" fill="#2563EB" font-size="25" text-anchor="middle">(1, −1)</text><path d="M245 415H291" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="305" y="365" width="205" height="100" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="407.5" y="398" fill="#059669" font-size="25" text-anchor="middle">R_mid</text><text x="407.5" y="440" fill="#059669" font-size="25" text-anchor="middle">(1, −1)</text><path d="M510 415H556" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="570" y="365" width="205" height="100" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="672.5" y="398" fill="#7C3AED" font-size="25" text-anchor="middle">M(R_mid)</text><text x="672.5" y="440" fill="#7C3AED" font-size="25" text-anchor="middle">(−0.25, 0.25)</text><path d="M775 415H821" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="835" y="365" width="205" height="100" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="937.5" y="398" fill="#059669" font-size="25" text-anchor="middle">R_out</text><text x="937.5" y="440" fill="#059669" font-size="25" text-anchor="middle">(0.75, −0.75)</text><text x="540" y="557" fill="#64748B" font-size="28" text-anchor="middle">MLP toy map: M(a, b) = (b/4, a/4)</text><text x="540" y="605" fill="#64748B" font-size="27" text-anchor="middle">The update is recomputed from the changed stream.</text></g></svg>
