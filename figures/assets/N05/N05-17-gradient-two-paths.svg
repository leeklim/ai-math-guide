<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" width="1040" height="760" role="img"><title>An incoming gradient splits through identity and branch Jacobians then sums at the input</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="760" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="520" y="45" fill="#0F172A" font-size="29" text-anchor="middle">Backpropagation adds two path contributions</text><rect x="365" y="110" width="310" height="100" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="520" y="149" fill="#059669" font-size="28" text-anchor="middle">incoming g_y</text><text x="520" y="190" fill="#059669" font-size="30" text-anchor="middle">(1, 1)</text><path d="M520 210V250H245V289" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="80" y="303" width="330" height="134" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="245" y="343" fill="#2563EB" font-size="28" text-anchor="middle">skip path</text><text x="245" y="382" fill="#2563EB" font-size="27" text-anchor="middle">Iᵀ g_y</text><text x="245" y="420" fill="#2563EB" font-size="30" text-anchor="middle">(1, 1)</text><path d="M245 437V485H520V524" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M520 210V250H795V289" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="630" y="303" width="330" height="134" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="795" y="343" fill="#7C3AED" font-size="28" text-anchor="middle">branch path</text><text x="795" y="382" fill="#7C3AED" font-size="27" text-anchor="middle">J_Fᵀ g_y</text><text x="795" y="420" fill="#7C3AED" font-size="30" text-anchor="middle">(2, −0.5)</text><path d="M795 437V485H520V524" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="365" y="540" width="310" height="100" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="520" y="578" fill="#059669" font-size="28" text-anchor="middle">gradient at x</text><text x="520" y="618" fill="#059669" font-size="30" text-anchor="middle">(3, 0.5)</text><text x="520" y="705" fill="#64748B" font-size="27" text-anchor="middle">Example: F(x₀, x₁) = (2x₀, −0.5x₁)</text></g></svg>
