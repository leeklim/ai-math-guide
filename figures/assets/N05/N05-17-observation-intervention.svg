<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 670" width="1040" height="670" role="img"><title>A numerical residual projection reads an unchanged activation while adding a vector changes the downstream run</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="670" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="520" y="45" fill="#0F172A" font-size="29" text-anchor="middle">Reading a stream is not changing the stream</text><text x="255" y="118" fill="#D97706" font-size="30" text-anchor="middle">Observe</text><rect x="60" y="158" width="390" height="105" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="255" y="199" fill="#2563EB" font-size="28" text-anchor="middle">stream r = (1, 2)</text><text x="255" y="240" fill="#64748B" font-size="25" text-anchor="middle">at one hook position</text><path d="M255 263V319" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="333" width="390" height="113" rx="10" fill="white" stroke="#D97706" stroke-width="2"/><text x="255" y="375" fill="#D97706" font-size="29" text-anchor="middle">read e₁ᵀr = 1</text><text x="255" y="420" fill="#D97706" font-size="27" text-anchor="middle">activation unchanged</text><path d="M255 446V502" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="516" width="390" height="100" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="255" y="558" fill="#059669" font-size="28" text-anchor="middle">original downstream run</text><text x="255" y="598" fill="#64748B" font-size="25" text-anchor="middle">no causal effect measured</text><text x="785" y="118" fill="#DC2626" font-size="30" text-anchor="middle">Intervene</text><rect x="590" y="158" width="390" height="105" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="785" y="199" fill="#2563EB" font-size="28" text-anchor="middle">stream r = (1, 2)</text><text x="785" y="240" fill="#64748B" font-size="25" text-anchor="middle">at one hook position</text><path d="M785 263V319" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="590" y="333" width="390" height="113" rx="10" fill="white" stroke="#DC2626" stroke-width="2"/><text x="785" y="375" fill="#DC2626" font-size="29" text-anchor="middle">add (0.5, 0)</text><text x="785" y="420" fill="#DC2626" font-size="27" text-anchor="middle">new r = (1.5, 2)</text><path d="M785 446V502" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="590" y="516" width="390" height="100" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="785" y="558" fill="#059669" font-size="25" text-anchor="middle">rerun downstream computation</text><text x="785" y="598" fill="#64748B" font-size="25" text-anchor="middle">compare an output metric</text></g></svg>
