<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Residual stream as a shared vector state updated by attention and MLP blocks</title>
  <desc id="desc">A horizontal residual stream carries the current vector state while attention and MLP branches read it and add updates back into the same model dimension.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
  <rect width="960" height="540" rx="18" fill="#F8FAFC"/>
  <text x="480" y="52" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#0F172A">Residual stream: read, compute, add</text>
  <path d="M70 300H890" stroke="#334155" stroke-width="7" marker-end="url(#arrow)"/>
  <g fill="#F8FAFC" stroke="#334155" stroke-width="3"><circle cx="150" cy="300" r="13"/><circle cx="465" cy="300" r="13"/><circle cx="775" cy="300" r="13"/></g>
  <g font-family="sans-serif" font-size="18" fill="#0F172A" text-anchor="middle"><text x="150" y="345">h⁽ˡ⁾</text><text x="465" y="345">h′</text><text x="775" y="345">h⁽ˡ⁺¹⁾</text></g>
  <rect x="215" y="115" width="190" height="95" rx="15" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="310" y="153" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#1E3A8A">Attention</text>
  <text x="310" y="185" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">Δh_attn</text>
  <path d="M150 285C150 220 180 162 205 162" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M415 162C455 162 465 220 465 278" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="530" y="115" width="190" height="95" rx="15" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
  <text x="625" y="153" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#14532D">MLP</text>
  <text x="625" y="185" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">Δh_mlp</text>
  <path d="M465 285C465 220 495 162 520 162" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M730 162C765 162 775 220 775 278" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/>
  <g font-family="sans-serif" font-size="18" fill="#334155" text-anchor="middle"><text x="307" y="395">h′ = h⁽ˡ⁾ + Δh_attn</text><text x="630" y="425">h⁽ˡ⁺¹⁾ = h′ + Δh_mlp</text></g>
  <text x="480" y="492" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#334155">Every update must return to the same d_model space before addition.</text>
</svg>
