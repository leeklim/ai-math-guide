<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img"><title>A numerical pre-norm and post-norm comparison tracks where the identity skip enters</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1200" height="790" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="600" y="45" fill="#0F172A" font-size="30" text-anchor="middle">Norm location changes the skip path and the numbers</text><text x="130" y="105" fill="#64748B" font-size="29" text-anchor="middle">Pre-norm</text><rect x="50" y="150" width="235" height="120" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="167.5" y="190" fill="#2563EB" font-size="27" text-anchor="middle">x</text><text x="167.5" y="235" fill="#2563EB" font-size="23" text-anchor="middle">(1,2,3)</text><path d="M285 210H313" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="325" y="150" width="235" height="120" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="442.5" y="190" fill="#7C3AED" font-size="27" text-anchor="middle">Norm(x)</text><text x="442.5" y="235" fill="#7C3AED" font-size="23" text-anchor="middle">(−1.225,0,1.225)</text><path d="M560 210H588" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="600" y="150" width="235" height="120" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="717.5" y="190" fill="#7C3AED" font-size="27" text-anchor="middle">F(Norm(x))</text><text x="717.5" y="235" fill="#7C3AED" font-size="23" text-anchor="middle">(−0.612,0,0.612)</text><path d="M835 210H863" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="875" y="150" width="235" height="120" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="992.5" y="190" fill="#059669" font-size="27" text-anchor="middle">x + update</text><text x="992.5" y="235" fill="#059669" font-size="23" text-anchor="middle">(0.388,2,3.612)</text><path d="M167.5 270V319H992.5V286" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><text x="550" y="355" fill="#2563EB" font-size="26" text-anchor="middle">skip bypasses Norm and F</text><text x="130" y="385" fill="#64748B" font-size="29" text-anchor="middle">Post-norm</text><rect x="50" y="430" width="235" height="120" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="167.5" y="470" fill="#2563EB" font-size="27" text-anchor="middle">x</text><text x="167.5" y="515" fill="#2563EB" font-size="23" text-anchor="middle">(1,2,3)</text><path d="M285 490H313" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="325" y="430" width="235" height="120" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="442.5" y="470" fill="#7C3AED" font-size="27" text-anchor="middle">F(x)</text><text x="442.5" y="515" fill="#7C3AED" font-size="23" text-anchor="middle">(0.5,1,1.5)</text><path d="M560 490H588" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="600" y="430" width="235" height="120" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="717.5" y="470" fill="#059669" font-size="27" text-anchor="middle">x + F(x)</text><text x="717.5" y="515" fill="#059669" font-size="23" text-anchor="middle">(1.5,3,4.5)</text><path d="M835 490H863" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="875" y="430" width="235" height="120" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="992.5" y="470" fill="#7C3AED" font-size="27" text-anchor="middle">Norm(sum)</text><text x="992.5" y="515" fill="#7C3AED" font-size="23" text-anchor="middle">(−1.225,0,1.225)</text><path d="M167.5 550V599H717.5V566" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><text x="550" y="635" fill="#2563EB" font-size="26" text-anchor="middle">skip joins before Norm</text><text x="600" y="739" fill="#64748B" font-size="27" text-anchor="middle">Toy F(z)=z/2; Norm=LayerNorm with γ=1, β=0 and negligible ε.</text></g></svg>
