<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 635" width="1080" height="635" role="img"><title>LayerNorm statistics are grouped by token across features</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="635" fill="#F8FAFC"/><g font-family="sans-serif" fill="#0F172A" font-size="28"><text x="540" y="45" fill="#0F172A" font-size="29" text-anchor="middle">Compute statistics within each token, not across tokens</text><text x="192" y="140" fill="#64748B" font-size="24" text-anchor="middle">f0</text><text x="310" y="140" fill="#64748B" font-size="24" text-anchor="middle">f1</text><text x="428" y="140" fill="#64748B" font-size="24" text-anchor="middle">f2</text><rect x="75" y="152" width="500" height="100" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="111" y="206" fill="#64748B" font-size="26" text-anchor="middle">t0</text><rect x="150" y="172" width="84" height="61" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="192" y="213" fill="#2563EB" font-size="28" text-anchor="middle">1</text><rect x="268" y="172" width="84" height="61" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="310" y="213" fill="#2563EB" font-size="28" text-anchor="middle">2</text><rect x="386" y="172" width="84" height="61" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="428" y="213" fill="#2563EB" font-size="28" text-anchor="middle">3</text><path d="M600 202H658" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="850" y="185" fill="#7C3AED" font-size="27" text-anchor="middle">μ=2, variance=2/3</text><text x="850" y="230" fill="#059669" font-size="28" text-anchor="middle">(−1.225, 0, 1.225)</text><path d="M150 267V281H470V267" fill="none" stroke="#7C3AED" stroke-width="2"/><text x="310" y="319" fill="#7C3AED" font-