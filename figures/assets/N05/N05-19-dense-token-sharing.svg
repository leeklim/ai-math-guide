<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 645" width="1080" height="645" role="img"><title>A two-token toy dense MLP reuses weights but computes separate hidden states and updates</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="645" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="540" y="45" fill="#0F172A" font-size="30" text-anchor="middle">Same MLP weights, separate token computations</text><text x="540" y="103" fill="#64748B" font-size="27" text-anchor="middle">Toy W_up: (3,2), ReLU, W_down: (2,3)</text><rect x="50" y="165" width="280" height="110" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="190" y="207" fill="#2563EB" font-size="25" text-anchor="middle">model: 2</text><text x="190" y="248" fill="#2563EB" font-size="26" text-anchor="middle">token 0: (2,−1)</text><path d="M330 220H385" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="400" y="165" width="280" height="110" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="540" y="207" fill="#7C3AED" font-size="25" text-anchor="middle">hidden: 3</text><text x="540" y="248" fill="#7C3AED" font-size="26" text-anchor="middle">hidden (2,0,1)</text><path d="M680 220H735" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="750" y="165" width="280" height="110" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="890" y="207" fill="#059669" font-size="25" text-anchor="middle">model: 2</text><text x="890" y="248" fill="#059669" font-size="26" text-anchor="middle">output (3,−1)</text><rect x="50" y="355" width="280" height="110" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="190" y="397" fill="#2563EB" font-size="25" text-anchor="middle">model: 2</text><text x="190" y="438" fill="#2563EB" font-size="26" text-anchor="middle">token 1: (−1,2)</text><path d="M330 410H385" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="400" y="355" width="280" height="110" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="540" y="397" fill="#7C3AED" font-size="25" text-anchor="middle">hidden: 3</text><text x="540" y="438" fill="#7C3AED" font-size="26" text-anchor="middle">hidden (0,2,1)</text><path d="M680 410H735" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="750" y="355" width="280" height="110" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="890" y="397" fill="#059669" font-size="25" text-anchor="middle">model: 2</text><text x="890" y="438" fill="#059669" font-size="26" text-anchor="middle">output (1,1)</text><text x="540" y="541" fill="#64748B" font-size="27" text-anchor="middle">W_up maps (a,b) → (a,b,a+b).</text><text x="540" y="590" fill="#64748B" font-size="27" text-anchor="middle">W_down maps (u,v,w) → (u+w,v−w). No token mixing.</text></g></svg>
