<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 830" width="1040" height="830" role="img"><title>Four experts remain stored while one token executes only expert two</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1040" height="830" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="520" y="45" fill="#0F172A" font-size="29" text-anchor="middle">Store every expert; execute only the selected one</text><rect x="370" y="105" width="300" height="100" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="520" y="145" fill="#2563EB" font-size="28" text-anchor="middle">one token</text><text x="520" y="183" fill="#2563EB" font-size="28" text-anchor="middle">selected index = 2</text><rect x="40" y="310" width="960" height="220" rx="10" fill="white" stroke="#64748B" stroke-width="2" stroke-dasharray="8 6"/><text x="290" y="289" fill="#64748B" font-size="29" text-anchor="middle">Stored expert parameters: 4P</text><rect x="70" y="345" width="180" height="135" rx="10" fill="white" stroke="#64748B" stroke-width="2" stroke-dasharray="5 5"/><text x="160" y="390" fill="#64748B" font-size="27" text-anchor="middle">expert 0</text><text x="160" y="438" fill="#64748B" font-size="26" text-anchor="middle">P weights</text><text x="160" y="471" fill="#64748B" font-size="27" text-anchor="middle">idle</text><rect x="310" y="345" width="180" height="135" rx="10" fill="white" stroke="#64748B" stroke-width="2" stroke-dasharray="5 5"/><text x="400" y="390" fill="#64748B" font-size="27" text-anchor="middle">expert 1</text><text x="400" y="438" fill="#64748B" font-size="26" text-anchor="middle">P weights</text><text x="400" y="471" fill="#64748B" font-size="27" text-anchor="middle">idle</text><rect x="550" y="345" width="180" height="135" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/>