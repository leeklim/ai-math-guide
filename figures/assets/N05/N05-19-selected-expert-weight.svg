<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 670" width="1200" height="670" role="img"><title>Two tokens select different toy experts and retain the selected softmax probability in their outputs</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1200" height="670" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="600" y="45" fill="#0F172A" font-size="29" text-anchor="middle">A selected expert keeps its probability coefficient</text><rect x="40" y="155" width="245" height="120" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="162.5" y="195" fill="#2563EB" font-size="24" text-anchor="middle">input/logits</text><text x="162.5" y="240" fill="#2563EB" font-size="22" text-anchor="middle">x=(2,−1)</text><path d="M285 215H320" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="330" y="155" width="245" height="120" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="452.5" y="195" fill="#7C3AED" font-size="24" text-anchor="middle">softmax</text><text x="452.5" y="240" fill="#7C3AED" font-size="22" text-anchor="middle">p=(0.9526,0.0474)</text><path d="M575 215H610" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="620" y="155" width="245" height="120" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="742.5" y="195" fill="#7C3AED" font-size="24" text-anchor="middle">top-1 output</text><text x="742.5" y="240" fill="#7C3AED" font-size="22" text-anchor="middle">expert 0: x=(2,−1)</text><path d="M865 215H900" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="910" y="155" width="245" height="120" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="1032.5" y="195" fill="#059669" font-size="24" text-anchor="middle">multiply 0.9526</text><text x="1032.5" y="240" fill="#059669" font-size="22" text-anchor="middle">y≈(1.905,−0.953)</text><rect x="40" y="390" width="245" height="120" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="162.5" y="430" fill="#2563EB" font-size="24" text-anchor="middle">input/logits</text><text x="162.5" y="475" fill="#2563EB" font-size="22" text-anchor="middle">x=(−1,2)</text><path d="M285 450H320" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="330" y="390" width="245" height="120" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="452.5" y="430" fill="#7C3AED" font-size="24" text-anchor="middle">softmax</text><text x="452.5" y="475" fill="#7C3AED" font-size="22" text-anchor="middle">p=(0.0474,0.9526)</text><path d="M575 450H610" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="620" y="390" width="245" height="120" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="742.5" y="430" fill="#7C3AED" font-size="24" text-anchor="middle">top-1 output</text><text x="742.5" y="475" fill="#7C3AED" font-size="22" text-anchor="middle">expert 1: −x=(1,−2)</text><path d="M865 450H900" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="910" y="390" width="245" height="120" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="1032.5" y="430" fill="#059669" font-size="24" text-anchor="middle">multiply 0.9526</text><text x="1032.5" y="475" fill="#059669" font-size="22" text-anchor="middle">y≈(0.953,−1.905)</text><text x="600" y="619" fill="#64748B" font-size="27" text-anchor="middle">Toy F₀(x)=x, F₁(x)=−x. The unselected expert does not enter the sum.</text></g></svg>
