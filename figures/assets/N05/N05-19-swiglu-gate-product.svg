<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 745" width="1080" height="745" role="img"><title>SwiGLU gate and content projections multiply featurewise in the lesson's exact toy example</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="745" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="540" y="45" fill="#0F172A" font-size="30" text-anchor="middle">SwiGLU multiplies matching hidden feature slots</text><rect x="405" y="103" width="270" height="85" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="540" y="156" fill="#2563EB" font-size="30" text-anchor="middle">x=(2,−1)</text><path d="M540 188V222H245V254" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="70" y="268" width="350" height="115" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="245" y="310" fill="#7C3AED" font-size="28" text-anchor="middle">SiLU(W_g x)</text><text x="245" y="356" fill="#7C3AED" font-size="29" text-anchor="middle">(1.762, −0.269)</text><path d="M245 383V422H540V456" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M540 188V222H835V254" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="660" y="268" width="350" height="115" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="835" y="310" fill="#7C3AED" font-size="28" text-anchor="middle">W_u x</text><text x="835" y="356" fill="#7C3AED" font-size="29" text-anchor="middle">(1, 3)</text><path d="M835 383V422H540V456" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="230" y="470" width="620" height="115" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="540" y="511" fill="#059669" font-size="27" text-anchor="middle">h₀=1.762×1, h₁=(−0.269)×3</text><text x="540" y="558" fill="#059669" font-size="30" text-anchor="middle">h ≈ (1.762, −0.807)</text><text x="540" y="650" fill="#64748B" font-size="27" text-anchor="middle">W_g=I₂; W_u maps (a,b) → (a+b,a−b).</text><text x="540" y="695" fill="#64748B" font-size="26" text-anchor="middle">Both dense projection paths are computed; no expert index is chosen.</text></g></svg>
