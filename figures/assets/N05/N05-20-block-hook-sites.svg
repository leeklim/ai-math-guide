<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 655" width="1100" height="655" role="img"><title>The serial decoder has distinct normalized inputs, sublayer updates, and residual states at matching shapes</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1100" height="655" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="550" y="45" fill="#0F172A" font-size="29" text-anchor="middle">Keep the hook sites distinct inside a serial block</text><rect x="50" y="350" width="200" height="115" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="150" y="390" fill="#059669" font-size="26" text-anchor="middle">X_in</text><text x="150" y="431" fill="#059669" font-size="27" text-anchor="middle">(1,3,4)</text><rect x="450" y="350" width="200" height="115" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="550" y="380" fill="#059669" font-size="26" text-anchor="middle">U</text><text x="550" y="412" fill="#059669" font-size="23" text-anchor="middle">residual mid</text><text x="550" y="449" fill="#059669" font-size="27" text-anchor="middle">(1,3,4)</text><rect x="850" y="350" width="200" height="115" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="950" y="390" fill="#059669" font-size="26" text-anchor="middle">X_next</text><text x="950" y="431" fill="#059669" font-size="27" text-anchor="middle">(1,3,4)</text><path d="M250 407H437" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M650 407H837" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="255" y="110" width="190" height="80" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="350" y="145" fill="#7C3AED" font-size="25" text-anchor="middle">RMSNorm</text><text x="350" y="176" fill="#64748B" font-size="23" text-anchor="middle">separate scale</text><rect x="255" y="230" width="190" height="83" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="350" y="267" fill="#7C3AED" font-size="24" text-anchor="middle">causal attention</text><text x="350" y="298" fill="#7C3AED" font-size="23" text-anchor="middle">update (1,3,4)</text><path d="M350 190V216" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M150 350V150H241" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M445 273H550V336" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="655" y="110" width="190" height="80" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="750" y="145" fill="#7C3AED" font-size="25" text-anchor="middle">RMSNorm</text><text x="750" y="176" fill="#64748B" font-size="23" text-anchor="middle">separate scale</text><rect x="655" y="230" width="190" height="83" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="750" y="267" fill="#7C3AED" font-size="24" text-anchor="middle">SwiGLU MLP</text><text x="750" y="298" fill="#7C3AED" font-size="23" text-anchor="middle">update (1,3,4)</text><path d="M750 190V216" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M620 350V150H641" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M845 273H950V336" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="550" y="551" fill="#64748B" font-size="26" text-anchor="middle">Norm outputs feed branches; raw stream values stay on the skip path.</text><text x="550" y="601" fill="#64748B" font-size="26" text-anchor="middle">Update hooks are before addition. Residual hooks are after addition.</text></g></svg>
