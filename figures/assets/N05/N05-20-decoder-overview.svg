<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1150" width="520" height="1150" role="img"><title>The reference decoder preserves residual axes until unembedding changes the last axis to vocabulary size</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="1150" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="260" y="45" fill="#0F172A" font-size="28" text-anchor="middle">IDs → residual → logits</text><rect x="65" y="96" width="390" height="105" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="260" y="138" fill="#2563EB" font-size="27" text-anchor="middle">input IDs</text><text x="260" y="179" fill="#2563EB" font-size="27" text-anchor="middle">(1,3)</text><path d="M260 201V236" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="250" width="390" height="105" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="260" y="292" fill="#7C3AED" font-size="27" text-anchor="middle">embedding lookup</text><text x="260" y="333" fill="#7C3AED" font-size="27" text-anchor="middle">(1,3,4)</text><path d="M260 355V390" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="404" width="390" height="105" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="446" fill="#059669" font-size="27" text-anchor="middle">attention + residual</text><text x="260" y="487" fill="#059669" font-size="27" text-anchor="middle">U: (1,3,4)</text><path d="M260 509V544" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="65" y="558" width="390" height="105" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="260" y="600" fill="#059669" font-size="27" text-anchor="middle">MLP + residual</text><text x="260" y="641" fill="#059669" font-size="2