<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" role="img"><title>Explicit attention exposes full score and weight buffers while a fused implementation may avoid exposing them</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1120" height="700" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="560" y="45" fill="#0F172A" font-size="29" text-anchor="middle">Same attention function, different exposed intermediates</text><text x="150" y="120" fill="#64748B" font-size="28" text-anchor="middle">Explicit path</text><rect x="50" y="155" width="205" height="104" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="152.5" y="197" fill="#2563EB" font-size="25" text-anchor="middle">Q, K, V, mask</text><text x="152.5" y="237" fill="#64748B" font-size="25" text-anchor="middle">same inputs</text><rect x="875" y="155" width="200" height="104" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="975" y="197" fill="#059669" font-size="28" text-anchor="middle">O = A V</text><text x="975" y="237" fill="#64748B" font-size="24" text-anchor="middle">same function</text><text x="150" y="385" fill="#64748B" font-size="28" text-anchor="middle">Fused path</text><rect x="50" y="420" width="205" height="104" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="152.5" y="462" fill="#2563EB" font-size="25" text-anchor="middle">Q, K, V, mask</text><text x="152.5" y="502" fill="#64748B" font-size="25" text-anchor="middle">same inputs</text><rect x="875" y="420" width="200" height="104" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="975" y="462" fill="#059669" font-size="28" text-anchor="middle">O = A V</text><text x="975" y="502" fill="#64748B" font-size="24" text-anchor="middle">same function</text><path d="M255 207H304" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="318" y="155" width="230" height="104" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="433" y="195" fill="#7C3AED" font-size="26" text-anchor="middle">scores: (T,T)</text><text x="433" y="233" fill="#64748B" font-size="24" text-anchor="middle">stored tensor</text><path d="M548 207H587" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="601" y="155" width="230" height="104" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="716" y="195" fill="#7C3AED" font-size="26" text-anchor="middle">A: (T,T)</text><text x="716" y="233" fill="#64748B" font-size="24" text-anchor="middle">stored tensor</text><path d="M831 207H861" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M255 472H304" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="318" y="395" width="513" height="165" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="574.5" y="435" fill="#7C3AED" font-size="28" text-anchor="middle">fused attention operation</text><text x="574.5" y="483" fill="#7C3AED" font-size="25" text-anchor="middle">scores / softmax / value mix</text><text x="574.5" y="529" fill="#64748B" font-size="23" text-anchor="middle">full (T,T) buffers need not be exposed</text><path d="M831 472H861" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="560" y="645" fill="#64748B" font-size="27" text-anchor="middle">A mathematical intermediate is not necessarily a hook-accessible tensor.</text></g></svg>
