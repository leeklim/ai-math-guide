<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 860" width="1080" height="860" role="img"><title>Toy serial and parallel residual blocks give different numbers because their MLP reads different inputs</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="860" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="540" y="45" fill="#0F172A" font-size="29" text-anchor="middle">Serial and parallel blocks have different dependencies</text><text x="245" y="112" fill="#64748B" font-size="30" text-anchor="middle">Serial</text><rect x="100" y="150" width="290" height="86" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="245" y="204" fill="#2563EB" font-size="30" text-anchor="middle">input x=1</text><text x="775" y="112" fill="#64748B" font-size="30" text-anchor="middle">Parallel</text><rect x="630" y="150" width="290" height="86" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="775" y="204" fill="#2563EB" font-size="30" text-anchor="middle">input x=1</text><path d="M245 236V280" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="100" y="294" width="290" height="100" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="245" y="331" fill="#7C3AED" font-size="28" text-anchor="middle">A(x)=0.5</text><text x="245" y="370" fill="#059669" font-size="26" text-anchor="middle">U=x+A(x)=1.5</text><path d="M245 394V438" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="100" y="452" width="290" height="100" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="245" y="489" fill="#7C3AED" font-size="28" text-anchor="middle">M(U)=3</text><text x="245" y="529" fill="#64748B" font-size="25" text-anchor="middle">MLP reads U</text><path d="M245 552V605" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="100" y="619" width="290" height="105" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="245" y="660" fill="#059669" font-size="28" text-anchor="middle">y=U+M(U)</text><text x="245" y="701" fill="#059669" font-size="31" text-anchor="middle">4.5</text><path d="M775 236V276H697.5V310" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="600" y="324" width="195" height="130" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="697.5" y="365" fill="#7C3AED" font-size="26" text-anchor="middle">A(x)=0.5</text><text x="697.5" y="413" fill="#64748B" font-size="20" text-anchor="middle">attention reads x</text><path d="M697.5 454V534H775V605" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M775 236V276H932.5V310" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="835" y="324" width="195" height="130" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="932.5" y="365" fill="#7C3AED" font-size="26" text-anchor="middle">M(x)=2</text><text x="932.5" y="413" fill="#64748B" font-size="20" text-anchor="middle">MLP reads x</text><path d="M932.5 454V534H775V605" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="630" y="619" width="290" height="105" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="775" y="660" fill="#059669" font-size="25" text-anchor="middle">y=x+A(x)+M(x)</text><text x="775" y="701" fill="#059669" font-size="31" text-anchor="middle">3.5</text><text x="540" y="810" fill="#64748B" font-size="25" text-anchor="middle">Toy A(z)=z/2, M(z)=2z; Norm omitted only for this dependency example.</text><path d="M100 193H65V344H86" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M390 344H445V670H404" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M630 193H575V670H616" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/></g></svg>
