<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img"><title>A conditioned token tree multiplies edge probabilities and changes the next-token distribution with its prefix</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1200" height="800" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="600" y="45" fill="#0F172A" font-size="29" text-anchor="middle">Multiply probabilities along one conditioned token path</text><rect x="470" y="104" width="260" height="86" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="600" y="159" fill="#2563EB" font-size="28" text-anchor="middle">given prefix A</text><path d="M600 190V234H320V274" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="190" y="288" width="260" height="87" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="320" y="343" fill="#7C3AED" font-size="30" text-anchor="middle">AB</text><text x="220" y="252" fill="#7C3AED" font-size="26" text-anchor="middle">× 0.5</text><path d="M600 190V234H880V274" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="750" y="288" width="260" height="87" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="880" y="343" fill="#7C3AED" font-size="30" text-anchor="middle">AD</text><text x="980" y="252" fill="#7C3AED" font-size="26" text-anchor="middle">× 0.5</text><path d="M320 375V418H150V495" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="88" y="445" width="124" height="42" fill="#F8FAFC"/><text x="150" y="475" fill="#7C3AED" font-size="26" text-anchor="middle">× 0.25</text><rect x="40" y="509" width="220" height="115" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="150" y="551" fill="#059669" font-size="29" text-anchor="middle">ABC</text><text x="150" y="595" fill="#059669" font-size="28" text-anchor="middle">p = 0.125</text><path d="M320 375V418H430V495" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="368" y="445" width="124" height="42" fill="#F8FAFC"/><text x="430" y="475" fill="#7C3AED" font-size="26" text-anchor="middle">× 0.75</text><rect x="320" y="509" width="220" height="115" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="430" y="551" fill="#059669" font-size="29" text-anchor="middle">ABE</text><text x="430" y="595" fill="#059669" font-size="28" text-anchor="middle">p = 0.375</text><path d="M880 375V418H750V495" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="688" y="445" width="124" height="42" fill="#F8FAFC"/><text x="750" y="475" fill="#7C3AED" font-size="26" text-anchor="middle">× 0.9</text><rect x="640" y="509" width="220" height="115" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="750" y="551" fill="#059669" font-size="29" text-anchor="middle">ADC</text><text x="750" y="595" fill="#059669" font-size="28" text-anchor="middle">p = 0.45</text><path d="M880 375V418H1030V495" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="968" y="445" width="124" height="42" fill="#F8FAFC"/><text x="1030" y="475" fill="#7C3AED" font-size="26" text-anchor="middle">× 0.1</text><rect x="920" y="509" width="220" height="115" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="1030" y="551" fill="#059669" font-size="29" text-anchor="middle">ADE</text><text x="1030" y="595" fill="#059669" font-size="28" text-anchor="middle">p = 0.05</text><text x="600" y="705" fill="#64748B" font-size="27" text-anchor="middle">p(C | AB)=0.25 but p(C | AD)=0.90: no independence assumption.</text><text x="600" y="751" fill="#64748B" font-size="27" text-anchor="middle">Given A, the four continuation probabilities sum to 1.</text></g></svg>
