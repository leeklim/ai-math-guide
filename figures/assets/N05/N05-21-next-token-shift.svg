<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 795" width="1080" height="795" role="img"><title>Four input token positions produce logits whose first three rows align diagonally with the next token labels</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="795" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="540" y="45" fill="#0F172A" font-size="29" text-anchor="middle">Align position t logits with the next token</text><text x="540" y="110" fill="#2563EB" font-size="30" text-anchor="middle">Input IDs: [1, 4, 2, 7]</text><text x="170" y="166" fill="#64748B" font-size="25" text-anchor="middle">position 0</text><rect x="100" y="196" width="140" height="85" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="170" y="250" fill="#2563EB" font-size="31" text-anchor="middle">1</text><rect x="80" y="330" width="180" height="87" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="170" y="384" fill="#7C3AED" font-size="26" text-anchor="middle">logits[0]</text><path d="M170 281V316" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="410" y="166" fill="#64748B" font-size="25" text-anchor="middle">position 1</text><rect x="340" y="196" width="140" height="85" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="410" y="250" fill="#2563EB" font-size="31" text-anchor="middle">4</text><rect x="320" y="330" width="180" height="87" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="410" y="384" fill="#7C3AED" font-size="26" text-anchor="middle">logits[1]</text><path d="M410 281V316" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="650" y="166" fill="#64748B" font-size="25" text-anchor="middle">position 2</text><rect x="580" y="196" width="140" height="85" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="650" y="250" fill="#2563EB" font-size="31" text-anchor="middle">2</text><rect x="560" y="330" width="180" height="87" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="650" y="384" fill="#7C3AED" font-size="26" text-anchor="middle">logits[2]</text><path d="M650 281V316" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="890" y="166" fill="#64748B" font-size="25" text-anchor="middle">position 3</text><rect x="820" y="196" width="140" height="85" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="890" y="250" fill="#2563EB" font-size="31" text-anchor="middle">7</text><rect x="800" y="330" width="180" height="87" rx="10" fill="white" stroke="#64748B" stroke-width="2"/><text x="890" y="384" fill="#64748B" font-size="26" text-anchor="middle">logits[3]</text><path d="M890 281V316" fill="none" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="220" y="530" width="140" height="85" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="290" y="584" fill="#059669" font-size="31" text-anchor="middle">4</text><path d="M170 417L290 516" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="290" y="666" fill="#059669" font-size="25" text-anchor="middle">label at 1</text><rect x="460" y="530" width="140" height="85" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="530" y="584" fill="#059669" font-size="31" text-anchor="middle">2</text><path d="M410 417L530 516" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="530" y="666" fill="#059669" font-size="25" text-anchor="middle">label at 2</text><rect x="700" y="530" width="140" height="85" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="770" y="584" fill="#059669" font-size="31" text-anchor="middle">7</text><path d="M650 417L770 516" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="770" y="666" fill="#059669" font-size="25" text-anchor="middle">label at 3</text><text x="890" y="481" fill="#64748B" font-size="25" text-anchor="middle">no next label</text><text x="540" y="739" fill="#64748B" font-size="28" text-anchor="middle">Use logits[:, :-1, :] and IDs[:, 1:].</text></g></svg>
