<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 885" width="1200" height="885" role="img"><title>Known ground-truth prefixes allow parallel teacher-forcing rows while generated token choices sequentially build future prefixes</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1200" height="885" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="600" y="45" fill="#0F172A" font-size="28" text-anchor="middle">Training knows the true prefixes; generation builds its prefixes</text><text x="305" y="118" fill="#64748B" font-size="30" text-anchor="middle">Teacher forcing</text><text x="900" y="118" fill="#64748B" font-size="30" text-anchor="middle">Autoregressive generation</text><rect x="60" y="178" width="260" height="90" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="190" y="231" fill="#2563EB" font-size="28" text-anchor="middle">[1]</text><path d="M320 223H370" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="384" y="178" width="155" height="90" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="461.5" y="231" fill="#059669" font-size="27" text-anchor="middle">target 4</text><rect x="60" y="333" width="260" height="90" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="190" y="386" fill="#2563EB" font-size="28" text-anchor="middle">[1,4]</text><path d="M320 378H370" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="384" y="333" width="155" height="90" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="461.5" y="386" fill="#059669" font-size="27" text-anchor="middle">target 2</text><rect x="60" y="488" width="260" height="90" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="190" y="541" fill="#2563EB" font-size="28" text-anchor="middle">[1,4,2]</text><path d="M320 533H370" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="384" y="488" width="155" height="90" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="461.5" y="541" fill="#059669" font-size="27" text-anchor="middle">target 7</text><text x="305" y="713" fill="#64748B" font-size="26" text-anchor="middle">Known ground-truth prefix rows</text><text x="305" y="753" fill="#64748B" font-size="24" text-anchor="middle">can run together with causal masking.</text><rect x="650" y="178" width="270" height="90" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="785" y="231" fill="#2563EB" font-size="28" text-anchor="middle">[1]</text><path d="M920 223H958" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="972" y="178" width="180" height="90" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="1062" y="231" fill="#059669" font-size="25" text-anchor="middle">choose 5</text><path d="M1062 268V297H785V319" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="650" y="333" width="270" height="90" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="785" y="386" fill="#2563EB" font-size="28" text-anchor="middle">[1,5]</text><path d="M920 378H958" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="972" y="333" width="180" height="90" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="1062" y="386" fill="#059669" font-size="25" text-anchor="middle">choose 9</text><path d="M1062 423V452H785V474" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="650" y="488" width="270" height="90" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="785" y="541" fill="#2563EB" font-size="28" text-anchor="middle">[1,5,9]</text><path d="M920 533H958" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="972" y="488" width="180" height="90" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="1062" y="541" fill="#059669" font-size="25" text-anchor="middle">next choice</text><text x="900" y="713" fill="#64748B" font-size="26" text-anchor="middle">Each chosen token becomes</text><text x="900" y="753" fill="#64748B" font-size="26" text-anchor="middle">part of the next input prefix.</text><text x="600" y="832" fill="#64748B" font-size="25" text-anchor="middle">The token choices on the right are illustrative, not measured model outputs.</text></g></svg>
