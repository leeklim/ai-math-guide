<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 850" width="1080" height="850" role="img"><title>Valid token averaging weights a longer valid sequence differently from equally averaging sequence means</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="850" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="540" y="45" fill="#0F172A" font-size="29" text-anchor="middle">Ignoring losses does not delete the tensor positions</text><text x="120" y="213" fill="#64748B" font-size="25" text-anchor="middle">sequence A</text><rect x="265" y="165" width="170" height="85" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="350" y="217" fill="#7C3AED" font-size="28" text-anchor="middle">1</text><rect x="500" y="165" width="170" height="85" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="585" y="217" fill="#7C3AED" font-size="28" text-anchor="middle">1</text><rect x="735" y="165" width="170" height="85" rx="10" fill="white" stroke="#64748B" stroke-width="2"/><text x="820" y="217" fill="#64748B" font-size="28" text-anchor="middle">ignored</text><path d="M747 177L893 238" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 5"/><text x="120" y="383" fill="#64748B" font-size="25" text-anchor="middle">sequence B</text><rect x="265" y="335" width="170" height="85" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="350" y="387" fill="#7C3AED" font-size="28" text-anchor="middle">4</text><rect x="500" y="335" width="170" height="85" rx="10" fill="white" stroke="#64748B" stroke-width="2"/><text x="585" y="387" fill="#64748B" font-size="28" text-anchor="middle">ignored</text><path d="M512 347L658 408" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="735" y="335" width="170" height="85" rx="10" fill="white" stroke="#64748B" stroke-width="2"/><text x="820" y="387" fill="#64748B" font-size="28" text-anchor="middle">ignored</text><path d="M747 347L893 408" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="50" y="508" width="455" height="150" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="277.5" y="550" fill="#059669" font-size="27" text-anchor="middle">all valid tokens: N=3</text><text x="277.5" y="593" fill="#059669" font-size="30" text-anchor="middle">(1+1+4)/3 = 2</text><text x="277.5" y="632" fill="#64748B" font-size="25" text-anchor="middle">weights A:B = 2:1</text><rect x="575" y="508" width="455" height="150" rx="10" fill="white" stroke="#D97706" stroke-width="2"/><text x="802.5" y="550" fill="#D97706" font-size="26" text-anchor="middle">average sequence means</text><text x="802.5" y="593" fill="#D97706" font-size="29" text-anchor="middle">(1+4)/2 = 2.5</text><text x="802.5" y="632" fill="#64748B" font-size="25" text-anchor="middle">weights A:B = 1:1</text><text x="540" y="739" fill="#64748B" font-size="26" text-anchor="middle">Both sequences retain three tensor positions.</text><text x="540" y="790" fill="#64748B" font-size="26" text-anchor="middle">Only positions with valid labels enter the loss reduction.</text></g></svg>
