<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 735" width="1080" height="735" role="img"><title>Two stored keys and values append one current vector along their token axis while feature width remains two</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="735" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="540" y="45" fill="#0F172A" font-size="29" text-anchor="middle">Append along the sequence axis, not the feature axis</text><text x="110" y="115" fill="#64748B" font-size="28" text-anchor="middle">K cache</text><rect x="60" y="155" width="165" height="90" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="142.5" y="208" fill="#2563EB" font-size="29" text-anchor="middle">(1,0)</text><rect x="250" y="155" width="165" height="90" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="332.5" y="208" fill="#2563EB" font-size="29" text-anchor="middle">(0,1)</text><text x="235" y="287" fill="#2563EB" font-size="26" text-anchor="middle">past two positions</text><text x="495" y="206" fill="#0F172A" font-size="36" text-anchor="middle">+</text><rect x="565" y="155" width="165" height="90" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="647.5" y="208" fill="#7C3AED" font-size="29" text-anchor="middle">(1,1)</text><text x="647.5" y="287" fill="#7C3AED" font-size="25" text-anchor="middle">current position</text><path d="M755 200H803" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="817" y="145" width="195" height="115" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="914.5" y="188" fill="#059669" font-size="27" text-anchor="middle">length 2 → 3</text><text x="914.5" y="234" fill="#059669" font-size="24" text-anchor="middle">feature width 2</text><text x="110" y="370" fill="#64748B" font-size="28" text-anchor="middle">V cache</text><rect x="60" y="410" width="165" height="90" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="142.5" y="463" fill="#2563EB" font-size="29" text-anchor="middle">(1,0)</text><rect x="250" y="410" width="165" height="90" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="332.5" y="463" fill="#2563EB" font-size="29" text-anchor="middle">(0,2)</text><text x="235" y="542" fill="#2563EB" font-size="26" text-anchor="middle">past two positions</text><text x="495" y="461" fill="#0F172A" font-size="36" text-anchor="middle">+</text><rect x="565" y="410" width="165" height="90" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="647.5" y="463" fill="#7C3AED" font-size="29" text-anchor="middle">(1,1)</text><text x="647.5" y="542" fill="#7C3AED" font-size="25" text-anchor="middle">current position</text><path d="M755 455H803" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="817" y="400" width="195" height="115" rx="10" fill="white" stroke="#059669" stroke-width="2"/><text x="914.5" y="443" fill="#059669" font-size="27" text-anchor="middle">length 2 → 3</text><text x="914.5" y="489" fill="#059669" font-size="24" text-anchor="middle">feature width 2</text><text x="540" y="681" fill="#64748B" font-size="27" text-anchor="middle">Toy one-head vectors. K and V retain separate cache arrays.</text></g></svg>
