<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 775" width="1080" height="775" role="img"><title>A full four-token causal forward and a cached three-plus-one run keep identical token IDs and absolute positions</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="775" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="540" y="45" fill="#0F172A" font-size="29" text-anchor="middle">Full and cached runs compare the same prefix end</text><text x="540" y="119" fill="#64748B" font-size="28" text-anchor="middle">Full recomputation</text><rect x="65" y="155" width="165" height="100" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="147.5" y="195" fill="#7C3AED" font-size="28" text-anchor="middle">ID 1</text><text x="147.5" y="235" fill="#64748B" font-size="24" text-anchor="middle">position 0</text><text x="147.5" y="294" fill="#7C3AED" font-size="24" text-anchor="middle">compute K/V</text><rect x="275" y="155" width="165" height="100" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="357.5" y="195" fill="#7C3AED" font-size="28" text-anchor="middle">ID 4</text><text x="357.5" y="235" fill="#64748B" font-size="24" text-anchor="middle">position 1</text><text x="357.5" y="294" fill="#7C3AED" font-size="24" text-anchor="middle">compute K/V</text><rect x="485" y="155" width="165" height="100" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="567.5" y="195" fill="#7C3AED" font-size="28" text-anchor="middle">ID 2</text><text x="567.5" y="235" fill="#64748B" font-size="24" text-anchor="middle">position 2</text><text x="567.5" y="294" fill="#7C3AED" font-size="24" text-anchor="middle">compute K/V</text><rect x="695" y="155" width="165" height="100" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="777.5" y="195" fill="#7C3AED" font-size="28" text-anchor="middle">ID 7</text><text x="777.5" y="235" fill="#64748B" font-size="24" text-anchor="middle">position 3</text><text x="777.5" y="294" fill="#7C3AED" font-size="24" text-anchor="middle">compute K/V</text><text x="540" y="354" fill="#64748B" font-size="28" text-anchor="middle">Reuse cache + current projection</text><rect x="65" y="390" width="165" height="100" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="147.5" y="430" fill="#2563EB" font-size="28" text-anchor="middle">ID 1</text><text x="147.5" y="470" fill="#64748B" font-size="24" text-anchor="middle">position 0</text><text x="147.5" y="529" fill="#2563EB" font-size="24" text-anchor="middle">reuse K/V</text><rect x="275" y="390" width="165" height="100" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="357.5" y="430" fill="#2563EB" font-size="28" text-anchor="middle">ID 4</text><text x="357.5" y="470" fill="#64748B" font-size="24" text-anchor="middle">position 1</text><text x="357.5" y="529" fill="#2563EB" font-size="24" text-anchor="middle">reuse K/V</text><rect x="485" y="390" width="165" height="100" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="567.5" y="430" fill="#2563EB" font-size="28" text-anchor="middle">ID 2</text><text x="567.5" y="470" fill="#64748B" font-size="24" text-anchor="middle">position 2</text><text x="567.5" y="529" fill="#2563EB" font-size="24" text-anchor="middle">reuse K/V</text><rect x="695" y="390" width="165" height="100" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="777.5" y="430" fill="#7C3AED" font-size="28" text-anchor="middle">ID 7</text><text x="777.5" y="470" fill="#64748B" font-size="24" text-anchor="middle">position 3</text><text x="777.5" y="529" fill="#7C3AED" font-size="24" text-anchor="middle">compute K/V</text><text x="540" y="627" fill="#059669" font-size="27" text-anchor="middle">Compare the final-position logit, not a newly reset position 0.</text><text x="540" y="675" fill="#64748B" font-size="26" text-anchor="middle">Same weights, prefix, eval mode, mask, dtype and position handling.</text><text x="540" y="721" fill="#64748B" font-size="25" text-anchor="middle">Numerical agreement is checked with tolerance, not asserted from this drawing.</text></g></svg>
