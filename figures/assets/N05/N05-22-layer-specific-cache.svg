<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 755" width="1080" height="755" role="img"><title>Current token computation traverses each layer while separately appending to that layer's key and value cache</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="755" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="540" y="45" fill="#0F172A" font-size="28" text-anchor="middle">Each layer owns its past K/V; the new token still crosses all layers</text><rect x="60" y="160" width="335" height="135" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="227.5" y="202" fill="#7C3AED" font-size="28" text-anchor="middle">layer 0</text><text x="227.5" y="245" fill="#7C3AED" font-size="24" text-anchor="middle">attention + residual + MLP</text><text x="227.5" y="280" fill="#64748B" font-size="24" text-anchor="middle">current hidden state</text><path d="M395 225H520" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="534" y="160" width="485" height="135" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="776.5" y="200" fill="#2563EB" font-size="29" text-anchor="middle">past K0, V0 cache</text><text x="776.5" y="243" fill="#2563EB" font-size="25" text-anchor="middle">append this layer's current K/V</text><text x="776.5" y="280" fill="#64748B" font-size="26" text-anchor="middle">(B,h_kv,T,d_h)</text><rect x="60" y="410" width="335" height="135" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="227.5" y="452" fill="#7C3AED" font-size="28" text-anchor="middle">layer 1</text><text x="227.5" y="495" fill="#7C3AED" font-size="24" text-anchor="middle">attention + residual + MLP</text><text x="227.5" y="530" fill="#64748B" font-size="24" text-anchor="middle">current hidden state</text><path d="M395 475H520" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="534" y="410" width="485" height="135" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="776.5" y="450" fill="#2563EB" font-size="29" text-anchor="middle">past K1, V1 cache</text><text x="776.5" y="493" fill="#2563EB" font-size="25" text-anchor="middle">append this layer's current K/V</text><text x="776.5" y="530" fill="#64748B" font-size="26" text-anchor="middle">(B,h_kv,T,d_h)</text><path d="M227.5 295V396" fill="none" stroke="#059669" stroke-width="2.6" marker-end="url(#arrow)"/><text x="375" y="365" fill="#059669" font-size="24" text-anchor="middle">next-layer input</text><text x="540" y="653" fill="#64748B" font-size="27" text-anchor="middle">Layer 0 and layer 1 use different states and projection weights.</text><text x="540" y="703" fill="#64748B" font-size="27" text-anchor="middle">The cache is not an archive of every residual and MLP activation.</text></g></svg>
