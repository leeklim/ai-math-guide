<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 635" width="1080" height="635" role="img"><title>A one-token query creates three scores from two cached keys and the current key</title><defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="635" fill="#F8FAFC"/><g font-family="sans-serif" font-size="28"><text x="540" y="45" fill="#0F172A" font-size="28" text-anchor="middle">One current query still compares with every cached key</text><rect x="55" y="145" width="235" height="100" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="172.5" y="182" fill="#2563EB" font-size="27" text-anchor="middle">current q=(1,1)</text><text x="172.5" y="222" fill="#64748B" font-size="25" text-anchor="middle">query length 1</text><rect x="385" y="145" width="180" height="100" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="475" y="183" fill="#64748B" font-size="26" text-anchor="middle">key 0</text><text x="475" y="222" fill="#2563EB" font-size="28" text-anchor="middle">(1,0)</text><path d="M475 245V316" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="605" y="145" width="180" height="100" rx="10" fill="white" stroke="#2563EB" stroke-width="2"/><text x="695" y="183" fill="#64748B" font-size="26" text-anchor="middle">key 1</text><text x="695" y="222" fill="#2563EB" font-size="28" text-anchor="middle">(0,1)</text><path d="M695 245V316" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="825" y="145" width="180" height="100" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="915" y="183" fill="#64748B" font-size="26" text-anchor="middle">key 2</text><text x="915" y="222" fill="#7C3AED" font-size="28" text-anchor="middle">(1,1)</text><path d="M915 245V316" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="335" y="330" width="690" height="105" rx="10" fill="white" stroke="#7C3AED" stroke-width="2"/><text x="475" y="375" fill="#7C3AED" font-size="29" text-anchor="middle">0.707</text><text x="695" y="375" fill="#7C3AED" font-size="29" text-anchor="middle">0.707</text><text x="915" y="375" fill="#7C3AED" font-size="29" text-anchor="middle">1.414</text><text x="680" y="414" fill="#7C3AED" font-size="27" text-anchor="middle">one score row, three key columns</text><path d="M172.5 245V385H321" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="540" y="529" fill="#64748B" font-size="28" text-anchor="middle">score = qKᵀ/√2; score shape (1,3)</text><text x="540" y="582" fill="#64748B" font-size="27" text-anchor="middle">Then softmax over all three keys and mix their V vectors.</text></g></svg>
