<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="760" viewBox="0 0 1080 760"><defs><marker id="arrow" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="760" fill="#F8FAFC"/><g font-family="sans-serif"><text x="540" y="46" font-size="29" fill="#0F172A" text-anchor="middle">Keep candidates, then renormalize their remaining mass</text><text x="80" y="140" font-size="27" fill="#2563EB" text-anchor="start">Before: keep tokens 0 and 1</text><rect x="50" y="182" width="180" height="75" rx="10" fill="#FFF" stroke="#2563EB" stroke-width="2"/><text x="140" y="230" font-size="28" fill="#2563EB" text-anchor="middle">0.5581</text><text x="140" y="293" font-size="26" fill="#64748B" text-anchor="middle">token 0</text><rect x="285" y="182" width="180" height="75" rx="10" fill="#FFF" stroke="#2563EB" stroke-width="2"/><text x="375" y="230" font-size="28" fill="#2563EB" text-anchor="middle">0.3385</text><text x="375" y="293" font-size="26" fill="#64748B" text-anchor="middle">token 1</text><rect x="520" y="182" width="180" height="75" rx="10" fill="#FFF" stroke="#64748B" stroke-width="2"/><text x="610" y="230" font-size="28" fill="#64748B" text-anchor="middle">0.0755</text><text x="610" y="293" font-size="26" fill="#64748B" text-anchor="middle">token 2</text><rect x="755" y="182" width="180" height="75" rx="10" fill="#FFF" stroke="#64748B" stroke-width="2"/><text x="845" y="230" font-size="28" fill="#64748B" text-anchor="middle">0.0278</text><text x="845" y="293" font-size="26" fill="#64748B" text-anchor="middle">token 3</text><text x="540" y="347" font-size="26" fill="#64748B" text-anchor="middle">retained mass ≈ 0.5581 + 0.3385 = 0.8966</text><text x="80" y="430" font-size="27" fill="#059669" text-anchor="start">After: divide by 0.8966</text><rect x="50" y="472" width="180" height="75" rx="10" fill="#FFF" stroke="#059669" stroke-width="2"/><text x="140" y="520" font-size="28" fill="#059669" text-anchor="middle">0.6225</text><text x="140" y="583" font-size="26" fill="#64748B" text-anchor="middle">token 0</text><rect x="285" y="472" width="180" height="75" rx="10" fill="#FFF" stroke="#059669" stroke-width="2"/><text x="375" y="520" font-size="28" fill="#059669" text-anchor="middle">0.3775</text><text x="375" y="583" font-size="26" fill="#64748B" text-anchor="middle">token 1</text><rect x="520" y="472" width="180" height="75" rx="10" fill="#FFF" stroke="#64748B" stroke-width="2"/><text x="610" y="520" font-size="28" fill="#64748B" text-anchor="middle">0.0000</text><text x="610" y="583" font-size="26" fill="#64748B" text-anchor="middle">token 2</text><rect x="755" y="472" width="180" height="75" rx="10" fill="#FFF" stroke="#64748B" stroke-width="2"/><text x="845" y="520" font-size="28" fill="#64748B" text-anchor="middle">0.0000</text><text x="845" y="583" font-size="26" fill="#64748B" text-anchor="middle">token 3</text><text x="540" y="637" font-size="26" fill="#64748B" text-anchor="middle">sum = 1; excluded candidates have zero probability</text><path d="M540 368V405" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="540" y="714" font-size="25" fill="#64748B" text-anchor="middle">Here top-k=2 and top-p=0.75 retain the same two candidates.</text></g></svg>
