<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="735" viewBox="0 0 1080 735"><defs><marker id="arrow" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="735" fill="#F8FAFC"/><g font-family="sans-serif"><text x="540" y="47" font-size="29" fill="#0F172A" text-anchor="middle">Token edits and activation edits change different sites</text><text x="80" y="117" font-size="28" fill="#DC2626" text-anchor="start">CoT token intervention</text><rect x="60" y="165" width="305" height="126" rx="10" fill="#FFF" stroke="#DC2626" stroke-width="2"/><text x="212.5" y="206" font-size="26" fill="#DC2626" text-anchor="middle">edit / remove a step</text><text x="212.5" y="248" font-size="30" fill="#0F172A" text-anchor="middle">c → c′</text><path d="M365 228H440" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="455" y="165" width="300" height="126" rx="10" fill="#FFF" stroke="#2563EB" stroke-width="2"/><text x="605" y="206" font-size="26" fill="#2563EB" text-anchor="middle">new token context</text><text x="605" y="248" font-size="30" fill="#0F172A" text-anchor="middle">[x, c′]</text><path d="M755 228H830" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="845" y="165" width="175" height="126" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/><text x="932.5" y="212" font-size="28" fill="#D97706" text-anchor="middle">answer</text><text x="932.5" y="253" font-size="23" fill="#D97706" text-anchor="middle">distribution</text><text x="80" y="388" font-size="28" fill="#DC2626" text-anchor="start">Internal activation intervention</text><rect x="60" y="435" width="305" height="126" rx="10" fill="#FFF" stroke="#2563EB" stroke-width="2"/><text x="212.5" y="476" font-size="26" fill="#2563EB" text-anchor="middle">same token context</text><text x="212.5" y="518" font-size="30" fill="#0F172A" text-anchor="middle">[x, c]</text><path d="M365 498H440" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="455" y="435" width="300" height="126" rx="10" fill="#FFF" stroke="#DC2626" stroke-width="2"/><text x="605" y="476" font-size="25" fill="#DC2626" text-anchor="middle">replace layer 4 state</text><text x="605" y="518" font-size="30" fill="#0F172A" text-anchor="middle">h₄ → h₄′</text><path d="M755 498H830" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="845" y="435" width="175" height="126" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/><text x="932.5" y="482" font-size="28" fill="#D97706" text-anchor="middle">answer</text><text x="932.5" y="523" font-size="23" fill="#D97706" text-anchor="middle">distribution</text><text x="540" y="636" font-size="27" fill="#64748B" text-anchor="middle">Both need a fixed target and matched controls.</text><text x="540" y="686" font-size="25" fill="#64748B" text-anchor="middle">No equality of intervention sites or effects is assumed.</text></g></svg>
