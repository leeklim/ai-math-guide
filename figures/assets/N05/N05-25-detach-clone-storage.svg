<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810"><defs><marker id="arrow" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="810" fill="#F8FAFC"/><g font-family="sans-serif"><text x="540" y="46" font-size="29" fill="#0F172A" text-anchor="middle">Detach changes graph links; clone changes storage sharing</text><rect x="60" y="125" width="420" height="110" rx="10" fill="#FFF" stroke="#2563EB" stroke-width="2"/><text x="270" y="166" font-size="27" fill="#2563EB" text-anchor="middle">original CPU tensor</text><text x="270" y="210" font-size="28" fill="#0F172A" text-anchor="middle">storage A: (1,2)</text><path d="M270 235V304" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="319" width="420" height="115" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/><text x="270" y="361" font-size="28" fill="#D97706" text-anchor="middle">detach().cpu()</text><text x="270" y="405" font-size="23" fill="#64748B" text-anchor="middle">same storage A, graph detached</text><path d="M480 376H590" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="605" y="319" width="415" height="115" rx="10" fill="#FFF" stroke="#059669" stroke-width="2"/><text x="812.5" y="361" font-size="28" fill="#059669" text-anchor="middle">then clone()</text><text x="812.5" y="405" font-size="24" fill="#64748B" text-anchor="middle">independent storage B: (1,2)</text><path d="M270 434V508" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="523" width="420" height="130" rx="10" fill="#FFF" stroke="#DC2626" stroke-width="2"/><text x="270" y="563" font-size="26" fill="#DC2626" text-anchor="middle">later: original[0] = 9</text><text x="270" y="610" font-size="25" fill="#0F172A" text-anchor="middle">original + detached: (9,2)</text><rect x="605" y="523" width="415" height="130" rx="10" fill="#FFF" stroke="#059669" stroke-width="2"/><text x="812.5" y="563" font-size="27" fill="#059669" text-anchor="middle">saved clone stays</text><text x="812.5" y="610" font-size="30" fill="#059669" text-anchor="middle">(1,2)</text><text x="540" y="719" font-size="25" fill="#64748B" text-anchor="middle">Already on CPU: cpu() alone does not guarantee a new copy.</text><text x="540" y="764" font-size="24" fill="#64748B" text-anchor="middle">clone() alone can retain graph links; this clone follows detach().</text></g></svg>
