<svg xmlns="http://www.w3.org/2000/svg" width="520" height="840" viewBox="0 0 520 840"><defs><marker id="arrow" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="840" fill="#F8FAFC"/><g font-family="sans-serif"><text x="260" y="46" font-size="27" fill="#0F172A" text-anchor="middle">The hook lifetime ends at remove()</text><rect x="60" y="100" width="400" height="108" rx="10" fill="#FFF" stroke="#2563EB" stroke-width="2"/><text x="260" y="143" font-size="28" fill="#2563EB" text-anchor="middle">register hook</text><text x="260" y="184" font-size="25" fill="#0F172A" text-anchor="middle">count = 0</text><path d="M260 208V231" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="245" width="400" height="108" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/><text x="260" y="288" font-size="28" fill="#D97706" text-anchor="middle">forward 1</text><text x="260" y="329" font-size="25" fill="#0F172A" text-anchor="middle">callback → count = 1</text><path d="M260 353V406" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="420" width="400" height="108" rx="10" fill="#FFF" stroke="#DC2626" stroke-width="2"/><text x="260" y="463" font-size="28" fill="#DC2626" text-anchor="middle">handle.remove()</text><text x="260" y="504" font-size="25" fill="#0F172A" text-anchor="middle">remove this callback</text><path d="M260 528V581" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="595" width="400" height="108" rx="10" fill="#FFF" stroke="#059669" stroke-width="2"/><text x="260" y="638" font-size="28" fill="#059669" text-anchor="middle">forward 2</text><text x="260" y="679" font-size="25" fill="#0F172A" text-anchor="middle">count stays 1</text><text x="260" y="759" font-size="24" fill="#64748B" text-anchor="middle">Compare logits too: observation</text><text x="260" y="796" font-size="24" fill="#64748B" text-anchor="middle">must leave the output unchanged.</text></g></svg>
