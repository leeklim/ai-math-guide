<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="840" viewBox="0 0 1080 840"><defs><marker id="arrow" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="840" fill="#F8FAFC"/><g font-family="sans-serif"><text x="540" y="46" font-size="29" fill="#0F172A" text-anchor="middle">A gradient can be computed without being kept in a.grad</text><rect x="60" y="125" width="270" height="116" rx="10" fill="#FFF" stroke="#2563EB" stroke-width="2"/><text x="195" y="168" font-size="27" fill="#2563EB" text-anchor="middle">upstream graph</text><text x="195" y="212" font-size="24" fill="#0F172A" text-anchor="middle">requires gradient</text><path d="M330 184H419" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="434" y="125" width="292" height="116" rx="10" fill="#FFF" stroke="#7C3AED" stroke-width="2"/><text x="580" y="166" font-size="26" fill="#7C3AED" text-anchor="middle">non-leaf a=(1,2)</text><text x="580" y="211" font-size="25" fill="#0F172A" text-anchor="middle">retain_grad() first</text><path d="M726 184H815" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="830" y="125" width="190" height="116" rx="10" fill="#FFF" stroke="#059669" stroke-width="2"/><text x="925" y="168" font-size="25" fill="#059669" text-anchor="middle">s=a₀−a₁</text><text x="925" y="212" font-size="28" fill="#0F172A" text-anchor="middle">s=−1</text><path d="M925 241V303H595V382" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><text x="745" y="340" font-size="25" fill="#DC2626" text-anchor="middle">backward from s</text><rect x="400" y="397" width="360" height="105" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/><text x="580" y="438" font-size="28" fill="#D97706" text-anchor="middle">a.grad = (1,−1)</text><text x="580" y="479" font-size="24" fill="#64748B" text-anchor="middle">retained on the original a</text><path d="M434 204H365V556H280V607" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="622" width="435" height="113" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/><text x="277.5" y="665" font-size="26" fill="#D97706" text-anchor="middle">detached record: (1,2)</text><text x="277.5" y="710" font-size="25" fill="#64748B" text-anchor="middle">graph link removed</text><text x="790" y="659" font-size="25" fill="#64748B" text-anchor="middle">Its values are a snapshot.</text><text x="790" y="708" font-size="23" fill="#64748B" text-anchor="middle">It does not restore the old graph.</text><text x="540" y="796" font-size="26" fill="#64748B" text-anchor="middle">Request the original intermediate gradient before backward.</text></g></svg>
