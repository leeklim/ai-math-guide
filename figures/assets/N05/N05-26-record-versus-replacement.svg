<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="700" viewBox="0 0 1080 700"><defs><marker id="arrow" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="700" fill="#F8FAFC"/><g font-family="sans-serif"><text x="540" y="46" font-size="29" fill="#0F172A" text-anchor="middle">Editing a saved record does not edit the model forward</text><text x="80" y="111" font-size="28" fill="#D97706" text-anchor="start">Read-only record edit</text><rect x="60" y="155" width="280" height="118" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/><text x="200" y="201" font-size="29" fill="#D97706" text-anchor="middle">copy of a</text><text x="200" y="246" font-size="27" fill="#0F172A" text-anchor="middle">(1,2) → (0,0)</text><rect x="650" y="155" width="369" height="118" rx="10" fill="#FFF" stroke="#059669" stroke-width="2"/><text x="834.5" y="199" font-size="25" fill="#059669" text-anchor="middle">live forward still uses a</text><text x="834.5" y="246" font-size="29" fill="#0F172A" text-anchor="middle">s(1,2)</text><path d="M354 214H630" stroke="#64748B" stroke-width="2" stroke-dasharray="8 7"/><path d="M475 191L510 237M510 191L475 237" stroke="#DC2626" stroke-width="3"/><text x="80" y="373" font-size="28" fill="#DC2626" text-anchor="start">Forward replacement</text><rect x="60" y="415" width="280" height="118" rx="10" fill="#FFF" stroke="#2563EB" stroke-width="2"/><text x="200" y="461" font-size="27" fill="#2563EB" text-anchor="middle">live activation a</text><text x="200" y="506" font-size="29" fill="#0F172A" text-anchor="middle">(1,2)</text><path d="M340 474H428" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="443" y="415" width="290" height="118" rx="10" fill="#FFF" stroke="#DC2626" stroke-width="2"/><text x="588" y="461" font-size="26" fill="#DC2626" text-anchor="middle">replace with zeros</text><text x="588" y="506" font-size="28" fill="#0F172A" text-anchor="middle">δa=(−1,−2)</text><path d="M733 474H812" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="827" y="415" width="192" height="118" rx="10" fill="#FFF" stroke="#059669" stroke-width="2"/><text x="923" y="460" font-size="28" fill="#059669" text-anchor="middle">rerun</text><text x="923" y="506" font-size="28" fill="#0F172A" text-anchor="middle">s(0,0)</text><text x="540" y="601" font-size="25" fill="#64748B" text-anchor="middle">Δs = s(0,0) − s(1,2): same site, input, weights and target.</text><text x="540" y="651" font-size="26" fill="#64748B" text-anchor="middle">The replaced value must reach the downstream forward.</text></g></svg>
