<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="715" viewBox="0 0 1080 715"><defs><marker id="arrow" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="715" fill="#F8FAFC"/><g font-family="sans-serif"><text x="540" y="46" font-size="28" fill="#0F172A" text-anchor="middle">The scalar target chooses output weights for the backward pass</text><rect x="60" y="133" width="395" height="170" rx="10" fill="#FFF" stroke="#2563EB" stroke-width="2"/><text x="257.5" y="180" font-size="29" fill="#2563EB" text-anchor="middle">ℓ₀ = 2a₀ + a₁</text><text x="257.5" y="240" font-size="29" fill="#2563EB" text-anchor="middle">∇ℓ₀ = (2,1)</text><rect x="625" y="133" width="395" height="170" rx="10" fill="#FFF" stroke="#7C3AED" stroke-width="2"/><text x="822.5" y="180" font-size="29" fill="#7C3AED" text-anchor="middle">ℓ₁ = a₀ + 2a₁</text><text x="822.5" y="240" font-size="29" fill="#7C3AED" text-anchor="middle">∇ℓ₁ = (1,2)</text><path d="M257.5 303V361H405V434" fill="none" stroke="#2563EB" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M822.5 303V361H675V434" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><text x="302" y="411" font-size="25" fill="#2563EB" text-anchor="middle">weight +1</text><text x="800" y="411" font-size="25" fill="#7C3AED" text-anchor="middle">weight −1</text><rect x="275" y="449" width="530" height="147" rx="10" fill="#FFF" stroke="#059669" stroke-width="2"/><text x="540" y="493" font-size="28" fill="#059669" text-anchor="middle">s = ℓ₀ − ℓ₁ = a₀ − a₁</text><text x="540" y="549" font-size="27" fill="#059669" text-anchor="middle">∇s = (2,1) − (1,2) = (1,−1)</text><text x="540" y="668" font-size="25" fill="#64748B" text-anchor="middle">Toy linear logits: choosing ℓ₀ alone would give a different gradient.</text></g></svg>
