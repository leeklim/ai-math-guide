<svg xmlns="http://www.w3.org/2000/svg" width="520" height="980" viewBox="0 0 520 980"><defs><marker id="arrow" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="520" height="980" fill="#F8FAFC"/><g font-family="sans-serif"><text x="260" y="46" font-size="28" fill="#0F172A" text-anchor="middle">Key checks and forward checks</text><text x="260" y="100" font-size="27" fill="#0F172A" text-anchor="middle">are different tests.</text><rect x="60" y="147" width="400" height="128" rx="10" fill="#FFF" stroke="#2563EB" stroke-width="2"/><text x="260" y="187" font-size="28" fill="#2563EB" text-anchor="middle">expected keys {A,B}</text><text x="260" y="229" font-size="28" fill="#DC2626" text-anchor="middle">loaded keys {A,C}</text><text x="260" y="261" font-size="24" fill="#DC2626" text-anchor="middle">missing B; unexpected C</text><path d="M260 275V334" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="349" width="400" height="93" rx="10" fill="#FFF" stroke="#DC2626" stroke-width="2"/><text x="260" y="391" font-size="28" fill="#DC2626" text-anchor="middle">strict load fails</text><text x="260" y="425" font-size="24" fill="#0F172A" text-anchor="middle">fix mismatch before analysis</text><text x="260" y="507" font-size="25" fill="#64748B" text-anchor="middle">After keys and shapes match:</text><rect x="60" y="553" width="400" height="113" rx="10" fill="#FFF" stroke="#7C3AED" stroke-width="2"/><text x="260" y="596" font-size="24" fill="#7C3AED" text-anchor="middle">same forward code and config</text><text x="260" y="637" font-size="25" fill="#0F172A" text-anchor="middle">same input, eval, dtype</text><path d="M260 666V725" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="60" y="740" width="400" height="98" rx="10" fill="#FFF" stroke="#059669" stroke-width="2"/><text x="260" y="782" font-size="25" fill="#059669" text-anchor="middle">compare output numerically</text><text x="260" y="820" font-size="25" fill="#0F172A" text-anchor="middle">use a stated tolerance</text><text x="260" y="895" font-size="24" fill="#64748B" text-anchor="middle">A finite-input check is not a proof</text><text x="260" y="936" font-size="24" fill="#64748B" text-anchor="middle">of equality on every input.</text></g></svg>
