<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660"><defs><marker id="arrow" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="660" fill="#F8FAFC"/><g font-family="sans-serif"><text x="540" y="46" font-size="29" fill="#0F172A" text-anchor="middle">Model state and optimizer state are separate dictionaries</text><rect x="60" y="120" width="550" height="378" rx="10" fill="#FFF" stroke="#2563EB" stroke-width="2"/><text x="335" y="165" font-size="29" fill="#2563EB" text-anchor="middle">model.state_dict()</text><rect x="100" y="205" width="470" height="102" rx="10" fill="#FFF" stroke="#7C3AED" stroke-width="2"/><text x="335" y="247" font-size="28" fill="#7C3AED" text-anchor="middle">parameters</text><text x="335" y="285" font-size="25" fill="#0F172A" text-anchor="middle">tiny decoder: 12 tensor entries</text><rect x="100" y="343" width="470" height="102" rx="10" fill="#FFF" stroke="#64748B" stroke-width="2"/><text x="335" y="384" font-size="28" fill="#64748B" text-anchor="middle">persistent buffers</text><text x="335" y="423" font-size="26" fill="#0F172A" text-anchor="middle">tiny decoder: 0 entries</text><rect x="674" y="120" width="345" height="378" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/><text x="846.5" y="165" font-size="25" fill="#D97706" text-anchor="middle">optimizer.state_dict()</text><text x="846.5" y="226" font-size="24" fill="#64748B" text-anchor="middle">per parameter after step 1</text><text x="846.5" y="301" font-size="29" fill="#D97706" text-anchor="middle">step</text><text x="846.5" y="361" font-size="29" fill="#D97706" text-anchor="middle">exp_avg</text><text x="846.5" y="421" font-size="29" fill="#D97706" text-anchor="middle">exp_avg_sq</text><text x="540" y="566" font-size="25" fill="#64748B" text-anchor="middle">A buffer is saved model state, but not an optimizer parameter.</text><text x="540" y="614" font-size="26" fill="#64748B" text-anchor="middle">The optimizer moments are not inside model.state_dict().</text></g></svg>
