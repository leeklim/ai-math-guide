<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="690" viewBox="0 0 1080 690"><defs><marker id="arrow" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="690" fill="#F8FAFC"/><g font-family="sans-serif"><text x="540" y="46" font-size="29" fill="#0F172A" text-anchor="middle">Keep a step snapshot separate from live model storage</text><text x="80" y="115" font-size="28" fill="#64748B" text-anchor="start">at saved step k</text><rect x="60" y="155" width="365" height="116" rx="10" fill="#FFF" stroke="#2563EB" stroke-width="2"/><text x="242.5" y="198" font-size="28" fill="#2563EB" text-anchor="middle">live weight entry</text><text x="242.5" y="242" font-size="28" fill="#0F172A" text-anchor="middle">toy value: 1</text><path d="M425 213H640" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><text x="533" y="182" font-size="25" fill="#D97706" text-anchor="middle">deep copy</text><rect x="655" y="155" width="365" height="116" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/><text x="837.5" y="198" font-size="28" fill="#D97706" text-anchor="middle">saved snapshot</text><text x="837.5" y="242" font-size="28" fill="#0F172A" text-anchor="middle">toy value: 1</text><path d="M242.5 271V389" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><text x="385" y="337" font-size="25" fill="#DC2626" text-anchor="middle">later update</text><rect x="60" y="404" width="365" height="116" rx="10" fill="#FFF" stroke="#DC2626" stroke-width="2"/><text x="242.5" y="447" font-size="27" fill="#DC2626" text-anchor="middle">live model at k+1</text><text x="242.5" y="491" font-size="28" fill="#0F172A" text-anchor="middle">toy value: 2</text><rect x="655" y="404" width="365" height="116" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/><text x="837.5" y="447" font-size="26" fill="#D97706" text-anchor="middle">saved step k remains</text><text x="837.5" y="491" font-size="28" fill="#0F172A" text-anchor="middle">toy value: 1</text><text x="540" y="590" font-size="25" fill="#64748B" text-anchor="middle">Holding a shallow state_dict reference can still see the live value 2.</text><text x="540" y="641" font-size="24" fill="#64748B" text-anchor="middle">The copied values preserve the selected step, not a moving reference.</text></g></svg>
