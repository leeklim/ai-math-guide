<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="915" viewBox="0 0 1080 915"><defs><marker id="arrow" markerWidth="9" markerHeight="12" refX="8.5" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0.5 0.8L8.5 6L0.5 11.2L3 6Z" fill="context-stroke"/></marker></defs><rect width="1080" height="915" fill="#F8FAFC"/><g font-family="sans-serif"><text x="540" y="46" font-size="28" fill="#0F172A" text-anchor="middle">Choose a vocabulary index, then differentiate its fixed logit</text><rect x="60" y="135" width="195" height="117" rx="10" fill="#FFF" stroke="#2563EB" stroke-width="2"/><text x="157.5" y="177" font-size="23" fill="#2563EB" text-anchor="middle">input at t=2</text><text x="157.5" y="222" font-size="27" fill="#0F172A" text-anchor="middle">ID 2</text><rect x="315" y="135" width="195" height="117" rx="10" fill="#FFF" stroke="#7C3AED" stroke-width="2"/><text x="412.5" y="177" font-size="23" fill="#7C3AED" text-anchor="middle">lookup E[2]</text><text x="412.5" y="222" font-size="27" fill="#0F172A" text-anchor="middle">shape (4,)</text><rect x="570" y="135" width="195" height="117" rx="10" fill="#FFF" stroke="#059669" stroke-width="2"/><text x="667.5" y="177" font-size="23" fill="#059669" text-anchor="middle">logits at t=2</text><text x="667.5" y="222" font-size="27" fill="#0F172A" text-anchor="middle">shape (16,)</text><rect x="825" y="135" width="195" height="117" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/><text x="922.5" y="177" font-size="23" fill="#D97706" text-anchor="middle">argmax</text><text x="922.5" y="222" font-size="27" fill="#0F172A" text-anchor="middle">index 15</text><path d="M255 193H300" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M510 193H555" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M765 193H810" fill="none" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arrow)"/><path d="M922.5 252V334" fill="none" stroke="#D97706" stroke-width="2.6" marker-end="url(#arrow)"/><rect x="747" y="349" width="272" height="120" rx="10" fill="#FFF" stroke="#059669" stroke-width="2"/><text x="883" y="391" font-size="27" fill="#059669" text-anchor="middle">fix target ℓ₂,₁₅</text><text x="883" y="440" font-size="22" fill="#0F172A" text-anchor="middle">scalar, not argmax ID</text><path d="M883 469V544H412.5V613" fill="none" stroke="#DC2626" stroke-width="2.6" marker-end="url(#arrow)"/><text x="695" y="595" font-size="25" fill="#DC2626" text-anchor="middle">backward with index 15 fixed</text><rect x="270" y="628" width="370" height="125" rx="10" fill="#FFF" stroke="#D97706" stroke-width="2"/><text x="455" y="672" font-size="27" fill="#D97706" text-anchor="middle">∇e₂ ℓ₂,₁₅: shape (4,)</text><text x="455" y="719" font-size="25" fill="#0F172A" text-anchor="middle">continuous lookup vector</text><text x="540" y="821" font-size="25" fill="#64748B" text-anchor="middle">No derivative of the integer input ID or the argmax index is taken.</text><text x="540" y="866" font-size="24" fill="#64748B" text-anchor="middle">A small vector perturbation differs from a finite token replacement.</text></g></svg>
