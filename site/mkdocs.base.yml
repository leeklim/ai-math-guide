site_name: 모델 해석을 위한 수학과 방법론
site_description: AI 논문 독해와 모델 해석 실험을 위한 수학 교육과정
site_url: https://leeklim.github.io/ai-math-guide/
strict: true
use_directory_urls: true

theme:
  name: material
  custom_dir: ../site/overrides
  language: ko
  features:
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 어두운 화면으로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 밝은 화면으로 전환

plugins:
  - search

markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  analytics:
    provider: google
    property: G-VXDGRXQFT3
    public_url: https://leeklim.github.io/ai-math-guide/
  consent:
    title: 방문 통계 수집 동의
    description: >-
      운영자는 방문자 수와 페이지 이용 현황을 확인하기 위해 Google Analytics 4를 사용합니다.
      동의하면 Google에 방문 정보가 전송되고 통계 쿠키를 사용합니다.
      허용하려면 아래 항목을 체크한 뒤 동의를 눌러 주세요. 거부해도 모든 교재를 읽을 수 있습니다.
      하단의 통계 쿠키 설정에서 동의를 변경할 수 있습니다.
      <a href="https://policies.google.com/privacy?hl=ko" target="_blank" rel="noopener">Google 개인정보처리방침</a>
    cookies:
      analytics:
        name: 방문 통계 (Google Analytics 4)
        checked: false
    actions:
      - accept
      - reject

copyright: '<a href="#__consent">통계 쿠키 설정</a>'
