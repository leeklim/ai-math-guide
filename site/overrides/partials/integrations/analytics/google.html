{# Material's outer analytics partial handles saved consent and initialization. #}
<script id="__analytics">
function __md_analytics() {
  const canonical = new URL({{ config.extra.analytics.public_url | tojson }});
  const measurementId = {{ config.extra.analytics.property | default("", true) | tojson }};
  const consent = __md_get("__consent");
  if (location.origin !== canonical.origin ||
      !location.pathname.startsWith(canonical.pathname) ||
      !/^G-[A-Z0-9]+$/.test(measurementId) ||
      !consent || consent.analytics !== true ||
      document.querySelector("script[data-mmi-analytics]")) {
    return;
  }

  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { window.dataLayer.push(arguments); };
  window.gtag("js", new Date());
  window.gtag("config", measurementId, {
    page_location: location.origin + location.pathname,
    page_referrer: document.referrer.split(/[?#]/)[0],
    allow_google_signals: false,
    allow_ad_personalization_signals: false
  });

  const script = document.createElement("script");
  script.async = true;
  script.dataset.mmiAnalytics = "true";
  script.src = "https://www.googletagmanager.com/gtag/js?id=" + encodeURIComponent(measurementId);
  document.getElementById("__analytics").insertAdjacentElement("afterend", script);
}
</script>
